name: Agent Autonomous Semantic Review Patch

on:
  push:
    branches:
      - agent/creative-autonomous-semantic-review
    paths:
      - scripts/agent-autonomous-semantic-review-patch.py
      - .github/workflows/agent-autonomous-semantic-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-autonomous-semantic-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/agent-autonomous-semantic-review-patch.py
      - run: |
          git config user.name "avantiqo-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Wire autonomous Creative semantic review" || exit 0
          git push origin HEAD:agent/creative-autonomous-semantic-review
