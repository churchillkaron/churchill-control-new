name: Agent Creative Wallet Liquidity Patch

on:
  push:
    branches:
      - agent/creative-wallet-liquidity-semantics
    paths:
      - scripts/agent-creative-wallet-liquidity-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-wallet-liquidity-semantics
          fetch-depth: 0
      - name: Apply exact wallet semantics patch
        run: python3 scripts/agent-creative-wallet-liquidity-patch.py
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/creative/release/preflight/route.js scripts/agent-creative-wallet-liquidity-patch.py .github/workflows/agent-creative-wallet-liquidity.yml
          git commit -m "Fix Creative wallet liquidity semantics"
          git push origin HEAD:agent/creative-wallet-liquidity-semantics
