name: Agent Publication Idempotency Port

on:
  push:
    branches:
      - agent/creative-publication-idempotency-current
    paths:
      - scripts/agent-publication-idempotency-port.sh

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-publication-idempotency-current
          fetch-depth: 0
      - name: Port publication idempotency repair
        run: bash scripts/agent-publication-idempotency-port.sh
      - name: Validate JavaScript syntax
        run: |
          node --check lib/creative/assets/graph/repositories/CreativeAssetGraphRepository.js
          node --check lib/creative/release/runtime/CreativePublishCommandRuntime.js
          node --check lib/creative/release/runtime/CreativePublishExecutionRuntime.js
          node --check lib/platform/service-runtime/providers/ProviderExecutor.js
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/creative/assets/graph/repositories/CreativeAssetGraphRepository.js lib/creative/release/runtime/CreativePublishCommandRuntime.js lib/creative/release/runtime/CreativePublishExecutionRuntime.js lib/platform/service-runtime/providers/ProviderExecutor.js supabase/migrations/20260726101500_creative_publication_idempotency.sql scripts/agent-publication-idempotency-port.sh .github/workflows/agent-publication-idempotency-port.yml
          git commit -m "Port Creative publication idempotency to current main"
          git push origin HEAD:agent/creative-publication-idempotency-current
