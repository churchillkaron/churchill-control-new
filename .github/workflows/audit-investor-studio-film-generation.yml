name: Audit Investor Studio Film Generation

on:
  push:
    paths:
      - "lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationPlan.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationRuntime.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorStudioExecutionRuntime.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorCapabilityVisualChoreography.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorOwnedExecutionPolicy.js"
      - "lib/creative/video/runtime/CreativeInvestorHumanGenerationPolicy.js"
      - "lib/creative/video/runtime/CreativeVideoProductionDispatchBootstrap.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorProductProofPlan.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorFinalActPlan.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorFilmMasterPlan.js"
      - "services/avantiqo-image-engine/investor_first_minute_keyframes.py"
      - "services/avantiqo-image-engine/modal_character_keyframe_runtime.py"
      - "services/avantiqo-video-engine/investor_human_release_gate.py"
      - "services/avantiqo-video-engine/investor_human_qc_pack.py"
      - "services/avantiqo-video-engine/investor_human_vbench_qc.py"
      - "services/avantiqo-video-engine/modal_human_multi_keyframe_render.py"
      - "scripts/investor-human-proof-pipeline.py"
      - "scripts/test_investor_human_generation_policy.mjs"
      - "scripts/test_investor_human_release_gate.py"
      - "scripts/test_investor_human_qc_pack.py"
      - "scripts/test_investor_human_vbench_qc.py"
      - "scripts/avantiqo-investor-studio-scenes.mjs"
      - "scripts/investor-studio-film-generation-audit.mjs"
      - ".github/workflows/audit-investor-studio-film-generation.yml"
  pull_request:
    paths:
      - "lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationPlan.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationRuntime.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorStudioExecutionRuntime.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorCapabilityVisualChoreography.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorOwnedExecutionPolicy.js"
      - "lib/creative/video/runtime/CreativeInvestorHumanGenerationPolicy.js"
      - "lib/creative/video/runtime/CreativeVideoProductionDispatchBootstrap.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorProductProofPlan.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorFinalActPlan.js"
      - "lib/creative/post-production/runtime/AvantiqoInvestorFilmMasterPlan.js"
      - "services/avantiqo-image-engine/investor_first_minute_keyframes.py"
      - "services/avantiqo-image-engine/modal_character_keyframe_runtime.py"
      - "services/avantiqo-video-engine/investor_human_release_gate.py"
      - "services/avantiqo-video-engine/investor_human_qc_pack.py"
      - "services/avantiqo-video-engine/investor_human_vbench_qc.py"
      - "services/avantiqo-video-engine/modal_human_multi_keyframe_render.py"
      - "scripts/investor-human-proof-pipeline.py"
      - "scripts/test_investor_human_generation_policy.mjs"
      - "scripts/test_investor_human_release_gate.py"
      - "scripts/test_investor_human_qc_pack.py"
      - "scripts/test_investor_human_vbench_qc.py"
      - "scripts/avantiqo-investor-studio-scenes.mjs"
      - "scripts/investor-studio-film-generation-audit.mjs"
      - ".github/workflows/audit-investor-studio-film-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check investor Studio source
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationPlan.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationRuntime.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorStudioExecutionRuntime.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorCapabilityVisualChoreography.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorOwnedExecutionPolicy.js
          node --check lib/creative/video/runtime/CreativeInvestorHumanGenerationPolicy.js
          node --check lib/creative/video/runtime/CreativeVideoProductionDispatchBootstrap.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorProductProofPlan.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorFinalActPlan.js
          node --check lib/creative/post-production/runtime/AvantiqoInvestorFilmMasterPlan.js
          node --check scripts/test_investor_human_generation_policy.mjs
          node --check scripts/avantiqo-investor-studio-scenes.mjs
          node --check scripts/investor-studio-film-generation-audit.mjs
          python -m py_compile services/avantiqo-image-engine/investor_first_minute_keyframes.py
          python -m py_compile services/avantiqo-image-engine/modal_character_keyframe_runtime.py
          python -m py_compile services/avantiqo-video-engine/investor_human_release_gate.py
          python -m py_compile services/avantiqo-video-engine/investor_human_qc_pack.py
          python -m py_compile services/avantiqo-video-engine/investor_human_vbench_qc.py
          python -m py_compile services/avantiqo-video-engine/modal_human_multi_keyframe_render.py
          python -m py_compile scripts/investor-human-proof-pipeline.py
          python -m py_compile scripts/test_investor_human_release_gate.py
          python -m py_compile scripts/test_investor_human_qc_pack.py
          python -m py_compile scripts/test_investor_human_vbench_qc.py
      - name: Test investor human generation routing policy
        run: node scripts/test_investor_human_generation_policy.mjs
      - name: Test fail-closed investor human release contract
        run: python scripts/test_investor_human_release_gate.py
      - name: Test exact-master investor human QC pack
        run: python scripts/test_investor_human_qc_pack.py
      - name: Test byte-bound VBench investor human QC
        run: python scripts/test_investor_human_vbench_qc.py
      - name: Enforce investor Studio generation contract
        run: node scripts/investor-studio-film-generation-audit.mjs
