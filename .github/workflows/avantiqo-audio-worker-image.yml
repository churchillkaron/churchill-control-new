name: Avantiqo Audio Worker Image

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-audio-worker-image-request.json

permissions:
  contents: write
  packages: write

concurrency:
  group: avantiqo-audio-worker-image
  cancel-in-progress: true

jobs:
  build-audio-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_repository: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.tag }}
      source_sha: ${{ steps.image.outputs.release_sha }}
      image_digest: ${{ steps.build.outputs.digest }}
      preflight_outcome: ${{ steps.preflight.outcome }}
      build_outcome: ${{ steps.build.outcome }}
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Audio worker source lock
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f services/avantiqo-audio-engine/Dockerfile
          test -f services/avantiqo-audio-engine/handler.py
          grep -F 'ARG CUDA_VERSION=12.8.1' services/avantiqo-audio-engine/Dockerfile
          grep -F 'FROM nvidia/cuda:${CUDA_VERSION}-runtime-ubuntu22.04' services/avantiqo-audio-engine/Dockerfile
          grep -F 'git checkout 14c0211d5a0653b0f63e27686f4c3f151b4d8629' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_MODEL_VARIANT=acestep-v15-xl-turbo' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_LM_MODEL=acestep-5Hz-lm-1.7B' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_LM_BACKEND=vllm' services/avantiqo-audio-engine/Dockerfile
          grep -F 'ACESTEP_INIT_LLM=true' services/avantiqo-audio-engine/Dockerfile
          grep -F 'QUALITY_PROFILE = "ACE_STEP_1_5_XL_TURBO_1_7B_LM_V1"' services/avantiqo-audio-engine/handler.py
          grep -F 'DEFAULT_CERTIFIED_CAPABILITIES = {"ai.music.generate"}' services/avantiqo-audio-engine/handler.py
          grep -F 'AVANTIQO_AUDIO_IMAGE_IMPORT_SMOKE=PASS' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_XL_MODEL_REQUIRED' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_1_7B_LM_REQUIRED' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_LM_INIT_REQUIRED' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_CUDA_12_8_TORCH_REQUIRED' services/avantiqo-audio-engine/Dockerfile
          grep -F 'AVANTIQO_AUDIO_NATIVE_AUDIO_IMPORTS=PASS' services/avantiqo-audio-engine/Dockerfile
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_TRIGGER_SHA_BOUND=true'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_XL_PLUS_1_7B_LM_REQUIRED=true'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_CUDA_12_8_REQUIRED=true'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_NATIVE_AUDIO_IMPORT_SMOKE_REQUIRED=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-audio-worker"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_AUDIO_WORKER_IMAGE_TAG=$tag"

      - name: Build and push immutable Audio worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-audio-engine
          file: services/avantiqo-audio-engine/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-audio-worker
          cache-to: type=gha,mode=max,scope=avantiqo-audio-worker

      - name: Confirm no production application deployment
        shell: bash
        run: |
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_SOURCE_TRIGGER_MATCH=true'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_XL_PLUS_1_7B_LM=PASS'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_CUDA_12_8=PASS'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_NATIVE_AUDIO_IMPORT_SMOKE=PASS'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_PRODUCTION_WEB_DEPLOY=false'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_PRICING_ACTIVATION=false'

  record-audio-worker-image-evidence:
    needs: build-audio-worker-image
    if: ${{ always() && needs.build-audio-worker-image.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout newest main for evidence only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record sanitized PASS or FAIL evidence
        env:
          BUILD_JOB_RESULT: ${{ needs.build-audio-worker-image.result }}
          PREFLIGHT_OUTCOME: ${{ needs.build-audio-worker-image.outputs.preflight_outcome }}
          BUILD_OUTCOME: ${{ needs.build-audio-worker-image.outputs.build_outcome }}
          IMAGE_REPOSITORY: ${{ needs.build-audio-worker-image.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build-audio-worker-image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-audio-worker-image.outputs.image_digest }}
          RELEASE_SHA: ${{ needs.build-audio-worker-image.outputs.source_sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$BUILD_JOB_RESULT" = "success" ]; then
            test "$RELEASE_SHA" = "$TRIGGER_SHA"
          fi

          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const triggerSha = String(process.env.TRIGGER_SHA || "").trim();
          const sourceSha = String(process.env.RELEASE_SHA || "").trim();
          const digest = String(process.env.IMAGE_DIGEST || "").trim();
          const owner = String(process.env.REPOSITORY_OWNER || "").trim().toLowerCase();
          const repository = String(process.env.IMAGE_REPOSITORY || "").trim() ||
            (owner ? `ghcr.io/${owner}/avantiqo-audio-worker` : null);
          const buildJobResult = String(process.env.BUILD_JOB_RESULT || "").trim();
          const preflightOutcome = String(process.env.PREFLIGHT_OUTCOME || "").trim() || null;
          const buildOutcome = String(process.env.BUILD_OUTCOME || "").trim() || null;
          const sourceMatchesTrigger = Boolean(sourceSha) && sourceSha === triggerSha;
          const digestValid = /^sha256:[a-f0-9]{64}$/i.test(digest);
          const success = buildJobResult === "success" && sourceMatchesTrigger && digestValid && Boolean(repository);

          const report = {
            success,
            contract: "AVANTIQO_AUDIO_WORKER_IMAGE_RESULT_V3",
            observable_result: true,
            build_job_result: buildJobResult || "unknown",
            preflight_outcome: preflightOutcome,
            build_outcome: buildOutcome,
            source_sha: sourceSha || null,
            trigger_sha: triggerSha || null,
            source_sha_matches_trigger: sourceMatchesTrigger,
            github_run_id: process.env.BUILD_RUN_ID || null,
            image_repository: repository,
            image_tag: String(process.env.IMAGE_TAG || "").trim() || null,
            image_digest: digestValid ? digest : null,
            immutable_image_reference: success ? `${repository}@${digest}` : null,
            runtime: "ACE-Step-1.5",
            runtime_variant: "acestep-v15-xl-turbo",
            quality_profile: "ACE_STEP_1_5_XL_TURBO_1_7B_LM_V1",
            lm_model: "acestep-5Hz-lm-1.7B",
            lm_backend: "vllm",
            ace_step_lm_required: true,
            cuda_runtime_expected: "12.8",
            cuda_enabled_torch_required: true,
            owned_handler_import_smoke_required: true,
            native_audio_import_smoke_required: true,
            ...(success ? {
              xl_model_contract_passed_by_docker_build: true,
              lm_contract_passed_by_docker_build: true,
              cuda_import_smoke_passed_by_docker_build: true,
              native_audio_import_smoke_passed_by_docker_build: true,
            } : {
              xl_model_contract_passed_by_docker_build: false,
              lm_contract_passed_by_docker_build: false,
              cuda_import_smoke_passed_by_docker_build: false,
              native_audio_import_smoke_passed_by_docker_build: false,
            }),
            certified_capability_default: "ai.music.generate",
            failure: success ? null : {
              code: "AVANTIQO_AUDIO_WORKER_IMAGE_BUILD_FAILED",
              build_job_result: buildJobResult || "unknown",
              preflight_outcome: preflightOutcome,
              build_outcome: buildOutcome,
            },
            production_web_deploy: false,
            provider_job_submitted: false,
            pricing_activation_performed: false,
            secrets_in_output: false,
          };

          writeFileSync(
            "/tmp/avantiqo-audio-worker-image.json",
            `${JSON.stringify(report)}\n`,
            "utf8",
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B audio-image-evidence origin/main
            mkdir -p audits/results
            cp /tmp/avantiqo-audio-worker-image.json audits/results/avantiqo-audio-worker-image.json
            git add audits/results/avantiqo-audio-worker-image.json

            if git diff --cached --quiet; then
              echo 'AVANTIQO_AUDIO_WORKER_IMAGE_EVIDENCE_ALREADY_CURRENT=true'
              exit 0
            fi

            git commit -m "Record Audio worker image result"
            if git push origin HEAD:main; then
              echo 'AVANTIQO_AUDIO_WORKER_IMAGE_EVIDENCE_RECORDED=true'
              exit 0
            fi

            echo "AVANTIQO_AUDIO_WORKER_IMAGE_EVIDENCE_PUSH_RETRY=${attempt}"
            sleep "$attempt"
          done

          echo 'AVANTIQO_AUDIO_WORKER_IMAGE_EVIDENCE_PUSH_FAILED'
          exit 1
