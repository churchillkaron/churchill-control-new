name: Avantiqo Audio XL LM Live Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-audio-xl-lm-live-test-request.json

permissions:
  contents: write
  packages: read

concurrency:
  group: avantiqo-audio-xl-lm-live-test
  cancel-in-progress: false

jobs:
  repair-preflight-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_AUDIO_API_KEY || secrets.RUNPOD_API_KEY }}
      RUNPOD_AVANTIQO_AUDIO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_AUDIO_API_KEY || secrets.RUNPOD_API_KEY }}
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AVANTIQO_AUDIO_RUNPOD_STORAGE_APPROVED: "YES"
      AVANTIQO_AUDIO_RUNPOD_REPAIR_APPROVED: "YES"
      AVANTIQO_AUDIO_BENCHMARK_SPEND_APPROVED: "YES"
      AVANTIQO_AUDIO_BENCHMARK_RUNS: "1"
      AVANTIQO_AUDIO_BENCHMARK_DURATION_SECONDS: "12"
      AVANTIQO_MUSIC_BENCHMARK_ORGANIZATION_ID: "benchmark-music-xl-lm-live-test"
      AVANTIQO_AUDIO_BENCHMARK_OUTPUT: ${{ github.workspace }}/artifacts/avantiqo-music-xl-lm-benchmark.json
      AVANTIQO_AUDIO_BENCHMARK_QUEUE_TIMEOUT_MS: "1200000"
      AVANTIQO_AUDIO_BENCHMARK_EXECUTION_TIMEOUT_MS: "2100000"
    steps:
      - name: Checkout exact test request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned benchmark-only Supabase client
        run: npm install --no-save --package-lock=false --ignore-scripts @supabase/supabase-js@2.105.4

      - name: Validate live-test credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          missing=()
          for name in \
            RUNPOD_API_KEY \
            RUNPOD_MANAGEMENT_API_KEY \
            RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID \
            NEXT_PUBLIC_SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "AVANTIQO_AUDIO_XL_LM_LIVE_TEST_BLOCKED_MISSING=${missing[0]}"
            exit 1
          fi
          echo "AVANTIQO_AUDIO_XL_LM_LIVE_TEST_CREDENTIAL_PREFLIGHT=PASS"

      - name: Validate immutable V3 XL LM image evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const evidence = JSON.parse(await readFile("audits/results/avantiqo-audio-worker-image.json", "utf8"));
          const failures = [];
          if (evidence.success !== true) failures.push("success");
          if (evidence.contract !== "AVANTIQO_AUDIO_WORKER_IMAGE_RESULT_V3") failures.push("contract");
          if (evidence.runtime_variant !== "acestep-v15-xl-turbo") failures.push("variant");
          if (evidence.quality_profile !== "ACE_STEP_1_5_XL_TURBO_1_7B_LM_V1") failures.push("quality_profile");
          if (evidence.lm_model !== "acestep-5Hz-lm-1.7B") failures.push("lm_model");
          if (evidence.lm_backend !== "vllm") failures.push("lm_backend");
          if (evidence.ace_step_lm_required !== true) failures.push("lm_required");
          if (evidence.xl_model_contract_passed_by_docker_build !== true) failures.push("xl_build");
          if (evidence.lm_contract_passed_by_docker_build !== true) failures.push("lm_build");
          if (!String(evidence.immutable_image_reference || "").includes("@sha256:")) failures.push("immutable_digest");
          if (failures.length) throw new Error(`AVANTIQO_AUDIO_V3_IMAGE_INVALID:${failures.join(",")}`);
          console.log("AVANTIQO_AUDIO_XL_LM_IMAGE_EVIDENCE=PASS");
          NODE

      - name: Syntax check governed Audio runners
        run: |
          node --check scripts/repair-avantiqo-audio-runpod-worker-local.mjs
          node --check scripts/provision-avantiqo-audio-runpod-storage-local.mjs
          node --check scripts/wait-avantiqo-audio-runpod-drain-local.mjs
          node --check scripts/preflight-avantiqo-music-local.mjs
          node --check scripts/benchmark-avantiqo-music.mjs

      - name: Prove GHCR auth and plan Audio repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/provision-avantiqo-runpod-ghcr-auth-local.mjs > artifacts/ghcr-plan.log
          set +e
          node scripts/run-with-runpod-registry-auth-normalized-local.mjs scripts/repair-avantiqo-audio-runpod-worker-local.mjs > artifacts/repair-plan.log 2>&1
          status=$?
          set -e
          cat artifacts/repair-plan.log
          if [ "$status" -ne 0 ]; then
            echo "AVANTIQO_AUDIO_XL_LM_REPAIR_PLAN_STATUS=$status"
            exit "$status"
          fi

      - name: Drain Audio endpoint before mutation
        env:
          AVANTIQO_AUDIO_RUNPOD_DRAIN_TIMEOUT_MS: "1200000"
        run: node scripts/wait-avantiqo-audio-runpod-drain-local.mjs

      - name: Plan and attach durable shared Audio Voice cache
        shell: bash
        run: |
          set -euo pipefail
          node scripts/provision-avantiqo-audio-runpod-storage-local.mjs --plan
          node scripts/provision-avantiqo-audio-runpod-storage-local.mjs --apply

      - name: Apply V3 XL LM Audio worker repair
        run: node scripts/run-with-runpod-registry-auth-normalized-local.mjs scripts/repair-avantiqo-audio-runpod-worker-local.mjs --apply

      - name: Zero-generation XL LM preflight
        run: node scripts/preflight-avantiqo-music-local.mjs > artifacts/preflight.json

      - name: Run exactly one 12-second XL LM generation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/benchmark-avantiqo-music.mjs > artifacts/benchmark-console-private.log
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("artifacts/avantiqo-music-xl-lm-benchmark.json", "utf8"));
          const observation = report.observations?.[0] || {};
          const failures = [];
          if (report.contract !== "AVANTIQO_MUSIC_CERTIFICATION_BENCHMARK_V3") failures.push("contract");
          if (report.summary?.passed !== true) failures.push("benchmark");
          if (report.benchmark_scope?.runs !== 1) failures.push("run_count");
          if (report.benchmark_scope?.requested_duration_seconds !== 12) failures.push("duration");
          if (report.model?.variant !== "acestep-v15-xl-turbo") failures.push("variant");
          if (report.model?.quality_profile !== "ACE_STEP_1_5_XL_TURBO_1_7B_LM_V1") failures.push("quality_profile");
          if (report.model?.ace_step_lm_model !== "acestep-5Hz-lm-1.7B") failures.push("lm_model");
          if (report.model?.ace_step_lm_backend !== "vllm") failures.push("lm_backend");
          if (observation.ace_step_lm_used !== true) failures.push("lm_used");
          if (observation.thinking_enabled !== true) failures.push("thinking");
          if (observation.passed !== true) failures.push("observation");
          if (!observation.review_url) failures.push("review_url");
          if (failures.length) throw new Error(`AVANTIQO_AUDIO_XL_LM_LIVE_TEST_FAILED:${failures.join(",")}`);
          const sanitized = {
            success: true,
            contract: "AVANTIQO_AUDIO_XL_LM_LIVE_TEST_V1",
            generated_at: new Date().toISOString(),
            github_run_id: process.env.GITHUB_RUN_ID,
            benchmark_contract: report.contract,
            benchmark_id: report.benchmark_id,
            model_variant: observation.model_variant,
            quality_profile: observation.quality_profile,
            ace_step_lm_used: observation.ace_step_lm_used,
            ace_step_lm_model: observation.ace_step_lm_model,
            ace_step_lm_backend: observation.ace_step_lm_backend,
            thinking_enabled: observation.thinking_enabled,
            duration_seconds: observation.duration_seconds,
            sample_rate: observation.sample_rate,
            size_bytes: observation.size_bytes,
            worker_generation_seconds: observation.worker_generation_seconds,
            runpod_execution_ms: observation.runpod_execution_ms,
            runpod_delay_ms: observation.runpod_delay_ms,
            storage_reference: observation.storage_reference,
            review_url_persisted_publicly: false,
            controlled_generation_count: 1,
            production_deploy_performed: false,
            pricing_activation_performed: false,
            provider_selection_changed: false,
          };
          await writeFile("artifacts/avantiqo-audio-xl-lm-live-test.json", `${JSON.stringify(sanitized, null, 2)}\n`);
          await writeFile("artifacts/review-url-private.txt", `${observation.review_url}\n`);
          console.log("AVANTIQO_AUDIO_XL_LM_LIVE_TEST=PASS");
          console.log(`AVANTIQO_AUDIO_XL_LM_DURATION_SECONDS=${observation.duration_seconds}`);
          console.log(`AVANTIQO_AUDIO_XL_LM_GENERATION_SECONDS=${observation.worker_generation_seconds}`);
          NODE
          REVIEW_URL="$(cat artifacts/review-url-private.txt)"
          curl --fail --silent --show-error --location "$REVIEW_URL" -o artifacts/avantiqo-music-xl-lm-live-test.wav
          test -s artifacts/avantiqo-music-xl-lm-live-test.wav
          rm -f artifacts/review-url-private.txt artifacts/benchmark-console-private.log

      - name: Upload private listening artifact and sanitized evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-audio-xl-lm-live-test-${{ github.run_id }}
          path: |
            artifacts/avantiqo-music-xl-lm-live-test.wav
            artifacts/avantiqo-audio-xl-lm-live-test.json
            artifacts/preflight.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit sanitized live-test evidence to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/results
          cp artifacts/avantiqo-audio-xl-lm-live-test.json audits/results/avantiqo-audio-xl-lm-live-test.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-audio-xl-lm-live-test.json
          if git diff --cached --quiet; then
            echo "No sanitized evidence change to commit."
            exit 0
          fi
          git commit -m "Record Audio XL LM live test result"
          git pull --rebase origin main
          git push origin HEAD:main
