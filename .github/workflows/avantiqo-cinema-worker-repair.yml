name: Avantiqo Cinema Worker Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-cinema-worker-repair-request.json
      - .github/workflows/avantiqo-cinema-worker-repair.yml
      - scripts/repair-avantiqo-cinema-runpod-worker-local.mjs

permissions:
  contents: write

concurrency:
  group: avantiqo-cinema-worker-repair
  cancel-in-progress: false

jobs:
  repair-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY }}
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INVESTOR_SCENE9_PROVIDER_JOB_ID: 7149b284-b209-417f-acb6-71b4112e116c-e1
      AVANTIQO_CINEMA_RUNPOD_REPAIR_BACKUP: /tmp/avantiqo-cinema-runpod-repair-backup.json
      AVANTIQO_CINEMA_RUNPOD_REPAIR_RESULT: artifacts/avantiqo-cinema-runpod-repair.json
      INVESTOR_SCENE9_PROOF_REQUEST_ID: scene9-owned-proof-v2
      INVESTOR_SCENE9_PROOF_RESULT: artifacts/avantiqo-investor-scene9-cinema-proof.json
      INVESTOR_SCENE9_PROOF_TIMEOUT_MS: "3600000"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dedicated credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          missing=()
          for name in \
            RUNPOD_API_KEY \
            RUNPOD_MANAGEMENT_API_KEY \
            RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID \
            NEXT_PUBLIC_SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            first="${missing[0]}"
            printf '{"success":false,"contract":"AVANTIQO_CINEMA_RUNPOD_WORKER_REPAIR_V3","error":"CREDENTIAL_PREFLIGHT_FAILED","missing_binding":"%s","github_run_id":"%s","generation_submitted":false,"external_ai_provider_used":false,"secrets_in_output":false}\n' \
              "$first" "$GITHUB_RUN_ID" > "$AVANTIQO_CINEMA_RUNPOD_REPAIR_RESULT"
            echo "Cinema repair preflight failed: required binding missing: $first"
            exit 1
          fi
          echo "Cinema inference, management and test-scoped storage bindings are present."

      - name: Syntax check repair and Scene 9 runners
        run: |
          node --check scripts/repair-avantiqo-cinema-runpod-worker-local.mjs
          node --check scripts/avantiqo-investor-scene9-cinema-proof.mjs

      - name: Cancel stale request, repair worker and warm Cinema
        env:
          AVANTIQO_CINEMA_RUNPOD_REPAIR: "1"
          AVANTIQO_CINEMA_CANCEL_STALE_JOB: "1"
          AVANTIQO_CINEMA_RUNPOD_REPAIR_WAIT_MS: "1200000"
        run: |
          mkdir -p artifacts
          node scripts/repair-avantiqo-cinema-runpod-worker-local.mjs

      - name: Generate one fresh Scene 9 proof
        run: node scripts/avantiqo-investor-scene9-cinema-proof.mjs

      - name: Restore original minimum worker count
        if: always()
        env:
          AVANTIQO_CINEMA_RUNPOD_RESTORE_MIN: "1"
        shell: bash
        run: |
          if [ -f "$AVANTIQO_CINEMA_RUNPOD_REPAIR_BACKUP" ]; then
            node scripts/repair-avantiqo-cinema-runpod-worker-local.mjs || true
          else
            echo "No repair backup exists; minimum worker count was not changed by this run."
          fi

      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-cinema-scene9-repair-${{ github.run_id }}
          path: |
            artifacts/avantiqo-cinema-runpod-repair.json
            artifacts/avantiqo-investor-scene9-cinema-proof.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit sanitized result to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/results
          if [ -f artifacts/avantiqo-cinema-runpod-repair.json ]; then
            cp artifacts/avantiqo-cinema-runpod-repair.json audits/results/avantiqo-cinema-runpod-repair.json
          else
            printf '{"success":false,"contract":"AVANTIQO_CINEMA_RUNPOD_WORKER_REPAIR_V3","error":"REPAIR_RESULT_NOT_PRODUCED","github_run_id":"%s","generation_submitted":false,"external_ai_provider_used":false,"secrets_in_output":false}\n' \
              "$GITHUB_RUN_ID" > audits/results/avantiqo-cinema-runpod-repair.json
          fi
          if [ -f artifacts/avantiqo-investor-scene9-cinema-proof.json ]; then
            cp artifacts/avantiqo-investor-scene9-cinema-proof.json audits/results/avantiqo-investor-scene9-cinema-proof.json
          else
            printf '{"success":false,"contract":"AVANTIQO_INVESTOR_SCENE9_CINEMA_PROOF_V1","error":"SCENE9_RESULT_NOT_PRODUCED","github_run_id":"%s","external_ai_provider_used":false}\n' \
              "$GITHUB_RUN_ID" > audits/results/avantiqo-investor-scene9-cinema-proof.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-cinema-runpod-repair.json audits/results/avantiqo-investor-scene9-cinema-proof.json
          if git diff --cached --quiet; then
            echo "No result change to commit."
            exit 0
          fi
          git commit -m "Record Cinema repair and Scene 9 proof result"
          git pull --rebase origin main
          git push origin HEAD:main
