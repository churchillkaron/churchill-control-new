name: Avantiqo Code Copilot Auth Probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/avantiqo-code-copilot-auth-probe.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current Copilot CLI
        run: npm install -g @github/copilot
      - name: Discover advertised models without inference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AUTO_UPDATE: 'false'
        run: |
          set -euo pipefail
          copilot help --no-color > /tmp/copilot-help.txt
          echo "COPILOT_HELP_MODEL_SECTION_BEGIN"
          awk '/--model/{show=1} show{print} /--mouse/{if(show){exit}}' /tmp/copilot-help.txt | head -c 12000
          echo
          echo "COPILOT_HELP_MODEL_SECTION_END"
          grep -Eiq 'gpt|claude|model' /tmp/copilot-help.txt
