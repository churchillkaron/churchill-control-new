name: Avantiqo Code Copilot Auth Probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/avantiqo-code-copilot-auth-probe.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current Copilot CLI
        run: npm install -g @github/copilot
      - name: Probe strongest model entitlements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AUTO_UPDATE: 'false'
        run: |
          set -uo pipefail
          any=0
          for model in gpt-5.3-codex gpt-5.4 claude-opus-5 claude-opus-4.8 claude-sonnet-4.6; do
            safe="${model//[^a-zA-Z0-9]/_}"
            set +e
            output="$(copilot --yolo -p 'Return exactly OK and nothing else.' -s --model="$model" --no-custom-instructions --no-auto-update --no-color 2> "/tmp/${safe}.err")"
            code=$?
            set -e
            detail="$(tr '\n' ' ' < "/tmp/${safe}.err" | head -c 500)"
            echo "COPILOT_MODEL_PROBE model=$model exit=$code stdout=$output stderr=$detail"
            if [ "$code" -eq 0 ] && [ "$output" = "OK" ]; then
              any=1
            fi
          done
          test "$any" -eq 1
