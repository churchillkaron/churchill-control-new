name: Avantiqo Code Copilot Auth Probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/avantiqo-code-copilot-auth-probe.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current Copilot CLI
        run: npm install -g @github/copilot
      - name: List entitled models without inference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AUTO_UPDATE: 'false'
          TERM: xterm-256color
        run: |
          set -euo pipefail
          set +e
          printf '/models\n/exit\n' | timeout 30s script -q -e -c 'copilot --no-auto-update --no-color' /tmp/copilot-models.typescript
          code=$?
          set -e
          tr -d '\r' < /tmp/copilot-models.typescript > /tmp/copilot-models.txt
          echo "COPILOT_ENTITLED_MODELS_BEGIN"
          grep -Eai 'gpt|claude|gemini|model|codex|sonnet|opus|haiku' /tmp/copilot-models.txt | head -c 16000 || true
          echo
          echo "COPILOT_ENTITLED_MODELS_END"
          if [ "$code" -ne 0 ] && ! grep -Eiq 'gpt|claude|gemini|codex|sonnet|opus|haiku' /tmp/copilot-models.txt; then
            exit "$code"
          fi
