name: Avantiqo Code Duplicate Volume Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-code-duplicate-volume-cleanup.yml
      - scripts/cleanup-duplicate-avantiqo-code-volume-ci.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delete only proven duplicate Code volume
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: node scripts/cleanup-duplicate-avantiqo-code-volume-ci.mjs
      - name: Immutable boundary
        if: always()
        run: |
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
          echo "GPU_ACTIVATION_PERFORMED=false"
          echo "MODEL_INFERENCE_PERFORMED=false"
          echo "NEW_VOLUME_CREATED=false"
