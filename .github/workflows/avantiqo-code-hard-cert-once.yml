name: Avantiqo Code Hard Certification One-Shot Dispatcher

on:
  push:
    paths:
      - .github/avantiqo-code-hard-cert-admission-20260903T0310Z.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify one-shot admission marker
        run: |
          set -euo pipefail
          test -f .github/avantiqo-code-hard-cert-admission-20260903T0310Z.txt
          grep -qx 'AVANTIQO_CODE_HARD_CERT_ADMISSION=20260903T0310Z' .github/avantiqo-code-hard-cert-admission-20260903T0310Z.txt
          echo 'AVANTIQO_CODE_HARD_CERT_ONE_SHOT_ADMISSION=PASS'

      - name: Dispatch current-main hard certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/avantiqo-code-owned-head-to-head-v2.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'AVANTIQO_CODE_HARD_CERT_DISPATCH=PASS'
