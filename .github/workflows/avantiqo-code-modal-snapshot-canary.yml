name: Avantiqo Code Modal Snapshot Canary

on:
  push:
    paths:
      - "services/avantiqo-code-engine/modal_snapshot_canary.py"
      - "scripts/probe-avantiqo-code-modal-snapshot.py"
      - ".github/workflows/avantiqo-code-modal-snapshot-canary.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  snapshot-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: development
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check "modal==1.5.0"

      - name: Cancel stale slow benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33588428823/cancel" \
            || true

      - name: Zero-cost syntax gate
        run: |
          python -m py_compile services/avantiqo-code-engine/modal_snapshot_canary.py
          python -m py_compile scripts/probe-avantiqo-code-modal-snapshot.py

      - name: Deploy scale-to-zero snapshot canary
        run: |
          set -euo pipefail
          python -m modal deploy services/avantiqo-code-engine/modal_snapshot_canary.py \
            2>&1 | tee /tmp/avantiqo-code-modal-snapshot-deploy.log

      - name: Probe restored cold start
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/probe-avantiqo-code-modal-snapshot.py \
            2>&1 | tee /tmp/avantiqo-code-modal-snapshot-probe.log
          cp /tmp/avantiqo-code-modal-snapshot-probe.log artifacts/avantiqo-code-modal-snapshot-probe.log

      - name: Verify latency evidence
        run: |
          set -euo pipefail
          grep -q 'AVANTIQO_CODE_MODAL_SNAPSHOT_SUMMARY=' artifacts/avantiqo-code-modal-snapshot-probe.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-modal-snapshot-canary-${{ github.run_id }}
          path: |
            artifacts/avantiqo-code-modal-snapshot-probe.log
            /tmp/avantiqo-code-modal-snapshot-deploy.log
          if-no-files-found: warn
          retention-days: 14

# retest trigger: fixed self-contained Modal canary packaging
