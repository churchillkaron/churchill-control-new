name: Avantiqo Code Model Canary Preflight One-Shot

on:
  push:
    paths:
      - .github/avantiqo-code-model-canary-preflight-20260903.txt

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'
      - name: Verify code and inspect the single existing Code volume without GPU or download
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/code_model_canary_v2.py
          python -m py_compile services/avantiqo-code-engine/modal_code_model_canary_preflight.py
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py 2>&1 | tee /tmp/avantiqo-code-model-canary-preflight.log
          grep -q '"gpu_used":false' /tmp/avantiqo-code-model-canary-preflight.log
          grep -q '"model_download_performed":false' /tmp/avantiqo-code-model-canary-preflight.log
          grep -q '"volume_created":false' /tmp/avantiqo-code-model-canary-preflight.log
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-model-canary-preflight-${{ github.run_id }}
          path: /tmp/avantiqo-code-model-canary-preflight.log
          if-no-files-found: warn
          retention-days: 14
