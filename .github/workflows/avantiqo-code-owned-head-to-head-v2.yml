name: Avantiqo Code Hard Owned Certification

on:
  workflow_dispatch:
  push:
    paths:
      - .github/avantiqo-code-paid-admission-20260903T0120Z.txt

permissions:
  contents: read

concurrency:
  group: avantiqo-code-hard-owned-cert
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify one-shot paid admission
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test -f .github/avantiqo-code-paid-admission-20260903T0120Z.txt
          grep -qx 'AVANTIQO_CODE_PAID_ADMISSION=20260903T0120Z' .github/avantiqo-code-paid-admission-20260903T0120Z.txt
          echo 'AVANTIQO_CODE_ONE_SHOT_PAID_ADMISSION=PASS'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost hard-suite and paid-run admission preflight
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/modal_app.py
          python -m py_compile services/avantiqo-code-engine/modal_head_to_head.py
          python -m py_compile services/avantiqo-code-engine/modal_verified_head_to_head.py
          python -m py_compile services/avantiqo-code-engine/modal_persistent_owned_cert.py
          python -m py_compile services/avantiqo-code-engine/modal_persistent_owned_cert_repair.py
          python -m py_compile services/avantiqo-code-engine/modal_code_model_bootstrap.py
          python -m py_compile services/avantiqo-code-engine/modal_code_hard_owned_cert.py
          python -m py_compile services/avantiqo-code-engine/modal_code_hard_owned_cert_fixed.py
          python -m py_compile services/avantiqo-code-engine/modal_code_hard_owned_cert_final.py
          python -m py_compile services/avantiqo-code-engine/modal_code_hard_service.py
          python -m py_compile services/avantiqo-code-engine/verify_hard_public_contract_guards.py
          python -m py_compile services/avantiqo-code-engine/verify_hard_final_gates.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_hard_public_contract_guards.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_hard_final_gates.py
          PYTHONPATH=services/avantiqo-code-engine python - <<'PY'
          import modal_code_hard_owned_cert as hard
          import modal_code_hard_owned_cert_fixed as fixed
          import modal_code_hard_owned_cert_final as final
          import modal_code_hard_service as service
          import modal_persistent_owned_cert as cert
          assert final.app is fixed.app is hard.app is cert.app
          assert fixed.SERVICE_APP == service.APP_NAME == 'avantiqo-code-hard-service-v1'
          assert fixed.SERVICE_FUNCTION == service.FUNCTION_NAME == 'run_hard_cert_batch'
          assert len(hard.HARD_TASKS) == 10
          assert len(hard.HARD_PROBES) == 10
          assert {t['id'] for t in hard.HARD_TASKS} == set(hard.HARD_PROBES)
          assert final.MAX_COMPLETION_TOKENS == 800
          assert final.COMPACT_TARGET_TOKENS == 650
          assert service.MAX_HARD_COMPLETION_TOKENS == 800
          assert cert.MODEL_VOLUME_NAME == 'avantiqo-code-models'
          assert cert.MODEL_REVISION == 'dcaee4d4dfc5ee71ad501f01f530e5652438fde0'
          for task in hard.HARD_TASKS:
              initial = hard.base._run_test(task['module'], task['source'], task['visible_test'])
              assert initial['exit_code'] != 0, f"broken fixture unexpectedly passes: {task['id']}"
          print('AVANTIQO_CODE_ESCAPED_DEFECT_GATES=PASS')
          print('AVANTIQO_CODE_FALSE_PASS_MARKER_GUARD=PASS')
          print('AVANTIQO_CODE_PAID_RUN_ADMISSION=PASS')
          print('AVANTIQO_CODE_HARD_PREFLIGHT=PASS')
          PY
          node --version

      - name: Ensure persistent Code model storage without GPU
        timeout-minutes: 32
        env:
          NODE_ENV: development
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          timeout --signal=TERM --kill-after=30s 31m python -m modal run services/avantiqo-code-engine/modal_code_model_bootstrap.py 2>&1 | tee /tmp/avantiqo-code-model-bootstrap.log
          grep -q 'AVANTIQO_CODE_PERSISTENT_MODEL_BOOTSTRAP_V1=PASS' /tmp/avantiqo-code-model-bootstrap.log

      - name: Run one paid 10-case hard Code certification
        timeout-minutes: 12
        env:
          NODE_ENV: development
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          mkdir -p artifacts
          timeout --signal=TERM --kill-after=30s 11m python -m modal run services/avantiqo-code-engine/modal_code_hard_owned_cert_final.py::app.hard_owned_cert_final 2>&1 | tee /tmp/avantiqo-code-hard-owned-cert.log
          grep -q '^AVANTIQO_CODE_HARD_EXECUTABLE_GATE_CERT_V1=PASS$' /tmp/avantiqo-code-hard-owned-cert.log

      - name: Verify hard-suite evidence
        run: |
          set -euo pipefail
          test -f artifacts/avantiqo-code-hard-executable-gate-cert.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const r = JSON.parse(await readFile('artifacts/avantiqo-code-hard-executable-gate-cert.json','utf8'));
          const s = r?.summary || {};
          const m = r?.methodology || {};
          if (r.contract !== 'AVANTIQO_CODE_HARD_EXECUTABLE_GATE_CERT_V1') throw new Error('hard contract invalid');
          if (m.cases !== 10 || s.cases !== 10) throw new Error('ten hard cases required');
          if (m.difficulty !== 'advanced-erp-invariants' || m.explicit_production_contract_per_case !== true) throw new Error('hard difficulty contract missing');
          if (m.visible_tests_executed_before_acceptance !== true || m.semantic_contract_probes_executed_before_acceptance !== true) throw new Error('executable gates not proven');
          if (m.repair_only_after_machine_failure !== true || m.max_repair_calls_per_case !== 1) throw new Error('bounded repair not proven');
          if (m.hidden_tests_sealed_until_final_scoring !== true || m.ai_judge_used !== false) throw new Error('sealed deterministic scoring not proven');
          if (m.persistent_modal_service !== true || s.persistent_modal_service !== true || s.service_app !== 'avantiqo-code-hard-service-v1') throw new Error('persistent service not proven');
          if (s.persistent_model_storage !== true || s.model_storage_ready !== true || s.model_storage_reused !== true) throw new Error('persistent model reuse not proven');
          if (s.model_volume_name !== 'avantiqo-code-models' || s.model_revision !== 'dcaee4d4dfc5ee71ad501f01f530e5652438fde0') throw new Error('model identity invalid');
          if (s.owned_gpu_sessions !== 1) throw new Error('single Hopper GPU session required');
          if (Number(s.owned_model_calls) !== 10 + Number(s.repairs_used)) throw new Error('model-call accounting invalid');
          if (s.machine_gate_passed !== true || s.warm_container_reused !== true) throw new Error('machine gate/reuse not proven');
          if (s.passed !== 10 || s.hidden_tests_passed !== 10 || s.instruction_format_passed !== 10 || s.security_boundary_passed !== 10) throw new Error(`10/10 required: ${JSON.stringify(s)}`);
          if (s.warm_latency_target_ms !== 4000 || s.warm_latency_passed !== true || Number(s.warm_max_ms) > 4000) throw new Error(`warm latency failed: ${JSON.stringify(s)}`);
          if (s.vllm_enforce_eager !== false || s.safetensors_load_strategy !== 'prefetch') throw new Error('optimized runtime not proven');
          if (s.production_deploy_performed !== false) throw new Error('production deploy forbidden');
          console.log(JSON.stringify(s));
          console.log('AVANTIQO_CODE_HARD_EXECUTABLE_GATE=PASS');
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-hard-owned-cert-${{ github.run_id }}
          path: |
            artifacts/avantiqo-code-hard-executable-gate-cert.json
            /tmp/avantiqo-code-model-bootstrap.log
            /tmp/avantiqo-code-hard-owned-cert.log
          if-no-files-found: warn
          retention-days: 14
