name: Avantiqo Code Pod Image

on:
  push:
    branches:
      - main
    paths:
      - services/avantiqo-code-engine/Dockerfile.pod
      - services/avantiqo-code-engine/pod_server.py
      - services/avantiqo-code-engine/handler.py
      - services/avantiqo-code-engine/requirements.txt
      - .github/workflows/avantiqo-code-pod-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-code-pod-image
  cancel-in-progress: true

jobs:
  build-code-pod-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Code Pod V3 overlay provenance
        shell: bash
        run: |
          set -euo pipefail
          BASE_SOURCE_SHA='1cb94f50400afdf448d8460de0a2709f7f6dc688'
          BASE_IMAGE='ghcr.io/churchillkaron/avantiqo-code-pod@sha256:21075fc9457c5d6638d9a6a7f04ab748bd4ac50a65fed19e0fd57540a1325262'

          test -f services/avantiqo-code-engine/Dockerfile.pod
          test -f services/avantiqo-code-engine/pod_server.py
          test -f services/avantiqo-code-engine/handler.py
          test -f services/avantiqo-code-engine/requirements.txt
          git cat-file -e "${BASE_SOURCE_SHA}^{commit}"

          test -z "$(git diff --name-only "${BASE_SOURCE_SHA}"..HEAD -- services/avantiqo-code-engine/handler.py services/avantiqo-code-engine/requirements.txt)"
          grep -F "FROM ${BASE_IMAGE}" services/avantiqo-code-engine/Dockerfile.pod
          grep -F 'ENTRYPOINT ["python3", "-u", "pod_server.py"]' services/avantiqo-code-engine/Dockerfile.pod
          grep -F 'CONTRACT = "AVANTIQO_CODE_POD_HTTP_V3"' services/avantiqo-code-engine/pod_server.py
          grep -F 'TRANSPORT_PROBE_PATH = "/v3/transport-probe"' services/avantiqo-code-engine/pod_server.py
          grep -F 'ASYNC_SUBMIT_PATH = "/v3/generations"' services/avantiqo-code-engine/pod_server.py
          grep -F 'ASYNC_STATUS_PATH_TEMPLATE = "/v3/generations/{job_id}"' services/avantiqo-code-engine/pod_server.py
          grep -F '@app.post(TRANSPORT_PROBE_PATH)' services/avantiqo-code-engine/pod_server.py
          grep -F '@app.post(ASYNC_SUBMIT_PATH)' services/avantiqo-code-engine/pod_server.py
          grep -F '@app.get(ASYNC_STATUS_PATH_TEMPLATE)' services/avantiqo-code-engine/pod_server.py
          grep -F 'import handler as code_engine' services/avantiqo-code-engine/pod_server.py
          grep -F 'MAX_CONCURRENCY = 1' services/avantiqo-code-engine/pod_server.py
          grep -F 'AVANTIQO_CODE_POD_TOKEN_REQUIRED_MIN_32_CHARS' services/avantiqo-code-engine/pod_server.py
          grep -F 'AVANTIQO_CODE_POD_ASYNC_JOB_REQUIRED' services/avantiqo-code-engine/pod_server.py
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'AVANTIQO_CODE_POD_IMAGE_BASE_RUNTIME_IMMUTABLE=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_HANDLER_REQUIREMENTS_UNCHANGED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_EXTERNAL_RUNTIME_GATE_REQUIRED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_THIN_OVERLAY_PUBLICATION=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_PREFLIGHT=PASS'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-code-pod"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_CODE_POD_IMAGE_TAG=$tag"

      - name: Build and push immutable Code Pod image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avantiqo-code-engine/Dockerfile.pod
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            avantiqo.code.base.source=1cb94f50400afdf448d8460de0a2709f7f6dc688
            avantiqo.code.base.digest=sha256:21075fc9457c5d6638d9a6a7f04ab748bd4ac50a65fed19e0fd57540a1325262
            avantiqo.code.runtime.gate=external-runpod-v3-before-inference
            avantiqo.code.publication.mode=thin-overlay-no-base-scan
          provenance: false
          sbom: false

      - name: Create immutable Pod image evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "AVANTIQO_CODE_POD_IMAGE_DIGEST_INVALID"; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-code-pod-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_CODE_POD_IMAGE_RESULT_V3",
            source_sha: process.env.RELEASE_SHA,
            trigger_sha: process.env.TRIGGER_SHA,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            base_source_sha: "1cb94f50400afdf448d8460de0a2709f7f6dc688",
            base_image_digest: "sha256:21075fc9457c5d6638d9a6a7f04ab748bd4ac50a65fed19e0fd57540a1325262",
            base_runtime_reused_immutably: true,
            handler_requirements_unchanged_from_base: true,
            publication_mode: "thin-overlay-no-base-scan",
            registry_provenance_attestation_generated: false,
            registry_sbom_generated: false,
            transport: "pod-http",
            pod_http_contract: "AVANTIQO_CODE_POD_HTTP_V3",
            transport_mode: "async-job-polling",
            transport_probe_path: "/v3/transport-probe",
            async_submit_path: "/v3/generations",
            async_status_path_template: "/v3/generations/{job_id}",
            http_proxy_timeout_strategy: "authenticated-probe-plus-immediate-job-id-plus-polling",
            synchronous_generation_allowed: false,
            build_time_transport_probe: false,
            build_time_async_transport_smoke: false,
            external_runpod_transport_probe_required_before_inference: true,
            runtime: "vllm-0.27.1",
            runtime_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8",
            quantization: "fp8",
            network_volume_mount: "/workspace",
            max_concurrency: 1,
            provider_job_submitted: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-code-pod-image/avantiqo-code-pod-image.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload immutable Pod image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-pod-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-code-pod-image/avantiqo-code-pod-image.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm isolated Pod image build
        shell: bash
        run: |
          echo 'AVANTIQO_CODE_POD_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_IMMUTABLE_OVERLAY=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_THIN_OVERLAY_PUBLICATION=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_EXTERNAL_RUNTIME_GATE_REQUIRED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_CODE_POD_IMAGE_PRODUCTION_DEPLOY=false'
