name: Avantiqo Code Pod Image

on:
  push:
    branches:
      - main
    paths:
      - services/avantiqo-code-engine/Dockerfile.pod
      - services/avantiqo-code-engine/pod_server.py
      - services/avantiqo-code-engine/handler.py
      - services/avantiqo-code-engine/requirements.txt
      - .github/workflows/avantiqo-code-pod-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-code-pod-image
  cancel-in-progress: true

jobs:
  publish-code-pod-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_SOURCE_SHA: 28dd1b26b3e0d5801804388e2ed8eb6df51967b2
      BASE_SOURCE_SHA: 1cb94f50400afdf448d8460de0a2709f7f6dc688
      BASE_IMAGE: ghcr.io/churchillkaron/avantiqo-code-pod@sha256:21075fc9457c5d6638d9a6a7f04ab748bd4ac50a65fed19e0fd57540a1325262

    steps:
      - name: Checkout publisher source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify pinned Code V3 warmup runtime source
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${RUNTIME_SOURCE_SHA}^{commit}"
          git cat-file -e "${BASE_SOURCE_SHA}^{commit}"

          # Publisher-only workflow changes are allowed after the runtime pin.
          # Runtime inputs must remain exactly the pinned generation-free warmup release.
          test -z "$(git diff --name-only "${RUNTIME_SOURCE_SHA}"..HEAD -- \
            services/avantiqo-code-engine/Dockerfile.pod \
            services/avantiqo-code-engine/pod_server.py \
            services/avantiqo-code-engine/handler.py \
            services/avantiqo-code-engine/requirements.txt)"

          # V3 changes transport only; the engine and dependencies remain the
          # already-certified immutable V2 runtime.
          test -z "$(git diff --name-only "${BASE_SOURCE_SHA}".."${RUNTIME_SOURCE_SHA}" -- \
            services/avantiqo-code-engine/handler.py \
            services/avantiqo-code-engine/requirements.txt)"

          dockerfile="$(git show "${RUNTIME_SOURCE_SHA}:services/avantiqo-code-engine/Dockerfile.pod")"
          server="$(git show "${RUNTIME_SOURCE_SHA}:services/avantiqo-code-engine/pod_server.py")"

          grep -F "FROM ${BASE_IMAGE}" <<<"${dockerfile}"
          grep -F 'ENTRYPOINT ["python3", "-u", "pod_server.py"]' <<<"${dockerfile}"
          grep -F 'CONTRACT = "AVANTIQO_CODE_POD_HTTP_V3"' <<<"${server}"
          grep -F 'TRANSPORT_PROBE_PATH = "/v3/transport-probe"' <<<"${server}"
          grep -F 'ASYNC_SUBMIT_PATH = "/v3/generations"' <<<"${server}"
          grep -F 'ASYNC_STATUS_PATH_TEMPLATE = "/v3/generations/{job_id}"' <<<"${server}"
          grep -F '@app.post(TRANSPORT_PROBE_PATH)' <<<"${server}"
          grep -F '@app.post(ASYNC_SUBMIT_PATH)' <<<"${server}"
          grep -F '@app.get(ASYNC_STATUS_PATH_TEMPLATE)' <<<"${server}"
          grep -F 'import handler as code_engine' <<<"${server}"
          grep -F 'MAX_CONCURRENCY = 1' <<<"${server}"
          grep -F 'AVANTIQO_CODE_POD_TOKEN_REQUIRED_MIN_32_CHARS' <<<"${server}"
          grep -F 'AVANTIQO_CODE_POD_ASYNC_JOB_REQUIRED' <<<"${server}"
          grep -F 'def _engine_warmup_requested' <<<"${server}"
          grep -F 'def _engine_warmup_output' <<<"${server}"
          grep -F 'def _ensure_engine_loaded' <<<"${server}"
          grep -F 'async def _boot_preload_engine' <<<"${server}"
          grep -F '@app.on_event("startup")' <<<"${server}"
          grep -F 'NETWORK_SAFETENSORS_LOAD_STRATEGY = "eager"' <<<"${server}"
          grep -F 'await asyncio.to_thread(_ensure_engine_loaded)' <<<"${server}"
          grep -F '"safetensors_load_strategy": NETWORK_SAFETENSORS_LOAD_STRATEGY' <<<"${server}"
          grep -F '"inference_performed": False' <<<"${server}"
          grep -F '"generation_performed": False' <<<"${server}"
          grep -F '"reasoning_call_consumed": False' <<<"${server}"
          grep -F '"wallet_mutation_performed": False' <<<"${server}"
          grep -F '"model_load": "BOOT_BACKGROUND_GENERATION_FREE"' <<<"${server}"
          grep -F '"engine_warmup_generation_performed": False' <<<"${server}"

          mkdir -p /tmp/avantiqo-code-v3-source
          printf '%s\n' "${server}" > /tmp/avantiqo-code-v3-source/pod_server.py
          python3 -m py_compile /tmp/avantiqo-code-v3-source/pod_server.py

          echo 'AVANTIQO_CODE_POD_IMAGE_RUNTIME_SOURCE_PINNED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_BASE_RUNTIME_IMMUTABLE=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_HANDLER_REQUIREMENTS_UNCHANGED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_ENGINE_WARMUP_GENERATION_FREE=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_EAGER_BOOT_PRELOAD=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_NETWORK_SAFETENSORS_EAGER=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_EXTERNAL_RUNTIME_GATE_REQUIRED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_PREFLIGHT=PASS'

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.7

      - name: Authenticate GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish immutable V3 registry overlay
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-code-pod"
          short_sha="${RUNTIME_SOURCE_SHA:0:12}"
          tag="${image}:sha-${short_sha}"

          rm -rf /tmp/avantiqo-code-v3-layer
          mkdir -p /tmp/avantiqo-code-v3-layer/app
          git show "${RUNTIME_SOURCE_SHA}:services/avantiqo-code-engine/pod_server.py" \
            > /tmp/avantiqo-code-v3-layer/app/pod_server.py
          chmod 0644 /tmp/avantiqo-code-v3-layer/app/pod_server.py

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C /tmp/avantiqo-code-v3-layer \
            -cf /tmp/avantiqo-code-v3-layer.tar \
            app/pod_server.py

          base_platform_digest="$(crane digest --platform linux/amd64 "${BASE_IMAGE}")"

          crane mutate \
            --platform linux/amd64 \
            "${BASE_IMAGE}" \
            --append /tmp/avantiqo-code-v3-layer.tar \
            --entrypoint=python3,-u,pod_server.py \
            --workdir=/app \
            --env AVANTIQO_CODE_POD_PORT=8000 \
            --exposed-ports=8000/tcp \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${RUNTIME_SOURCE_SHA}" \
            --label avantiqo.code.base.source="${BASE_SOURCE_SHA}" \
            --label avantiqo.code.base.digest="${BASE_IMAGE#*@}" \
            --label avantiqo.code.runtime.gate=external-runpod-v3-before-inference \
            --label avantiqo.code.engine.warmup=generation-free \
            --label avantiqo.code.engine.preload=boot-background \
            --label avantiqo.code.safetensors.load-strategy=eager \
            --label avantiqo.code.publication.mode=registry-mutation-no-base-materialization \
            --tag "${tag}"

          digest="$(crane digest "${tag}")"
          case "${digest}" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "AVANTIQO_CODE_POD_IMAGE_DIGEST_INVALID:${digest}"; exit 1 ;;
          esac

          crane config "${tag}" > /tmp/avantiqo-code-v3-config.json
          crane manifest --platform linux/amd64 "${BASE_IMAGE}" > /tmp/avantiqo-code-v2-base-manifest.json
          crane manifest "${tag}" > /tmp/avantiqo-code-v3-manifest.json

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync('/tmp/avantiqo-code-v3-config.json', 'utf8'));
          const base = JSON.parse(readFileSync('/tmp/avantiqo-code-v2-base-manifest.json', 'utf8'));
          const next = JSON.parse(readFileSync('/tmp/avantiqo-code-v3-manifest.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          const entrypoint = config?.config?.Entrypoint ?? [];
          if (JSON.stringify(entrypoint) !== JSON.stringify(['python3', '-u', 'pod_server.py'])) fail('ENTRYPOINT_MISMATCH');
          if (config?.config?.WorkingDir !== '/app') fail('WORKDIR_MISMATCH');
          if (!(config?.config?.Env ?? []).includes('AVANTIQO_CODE_POD_PORT=8000')) fail('PORT_ENV_MISSING');
          if (!config?.config?.ExposedPorts?.['8000/tcp']) fail('EXPOSED_PORT_MISSING');
          const labels = config?.config?.Labels ?? {};
          if (labels['avantiqo.code.engine.warmup'] !== 'generation-free') fail('ENGINE_WARMUP_LABEL_MISSING');
          if (labels['avantiqo.code.engine.preload'] !== 'boot-background') fail('ENGINE_PRELOAD_LABEL_MISSING');
          if (labels['avantiqo.code.safetensors.load-strategy'] !== 'eager') fail('SAFETENSORS_LOAD_STRATEGY_LABEL_MISSING');
          const baseLayers = (base.layers ?? []).map((layer) => layer.digest);
          const nextLayers = (next.layers ?? []).map((layer) => layer.digest);
          if (nextLayers.length !== baseLayers.length + 1) fail('OVERLAY_LAYER_COUNT_MISMATCH');
          if (JSON.stringify(nextLayers.slice(0, baseLayers.length)) !== JSON.stringify(baseLayers)) fail('BASE_LAYER_SEQUENCE_CHANGED');
          console.log('AVANTIQO_CODE_POD_IMAGE_BASE_LAYERS_REUSED=PASS');
          console.log('AVANTIQO_CODE_POD_IMAGE_V3_CONFIG=PASS');
          console.log('AVANTIQO_CODE_POD_IMAGE_ENGINE_WARMUP_GENERATION_FREE=PASS');
          console.log('AVANTIQO_CODE_POD_IMAGE_EAGER_BOOT_PRELOAD=PASS');
          console.log('AVANTIQO_CODE_POD_IMAGE_NETWORK_SAFETENSORS_EAGER=PASS');
          NODE

          echo "release_sha=${RUNTIME_SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "publisher_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "base_platform_digest=${base_platform_digest}" >> "$GITHUB_OUTPUT"

          echo "AVANTIQO_CODE_POD_IMAGE_TAG=${tag}"
          echo "AVANTIQO_CODE_POD_IMAGE_DIGEST=${digest}"
          echo 'AVANTIQO_CODE_POD_IMAGE_REGISTRY_MUTATION=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_ENGINE_WARMUP_GENERATION_FREE=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_EAGER_BOOT_PRELOAD=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_NETWORK_SAFETENSORS_EAGER=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_BASE_MATERIALIZATION=false'

      - name: Create immutable Pod image evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          PUBLISHER_SHA: ${{ steps.image.outputs.publisher_sha }}
          BASE_PLATFORM_DIGEST: ${{ steps.image.outputs.base_platform_digest }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$RUNTIME_SOURCE_SHA"
          mkdir -p /tmp/avantiqo-code-pod-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_CODE_POD_IMAGE_RESULT_V3",
            source_sha: process.env.RELEASE_SHA,
            publisher_workflow_sha: process.env.PUBLISHER_SHA,
            source_sha_pinned_independently_from_publisher: true,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            base_source_sha: process.env.BASE_SOURCE_SHA,
            base_image_digest: process.env.BASE_IMAGE.split('@')[1],
            base_platform_digest: process.env.BASE_PLATFORM_DIGEST,
            base_runtime_reused_immutably: true,
            base_layers_reused_without_materialization: true,
            handler_requirements_unchanged_from_base: true,
            publication_mode: "registry-mutation-no-base-materialization",
            transport: "pod-http",
            pod_http_contract: "AVANTIQO_CODE_POD_HTTP_V3",
            transport_mode: "async-job-polling",
            transport_probe_path: "/v3/transport-probe",
            async_submit_path: "/v3/generations",
            async_status_path_template: "/v3/generations/{job_id}",
            http_proxy_timeout_strategy: "authenticated-probe-plus-immediate-job-id-plus-polling",
            synchronous_generation_allowed: false,
            engine_warmup_generation_free: true,
            engine_warmup_inference_performed: false,
            engine_warmup_reasoning_call_consumed: false,
            engine_warmup_wallet_mutation_performed: false,
            eager_boot_engine_preload: true,
            network_safetensors_load_strategy: "eager",
            external_runpod_transport_probe_required_before_inference: true,
            runtime: "vllm-0.27.1",
            runtime_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8",
            quantization: "fp8",
            network_volume_mount: "/workspace",
            max_concurrency: 1,
            provider_job_submitted: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-code-pod-image/avantiqo-code-pod-image.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload immutable Pod image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-pod-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-code-pod-image/avantiqo-code-pod-image.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm registry-level Pod image publication
        shell: bash
        run: |
          echo 'AVANTIQO_CODE_POD_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_IMMUTABLE_OVERLAY=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_REGISTRY_MUTATION=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_ENGINE_WARMUP_GENERATION_FREE=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_EAGER_BOOT_PRELOAD=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_NETWORK_SAFETENSORS_EAGER=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_BASE_MATERIALIZATION=false'
          echo 'AVANTIQO_CODE_POD_IMAGE_EXTERNAL_RUNTIME_GATE_REQUIRED=PASS'
          echo 'AVANTIQO_CODE_POD_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_CODE_POD_IMAGE_PRODUCTION_DEPLOY=false'