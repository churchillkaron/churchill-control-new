name: Avantiqo Code Private12 V13 Zero Cost Admission

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/avantiqo-code-private12-v13-zero-cost.trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client only
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Verify compact-review contract
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v12.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v8.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v13_cert.py
          python -m py_compile services/avantiqo-code-engine/verify_private12_v13_compact_review.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_private12_v13_compact_review.py
          grep -q 'REVIEWER_MAX_TOKENS = 256' services/avantiqo-code-engine/modal_code_qwen38_private12_v13_cert.py
          grep -q 'REPAIR_MAX_TOKENS = 1024' services/avantiqo-code-engine/modal_code_qwen38_private12_v13_cert.py
          grep -q 'maxItems.: 4' services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v8.py || grep -q '"maxItems": 4' services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v8.py
          grep -q 'reviewer_compact' services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v8.py
          grep -q 'MAX_WARM_P95_MS = 4_000' services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          echo 'AVANTIQO_CODE_PRIVATE12_V13_ZERO_COST_ADMISSION=PASS'
