name: Avantiqo Code Qwen3.8 Warm Generation Smoke

on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Type YES to allow one isolated H100 warm-generation smoke'
        required: true
        default: 'NO'
  push:
    branches:
      - main
    paths:
      - '.github/avantiqo-code-qwen38-generation-smoke-once.txt'

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-generation-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'push' || github.event.inputs.approved == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Validate one-shot approval marker
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test -f .github/avantiqo-code-qwen38-generation-smoke-once.txt
          grep -qx 'AVANTIQO_CODE_QWEN38_GENERATION_SMOKE_ONCE=20260903-V3' .github/avantiqo-code-qwen38-generation-smoke-once.txt

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost source admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/code_model_canary_v2.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_smoke_runner.py
          python -m py_compile services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          grep -q 'generation_smoke.remote(approved=True)' services/avantiqo-code-engine/modal_code_qwen38_smoke_runner.py
          grep -q 'AVANTIQO_CODE_QWEN38_SMOKE_RESULT=' services/avantiqo-code-engine/modal_code_qwen38_smoke_runner.py
          echo 'AVANTIQO_CODE_QWEN38_SMOKE_ZERO_COST_ADMISSION=PASS'
          echo 'AVANTIQO_CODE_QWEN38_SMOKE_EVIDENCE_TRANSPORT=PASS'

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py 2>&1 | tee /tmp/qwen38-smoke-preflight.log
          grep -q '"single_code_storage":true' /tmp/qwen38-smoke-preflight.log
          grep -q '"current_model_ready":true' /tmp/qwen38-smoke-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-smoke-preflight.log
          grep -q '"container_started":false' /tmp/qwen38-smoke-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-smoke-preflight.log
          grep -q '"model_download_performed":false' /tmp/qwen38-smoke-preflight.log
          grep -q '"volume_created":false' /tmp/qwen38-smoke-preflight.log

      - name: Run exactly one H100 warm-generation smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m python -m modal run services/avantiqo-code-engine/modal_code_qwen38_smoke_runner.py --approved 2>&1 | tee /tmp/qwen38-generation-smoke.log
          grep -q 'AVANTIQO_CODE_QWEN38_SMOKE_RESULT=' /tmp/qwen38-generation-smoke.log
          grep -q '"smoke_pass":true' /tmp/qwen38-generation-smoke.log
          grep -q '"correctness_pass":true' /tmp/qwen38-generation-smoke.log
          grep -q '"latency_pass":true' /tmp/qwen38-generation-smoke.log
          grep -q 'Qwen/Qwen3.8-27B-FP8' /tmp/qwen38-generation-smoke.log
          grep -q '017b9c7af6b5689d5dd426a76e0bc077eb5ca20a' /tmp/qwen38-generation-smoke.log
          grep -q 'avantiqo-code-models' /tmp/qwen38-generation-smoke.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-generation-smoke-${{ github.run_id }}
          path: |
            /tmp/qwen38-smoke-preflight.log
            /tmp/qwen38-generation-smoke.log
          if-no-files-found: warn
          retention-days: 14
