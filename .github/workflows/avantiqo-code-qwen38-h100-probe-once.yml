name: Avantiqo Code Qwen3.8 H100 Compatibility Probe

on:
  push:
    paths:
      - .github/avantiqo-code-qwen38-h100-probe-once.txt

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-h100-probe-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost stable-runtime source admission
        run: |
          set -euo pipefail
          test -f .github/avantiqo-code-qwen38-h100-probe-once.txt
          grep -qx 'AVANTIQO_CODE_QWEN38_H100_PROBE_ONCE=20260903-V1' .github/avantiqo-code-qwen38-h100-probe-once.txt
          python -m py_compile services/avantiqo-code-engine/code_model_canary_v2.py
          python -m py_compile services/avantiqo-code-engine/modal_code_model_canary_preflight.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_bootstrap.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_runtime_probe.py
          python -m py_compile services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py

      - name: Prove candidate ready on the one Code volume
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/modal_code_model_canary_preflight.py 2>&1 | tee /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '^AVANTIQO_CODE_MODEL_CANARY_V3=PASS$' /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '"single_code_storage":true' /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '"current_model_ready":true' /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '"current_model_revision":"dcaee4d4dfc5ee71ad501f01f530e5652438fde0"' /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '"gpu_used":false' /tmp/avantiqo-code-qwen38-h100-preflight.log
          grep -q '"volume_created":false' /tmp/avantiqo-code-qwen38-h100-preflight.log

      - name: Run exactly one paid H100 load probe
        timeout-minutes: 14
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
          AVANTIQO_CODE_QWEN38_H100_PROBE_APPROVED: 'YES'
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          timeout --signal=TERM --kill-after=30s 13m python -m modal run services/avantiqo-code-engine/modal_code_qwen38_runtime_probe.py 2>&1 | tee /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '^AVANTIQO_CODE_QWEN38_H100_PROBE_V1=PASS$' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"engine_loaded":true' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"vllm_version":"0.28.0"' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"runtime_model":"Qwen/Qwen3.8-27B-FP8"' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"revision":"017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"prefix_caching_enabled":false' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"speculative_decoding_enabled":false' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"model_download_performed":false' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"volume_created":false' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"production_routing_change":false' /tmp/avantiqo-code-qwen38-h100-probe.log
          grep -q '"production_deploy_performed":false' /tmp/avantiqo-code-qwen38-h100-probe.log

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-h100-probe-${{ github.run_id }}
          path: |
            /tmp/avantiqo-code-qwen38-h100-preflight.log
            /tmp/avantiqo-code-qwen38-h100-probe.log
          if-no-files-found: warn
          retention-days: 14
