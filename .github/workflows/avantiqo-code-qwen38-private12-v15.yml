name: Avantiqo Code Qwen3.8 Private 12 Certification V15

on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Type YES to allow one isolated Qwen3.8 H100 Private12 V15 certification'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-private12-v15
  cancel-in-progress: false

jobs:
  certify:
    if: github.event.inputs.approved == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost V15 hot-path admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v14.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v9.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v15_cert.py
          python -m py_compile services/avantiqo-code-engine/verify_private12_v15_hot_path.py
          python -m py_compile services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_private12_v15_hot_path.py
          echo 'AVANTIQO_CODE_QWEN38_PRIVATE12_V15_ADMISSION=PASS'

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m \
            python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py \
            2>&1 | tee /tmp/qwen38-private12-v15-preflight.log
          grep -q '"single_code_storage":true' /tmp/qwen38-private12-v15-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-private12-v15-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-private12-v15-preflight.log
          grep -q '"model_download_performed":false' /tmp/qwen38-private12-v15-preflight.log
          grep -q '"volume_created":false' /tmp/qwen38-private12-v15-preflight.log
          grep -q '"production_deploy_performed":false' /tmp/qwen38-private12-v15-preflight.log
          grep -q '"production_routing_change":false' /tmp/qwen38-private12-v15-preflight.log

      - name: Derive fresh sealed suite secret
        run: |
          set -euo pipefail
          secret="$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_SHA}:avantiqo-qwen38-private12-v15" | sha256sum | awk '{print $1}')"
          echo "::add-mask::${secret}"
          echo "AVANTIQO_CODE_PRIVATE_SUITE_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Run one hot-path-fixed Qwen3.8 Private12 V15 certification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            python -m modal run \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v15_cert.py::qwen38_private12_v15 \
            --approved 2>&1 | tee /tmp/qwen38-private12-v15.log
          grep -q '"cases":12' /tmp/qwen38-private12-v15.log
          grep -q '"passed":12' /tmp/qwen38-private12-v15.log
          grep -q '"hidden_tests_passed":12' /tmp/qwen38-private12-v15.log
          grep -q '"regression_tests_passed":12' /tmp/qwen38-private12-v15.log
          grep -q '"semantic_review_passed":12' /tmp/qwen38-private12-v15.log
          grep -q '"latency_measurement":"warm_single_request_representative"' /tmp/qwen38-private12-v15.log
          grep -Eq '"quality_batch_calls":[1-4](,|})' /tmp/qwen38-private12-v15.log
          grep -q '"latency_single_calls":3' /tmp/qwen38-private12-v15.log
          grep -Eq '"total_modal_calls":[4-7](,|})' /tmp/qwen38-private12-v15.log
          grep -q '"worldclass_certified":true' /tmp/qwen38-private12-v15.log
          grep -q 'AVANTIQO_CODE_QWEN38_PRIVATE12_CERT_V15=PASS' /tmp/qwen38-private12-v15.log

      - name: Upload V15 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-private12-v15-${{ github.run_id }}
          path: |
            /tmp/qwen38-private12-v15-preflight.log
            /tmp/qwen38-private12-v15.log
          if-no-files-found: warn
          retention-days: 14
