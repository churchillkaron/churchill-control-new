name: Avantiqo Code Qwen3.8 Private 12 Certification V2

on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Type YES to allow one isolated Qwen3.8 H100 private 12 V2 certification'
        required: true
        default: 'NO'
  push:
    branches:
      - main
    paths:
      - '.github/triggers/avantiqo-code-qwen38-private12-v2-20260903.trigger'

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-private12-v2
  cancel-in-progress: false

jobs:
  certify:
    if: github.event_name == 'push' || github.event.inputs.approved == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost V2 admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v4.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v2_cert.py
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_repo_agent_v4.py
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
          ! grep -Eq 'ledger_rounding|hot_path|97b8062e96e6f0772fc3|35c408a88303c4f5cc9a' \
            services/avantiqo-code-engine/repo_agent_v4.py
          grep -q 'enable_prefix_caching=ENABLE_PREFIX_CACHING' \
            services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py
          grep -q 'model_calls <= MAX_MODEL_CALLS' \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v2_cert.py
          echo 'AVANTIQO_CODE_PRIVATE12_V2_MODEL_CALL_BUDGET=PASS'
          echo 'AVANTIQO_CODE_QWEN38_PRIVATE12_V2_ADMISSION=PASS'

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m \
            python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py \
            2>&1 | tee /tmp/qwen38-private12-v2-preflight.log
          grep -q '"single_code_storage":true' /tmp/qwen38-private12-v2-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-private12-v2-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-private12-v2-preflight.log
          grep -q '"model_download_performed":false' /tmp/qwen38-private12-v2-preflight.log
          grep -q '"volume_created":false' /tmp/qwen38-private12-v2-preflight.log
          grep -q '"production_deploy_performed":false' /tmp/qwen38-private12-v2-preflight.log
          grep -q '"production_routing_change":false' /tmp/qwen38-private12-v2-preflight.log

      - name: Derive new sealed suite secret
        run: |
          set -euo pipefail
          secret="$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_SHA}:avantiqo-qwen38-private12-v2" | sha256sum | awk '{print $1}')"
          echo "::add-mask::${secret}"
          echo "AVANTIQO_CODE_PRIVATE_SUITE_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Run one Qwen3.8 private 12 V2 certification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 30m \
            python -m modal run \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v2_cert.py::qwen38_private12_v2 \
            --approved 2>&1 | tee /tmp/qwen38-private12-v2.log
          grep -q 'AVANTIQO_CODE_QWEN38_PRIVATE12_V2_RESULT=' /tmp/qwen38-private12-v2.log
          grep -q '"cases":12' /tmp/qwen38-private12-v2.log
          grep -q '"passed":12' /tmp/qwen38-private12-v2.log
          grep -q '"hidden_tests_passed":12' /tmp/qwen38-private12-v2.log
          grep -q '"regression_tests_passed":12' /tmp/qwen38-private12-v2.log
          grep -q '"semantic_review_passed":12' /tmp/qwen38-private12-v2.log
          grep -q '"worldclass_certified":true' /tmp/qwen38-private12-v2.log
          grep -q 'AVANTIQO_CODE_QWEN38_PRIVATE12_CERT_V2=PASS' /tmp/qwen38-private12-v2.log

      - name: Upload V2 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-private12-v2-${{ github.run_id }}
          path: |
            /tmp/qwen38-private12-v2-preflight.log
            /tmp/qwen38-private12-v2.log
          if-no-files-found: warn
          retention-days: 14
