name: Avantiqo Code Qwen3.8 Private 12 Certification V8

on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Type YES to allow one isolated Qwen3.8 H100 Private12 V8 certification'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-private12-v8
  cancel-in-progress: false

jobs:
  certify:
    if: github.event.inputs.approved == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost V8 admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v9.py
          python -m py_compile services/avantiqo-code-engine/verify_repo_agent_v9.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v7.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py
          python -m py_compile services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_repo_agent_v9.py
          grep -q 'RUN_SEED = "20260904-qwen38-private12-v8"' services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py
          grep -q 'import repo_agent_v9 as agent' services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py
          grep -q 'runtime.generate_v7' services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py
          grep -q 'MAX_MODAL_TOTAL_CALLS = base.MAX_MODAL_TOTAL_CALLS' services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py
          grep -q 'WARM_TARGET_MS = base.WARM_TARGET_MS' services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py
          grep -q 'MAX_WARM_P95_MS = 4_000' services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          grep -q 'StructuredOutputsParams' services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v7.py
          echo 'AVANTIQO_CODE_QWEN38_PRIVATE12_V8_ADMISSION=PASS'

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m \
            python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py \
            2>&1 | tee /tmp/qwen38-private12-v8-preflight.log
          grep -q '"single_code_storage":true' /tmp/qwen38-private12-v8-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-private12-v8-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-private12-v8-preflight.log
          grep -q '"model_download_performed":false' /tmp/qwen38-private12-v8-preflight.log
          grep -q '"volume_created":false' /tmp/qwen38-private12-v8-preflight.log
          grep -q '"production_deploy_performed":false' /tmp/qwen38-private12-v8-preflight.log
          grep -q '"production_routing_change":false' /tmp/qwen38-private12-v8-preflight.log

      - name: Derive fresh sealed suite secret
        run: |
          set -euo pipefail
          secret="$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_SHA}:avantiqo-qwen38-private12-v8" | sha256sum | awk '{print $1}')"
          echo "::add-mask::${secret}"
          echo "AVANTIQO_CODE_PRIVATE_SUITE_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Run one structured accelerated Qwen3.8 Private12 V8 certification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            python -m modal run \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v8_cert.py::qwen38_private12_v8 \
            --approved 2>&1 | tee /tmp/qwen38-private12-v8.log
          grep -q '"cases":12' /tmp/qwen38-private12-v8.log
          grep -q '"passed":12' /tmp/qwen38-private12-v8.log
          grep -q '"hidden_tests_passed":12' /tmp/qwen38-private12-v8.log
          grep -q '"regression_tests_passed":12' /tmp/qwen38-private12-v8.log
          grep -q '"semantic_review_passed":12' /tmp/qwen38-private12-v8.log
          grep -q '"latency_measurement":"warm_single_request_representative"' /tmp/qwen38-private12-v8.log
          grep -Eq '"quality_batch_calls":[1-4](,|})' /tmp/qwen38-private12-v8.log
          grep -q '"latency_single_calls":3' /tmp/qwen38-private12-v8.log
          grep -Eq '"total_modal_calls":[4-7](,|})' /tmp/qwen38-private12-v8.log
          grep -q '"worldclass_certified":true' /tmp/qwen38-private12-v8.log
          grep -q 'AVANTIQO_CODE_QWEN38_PRIVATE12_CERT_V8=PASS' /tmp/qwen38-private12-v8.log

      - name: Upload V8 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-private12-v8-${{ github.run_id }}
          path: |
            /tmp/qwen38-private12-v8-preflight.log
            /tmp/qwen38-private12-v8.log
          if-no-files-found: warn
          retention-days: 14
