name: Avantiqo Code Qwen3.8 Private 12 Certification V8

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/avantiqo-code-v11-registered-zero-cost-20260904.trigger'

permissions:
  contents: read

jobs:
  verify_v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove Repo Agent V11 zero cost
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v11.py
          python -m py_compile services/avantiqo-code-engine/verify_repo_agent_v11.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_repo_agent_v11.py
          echo 'AVANTIQO_CODE_REPO_AGENT_V11_REGISTERED_ZERO_COST=PASS'
