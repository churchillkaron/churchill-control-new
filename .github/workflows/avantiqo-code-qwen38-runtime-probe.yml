name: Avantiqo Code Qwen3.8 H100 Compatibility Probe

on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Type YES to allow one isolated H100 model-load compatibility probe'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-h100-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event.inputs.approved == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost source admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/code_model_canary_v2.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
          python -m py_compile services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py 2>&1 | tee /tmp/qwen38-probe-preflight.log
          grep -q '"single_code_storage":true' /tmp/qwen38-probe-preflight.log
          grep -q '"current_model_ready":true' /tmp/qwen38-probe-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-probe-preflight.log
          grep -q '"container_started":false' /tmp/qwen38-probe-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-probe-preflight.log

      - name: Run exactly one H100 model-load probe
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 15m python -m modal run services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py::app.runtime_probe --approved true 2>&1 | tee /tmp/qwen38-h100-probe.log
          grep -q 'runtime_ready' /tmp/qwen38-h100-probe.log
          grep -q 'Qwen/Qwen3.8-27B-FP8' /tmp/qwen38-h100-probe.log
          grep -q '017b9c7af6b5689d5dd426a76e0bc077eb5ca20a' /tmp/qwen38-h100-probe.log
          grep -q 'avantiqo-code-models' /tmp/qwen38-h100-probe.log

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-h100-probe-${{ github.run_id }}
          path: |
            /tmp/qwen38-probe-preflight.log
            /tmp/qwen38-h100-probe.log
          if-no-files-found: warn
          retention-days: 14
