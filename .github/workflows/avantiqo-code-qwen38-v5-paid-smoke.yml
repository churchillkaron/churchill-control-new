name: Avantiqo Code Qwen3.8 V5 Paid Smoke

on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Type YES to allow one isolated Qwen3.8 H100 V5 smoke'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-v5-paid-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event.inputs.approved == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_v5_paid_smoke.py
          grep -q 'enable_prefix_caching=ENABLE_PREFIX_CACHING' services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py
          echo 'AVANTIQO_CODE_QWEN38_V5_SMOKE_ADMISSION=PASS'

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m \
            python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py \
            2>&1 | tee /tmp/qwen38-v5-smoke-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-v5-smoke-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-v5-smoke-preflight.log
          grep -q '"model_download_performed":false' /tmp/qwen38-v5-smoke-preflight.log
          grep -q '"volume_created":false' /tmp/qwen38-v5-smoke-preflight.log
          grep -q '"production_deploy_performed":false' /tmp/qwen38-v5-smoke-preflight.log

      - name: Run one V5 H100 smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            python -m modal run services/avantiqo-code-engine/modal_code_qwen38_v5_paid_smoke.py::qwen38_v5_paid_smoke \
            --approved 2>&1 | tee /tmp/qwen38-v5-smoke.log
          grep -q 'AVANTIQO_CODE_QWEN38_V5_SMOKE_RESULT=' /tmp/qwen38-v5-smoke.log
          grep -q 'AVANTIQO_CODE_QWEN38_V5_SMOKE=PASS' /tmp/qwen38-v5-smoke.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-v5-smoke-${{ github.run_id }}
          path: |
            /tmp/qwen38-v5-smoke-preflight.log
            /tmp/qwen38-v5-smoke.log
          if-no-files-found: warn
          retention-days: 14
