name: Avantiqo Code Qwen3.8 Zero-Cost Admission

on:
  workflow_dispatch:
  push:
    paths:
      - services/avantiqo-code-engine/code_model_canary_v2.py
      - services/avantiqo-code-engine/modal_code_model_canary_preflight.py
      - services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
      - services/avantiqo-code-engine/modal_code_qwen38_bootstrap.py
      - services/avantiqo-code-engine/modal_code_qwen38_runtime_probe.py
      - services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
      - services/avantiqo-code-engine/modal_code_qwen38_hard10_benchmark.py
      - services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
      - services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
      - services/avantiqo-code-engine/repo_agent_v3.py
      - services/avantiqo-code-engine/worldclass_cert_v2_contract.py
      - services/avantiqo-code-engine/worldclass_private_runner_v2.py
      - services/avantiqo-code-engine/worldclass_private_suite_v2.py
      - services/avantiqo-code-engine/worldclass_private_fixtures_v3.py
      - services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
      - .github/workflows/avantiqo-code-qwen38-generation-smoke.yml
      - .github/workflows/avantiqo-code-qwen38-hard10.yml
      - .github/workflows/avantiqo-code-qwen38-private12.yml
      - .github/workflows/avantiqo-code-qwen38-zero-cost.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-zero-cost
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify authoritative isolated canary source
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/code_model_canary_v2.py
          python -m py_compile services/avantiqo-code-engine/modal_code_model_canary_preflight.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_bootstrap.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_runtime_probe.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_hard10_benchmark.py
          python -m py_compile services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          grep -q 'from modal_code_qwen38_canary_runtime import app, generation_smoke' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          grep -q 'def smoke_evidence(approved: bool = False)' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          test "$(grep -c 'generation_smoke.remote(approved=approved)' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py)" -eq 1
          grep -q 'AVANTIQO_CODE_QWEN38_SMOKE_RESULT=' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          grep -q 'modal_code_qwen38_smoke_evidence.py::smoke_evidence --approved' .github/workflows/avantiqo-code-qwen38-generation-smoke.yml
          grep -q 'AVANTIQO_CODE_QWEN38_HARD10_BENCHMARK_V2' services/avantiqo-code-engine/modal_code_qwen38_hard10_benchmark.py
          grep -q 'Number(value.toFixed(2))' services/avantiqo-code-engine/modal_code_qwen38_hard10_benchmark.py
          grep -q '100\*1 + 50\*0.8 = 140' services/avantiqo-code-engine/modal_code_qwen38_hard10_benchmark.py
          grep -q 'benchmark_specific_source_rewrite_used' services/avantiqo-code-engine/modal_code_qwen38_hard10_benchmark.py
          echo 'AVANTIQO_CODE_QWEN38_SMOKE_EVIDENCE_TRANSPORT=PASS'
          echo 'AVANTIQO_CODE_QWEN38_HARD10_V2_PUBLIC_GUARDS=PASS'
          echo 'AVANTIQO_CODE_QWEN38_ZERO_COST_CI=PASS'

      - name: Verify sealed executable world-class fixtures
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v3.py
          python -m py_compile services/avantiqo-code-engine/worldclass_cert_v2_contract.py
          python -m py_compile services/avantiqo-code-engine/worldclass_private_runner_v2.py
          python -m py_compile services/avantiqo-code-engine/worldclass_private_suite_v2.py
          python -m py_compile services/avantiqo-code-engine/worldclass_private_fixtures_v3.py
          python -m py_compile services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
          echo 'AVANTIQO_CODE_WORLDCLASS_PRIVATE_FIXTURES_ZERO_GPU=PASS'

      - name: Verify Qwen3.8 private-12 certification contract
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'AVANTIQO_CODE_QWEN38_PRIVATE12_CERT_V1' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'len(materialized) != 12' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'run_repo_agent' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'hidden_tests_passed' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'regression_tests_passed' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'warm_ms = max(model.latencies_ms)' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'benchmark_task_specific_rewriters' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'candidate_isolated_from_production' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'production_routing_change.*False' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'production_deploy_performed.*False' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'model_download_performed.*False' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          grep -q 'volume_created.*False' services/avantiqo-code-engine/modal_code_qwen38_private12_cert.py
          echo 'AVANTIQO_CODE_QWEN38_PRIVATE12_ZERO_COST_ADMISSION=PASS'
