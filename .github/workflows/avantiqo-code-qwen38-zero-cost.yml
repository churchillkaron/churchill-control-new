name: Avantiqo Code Qwen3.8 Zero-Cost Admission

on:
  workflow_dispatch:
  push:
    paths:
      - services/avantiqo-code-engine/code_model_canary_v2.py
      - services/avantiqo-code-engine/modal_code_model_canary_preflight.py
      - services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
      - services/avantiqo-code-engine/modal_code_qwen38_bootstrap.py
      - services/avantiqo-code-engine/modal_code_qwen38_runtime_probe.py
      - services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
      - services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
      - services/avantiqo-code-engine/worldclass_private_suite_v2.py
      - services/avantiqo-code-engine/worldclass_private_fixtures_v3.py
      - services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
      - .github/workflows/avantiqo-code-qwen38-generation-smoke.yml
      - .github/workflows/avantiqo-code-qwen38-zero-cost.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-code-qwen38-zero-cost
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify authoritative isolated canary source
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/code_model_canary_v2.py
          python -m py_compile services/avantiqo-code-engine/modal_code_model_canary_preflight.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_bootstrap.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_runtime_probe.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          python -m py_compile services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_code_qwen38_canary_v1.py
          grep -q 'from modal_code_qwen38_canary_runtime import app, generation_smoke' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          grep -q 'def smoke_evidence(approved: bool = False)' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          test "$(grep -c 'generation_smoke.remote(approved=approved)' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py)" -eq 1
          grep -q 'AVANTIQO_CODE_QWEN38_SMOKE_RESULT=' services/avantiqo-code-engine/modal_code_qwen38_smoke_evidence.py
          grep -q 'modal_code_qwen38_smoke_evidence.py::smoke_evidence --approved' .github/workflows/avantiqo-code-qwen38-generation-smoke.yml
          echo 'AVANTIQO_CODE_QWEN38_SMOKE_EVIDENCE_TRANSPORT=PASS'
          echo 'AVANTIQO_CODE_QWEN38_ZERO_COST_CI=PASS'

      - name: Verify sealed executable world-class fixtures
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/worldclass_private_suite_v2.py
          python -m py_compile services/avantiqo-code-engine/worldclass_private_fixtures_v3.py
          python -m py_compile services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py
          echo 'AVANTIQO_CODE_WORLDCLASS_PRIVATE_FIXTURES_ZERO_GPU=PASS'
