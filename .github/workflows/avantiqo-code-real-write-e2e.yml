name: Avantiqo Code Real Write E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - services/avantiqo-code-engine/handler.py
      - services/avantiqo-code-engine/modal_app.py
      - scripts/run-avantiqo-code-modal-real-write-e2e-ci.py
      - lib/platform/service-runtime/providers/avantiqo-code/AvantiqoCodeProviderV2.js
      - lib/platform/service-runtime/providers/avantiqo-code/AvantiqoCodeProviderRegistration.js
      - .github/workflows/avantiqo-code-real-write-e2e.yml

permissions:
  contents: read

# Exactly one paid hard proof may run at a time. Do not cancel an in-flight
# inference just because main moves in parallel.
concurrency:
  group: avantiqo-code-real-write-e2e
  cancel-in-progress: false

jobs:
  certify-real-code-write:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Modal client
        run: python -m pip install --disable-pip-version-check "modal==1.2.6"

      - name: Syntax-check strict Modal real-write proof
        run: |
          python -m py_compile services/avantiqo-code-engine/modal_app.py
          python -m py_compile scripts/run-avantiqo-code-modal-real-write-e2e-ci.py

      - name: Run one-shot Modal H100 real Code write proof
        env:
          NODE_ENV: development
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/run-avantiqo-code-modal-real-write-e2e-ci.py \
            2>&1 | tee /tmp/avantiqo-code-real-write-e2e.log

      - name: Verify hard E2E evidence
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const report = JSON.parse(await readFile("artifacts/avantiqo-code-real-write-e2e.json", "utf8"));
          const required = [
            [report.success === true, "REPORT_SUCCESS_REQUIRED"],
            [report.contract === "AVANTIQO_CODE_MODAL_REAL_WRITE_E2E_V1", "REPORT_CONTRACT_REQUIRED"],
            [report.transport === "MODAL_ONE_SHOT_H100", "MODAL_TRANSPORT_REQUIRED"],
            [report.proof?.broken_fixture_failed_before_ai === true, "BROKEN_FIXTURE_MUST_FAIL_FIRST"],
            [report.proof?.model_inference_performed === true, "REAL_MODEL_INFERENCE_REQUIRED"],
            [report.proof?.model_inference_count === 1, "EXACTLY_ONE_MODEL_INFERENCE_REQUIRED"],
            [report.proof?.source_mutation_performed === true, "REAL_SOURCE_WRITE_REQUIRED"],
            [report.proof?.generated_code_executed === true, "GENERATED_CODE_EXECUTION_REQUIRED"],
            [report.proof?.generated_tests_passed === true, "GENERATED_TEST_PASS_REQUIRED"],
            [report.proof?.final_test_exit_code === 0, "FINAL_TEST_EXIT_ZERO_REQUIRED"],
            [report.proof?.provider === "avantiqo-code", "OWNED_PROVIDER_REQUIRED"],
            [report.proof?.model === "avantiqo-code-v1", "PRODUCT_MODEL_REQUIRED"],
            [report.proof?.foundation_model === "Qwen/Qwen3-Coder-30B-A3B-Instruct", "FOUNDATION_MODEL_REQUIRED"],
            [report.proof?.runtime_model === "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8", "RUNTIME_MODEL_REQUIRED"],
            [report.proof?.serving_runtime === "vllm", "VLLM_RUNTIME_REQUIRED"],
            [report.proof?.quantization === "fp8", "FP8_REQUIRED"],
            [Number(report.proof?.usage?.input_tokens || 0) > 0, "INPUT_TOKEN_EVIDENCE_REQUIRED"],
            [Number(report.proof?.usage?.output_tokens || 0) > 0, "OUTPUT_TOKEN_EVIDENCE_REQUIRED"],
            [report.certification?.runner_contract === "AVANTIQO_CODE_MODAL_REAL_WRITE_E2E_CI_V1", "RUNNER_CONTRACT_REQUIRED"],
            [report.certification?.single_model_invocation_source_verified === true, "SINGLE_INVOCATION_SOURCE_GUARD_REQUIRED"],
            [report.certification?.model_inference_count === 1, "CERTIFICATION_ONE_INFERENCE_REQUIRED"],
            [report.certification?.owned_only === true, "OWNED_ONLY_REQUIRED"],
            [report.certification?.external_provider_fallback_used === false, "EXTERNAL_PROVIDER_FALLBACK_FORBIDDEN"],
            [report.safeguards?.runpod_transport_used === false, "SECOND_GPU_TRANSPORT_FORBIDDEN"],
            [report.safeguards?.runpod_storage_created === false, "RUNPOD_STORAGE_CREATION_FORBIDDEN"],
            [report.safeguards?.modal_volume_created === false, "MODAL_VOLUME_CREATION_FORBIDDEN"],
            [report.safeguards?.persistent_repository_mutation_performed === false, "PERSISTENT_REPO_MUTATION_FORBIDDEN"],
            [report.safeguards?.raw_reasoning_persisted === false, "RAW_REASONING_PERSISTENCE_FORBIDDEN"],
            [report.safeguards?.production_deploy_performed === false, "PRODUCTION_DEPLOY_FORBIDDEN"],
            [report.safeguards?.secrets_printed === false, "SECRET_PRINT_FORBIDDEN"],
          ];
          const failed = required.find(([ok]) => !ok);
          if (failed) throw new Error(failed[1]);

          const log = await readFile("/tmp/avantiqo-code-real-write-e2e.log", "utf8");
          if (!log.includes("AVANTIQO_CODE_MODAL_REAL_WRITE_E2E_V1=PASS")) {
            throw new Error("MODAL_ENGINE_PASS_REQUIRED");
          }
          if (!log.includes("AVANTIQO_CODE_MODAL_REAL_WRITE_E2E_CI_V1=PASS")) {
            throw new Error("MODAL_CI_RUNNER_PASS_REQUIRED");
          }
          if (log.includes("AVANTIQO_CODE_REAL_WRITE_POD_E2E_PROOF_V9=PASS") ||
              log.includes("AVANTIQO_CODE_REAL_WRITE_SERVERLESS_E2E_PROOF_V4_LAUNCHER=PASS")) {
            throw new Error("SECOND_GPU_TRANSPORT_EXECUTION_FORBIDDEN");
          }
          console.log("AVANTIQO_CODE_REAL_WRITE_E2E_HARD_GATE=PASS");
          NODE

      - name: Upload real-write E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-real-write-e2e-${{ github.run_id }}
          path: |
            artifacts/avantiqo-code-real-write-e2e.json
            artifacts/avantiqo-code-real-generation-modal/**
            /tmp/avantiqo-code-real-write-e2e.log
          if-no-files-found: warn
          retention-days: 14
