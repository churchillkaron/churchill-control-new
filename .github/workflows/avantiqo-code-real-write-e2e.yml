name: Avantiqo Code Real Write E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/migrate-avantiqo-code-runpod-global-cached-model-v3-local.mjs
      - scripts/run-avantiqo-code-real-write-auto-transport-e2e-proof-v10-local.mjs
      - scripts/run-avantiqo-code-real-write-pod-e2e-proof-v9-local.mjs
      - scripts/run-avantiqo-code-real-write-pod-e2e-proof-v8-local.mjs
      - scripts/run-avantiqo-code-real-write-e2e-proof-v1-local.mjs
      - scripts/run-avantiqo-code-real-write-serverless-e2e-proof-v4-local.mjs
      - scripts/run-avantiqo-code-real-write-serverless-child-v1.mjs
      - scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
      - scripts/avantiqo-code-runpod-distributed-lease.mjs
      - config/avantiqo-runpod-safe-lease-policy.json
      - .github/workflows/avantiqo-code-real-write-e2e.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-code-real-write-e2e
  cancel-in-progress: false

jobs:
  certify-real-code-write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Syntax-check repair and automatic real-write transport
        run: |
          node --check scripts/migrate-avantiqo-code-runpod-global-cached-model-v3-local.mjs
          node --check scripts/run-avantiqo-code-real-write-auto-transport-e2e-proof-v10-local.mjs
          node --check scripts/run-avantiqo-code-real-write-pod-e2e-proof-v9-local.mjs
          node --check scripts/run-avantiqo-code-real-write-pod-e2e-proof-v8-local.mjs
          node --check scripts/run-avantiqo-code-real-write-e2e-proof-v1-local.mjs
          node --check scripts/run-avantiqo-code-real-write-serverless-e2e-proof-v4-local.mjs
          node --check scripts/run-avantiqo-code-real-write-serverless-child-v1.mjs
          node --check scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          node --check scripts/avantiqo-code-runpod-distributed-lease.mjs

      - name: Force-refresh idle Code cached-model scheduler state
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_CODE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_CODE_API_KEY }}
          AVANTIQO_CODE_GLOBAL_CACHED_MODEL_MIGRATION_APPROVED: "YES"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate-avantiqo-code-runpod-global-cached-model-v3-local.mjs \
            2>&1 | tee /tmp/avantiqo-code-scheduler-refresh.log
          grep -F 'AVANTIQO_CODE_RUNPOD_GLOBAL_CACHED_MODEL_MIGRATION_V3=PASS' /tmp/avantiqo-code-scheduler-refresh.log >/dev/null
          grep -F '"code_storage_count": 1' /tmp/avantiqo-code-scheduler-refresh.log >/dev/null
          grep -F '"new_storage_created": false' /tmp/avantiqo-code-scheduler-refresh.log >/dev/null
          grep -F '"workers_min": 0' /tmp/avantiqo-code-scheduler-refresh.log >/dev/null
          grep -F '"workers_max": 0' /tmp/avantiqo-code-scheduler-refresh.log >/dev/null
          grep -F '"production_deploy_performed": false' /tmp/avantiqo-code-scheduler-refresh.log >/dev/null

      - name: Run one-shot Pod to Serverless real Code write proof
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_CODE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_CODE_API_KEY }}
          RUNPOD_AVANTIQO_CODE_ENDPOINT_ID: r79dtnjnrilrlc
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED: "YES"
          AVANTIQO_RUNPOD_SAFE_LEASE_TARGET_AND_OPEN_HEALTH_LANE: code
          AVANTIQO_CODE_REAL_WRITE_E2E_PROOF_APPROVED: "YES"
          AVANTIQO_CODE_E2E_REPORT_PATH: ${{ github.workspace }}/artifacts/avantiqo-code-real-write-e2e.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/run-avantiqo-code-real-write-auto-transport-e2e-proof-v10-local.mjs \
            2>&1 | tee /tmp/avantiqo-code-real-write-e2e.log

      - name: Verify hard E2E evidence
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("artifacts/avantiqo-code-real-write-e2e.json", "utf8"));
          const required = [
            [report.success === true, "REPORT_SUCCESS_REQUIRED"],
            [report.proof?.broken_fixture_failed_before_ai === true, "BROKEN_FIXTURE_MUST_FAIL_FIRST"],
            [report.proof?.model_inference_performed === true, "REAL_MODEL_INFERENCE_REQUIRED"],
            [report.proof?.source_mutation_performed === true, "REAL_SOURCE_WRITE_REQUIRED"],
            [report.proof?.generated_code_executed === true, "GENERATED_CODE_EXECUTION_REQUIRED"],
            [report.proof?.generated_tests_passed === true, "GENERATED_TEST_PASS_REQUIRED"],
            [report.proof?.final_test_exit_code === 0, "FINAL_TEST_EXIT_ZERO_REQUIRED"],
            [report.safeguards?.persistent_repository_mutation_performed === false, "PERSISTENT_REPO_MUTATION_FORBIDDEN"],
            [report.safeguards?.production_deploy_performed === false, "PRODUCTION_DEPLOY_FORBIDDEN"],
            [report.safeguards?.secrets_printed === false, "SECRET_PRINT_FORBIDDEN"],
          ];
          const failed = required.find(([ok]) => !ok);
          if (failed) throw new Error(failed[1]);
          const log = await readFile("/tmp/avantiqo-code-real-write-e2e.log", "utf8");
          if (!log.includes("AVANTIQO_CODE_REAL_WRITE_AUTO_TRANSPORT_E2E_PROOF_V10=PASS")) {
            throw new Error("AUTO_TRANSPORT_PASS_REQUIRED");
          }
          const podPass = log.includes("AVANTIQO_CODE_REAL_WRITE_POD_E2E_PROOF_V9=PASS");
          const serverlessPass = log.includes("AVANTIQO_CODE_REAL_WRITE_SERVERLESS_E2E_PROOF_V4_LAUNCHER=PASS");
          if (!podPass && !serverlessPass) throw new Error("OWNED_TRANSPORT_PASS_REQUIRED");
          if (podPass && serverlessPass) throw new Error("TRANSPORT_OVERLAP_FORBIDDEN");
          console.log("AVANTIQO_CODE_REAL_WRITE_E2E_HARD_GATE=PASS");
          NODE

      - name: Upload real-write E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-real-write-e2e-${{ github.run_id }}
          path: |
            artifacts/avantiqo-code-real-write-e2e.json
            /tmp/avantiqo-code-real-write-e2e.log
            /tmp/avantiqo-code-scheduler-refresh.log
          if-no-files-found: warn
          retention-days: 14
