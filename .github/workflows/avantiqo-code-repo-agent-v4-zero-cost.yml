name: Avantiqo Code Repo Agent Zero Cost

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/avantiqo-code-engine/repo_agent_v4.py'
      - 'services/avantiqo-code-engine/verify_repo_agent_v4.py'
      - 'services/avantiqo-code-engine/repo_agent_v5.py'
      - 'services/avantiqo-code-engine/verify_repo_agent_v5.py'
      - 'services/avantiqo-code-engine/repo_agent_v6.py'
      - 'services/avantiqo-code-engine/verify_repo_agent_v6.py'
      - 'services/avantiqo-code-engine/worldclass_cert_v3_contract.py'
      - 'services/avantiqo-code-engine/verify_worldclass_cert_v3.py'
      - 'services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py'
      - 'services/avantiqo-code-engine/modal_code_qwen38_private12_v2_cert.py'
      - 'services/avantiqo-code-engine/modal_code_qwen38_private12_v3_cert.py'
      - '.github/workflows/avantiqo-code-repo-agent-v4-zero-cost.yml'
      - '.github/workflows/avantiqo-code-qwen38-private12-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Code contracts
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v3.py
          python -m py_compile services/avantiqo-code-engine/repo_agent_v4.py
          python -m py_compile services/avantiqo-code-engine/verify_repo_agent_v4.py
          python -m py_compile services/avantiqo-code-engine/repo_agent_v5.py
          python -m py_compile services/avantiqo-code-engine/verify_repo_agent_v5.py
          python -m py_compile services/avantiqo-code-engine/repo_agent_v6.py
          python -m py_compile services/avantiqo-code-engine/verify_repo_agent_v6.py
          python -m py_compile services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          python -m py_compile services/avantiqo-code-engine/verify_worldclass_cert_v3.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v2_cert.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v3_cert.py

      - name: Prove V4 semantic review loop without GPU
        run: |
          set -euo pipefail
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_repo_agent_v4.py

      - name: Prove V5 batched low-call contract without GPU
        run: |
          set -euo pipefail
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_repo_agent_v5.py

      - name: Prove V6 resilient edit and semantic contract without GPU
        run: |
          set -euo pipefail
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_repo_agent_v6.py

      - name: Prove World-Class V3 separated latency gate without GPU
        run: |
          set -euo pipefail
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_worldclass_cert_v3.py

      - name: Re-prove sealed fixture integrity without GPU
        run: |
          set -euo pipefail
          PYTHONPATH=services/avantiqo-code-engine \
            python services/avantiqo-code-engine/verify_worldclass_private_fixtures_v3.py

      - name: Prove no benchmark-answer patching and hard batch ceiling
        run: |
          set -euo pipefail
          ! grep -Eq '97b8062e96e6f0772fc3|35c408a88303c4f5cc9a|152e5ea16232cf52d368|e1e7f8e24989b045959c' \
            services/avantiqo-code-engine/repo_agent_v4.py \
            services/avantiqo-code-engine/repo_agent_v5.py \
            services/avantiqo-code-engine/repo_agent_v6.py
          grep -q 'MAX_CASE_MODEL_SEQUENCES = v5.MAX_CASE_MODEL_SEQUENCES' \
            services/avantiqo-code-engine/repo_agent_v6.py
          grep -q 'MAX_WARM_P95_MS = 4_000' \
            services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          grep -q 'single_request=value.get("single_request") is True' \
            services/avantiqo-code-engine/worldclass_cert_v3_contract.py
          grep -q 'MAX_MODAL_BATCH_CALLS = 4' \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v3_cert.py
          grep -q 'modal_batch_calls > MAX_MODAL_BATCH_CALLS' \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v3_cert.py
          grep -q 'enable_prefix_caching=ENABLE_PREFIX_CACHING' \
            services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v5.py
          echo 'AVANTIQO_CODE_REPO_AGENT_V6_BATCH_CEILING=PASS'
          echo 'AVANTIQO_CODE_WORLDCLASS_V3_LATENCY_GATE=PASS'
          echo 'AVANTIQO_CODE_REPO_AGENT_ZERO_COST=PASS'
