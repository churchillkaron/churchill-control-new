name: Avantiqo Code Stalled Proof Cleanup

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-code-stalled-proof-cleanup-request.json

permissions:
  contents: read

jobs:
  cleanup-stalled-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_CODE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_CODE_API_KEY }}
    steps:
      - name: Purge exact observed single queued proof and park endpoint
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpointId = "r79dtnjnrilrlc";
          const management = (process.env.RUNPOD_MANAGEMENT_API_KEY || process.env.RUNPOD_API_KEY || "").trim();
          const runtime = (process.env.RUNPOD_AVANTIQO_CODE_API_KEY || process.env.RUNPOD_API_KEY || management).trim();
          if (!management || !runtime) throw new Error("RUNPOD_CODE_KEYS_REQUIRED");
          async function call(url, key, options = {}) {
            const response = await fetch(url, {
              method: options.method || "GET",
              headers: { Authorization: `Bearer ${key}`, Accept: "application/json", ...(options.body ? { "Content-Type": "application/json" } : {}) },
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const raw = await response.text();
            let body = {}; try { body = raw ? JSON.parse(raw) : {}; } catch { body = { message: raw }; }
            if (!response.ok) throw new Error(`HTTP_${response.status}:${String(body?.message || body?.error || body?.detail || raw).slice(0,700)}`);
            return body;
          }
          const healthUrl = `https://api.runpod.ai/v2/${endpointId}/health`;
          const before = await call(healthUrl, runtime);
          const inQueue = Number(before?.jobs?.inQueue ?? before?.jobs?.in_queue ?? 0);
          const inProgress = Number(before?.jobs?.inProgress ?? before?.jobs?.in_progress ?? 0);
          const workers = before?.workers || {};
          const activeWorkers = ["idle","initializing","ready","running","throttled","unhealthy"].reduce((sum,key) => sum + Math.max(0, Number(workers[key] ?? 0)), 0);
          if (inQueue !== 1 || inProgress !== 0 || activeWorkers !== 0) {
            throw new Error(`CODE_STALLED_PROOF_CLEANUP_PRECONDITION_FAILED:queue=${inQueue}:progress=${inProgress}:workers=${activeWorkers}`);
          }
          const purged = await call(`https://api.runpod.ai/v2/${endpointId}/purge-queue`, runtime, { method: "POST" });
          if (Number(purged?.removed ?? 0) !== 1) throw new Error(`CODE_STALLED_PROOF_PURGE_COUNT:${JSON.stringify(purged)}`);
          await call(`https://rest.runpod.io/v1/endpoints/${endpointId}`, management, { method: "PATCH", body: { workersMin: 0, workersMax: 0 } });
          await new Promise((resolve) => setTimeout(resolve, 1500));
          const [endpoint, after] = await Promise.all([
            call(`https://rest.runpod.io/v1/endpoints/${endpointId}?includeTemplate=true&includeWorkers=true`, management),
            call(healthUrl, runtime),
          ]);
          const afterQueue = Number(after?.jobs?.inQueue ?? after?.jobs?.in_queue ?? 0);
          const afterProgress = Number(after?.jobs?.inProgress ?? after?.jobs?.in_progress ?? 0);
          const afterWorkers = after?.workers || {};
          const afterActiveWorkers = ["idle","initializing","ready","running","throttled","unhealthy"].reduce((sum,key) => sum + Math.max(0, Number(afterWorkers[key] ?? 0)), 0);
          if (Number(endpoint.workersMin) !== 0 || Number(endpoint.workersMax) !== 0 || afterQueue !== 0 || afterProgress !== 0 || afterActiveWorkers !== 0) {
            throw new Error(`CODE_STALLED_PROOF_FINAL_NOT_PARKED:${JSON.stringify({workersMin:endpoint.workersMin,workersMax:endpoint.workersMax,after})}`);
          }
          console.log(JSON.stringify({
            success: true,
            contract: "AVANTIQO_CODE_STALLED_PROOF_CLEANUP_V1",
            purge_removed: Number(purged.removed),
            workers_min: 0,
            workers_max: 0,
            jobs_in_queue: 0,
            jobs_in_progress: 0,
            active_workers: 0,
            provider_inference_performed: false,
            wallet_mutation_performed: false,
            production_deploy_performed: false,
            secrets_printed: false
          }, null, 2));
          NODE
