name: Avantiqo Code V8 Structured Zero Cost Admission

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/avantiqo-code-repo-agent-v11-zero-cost-20260904.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove Repo Agent V11 zero cost
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/repo_agent_v11.py
          python -m py_compile services/avantiqo-code-engine/verify_repo_agent_v11.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v7.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_repo_agent_v11.py
          runtime=services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v7.py
          grep -q 'FAST_BOOT_ENFORCE_EAGER = False' "$runtime"
          grep -q '"method": "ngram"' "$runtime"
          grep -q 'StructuredOutputsParams' "$runtime"
          grep -q 'structured_outputs=structured' "$runtime"
          echo 'AVANTIQO_CODE_REPO_AGENT_V11_ZERO_COST=PASS'
