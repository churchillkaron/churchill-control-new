name: Avantiqo Code Worker Image

on:
  push:
    branches:
      - main
    paths:
      - services/avantiqo-code-engine/**
      - .github/workflows/avantiqo-code-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-code-worker-image
  cancel-in-progress: true

jobs:
  build-code-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Code worker source lock
        shell: bash
        run: |
          set -euo pipefail
          test -f services/avantiqo-code-engine/Dockerfile.runpod
          test -f services/avantiqo-code-engine/handler.py
          test -f services/avantiqo-code-engine/requirements.txt
          grep -F 'FROM vllm/vllm-openai:v0.27.1' services/avantiqo-code-engine/Dockerfile.runpod
          grep -F 'VLLM_WORKER_MULTIPROC_METHOD=spawn' services/avantiqo-code-engine/Dockerfile.runpod
          grep -F 'VLLM_USE_FLASHINFER_SAMPLER=0' services/avantiqo-code-engine/Dockerfile.runpod
          grep -F 'Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8' services/avantiqo-code-engine/Dockerfile.runpod
          grep -F 'os.environ["VLLM_USE_FLASHINFER_SAMPLER"] = "0"' services/avantiqo-code-engine/handler.py
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'AVANTIQO_CODE_WORKER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_CODE_WORKER_IMAGE_TRIGGER_SHA_BOUND=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-code-worker"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_CODE_WORKER_IMAGE_TAG=$tag"

      - name: Build and push immutable Code worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avantiqo-code-engine/Dockerfile.runpod
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-code-worker
          cache-to: type=gha,mode=max,scope=avantiqo-code-worker

      - name: Create immutable image evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "AVANTIQO_CODE_WORKER_IMAGE_DIGEST_INVALID"; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-code-worker-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_CODE_WORKER_IMAGE_RESULT_V1",
            source_sha: process.env.RELEASE_SHA,
            trigger_sha: process.env.TRIGGER_SHA,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            runtime: "vllm-0.27.1",
            runtime_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8",
            quantization: "fp8",
            vllm_worker_multiproc_method: "spawn",
            flashinfer_sampler_disabled: true,
            provider_job_submitted: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-code-worker-image/avantiqo-code-worker-image.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-worker-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-code-worker-image/avantiqo-code-worker-image.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm isolated worker image build
        shell: bash
        run: |
          echo 'AVANTIQO_CODE_WORKER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_CODE_WORKER_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_CODE_WORKER_IMAGE_PRODUCTION_WEB_DEPLOY=false'
