name: Avantiqo Code World-Class Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "lib/code/runtime/**"
      - "lib/platform/capabilities/createCodeAI*.js"
      - "lib/platform/capabilities/createOperatorWebResearchCapability.js"
      - "lib/platform/capabilities/createOperatorMissionCapability.js"
      - "lib/platform/capabilities/createProductRepositoryAssessmentCapability.js"
      - "lib/platform/runtime/AvantiqoDeveloperResourceReadRuntime.js"
      - "lib/platform/runtime/DeveloperAttachmentRuntime.js"
      - "lib/platform/runtime/AvantiqoLiveExecutionRuntime.js"
      - "app/api/operator/code/prewarm/route.js"
      - "app/api/operator/developer-attachments/route.js"
      - "app/api/operator/live-execution/route.js"
      - "app/api/internal/code/worker-session/process/route.js"
      - "components/operator/HomeAvantiqoIntelligenceDock.jsx"
      - "lib/platform/research/runtime/OperatorMechanismResearch*.js"
      - "lib/platform/research/runtime/OperatorWebResearchRuntime.js"
      - "lib/platform/research/runtime/OperatorWebEvidenceRuntime.js"
      - "tests/*.test.mjs"
      - "scripts/code-ai-*.mjs"
      - "scripts/business-partner-developer-resource-certification.mjs"
      - "scripts/operator-mechanism-research-*.mjs"
      - "scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs"
      - "config/avantiqo-runpod-safe-lease-policy.json"
      - "package.json"
      - ".github/workflows/avantiqo-code-worldclass-quality.yml"
  push:
    branches:
      - main
    paths:
      - "lib/code/runtime/**"
      - "lib/platform/capabilities/createCodeAI*.js"
      - "lib/platform/capabilities/createOperatorWebResearchCapability.js"
      - "lib/platform/capabilities/createOperatorMissionCapability.js"
      - "lib/platform/capabilities/createProductRepositoryAssessmentCapability.js"
      - "lib/platform/runtime/AvantiqoDeveloperResourceReadRuntime.js"
      - "lib/platform/runtime/DeveloperAttachmentRuntime.js"
      - "lib/platform/runtime/AvantiqoLiveExecutionRuntime.js"
      - "app/api/operator/code/prewarm/route.js"
      - "app/api/operator/developer-attachments/route.js"
      - "app/api/operator/live-execution/route.js"
      - "app/api/internal/code/worker-session/process/route.js"
      - "components/operator/HomeAvantiqoIntelligenceDock.jsx"
      - "lib/platform/research/runtime/OperatorMechanismResearch*.js"
      - "lib/platform/research/runtime/OperatorWebResearchRuntime.js"
      - "lib/platform/research/runtime/OperatorWebEvidenceRuntime.js"
      - "tests/*.test.mjs"
      - "scripts/code-ai-*.mjs"
      - "scripts/business-partner-developer-resource-certification.mjs"
      - "scripts/operator-mechanism-research-*.mjs"
      - "scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs"
      - "config/avantiqo-runpod-safe-lease-policy.json"
      - "package.json"
      - ".github/workflows/avantiqo-code-worldclass-quality.yml"

permissions:
  contents: read

concurrency:
  group: avantiqo-code-worldclass-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Repository regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVANTIQO_CODE_WORLDCLASS_CI: "YES"
      AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED: "NO"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies without lifecycle side effects
        run: npm ci --ignore-scripts

      - name: Run repository regression suite
        run: npm test

      - name: Assert regression job remains zero-GPU
        if: always()
        shell: bash
        run: |
          test "${AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED}" = "NO"
          echo "AVANTIQO_CODE_WORLDCLASS_REGRESSION_ZERO_GPU=PASS"

  code_quality:
    name: Code-specific world-class gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVANTIQO_CODE_WORLDCLASS_CI: "YES"
      AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED: "NO"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies without lifecycle side effects
        run: npm ci --ignore-scripts

      - name: Certify Business Partner developer resources
        run: node scripts/business-partner-developer-resource-certification.mjs

      - name: Run Code autonomy and world-class quality gates
        run: npm run audit:code-ai-autonomy

      - name: Assert Code-specific job remains zero-GPU
        if: always()
        shell: bash
        run: |
          test "${AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED}" = "NO"
          echo "AVANTIQO_CODE_WORLDCLASS_CODE_QUALITY_ZERO_GPU=PASS"
