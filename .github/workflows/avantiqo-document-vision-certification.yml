name: Avantiqo Document Vision Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-document-vision-certification
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check modal

      - name: Seed owned vision model cache
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m modal run services/avantiqo-image-engine/modal_app.py::seed_cache

      - name: Run ephemeral owned document vision benchmark
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          FIXTURE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tests/fixtures/avantiqo-document-vision-certification.png"
          python -m modal run services/avantiqo-image-engine/modal_app.py::certify_document_vision --source-url "$FIXTURE_URL" | tee /tmp/document-vision.log
          python - <<'PY'
          import json
          from pathlib import Path
          prefix = "AVANTIQO_DOCUMENT_VISION_CERTIFICATION_RESULT="
          lines = Path("/tmp/document-vision.log").read_text(encoding="utf-8").splitlines()
          matches = [line.split(prefix, 1)[1] for line in lines if prefix in line]
          if not matches:
              raise SystemExit("DOCUMENT_VISION_CERTIFICATION_RESULT_MISSING")
          report = json.loads(matches[-1])
          Path("document-vision-certification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          if report.get("summary", {}).get("passed") is not True:
              raise SystemExit("DOCUMENT_VISION_CERTIFICATION_FAILED")
          PY

      - name: Verify no activation occurred
        if: always()
        run: |
          if [ ! -f document-vision-certification.json ]; then exit 0; fi
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("document-vision-certification.json", "utf8"));
          if (report.activation_allowed !== false) throw new Error("ACTIVATION_GUARD_FAILED");
          if (report.pricing_activation_performed !== false) throw new Error("PRICING_GUARD_FAILED");
          console.log("Owned document vision no-activation guard passed.");
          NODE

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-document-vision-${{ github.run_id }}
          path: document-vision-certification.json
          if-no-files-found: warn
          retention-days: 14
