name: Avantiqo Fast AWQ32 Canary Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-fast-awq32-canary-repair.yml

permissions:
  contents: write

concurrency:
  group: avantiqo-fast-awq32-canary-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify live RunPod SaveTemplateInput contract
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = String(process.env.RUNPOD_MANAGEMENT_API_KEY || '').trim();
          if (!key) throw new Error('RUNPOD_MANAGEMENT_API_KEY_REQUIRED');
          const response = await fetch('https://api.runpod.io/graphql', {
            method: 'POST',
            headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ query: `query { __type(name: "SaveTemplateInput") { inputFields { name type { kind name ofType { kind name } } } } }` }),
            signal: AbortSignal.timeout(30000),
          });
          const body = await response.json();
          const errors = Array.isArray(body?.errors) ? body.errors : [];
          if (!response.ok || errors.length) throw new Error(`RUNPOD_GRAPHQL_SCHEMA:${errors.map(e => e?.message).join('|')}`);
          const fields = Array.isArray(body?.data?.__type?.inputFields) ? body.data.__type.inputFields : [];
          const names = new Set(fields.map((field) => String(field?.name || '')));
          for (const required of ['name','imageName','containerDiskInGb','volumeInGb','isServerless','env']) {
            if (!names.has(required)) throw new Error(`RUNPOD_SAVE_TEMPLATE_FIELD_MISSING:${required}`);
          }
          console.log(JSON.stringify({
            contract: 'AVANTIQO_FAST_AWQ32_SAVE_TEMPLATE_SCHEMA_V1',
            input_type: 'SaveTemplateInput',
            required_canary_fields_supported: true,
            field_names: [...names].sort(),
            mutation_performed: false,
            production_deploy_performed: false,
            secrets_printed: false,
          }, null, 2));
          NODE

      - name: Apply exact canary bootstrap repair
        run: |
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/avantiqo-fast-awq32-canary.yml')
          source = path.read_text()
          replacements = {
              'mutation Save($input: PodTemplateInput!)': 'mutation Save($input: SaveTemplateInput!)',
              "await rest(`/endpoints/${encodeURIComponent(canaryId)}`, { method:'PATCH', body:{ workersMin:0, workersMax:0 } });": "await rest(`/endpoints/${encodeURIComponent(canaryId)}/update`, { method:'POST', body:{ workersMin:0, workersMax:0 } });",
              "const patch = async (max) => rest(`/endpoints/${encodeURIComponent(endpointId)}`, { method:'PATCH', body:{ workersMin:0, workersMax:max } });": "const patch = async (max) => rest(`/endpoints/${encodeURIComponent(endpointId)}/update`, { method:'POST', body:{ workersMin:0, workersMax:max } });",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'EXPECTED_CANARY_SOURCE_NOT_FOUND:{old[:80]}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          grep -Fq 'mutation Save($input: SaveTemplateInput!)' .github/workflows/avantiqo-fast-awq32-canary.yml
          grep -Fq 'canaryId)}/update' .github/workflows/avantiqo-fast-awq32-canary.yml
          grep -Fq 'endpointId)}/update' .github/workflows/avantiqo-fast-awq32-canary.yml
          if grep -Fq "method:'PATCH'" .github/workflows/avantiqo-fast-awq32-canary.yml; then
            echo 'UNPROVEN_ENDPOINT_PATCH_REMAINS'
            exit 1
          fi

      - name: Commit only after green contract proof
        run: |
          git config user.name churchillkaron
          git config user.email patric@pcsphuket.com
          git add .github/workflows/avantiqo-fast-awq32-canary.yml
          git diff --cached --check
          git commit -m "Fix AWQ Fast canary bootstrap contract"
          git push origin main
