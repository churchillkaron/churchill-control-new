name: Avantiqo Fast AWQ32 Canary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-fast-awq32-canary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-fast-awq32-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANARY_TEMPLATE_NAME: avantiqo-intelligence-fast-awq32-canary-v1
      CANARY_ENDPOINT_NAME: avantiqo-intelligence-fast-awq32-canary-v1
      CANARY_MODEL: cyankiwi/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit
      CANONICAL_MODEL: Qwen/Qwen3-30B-A3B-Instruct-2507
      CANARY_GPU: NVIDIA RTX PRO 4500 Blackwell
      CANARY_DC: EU-RO-1
    steps:
      - name: Create or reuse zero-idle AWQ canary
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const key = String(process.env.RUNPOD_MANAGEMENT_API_KEY || '').trim();
          if (!key) throw new Error('RUNPOD_MANAGEMENT_API_KEY_REQUIRED');
          const text = (v) => String(v ?? '').trim();
          const list = (v) => Array.isArray(v) ? v : [];
          const rest = async (path, options = {}) => {
            const response = await fetch(`https://rest.runpod.io/v1${path}`, {
              method: options.method || 'GET',
              headers: { Authorization: `Bearer ${key}`, Accept: 'application/json', ...(options.body ? { 'Content-Type':'application/json' } : {}) },
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const raw = await response.text();
            let body = null; try { body = raw ? JSON.parse(raw) : null; } catch {}
            if (!response.ok || body === null) throw new Error(`RUNPOD_REST_${response.status}:${raw.slice(0,300)}`);
            return body;
          };
          const graph = async (query, variables = {}) => {
            const response = await fetch('https://api.runpod.io/graphql', {
              method: 'POST',
              headers: { Authorization: `Bearer ${key}`, 'Content-Type':'application/json', Accept:'application/json' },
              body: JSON.stringify({ query, variables }),
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.json();
            if (!response.ok || list(body?.errors).length) throw new Error(`RUNPOD_GRAPHQL:${list(body?.errors).map(e => e?.message).join('|')}`);
            return body?.data || {};
          };

          const endpointsRaw = await rest('/endpoints?includeTemplate=true&includeWorkers=true');
          const endpoints = Array.isArray(endpointsRaw) ? endpointsRaw : list(endpointsRaw?.endpoints || endpointsRaw?.data || endpointsRaw?.items || endpointsRaw?.results);
          const live = endpoints.find((e) => text(e?.name) === 'avantiqo-intelligence-fast-v1');
          if (!live) throw new Error('LIVE_FAST_ENDPOINT_REQUIRED');
          if (Number(live.workersMin) !== 0 || Number(live.workersMax) !== 0) throw new Error('LIVE_FAST_MUST_REST_0_0');

          let canary = endpoints.find((e) => text(e?.name) === process.env.CANARY_ENDPOINT_NAME);
          if (!canary) {
            const liveTemplateId = text(live.templateId || live.template?.id);
            if (!liveTemplateId) throw new Error('LIVE_FAST_TEMPLATE_ID_REQUIRED');
            const liveTemplate = await rest(`/templates/${encodeURIComponent(liveTemplateId)}`);
            const rawEnv = liveTemplate?.env || liveTemplate?.envs || liveTemplate?.environment || [];
            const envEntries = Array.isArray(rawEnv)
              ? rawEnv.map((entry) => ({ key:text(entry?.key || entry?.name), value:text(entry?.value) })).filter(e => e.key)
              : Object.entries(rawEnv).map(([k,v]) => ({ key:text(k), value:text(v) }));
            const excluded = new Set(['HF_TOKEN','HUGGING_FACE_HUB_TOKEN','QUANTIZATION','MODEL_NAME','MAX_MODEL_LEN','GPU_MEMORY_UTILIZATION','MAX_NUM_SEQS','OPENAI_SERVED_MODEL_NAME_OVERRIDE','MAX_CONCURRENCY']);
            const env = envEntries.filter((entry) => !excluded.has(entry.key) && !/SECRET|PASSWORD|TOKEN|API_KEY|AUTH/i.test(entry.key));
            env.push(
              { key:'MODEL_NAME', value:process.env.CANARY_MODEL },
              { key:'MAX_MODEL_LEN', value:'32768' },
              { key:'GPU_MEMORY_UTILIZATION', value:'0.90' },
              { key:'MAX_NUM_SEQS', value:'8' },
              { key:'OPENAI_SERVED_MODEL_NAME_OVERRIDE', value:process.env.CANONICAL_MODEL },
              { key:'MAX_CONCURRENCY', value:'4' },
              { key:'ENABLE_PREFIX_CACHING', value:'true' },
              { key:'ENABLE_CHUNKED_PREFILL', value:'true' }
            );

            const templateQuery = `mutation Save($input: PodTemplateInput!) { saveTemplate(input: $input) { id name imageName containerDiskInGb volumeInGb isServerless } }`;
            let template = null;
            try {
              const existingData = await graph(`query { myself { podTemplates { id name imageName containerDiskInGb volumeInGb isServerless } } }`);
              template = list(existingData?.myself?.podTemplates).find((t) => text(t?.name) === process.env.CANARY_TEMPLATE_NAME) || null;
            } catch {}
            if (!template) {
              const saved = await graph(templateQuery, { input: {
                name: process.env.CANARY_TEMPLATE_NAME,
                imageName: text(liveTemplate.imageName || liveTemplate.image),
                containerDiskInGb: Math.max(10, Number(liveTemplate.containerDiskInGb || 20)),
                volumeInGb: 0,
                isServerless: true,
                env,
              }});
              template = saved?.saveTemplate;
            }
            if (!text(template?.id)) throw new Error('CANARY_TEMPLATE_CREATE_FAILED');

            canary = await rest('/endpoints', { method:'POST', body: {
              templateId: text(template.id),
              name: process.env.CANARY_ENDPOINT_NAME,
              computeType:'GPU',
              gpuCount:1,
              gpuTypeIds:[process.env.CANARY_GPU],
              dataCenterIds:[process.env.CANARY_DC],
              executionTimeoutMs:180000,
              flashboot:true,
              idleTimeout:30,
              scalerType:'QUEUE_DELAY',
              scalerValue:1,
              workersMin:0,
              workersMax:0,
            }});
          }

          const canaryId = text(canary?.id);
          if (!canaryId) throw new Error('CANARY_ENDPOINT_ID_REQUIRED');
          if (Number(canary.workersMin) !== 0 || Number(canary.workersMax) !== 0) {
            await rest(`/endpoints/${encodeURIComponent(canaryId)}`, { method:'PATCH', body:{ workersMin:0, workersMax:0 } });
          }
          appendFileSync(process.env.GITHUB_ENV, `CANARY_ENDPOINT_ID=${canaryId}\n`, 'utf8');
          console.log(JSON.stringify({
            contract:'AVANTIQO_FAST_AWQ32_CANARY_BOOTSTRAP_V1',
            canary_endpoint_id:canaryId,
            canary_endpoint_name:process.env.CANARY_ENDPOINT_NAME,
            model:process.env.CANARY_MODEL,
            canonical_served_model:process.env.CANONICAL_MODEL,
            gpu:process.env.CANARY_GPU,
            data_center:process.env.CANARY_DC,
            workers_min:0,
            workers_max:0,
            live_endpoint_mutated:false,
            production_deploy_performed:false,
            secrets_printed:false,
          }, null, 2));
          NODE

      - name: Run bounded cold warmup and two interactive turns
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = String(process.env.RUNPOD_MANAGEMENT_API_KEY || process.env.RUNPOD_API_KEY || '').trim();
          const queueKey = String(process.env.RUNPOD_API_KEY || key).trim();
          const endpointId = String(process.env.CANARY_ENDPOINT_ID || '').trim();
          if (!key || !queueKey || !endpointId) throw new Error('CANARY_RUNTIME_CONTEXT_REQUIRED');
          const rest = async (path, options = {}) => {
            const response = await fetch(`https://rest.runpod.io/v1${path}`, {
              method: options.method || 'GET',
              headers: { Authorization:`Bearer ${key}`, Accept:'application/json', ...(options.body ? { 'Content-Type':'application/json' } : {}) },
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const raw = await response.text(); let body=null; try{body=raw?JSON.parse(raw):{};}catch{body={};}
            if(!response.ok) throw new Error(`REST_${response.status}:${raw.slice(0,300)}`);
            return body;
          };
          const queue = async (path, options = {}) => {
            const response = await fetch(`https://api.runpod.ai/v2/${encodeURIComponent(endpointId)}${path}`, {
              method: options.method || 'GET',
              headers: { Authorization:`Bearer ${queueKey}`, Accept:'application/json', ...(options.body ? { 'Content-Type':'application/json' } : {}) },
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(options.timeoutMs || 210000),
            });
            const raw = await response.text(); let body=null; try{body=raw?JSON.parse(raw):{};}catch{body={};}
            if(!response.ok) throw new Error(`QUEUE_${response.status}:${raw.slice(0,500)}`);
            return body;
          };
          const patch = async (max) => rest(`/endpoints/${encodeURIComponent(endpointId)}`, { method:'PATCH', body:{ workersMin:0, workersMax:max } });
          const health = async () => queue('/health', { timeoutMs:20000 });
          const jobs = (h) => ({ inQueue:Number(h?.jobs?.inQueue || h?.jobs?.in_queue || 0), inProgress:Number(h?.jobs?.inProgress || h?.jobs?.in_progress || 0) });
          const payload = (expected, maxTokens=8) => ({ input:{
            openai_route:'/v1/chat/completions',
            openai_input:{
              model:process.env.CANONICAL_MODEL,
              messages:[{role:'system',content:'Follow the exact response instruction.'},{role:'user',content:`Reply exactly ${expected} and nothing else.`}],
              max_tokens:maxTokens,
              temperature:0,
            }
          }});
          const run = async (label, expected, timeoutMs) => {
            const started=performance.now();
            const result=await queue('/runsync',{method:'POST',body:payload(expected),timeoutMs});
            const elapsed=Math.round(performance.now()-started);
            const all=JSON.stringify(result);
            if(!all.includes(expected)) throw new Error(`${label}_OUTPUT_INVALID:${all.slice(0,500)}`);
            return { label, latency_ms:elapsed, status:String(result?.status||''), delay_ms:Number(result?.delayTime||0), execution_ms:Number(result?.executionTime||0) };
          };
          let failure=null;
          try {
            await patch(1);
            const warmup=await run('WARMUP','WARM_OK',210000);
            const one=await run('TURN_1','FAST_ONE',20000);
            const two=await run('TURN_2','FAST_TWO',20000);
            if(one.latency_ms>5000) throw new Error(`TURN_1_LATENCY_GATE:${one.latency_ms}`);
            if(two.latency_ms>5000) throw new Error(`TURN_2_LATENCY_GATE:${two.latency_ms}`);
            console.log(JSON.stringify({
              contract:'AVANTIQO_FAST_AWQ32_LATENCY_PROOF_V1', success:true,
              warmup, measured_turns:[one,two], interactive_latency_gate_ms:5000,
              model:process.env.CANARY_MODEL, canonical_served_model:process.env.CANONICAL_MODEL,
              gpu:process.env.CANARY_GPU, data_center:process.env.CANARY_DC,
              external_ai_fallback_used:false, production_deploy_performed:false, secrets_printed:false,
            },null,2));
          } catch(error) { failure=error; }
          finally {
            await patch(0).catch(()=>null);
            const before=await health().catch(()=>null);
            const j=before?jobs(before):{inQueue:0,inProgress:0};
            if(j.inQueue>0 && j.inProgress===0) await queue('/purge-queue',{method:'POST',timeoutMs:30000}).catch(()=>null);
            const deadline=Date.now()+120000;
            while(Date.now()<deadline){
              const h=await health().catch(()=>null); const q=h?jobs(h):{inQueue:0,inProgress:0};
              const e=await rest(`/endpoints/${encodeURIComponent(endpointId)}?includeTemplate=false&includeWorkers=true`).catch(()=>null);
              const active=Array.isArray(e?.workers)?e.workers.filter(w=>!['EXITED','STOPPED','TERMINATED','DELETED'].includes(String(w?.status||w?.workerStatus||'').toUpperCase())).length:0;
              if(Number(e?.workersMax)===0 && q.inQueue===0 && q.inProgress===0 && active===0) break;
              await new Promise(r=>setTimeout(r,3000));
            }
          }
          if(failure) throw failure;
          console.log('AVANTIQO_FAST_AWQ32_LATENCY_PROOF_V1=PASS');
          NODE

      - name: Verify canary parked and live Fast untouched
        if: always()
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=String(process.env.RUNPOD_MANAGEMENT_API_KEY||'').trim();
          const r=await fetch('https://rest.runpod.io/v1/endpoints?includeTemplate=false&includeWorkers=true',{headers:{Authorization:`Bearer ${key}`,Accept:'application/json'},signal:AbortSignal.timeout(30000)});
          const body=await r.json(); const eps=Array.isArray(body)?body:body?.endpoints||body?.data||body?.items||body?.results||[];
          const live=eps.find(e=>String(e?.name||'')==='avantiqo-intelligence-fast-v1');
          const canary=eps.find(e=>String(e?.name||'')===process.env.CANARY_ENDPOINT_NAME);
          if(!live||Number(live.workersMin)!==0||Number(live.workersMax)!==0) throw new Error('LIVE_FAST_REST_STATE_CHANGED');
          if(!canary||Number(canary.workersMin)!==0||Number(canary.workersMax)!==0) throw new Error('CANARY_NOT_PARKED');
          console.log('LIVE_FAST_UNTOUCHED=true');
          console.log('CANARY_REST_0_0=true');
          console.log('PRODUCTION_DEPLOY_PERFORMED=false');
          NODE
