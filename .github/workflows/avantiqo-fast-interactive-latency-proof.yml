name: Avantiqo Fast Interactive Latency Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-fast-interactive-latency-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-fast-interactive-latency-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      AVANTIQO_INTELLIGENCE_ENGINE_ENABLED: YES
      AVANTIQO_INTELLIGENCE_FAST_TIMEOUT_MS: 10000
      AVANTIQO_INTELLIGENCE_FAST_UNSCHEDULED_TIMEOUT_MS: 8000
      AVANTIQO_INTELLIGENCE_FAST_SCHEDULING_POLL_MS: 1000
      AVANTIQO_INTELLIGENCE_REQUEST_LEASE_OPEN_SETTLE_MS: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static latency proof boundary
        run: |
          node --check scripts/run-avantiqo-fast-interactive-latency-proof-local.mjs
          node --check lib/platform/service-runtime/providers/ProviderExecutor.js
          node --check lib/platform/service-runtime/execution/OwnedIntelligenceRequestLeaseRuntime.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceFastProvider.js

      - name: Run real Fast governed latency proof
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY || secrets.RUNPOD_API_KEY }}
        run: node scripts/run-avantiqo-fast-interactive-latency-proof-local.mjs

      - name: Immutable boundary
        if: always()
        run: |
          echo "EXTERNAL_AI_FALLBACK_USED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
