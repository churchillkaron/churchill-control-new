name: Avantiqo Fast Intelligence Latency Topology Audit

# Read-only Deep/Fast CUDA placement comparison after Fast scheduler starvation.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-fast-latency-topology-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live Deep and Fast placement read-only
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY || secrets.RUNPOD_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const text=v=>String(v??'').trim(); const list=v=>Array.isArray(v)?v:[];
          const key=text(process.env.RUNPOD_MANAGEMENT_API_KEY||process.env.RUNPOD_API_KEY); const qkey=text(process.env.RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY||process.env.RUNPOD_API_KEY||key); if(!key||!qkey)throw new Error('RUNPOD_CREDENTIAL_REQUIRED');
          const rest=async path=>{const r=await fetch(`https://rest.runpod.io/v1${path}`,{headers:{Authorization:`Bearer ${key}`,Accept:'application/json'},signal:AbortSignal.timeout(30000)});const raw=await r.text();if(!r.ok)throw new Error(`REST_${r.status}:${raw.slice(0,300)}`);return raw?JSON.parse(raw):{};};
          const graph=async query=>{const r=await fetch('https://api.runpod.io/graphql',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query}),signal:AbortSignal.timeout(30000)});const body=await r.json();if(!r.ok||list(body?.errors).length)throw new Error(`GRAPHQL:${list(body?.errors).map(e=>e?.message).join('|')}`);return body?.data||{};};
          const raw=await rest('/endpoints?includeTemplate=true&includeWorkers=true'); const eps=Array.isArray(raw)?raw:list(raw?.endpoints||raw?.data||raw?.items||raw?.results);
          const deep=eps.filter(e=>text(e?.name)==='avantiqo-intelligence-v1'); const fast=eps.filter(e=>text(e?.name)==='avantiqo-intelligence-fast-v1'); if(deep.length!==1||fast.length!==1)throw new Error(`ENDPOINT_RESOLUTION:${deep.length}:${fast.length}`);
          const gql=await graph(`query { myself { endpoints { id name templateId gpuIds gpuCount workersMin workersMax minCudaVersion flashBootType idleTimeout scalerType scalerValue executionTimeoutMs } } }`);
          const rows=list(gql?.myself?.endpoints); const pick=e=>rows.find(r=>text(r?.id)===text(e.id));
          const health=async e=>{const r=await fetch(`https://api.runpod.ai/v2/${encodeURIComponent(text(e.id))}/health`,{headers:{Authorization:`Bearer ${qkey}`,Accept:'application/json'},signal:AbortSignal.timeout(20000)});const body=await r.json();return{status:r.status,jobs:body?.jobs||{},workers:body?.workers||{}};};
          const [dh,fh]=await Promise.all([health(deep[0]).catch(()=>null),health(fast[0]).catch(()=>null)]);
          console.log(JSON.stringify({contract:'AVANTIQO_DEEP_FAST_CUDA_PLACEMENT_COMPARE_V1',mutation_performed:false,deep:{rest:{id:text(deep[0].id),workers_min:Number(deep[0].workersMin),workers_max:Number(deep[0].workersMax),allowed_cuda_versions:list(deep[0].allowedCudaVersions),gpu_type_ids:list(deep[0].gpuTypeIds),data_center_ids:list(deep[0].dataCenterIds),network_volume_id:text(deep[0].networkVolumeId)},graphql:pick(deep[0]),health:dh},fast:{rest:{id:text(fast[0].id),workers_min:Number(fast[0].workersMin),workers_max:Number(fast[0].workersMax),allowed_cuda_versions:list(fast[0].allowedCudaVersions),gpu_type_ids:list(fast[0].gpuTypeIds),data_center_ids:list(fast[0].dataCenterIds),network_volume_id:text(fast[0].networkVolumeId)},graphql:pick(fast[0]),health:fh},production_deploy_performed:false},null,2));
          NODE
