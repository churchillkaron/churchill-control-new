name: Avantiqo Fast Warm Session Latency Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-fast-warm-session-latency-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-fast-warm-session-latency-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve exact Fast endpoint
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const key = String(process.env.RUNPOD_MANAGEMENT_API_KEY || '').trim();
          if (!key) throw new Error('RUNPOD_MANAGEMENT_API_KEY_MISSING');
          const response = await fetch('https://rest.runpod.io/v1/endpoints?includeTemplate=false&includeWorkers=false', {
            headers: { Authorization: `Bearer ${key}`, Accept: 'application/json' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`FAST_ENDPOINT_DISCOVERY_HTTP_${response.status}`);
          const body = await response.json();
          const endpoints = Array.isArray(body) ? body : body?.endpoints || body?.data || body?.items || body?.results || [];
          const matches = endpoints.filter((endpoint) => String(endpoint?.name || '') === 'avantiqo-intelligence-fast-v1');
          if (matches.length !== 1) throw new Error(`FAST_ENDPOINT_RESOLUTION_FAILED:${matches.length}`);
          const endpointId = String(matches[0]?.id || '').trim();
          if (!endpointId) throw new Error('FAST_ENDPOINT_ID_REQUIRED');
          appendFileSync(process.env.GITHUB_ENV, `RUNPOD_AVANTIQO_INTELLIGENCE_FAST_ENDPOINT_ID=${endpointId}\n`, 'utf8');
          console.log('FAST_ENDPOINT_RESOLUTION=PASS');
          NODE

      - name: Run cold warmup then two <=5s Fast turns under one Safe Lease
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY || secrets.RUNPOD_API_KEY }}
          AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED: "YES"
          AVANTIQO_FAST_WARM_SESSION_PROOF_SPEND_APPROVED: "YES"
          AVANTIQO_INTELLIGENCE_FAST_TIMEOUT_MS: "180000"
          AVANTIQO_INTELLIGENCE_FAST_UNSCHEDULED_TIMEOUT_MS: "120000"
          AVANTIQO_INTELLIGENCE_FAST_SCHEDULING_POLL_MS: "1000"
        run: |
          node scripts/run-avantiqo-runpod-safe-lease-v2-parallel-local.mjs \
            --lane=intelligence-fast \
            --ttl-ms=600000 \
            -- \
            node scripts/run-avantiqo-fast-warm-session-latency-proof-local.mjs

      - name: Immutable boundary
        if: always()
        run: |
          echo "EXTERNAL_AI_FALLBACK_USED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
