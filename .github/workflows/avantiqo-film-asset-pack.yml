name: Avantiqo Film Asset Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avantiqo-film-asset-pack.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/avantiqo-film-pack-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-film-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download approved film assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p avantiqo-film-assets/live
          BASE='https://avantiqo.ai/api/internal/avantiqo-film-transfer-20260818'
          for asset in field restaurant manager hotel kitchen bar hospital warehouse finance people compliance; do
            echo "Downloading ${asset}"
            curl --fail --location --retry 30 --retry-delay 10 --retry-all-errors "${BASE}?asset=${asset}" --output "avantiqo-film-assets/live/${asset}.mp4"
          done
          curl --fail --location --retry 30 --retry-delay 10 --retry-all-errors "${BASE}?asset=voice" --output avantiqo-film-assets/voice.mp3
          VOICE_JSON="$(curl --fail --location --retry 10 --retry-delay 5 --retry-all-errors 'https://avantiqo.ai/api/internal/avantiqo-investor-video-voice-v2?token=avq-cedar-v2-20260818')"
          VOICE_URL="$(printf '%s' "$VOICE_JSON" | jq -r '.audio_url')"
          test -n "$VOICE_URL"
          test "$VOICE_URL" != "null"
          curl --fail --location --retry 10 --retry-delay 5 --retry-all-errors "$VOICE_URL" --output avantiqo-film-assets/voice_v2.mp3
          curl --fail --location --retry 30 --retry-delay 10 --retry-all-errors "${BASE}?asset=score" --output avantiqo-film-assets/score.wav

      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          for file in avantiqo-film-assets/live/*.mp4 avantiqo-film-assets/voice.mp3 avantiqo-film-assets/voice_v2.mp3 avantiqo-film-assets/score.wav; do
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$file"
          done

      - name: Upload film asset pack
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-film-assets-20260818-v2-score-direct
          path: avantiqo-film-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
