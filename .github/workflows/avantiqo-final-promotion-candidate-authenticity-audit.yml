name: Avantiqo Final Promotion Candidate Authenticity Audit

on:
  push:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoFinalPromotionCandidateAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeCounterfactualBenchmarkRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js"
      - "scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs"
      - "scripts/patch-released-knowledge-authenticity.mjs"
      - ".github/workflows/avantiqo-final-promotion-candidate-authenticity-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoFinalPromotionCandidateAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeCounterfactualBenchmarkRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js"
      - "scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs"
      - ".github/workflows/avantiqo-final-promotion-candidate-authenticity-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avantiqo-final-promotion-candidate-authenticity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wire_released_knowledge:
    name: Wire released knowledge authenticity
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply exact released knowledge authenticity wiring
        run: node scripts/patch-released-knowledge-authenticity.mjs

      - name: Syntax gate wired source
        run: |
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
          node --check lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js

      - name: Commit wired source to main
        run: |
          if git diff --quiet; then
            echo "No wiring changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js
          git commit -m "feat(intelligence): enforce released knowledge authenticity"
          git push origin HEAD:main

  certify:
    name: Zero-cost final promotion authenticity certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AVANTIQO_MISSION_OUTCOME_AUTH_ACTIVE_KEY_ID: audit-v2
      AVANTIQO_MISSION_OUTCOME_AUTH_KEYRING_JSON: '{"audit-v1":"1111111111111111111111111111111111111111111111111111111111111111","audit-v2":"2222222222222222222222222222222222222222222222222222222222222222"}'
      SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax gate
        run: |
          node --check lib/intelligence/runtime/AvantiqoFinalPromotionCandidateAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoKnowledgeCounterfactualBenchmarkRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
          node --check lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js
          node --check scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs

      - name: Run final promotion authenticity adversarial audit
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs
