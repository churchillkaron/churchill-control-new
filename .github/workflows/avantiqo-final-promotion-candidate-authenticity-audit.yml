name: Avantiqo Final Promotion Candidate Authenticity Audit

on:
  push:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoFinalPromotionCandidateAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeCounterfactualBenchmarkRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAuthorizationAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAuthorizationIssuerRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAtomicCommitRuntime.js"
      - "app/api/intelligence/knowledge/final-release/authorize/route.js"
      - "supabase/migrations/20260905065000_atomic_final_knowledge_release.sql"
      - "scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs"
      - "scripts/audit-avantiqo-released-knowledge-authenticity-local.mjs"
      - "scripts/audit-avantiqo-final-knowledge-release-authorization-local.mjs"
      - "scripts/audit-avantiqo-final-knowledge-release-authority-atomicity-local.mjs"
      - ".github/workflows/avantiqo-final-promotion-candidate-authenticity-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoFinalPromotionCandidateAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeCounterfactualBenchmarkRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAuthorizationAuthenticityRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAuthorizationIssuerRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAtomicCommitRuntime.js"
      - "app/api/intelligence/knowledge/final-release/authorize/route.js"
      - "supabase/migrations/20260905065000_atomic_final_knowledge_release.sql"
      - "scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs"
      - "scripts/audit-avantiqo-released-knowledge-authenticity-local.mjs"
      - "scripts/audit-avantiqo-final-knowledge-release-authorization-local.mjs"
      - "scripts/audit-avantiqo-final-knowledge-release-authority-atomicity-local.mjs"
      - ".github/workflows/avantiqo-final-promotion-candidate-authenticity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-final-promotion-candidate-authenticity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Zero-cost final knowledge trust-chain certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AVANTIQO_MISSION_OUTCOME_AUTH_ACTIVE_KEY_ID: audit-v2
      AVANTIQO_MISSION_OUTCOME_AUTH_KEYRING_JSON: '{"audit-v1":"1111111111111111111111111111111111111111111111111111111111111111","audit-v2":"2222222222222222222222222222222222222222222222222222222222222222"}'
      SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax gate
        run: |
          node --check lib/intelligence/runtime/AvantiqoFinalPromotionCandidateAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoKnowledgeCounterfactualBenchmarkRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
          node --check lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAuthorizationAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAuthorizationIssuerRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseAtomicCommitRuntime.js
          node --check app/api/intelligence/knowledge/final-release/authorize/route.js
          node --check scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs
          node --check scripts/audit-avantiqo-released-knowledge-authenticity-local.mjs
          node --check scripts/audit-avantiqo-final-knowledge-release-authorization-local.mjs
          node --check scripts/audit-avantiqo-final-knowledge-release-authority-atomicity-local.mjs

      - name: Run final promotion authenticity adversarial audit
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-avantiqo-final-promotion-candidate-authenticity-local.mjs

      - name: Run released knowledge authenticity adversarial audit
        run: node scripts/audit-avantiqo-released-knowledge-authenticity-local.mjs

      - name: Run signed final release authorization adversarial audit
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-avantiqo-final-knowledge-release-authorization-local.mjs

      - name: Run authenticated authority and atomicity audit
        run: node scripts/audit-avantiqo-final-knowledge-release-authority-atomicity-local.mjs
