name: Avantiqo Fix Stale Release Approval Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fix-final-knowledge-release-stale-approval-export.py"
      - ".github/workflows/avantiqo-fix-stale-release-approval-export.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact source fix
        run: python scripts/fix-final-knowledge-release-stale-approval-export.py
      - name: Verify stale symbol is absent from runtime
        run: |
          ! grep -n "RELEASE_APPROVAL_ENV" lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
      - name: Commit generated source fix
        run: |
          if git diff --quiet -- lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
          git commit -m "fix(intelligence): remove stale release approval export"
          git push origin HEAD:main
