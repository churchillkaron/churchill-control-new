name: Avantiqo Image Worker Image

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-image-worker-image-request.json

permissions:
  contents: write
  packages: write

concurrency:
  group: avantiqo-image-worker-image
  cancel-in-progress: true

jobs:
  build-image-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Image worker source lock
        shell: bash
        run: |
          set -euo pipefail
          test -f services/avantiqo-image-engine/Dockerfile
          test -f services/avantiqo-image-engine/handler.py
          test -f services/avantiqo-image-engine/handler_v2.py
          test -f services/avantiqo-image-engine/handler_v3.py
          grep -F 'CMD ["python", "-u", "handler_v3.py"]' services/avantiqo-image-engine/Dockerfile
          grep -F 'RUNTIME_PROBE_OPERATION = "runtime_probe"' services/avantiqo-image-engine/handler_v3.py
          grep -F 'RUNTIME_PROBE_CONTRACT = "AVANTIQO_IMAGE_RUNTIME_PROBE_V1"' services/avantiqo-image-engine/handler_v3.py
          grep -F 'RUNTIME_ENTRYPOINT_REVISION = "AVANTIQO_IMAGE_HANDLER_V3_QUALITY_COMPILER_V2"' services/avantiqo-image-engine/handler_v3.py
          grep -F 'QUALITY_RUNTIME_REVISION = "AVANTIQO_IMAGE_QWEN_2512_QUALITY_V2"' services/avantiqo-image-engine/handler_v3.py
          grep -F 'QUALITY_POLICY = "QWEN_IMAGE_2512_REALISM_IDENTITY_PHYSICS_V2"' services/avantiqo-image-engine/handler_v3.py
          grep -F 'QUALITY_COMPILER_CONTRACT = "AVANTIQO_IMAGE_QUALITY_COMPILER_V2"' services/avantiqo-image-engine/handler_v3.py
          grep -F '"identity_separation"' services/avantiqo-image-engine/handler_v3.py
          grep -F '"requested_hand_visibility"' services/avantiqo-image-engine/handler_v3.py
          grep -F '"physical_food_realism"' services/avantiqo-image-engine/handler_v3.py
          grep -F '"photographic_naturalism"' services/avantiqo-image-engine/handler_v3.py
          grep -F '"generation_requested": False' services/avantiqo-image-engine/handler_v3.py
          grep -F '"inference_performed": False' services/avantiqo-image-engine/handler_v3.py
          python -m py_compile \
            services/avantiqo-image-engine/handler.py \
            services/avantiqo-image-engine/handler_v2.py \
            services/avantiqo-image-engine/handler_v3.py
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_TRIGGER_SHA_BOUND=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_RUNTIME_PROBE_REQUIRED=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_QUALITY_COMPILER_V2_LOCKED=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-image-worker"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_IMAGE_WORKER_IMAGE_TAG=$tag"

      - name: Build and push immutable Image worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-image-engine
          file: services/avantiqo-image-engine/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-image-worker
          cache-to: type=gha,mode=max,scope=avantiqo-image-worker

      - name: Record sanitized image evidence on newest main
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "AVANTIQO_IMAGE_WORKER_IMAGE_DIGEST_INVALID"; exit 1 ;;
          esac

          git fetch origin main
          git checkout -B image-worker-image-evidence origin/main
          mkdir -p audits/results
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_IMAGE_WORKER_IMAGE_RESULT_V1",
            source_sha: process.env.RELEASE_SHA || null,
            trigger_sha: process.env.TRIGGER_SHA || null,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID || null,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG || null,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            entrypoint: "handler_v3.py",
            entrypoint_revision: "AVANTIQO_IMAGE_HANDLER_V3_QUALITY_COMPILER_V2",
            runtime_probe_contract: "AVANTIQO_IMAGE_RUNTIME_PROBE_V1",
            runtime_revision: "AVANTIQO_IMAGE_QWEN_2512_QUALITY_V2",
            quality_policy: "QWEN_IMAGE_2512_REALISM_IDENTITY_PHYSICS_V2",
            quality_compiler_contract: "AVANTIQO_IMAGE_QUALITY_COMPILER_V2",
            quality_compiler_rules: [
              "identity_separation",
              "requested_hand_visibility",
              "physical_food_realism",
              "photographic_naturalism",
            ],
            provider_job_submitted: false,
            image_generation_submitted: false,
            production_web_deploy: false,
            pricing_activation_performed: false,
            secrets_in_output: false,
          };
          if (!report.source_sha_matches_trigger) {
            throw new Error("AVANTIQO_IMAGE_WORKER_IMAGE_SOURCE_TRIGGER_MISMATCH");
          }
          writeFileSync(
            "audits/results/avantiqo-image-worker-image.json",
            `${JSON.stringify(report)}\n`,
            "utf8",
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-image-worker-image.json
          git commit -m "Record Image worker image result"
          git push origin HEAD:main

      - name: Confirm no provider execution or production application deployment
        shell: bash
        run: |
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_SOURCE_TRIGGER_MATCH=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_QUALITY_COMPILER_V2=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PRODUCTION_WEB_DEPLOY=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PRICING_ACTIVATION=false'
