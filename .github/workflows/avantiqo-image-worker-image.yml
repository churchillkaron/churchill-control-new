name: Avantiqo Image Worker Image

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-image-worker-image-request.json

permissions:
  contents: write
  packages: write

concurrency:
  group: avantiqo-image-worker-image
  cancel-in-progress: true

jobs:
  build-image-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Image worker source lock
        shell: bash
        run: |
          set -euo pipefail
          test -f services/avantiqo-image-engine/Dockerfile
          test -f services/avantiqo-image-engine/handler.py
          test -f services/avantiqo-image-engine/handler_v2.py
          test -f services/avantiqo-image-engine/handler_v3.py
          test -f services/avantiqo-image-engine/handler_v4.py
          test -f services/avantiqo-image-engine/handler_v5.py
          grep -F 'COPY handler_v5.py ./handler_v5.py' services/avantiqo-image-engine/Dockerfile
          grep -F 'AVANTIQO_IMAGE_NETWORK_VOLUME_QUOTA_GB=80' services/avantiqo-image-engine/Dockerfile
          grep -F 'CMD ["python", "-u", "handler_v5.py"]' services/avantiqo-image-engine/Dockerfile
          grep -F 'RUNTIME_ENTRYPOINT_REVISION = "AVANTIQO_IMAGE_HANDLER_V5_VOLUME_QUOTA_GUARD_V1"' services/avantiqo-image-engine/handler_v5.py
          grep -F 'RUNTIME_REVISION = "AVANTIQO_IMAGE_MULTI_FOUNDATION_VOLUME_QUOTA_GUARD_V1"' services/avantiqo-image-engine/handler_v5.py
          grep -F 'NETWORK_VOLUME_ROOT = Path(' services/avantiqo-image-engine/handler_v5.py
          grep -F 'NETWORK_VOLUME_QUOTA_GB = float(' services/avantiqo-image-engine/handler_v5.py
          grep -F '"backing_filesystem_capacity_used_for_decision": False' services/avantiqo-image-engine/handler_v5.py
          grep -F 'PHOTOREAL_FOUNDATION_MODEL = "Tongyi-MAI/Z-Image"' services/avantiqo-image-engine/handler_v4.py
          grep -F '"automatic_production_routing_enabled": False' services/avantiqo-image-engine/handler_v4.py
          grep -F 'RUNTIME_PROBE_OPERATION = "runtime_probe"' services/avantiqo-image-engine/handler_v3.py
          grep -F 'RUNTIME_PROBE_CONTRACT = "AVANTIQO_IMAGE_RUNTIME_PROBE_V1"' services/avantiqo-image-engine/handler_v3.py
          python -m py_compile \
            services/avantiqo-image-engine/handler.py \
            services/avantiqo-image-engine/handler_v2.py \
            services/avantiqo-image-engine/handler_v3.py \
            services/avantiqo-image-engine/handler_v4.py \
            services/avantiqo-image-engine/handler_v5.py
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_TRIGGER_SHA_BOUND=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_RUNTIME_PROBE_REQUIRED=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_V5_VOLUME_QUOTA_GUARD_LOCKED=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_AUTOMATIC_PRODUCTION_ROUTING=false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-image-worker"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_IMAGE_WORKER_IMAGE_TAG=$tag"

      - name: Build and push immutable Image worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-image-engine
          file: services/avantiqo-image-engine/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-image-worker
          cache-to: type=gha,mode=max,scope=avantiqo-image-worker

      - name: Record sanitized image evidence on newest main
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "AVANTIQO_IMAGE_WORKER_IMAGE_DIGEST_INVALID"; exit 1 ;;
          esac

          git fetch origin main
          git checkout -B image-worker-image-evidence origin/main
          mkdir -p audits/results
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_IMAGE_WORKER_IMAGE_RESULT_V3",
            source_sha: process.env.RELEASE_SHA || null,
            trigger_sha: process.env.TRIGGER_SHA || null,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID || null,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG || null,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            entrypoint: "handler_v5.py",
            entrypoint_revision: "AVANTIQO_IMAGE_HANDLER_V5_VOLUME_QUOTA_GUARD_V1",
            runtime_probe_contract: "AVANTIQO_IMAGE_RUNTIME_PROBE_V1",
            runtime_revision: "AVANTIQO_IMAGE_MULTI_FOUNDATION_VOLUME_QUOTA_GUARD_V1",
            qwen_runtime_revision: "AVANTIQO_IMAGE_QWEN_2512_QUALITY_V2",
            photoreal_candidate_foundation: "Tongyi-MAI/Z-Image",
            photoreal_candidate_profile: "AVANTIQO_IMAGE_COMMERCIAL_PHOTOREAL_CANDIDATE_V1",
            photoreal_candidate_policy: "Z_IMAGE_RESTRAINED_PHOTOGRAPHIC_V1",
            photoreal_cache_contract: "AVANTIQO_IMAGE_PHOTOREAL_CACHE_COMPLETION_V1",
            capacity_probe_operation: "inspect_foundation_capacity",
            volume_quota_guard_contract: "AVANTIQO_IMAGE_NETWORK_VOLUME_QUOTA_GUARD_V1",
            network_volume_quota_gb: 80,
            backing_filesystem_capacity_used_for_decision: false,
            automatic_production_routing_enabled: false,
            qwen_replaced: false,
            provider_job_submitted: false,
            image_generation_submitted: false,
            model_download_submitted: false,
            production_web_deploy: false,
            pricing_activation_performed: false,
            secrets_in_output: false,
          };
          if (!report.source_sha_matches_trigger) {
            throw new Error("AVANTIQO_IMAGE_WORKER_IMAGE_SOURCE_TRIGGER_MISMATCH");
          }
          writeFileSync(
            "audits/results/avantiqo-image-worker-image.json",
            `${JSON.stringify(report)}\n`,
            "utf8",
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-image-worker-image.json
          git commit -m "Record Image worker image result"
          git push origin HEAD:main

      - name: Confirm no provider execution or production application deployment
        shell: bash
        run: |
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_SOURCE_TRIGGER_MATCH=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_V5_VOLUME_QUOTA_GUARD=true'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_AUTOMATIC_PRODUCTION_ROUTING=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_MODEL_DOWNLOAD_SUBMITTED=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PRODUCTION_WEB_DEPLOY=false'
          echo 'AVANTIQO_IMAGE_WORKER_IMAGE_PRICING_ACTIVATION=false'
