name: Avantiqo Intelligence Behavioral Trace Audit

on:
  push:
    branches: [main]
    paths:
      - "lib/intelligence/runtime/AvantiqoBehavioralTraceBenchmarkRuntime.mjs"
      - "lib/intelligence/runtime/AvantiqoModelPromotionRuntime.js"
      - "scripts/audit-avantiqo-behavioral-trace-benchmark-local.mjs"
      - ".github/workflows/avantiqo-intelligence-behavioral-trace-audit.yml"
  pull_request:
    paths:
      - "lib/intelligence/runtime/AvantiqoBehavioralTraceBenchmarkRuntime.mjs"
      - "lib/intelligence/runtime/AvantiqoModelPromotionRuntime.js"
      - "scripts/audit-avantiqo-behavioral-trace-benchmark-local.mjs"
      - ".github/workflows/avantiqo-intelligence-behavioral-trace-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavioral-trace-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run zero-cost behavioral trace certification audit
        run: node scripts/audit-avantiqo-behavioral-trace-benchmark-local.mjs
