name: Avantiqo Intelligence Benchmark Image
run-name: Avantiqo Intelligence benchmark image ${{ inputs.request_nonce }}

on:
  workflow_dispatch:
    inputs:
      request_nonce:
        description: Exact local build request identifier
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-intelligence-benchmark-image-${{ inputs.request_nonce }}
  cancel-in-progress: false

jobs:
  build-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify benchmark source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f services/avantiqo-intelligence-benchmark/Dockerfile.runpod
          test -f services/avantiqo-intelligence-benchmark/handler.py
          test -f services/avantiqo-intelligence-benchmark/requirements.txt
          grep -F 'CONTRACT = "AVANTIQO_INTELLIGENCE_BENCHMARK_WORKER_V1"' services/avantiqo-intelligence-benchmark/handler.py
          grep -F 'FOUNDATION_MODEL = "Qwen/Qwen3-30B-A3B-Thinking-2507"' services/avantiqo-intelligence-benchmark/handler.py
          grep -F 'BENCHMARK_MINIMUM_50_CASES_REQUIRED' services/avantiqo-intelligence-benchmark/handler.py
          grep -F 'mode not in {"baseline", "candidate"}' services/avantiqo-intelligence-benchmark/handler.py
          grep -F 'PeftModel.from_pretrained' services/avantiqo-intelligence-benchmark/handler.py
          grep -F 'do_sample=False' services/avantiqo-intelligence-benchmark/handler.py
          grep -F 'AVANTIQO_INTELLIGENCE_BENCHMARK_ENABLED=false' services/avantiqo-intelligence-benchmark/Dockerfile.runpod
          grep -F 'python -m py_compile handler.py' services/avantiqo-intelligence-benchmark/Dockerfile.runpod
          grep -F 'transformers==5.15.0' services/avantiqo-intelligence-benchmark/requirements.txt
          grep -F 'peft==0.20.0' services/avantiqo-intelligence-benchmark/requirements.txt
          node scripts/avantiqo-intelligence-model-benchmark-audit.mjs
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_IMAGE_TRIGGER_SHA_BOUND=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable benchmark coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-intelligence-benchmark"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_INTELLIGENCE_BENCHMARK_IMAGE_TAG=$tag"

      - name: Build and push immutable benchmark image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avantiqo-intelligence-benchmark/Dockerfile.runpod
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.avantiqo.contract=AVANTIQO_INTELLIGENCE_BENCHMARK_WORKER_V1
            io.avantiqo.foundation-model=Qwen/Qwen3-30B-A3B-Thinking-2507
            io.avantiqo.matched-baseline-candidate=true
            io.avantiqo.production-promotion=false
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-intelligence-benchmark
          cache-to: type=gha,mode=max,scope=avantiqo-intelligence-benchmark

      - name: Create immutable benchmark evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          REQUEST_NONCE: ${{ inputs.request_nonce }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_IMAGE_DIGEST_INVALID'; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-intelligence-benchmark-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_INTELLIGENCE_BENCHMARK_IMAGE_RESULT_V1",
            request_nonce: process.env.REQUEST_NONCE,
            source_sha: process.env.RELEASE_SHA,
            trigger_sha: process.env.TRIGGER_SHA,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            foundation_model: "Qwen/Qwen3-30B-A3B-Thinking-2507",
            worker_contract: "AVANTIQO_INTELLIGENCE_BENCHMARK_WORKER_V1",
            matched_baseline_candidate_prompts: true,
            minimum_case_count: 50,
            canonical_case_count: 60,
            benchmark_enabled_by_default: false,
            provider_job_submitted: false,
            runpod_endpoint_mutated: false,
            production_model_promoted: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-intelligence-benchmark-image/evidence.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload benchmark image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-benchmark-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-intelligence-benchmark-image/evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm isolated benchmark image build
        shell: bash
        run: |
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_RUNPOD_ENDPOINT_MUTATED=false'
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_PRODUCTION_PROMOTION=false'
          echo 'AVANTIQO_INTELLIGENCE_BENCHMARK_PRODUCTION_DEPLOY=false'
