name: Avantiqo Intelligence Deep Pure Service Proof

# E2E run marker: 2026-08-31 live reliability repair verification with bounded RunPod propagation guard.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avantiqo-intelligence-deep-pure-service-proof.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avantiqo-intelligence-deep-pure-service-proof
  cancel-in-progress: false

jobs:
  prove-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded Safe Lease propagation guard in proof checkout
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SAFE_LEASE_BLOB="$(git hash-object scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs)"
          echo "ORIGINAL_SAFE_LEASE_BLOB=$ORIGINAL_SAFE_LEASE_BLOB" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs')
          s = p.read_text()
          old = '''  await patch(targetId, 1, managementKey);
  endpointOpened = true;
  await enforce(
    await snapshot(managementKey, queueKey, targetId, targetQueueKey),
    policy,
    targetId,
    managementKey,
    args.lane,
'''
          new = '''  await patch(targetId, 1, managementKey);
  endpointOpened = true;

  // The direct endpoint PATCH can observe 0/1 before RunPod's global endpoint
  // listing catches up. Wait for independent global visibility before enforcing
  // the account-wide snapshot or submitting any child work.
  let openedSnapshot = null;
  const openedStateDeadline = Date.now() + 30_000;
  while (Date.now() < openedStateDeadline) {
    openedSnapshot = await snapshot(managementKey, queueKey, targetId, targetQueueKey);
    const openedTarget = openedSnapshot.rows.find((row) => row.id === targetId);
    if (openedTarget?.workers_min === 0 && openedTarget?.workers_max === 1) break;
    await sleep(1000);
  }
  const openedTarget = openedSnapshot?.rows?.find((row) => row.id === targetId);
  if (!openedTarget || openedTarget.workers_min !== 0 || openedTarget.workers_max !== 1) {
    throw new Error(`${CONTRACT}_TARGET_LEASE_STATE_PROPAGATION_TIMEOUT`);
  }

  await enforce(
    openedSnapshot,
    policy,
    targetId,
    managementKey,
    args.lane,
'''
          if old not in s:
              raise SystemExit('SAFE_LEASE_PROPAGATION_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          grep -q 'TARGET_LEASE_STATE_PROPAGATION_TIMEOUT' scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          git diff --check

      - name: Resolve exact Deep endpoint
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const key = String(process.env.RUNPOD_MANAGEMENT_API_KEY || '').trim();
          if (!key) throw new Error('RUNPOD_MANAGEMENT_API_KEY_MISSING');
          const response = await fetch('https://rest.runpod.io/v1/endpoints?includeTemplate=false&includeWorkers=false', {
            headers: { Authorization: `Bearer ${key}`, Accept: 'application/json' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`DEEP_ENDPOINT_DISCOVERY_HTTP_${response.status}`);
          const body = await response.json();
          const endpoints = Array.isArray(body) ? body : body?.endpoints || body?.data || body?.items || body?.results || [];
          const matches = endpoints.filter((endpoint) => String(endpoint?.name || '') === 'avantiqo-intelligence-v1');
          if (matches.length !== 1) throw new Error(`DEEP_ENDPOINT_RESOLUTION_FAILED:${matches.length}`);
          const endpointId = String(matches[0]?.id || '').trim();
          if (!endpointId) throw new Error('DEEP_ENDPOINT_ID_REQUIRED');
          appendFileSync(process.env.GITHUB_ENV, `RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID=${endpointId}\n`, 'utf8');
          console.log('DEEP_ENDPOINT_RESOLUTION=PASS');
          NODE

      - name: Run exactly three pure Deep service-accounted calls
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_INTELLIGENCE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_API_KEY || secrets.RUNPOD_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED: "YES"
          AVANTIQO_INTELLIGENCE_DEEP_PURE_PROOF_SPEND_APPROVED: "YES"
          AVANTIQO_INTELLIGENCE_DEEP_PURE_PROOF_EXPECTED_MAIN_COMMIT: ${{ github.sha }}
        run: |
          node scripts/run-avantiqo-runpod-safe-lease-v2-parallel-local.mjs \
            --lane=intelligence-deep \
            --ttl-ms=1800000 \
            -- \
            node scripts/run-avantiqo-intelligence-deep-pure-service-proof-local.mjs

      - name: Persist proven Safe Lease repair to newest main
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs /tmp/avantiqo-safe-lease-proven.mjs
          git fetch origin main
          CURRENT_BLOB="$(git show origin/main:scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs | git hash-object --stdin)"
          if [ "$CURRENT_BLOB" != "$ORIGINAL_SAFE_LEASE_BLOB" ]; then
            echo "SAFE_LEASE_SOURCE_MOVED_DURING_PROOF=true"
            exit 1
          fi
          git checkout -B main origin/main
          cp /tmp/avantiqo-safe-lease-proven.mjs scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          node --check scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          git diff --check
          git config user.name "churchillkaron"
          git config user.email "patric@pcsphuket.com"
          git add scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          git commit -m "Harden Safe Lease against RunPod propagation lag"
          git push origin HEAD:main

      - name: Record immutable proof boundary
        if: always()
        run: |
          echo "EXTERNAL_FALLBACK_ALLOWED=false"
          echo "PRODUCTION_ACTIVATION_PERFORMED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
