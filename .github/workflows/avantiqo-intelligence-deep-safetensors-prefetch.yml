name: Avantiqo Intelligence Deep Safetensors Prefetch

on:
  push:
    branches: [main]
    paths:
      - scripts/enable-avantiqo-intelligence-deep-safetensors-prefetch-local.mjs
      - .github/workflows/avantiqo-intelligence-deep-safetensors-prefetch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply Deep safetensors prefetch
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_AVANTIQO_INTELLIGENCE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_API_KEY }}
          AVANTIQO_INTELLIGENCE_DEEP_SAFETENSORS_PREFETCH_APPROVED: YES
        run: node scripts/enable-avantiqo-intelligence-deep-safetensors-prefetch-local.mjs --apply
      - name: Safety boundary
        if: always()
        run: |
          echo "INFERENCE_PERFORMED=false"
          echo "GPU_WORKER_STARTED_BY_TEMPLATE_REBIND=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
