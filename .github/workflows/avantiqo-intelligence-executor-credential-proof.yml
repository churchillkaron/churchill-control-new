name: Avantiqo Intelligence - Local-Only Executor Authority Proof

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  prove-local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove Intelligence requires no provider credential
        run: |
          set -euo pipefail
          grep -Fq 'if (provider === "avantiqo-intelligence") return null' lib/platform/service-runtime/providers/ProviderExecutorCore.js
          grep -Fq 'runtime_credentials_required_at_execution: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderRegistration.js
          grep -Fq 'external_provider_fallback_allowed: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderRegistration.js
          node --test tests/avantiqo-intelligence-governed-credential-transport.test.mjs
      - name: Assert zero external execution boundary
        run: |
          echo 'PROVIDER_CREDENTIAL_REQUIRED=false'
          echo 'EXTERNAL_PROVIDER_EXECUTE_CALLED=false'
          echo 'EXTERNAL_GPU_INFERENCE_PERFORMED=false'
          echo 'PRODUCTION_DEPLOY_PERFORMED=false'
          echo 'SECRET_MATERIAL_PRINTED=false'
