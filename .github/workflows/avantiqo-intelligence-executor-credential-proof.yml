name: Avantiqo Intelligence - Executor Vault Authority Proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avantiqo-intelligence-executor-credential-proof.yml

permissions:
  contents: read

jobs:
  prove:
    if: ${{ github.event.head_commit.message == 'Prove Intelligence executor Vault authority' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODAL_TOKEN_ID: ""
      MODAL_TOKEN_SECRET: ""
      AVANTIQO_MODAL_TOKEN_ID: ""
      AVANTIQO_MODAL_TOKEN_SECRET: ""
      AVANTIQO_INTELLIGENCE_MODAL_BASE_URL: ""
      AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN: ""

    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${MODAL_TOKEN_ID:-}"
          test -z "${MODAL_TOKEN_SECRET:-}"
          test -z "${AVANTIQO_MODAL_TOKEN_ID:-}"
          test -z "${AVANTIQO_MODAL_TOKEN_SECRET:-}"

      - name: Prove ProviderExecutor credential preparation from Vault only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap-avantiqo-intelligence-vault-credential.mjs

      - name: Assert zero-execution boundary
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'MODAL_PROCESS_ENV_CREDENTIAL_PRESENT=false'
          echo 'PROVIDER_EXECUTE_CALLED=false'
          echo 'GPU_INFERENCE_PERFORMED=false'
          echo 'EXTERNAL_AI_USED=false'
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'SECRET_MATERIAL_PRINTED=false'
