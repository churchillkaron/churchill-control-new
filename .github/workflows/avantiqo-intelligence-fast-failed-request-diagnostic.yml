name: Avantiqo Intelligence Fast Failed Request Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-intelligence-fast-failed-request-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Inspect Fast worker and retained logs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: node scripts/diagnose-avantiqo-intelligence-fast-live-request-local.mjs

      - name: Immutable diagnostic boundary
        if: always()
        run: |
          echo "GENERATION_SUBMITTED=false"
          echo "ENDPOINT_MUTATION_PERFORMED=false"
          echo "QUEUE_MUTATION_PERFORMED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
