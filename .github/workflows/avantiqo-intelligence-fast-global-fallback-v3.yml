name: Avantiqo Intelligence Fast Global Fallback V3

on:
  push:
    branches: [main]
    paths:
      - scripts/repair-avantiqo-intelligence-fast-global-fallback-v3-ci.mjs
      - .github/workflows/avantiqo-intelligence-fast-global-fallback-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-fast-runtime-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Static gate
        run: node --check scripts/repair-avantiqo-intelligence-fast-global-fallback-v3-ci.mjs
      - name: Apply global compatible GPU fallback
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          AVANTIQO_INTELLIGENCE_FAST_GLOBAL_FALLBACK_V3_APPROVED: YES
        run: node scripts/repair-avantiqo-intelligence-fast-global-fallback-v3-ci.mjs
      - name: Immutable boundary
        if: always()
        run: |
          echo "MODEL_INFERENCE_PERFORMED=false"
          echo "NEW_NETWORK_VOLUME_CREATED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
          echo "GLOBAL_FALLBACK_VERIFICATION=v3-set-equality"
