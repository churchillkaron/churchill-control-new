name: Avantiqo Intelligence Fast Model Cache Now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-intelligence-fast-model-cache-now.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Pin triggering commit on local main
        run: git switch -C main "${GITHUB_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Inspect Fast model cache
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          AVANTIQO_INTELLIGENCE_FAST_MODEL_CACHE_EXPECTED_MAIN: ${{ github.sha }}
        run: node scripts/diagnose-avantiqo-intelligence-fast-model-cache-local.mjs
      - name: Inspect Fast cache control plane
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          AVANTIQO_INTELLIGENCE_FAST_MODEL_CACHE_CONTROL_PLANE_EXPECTED_MAIN: ${{ github.sha }}
        run: node scripts/diagnose-avantiqo-intelligence-fast-model-cache-control-plane-local.mjs
      - if: always()
        run: |
          echo "GENERATION_SUBMITTED=false"
          echo "INFERENCE_PERFORMED=false"
          echo "MUTATION_PERFORMED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
          echo "DIAGNOSTIC_PINNED_TO_TRIGGER_SHA=true"
          echo "DIAGNOSTIC_RERUN=rest-plus-graphql-control-plane"
