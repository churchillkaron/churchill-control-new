name: Avantiqo Intelligence FP8 Serverless Capacity Now

on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-avantiqo-intelligence-fp8-serverless-capacity-now-ci.mjs
      - .github/workflows/avantiqo-intelligence-fp8-serverless-capacity-now.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Inspect FP8-compatible global Serverless capacity
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: node scripts/diagnose-avantiqo-intelligence-fp8-serverless-capacity-now-ci.mjs
      - if: always()
        run: |
          echo "GENERATION_SUBMITTED=false"
          echo "GPU_ACTIVATION_PERFORMED=false"
          echo "MUTATION_PERFORMED=false"
          echo "NEW_NETWORK_VOLUME_CREATED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
