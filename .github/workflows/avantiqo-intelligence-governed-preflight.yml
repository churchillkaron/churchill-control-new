name: Avantiqo Intelligence - Local-Only Governed Preflight

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  local-only-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert local-only Intelligence provider graph
        run: |
          grep -Fq 'AVANTIQO_INTELLIGENCE_LOCAL_RUNTIME_REQUIRED' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderV2.js
          grep -Fq 'external_compute_allowed = false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderV2.js
          grep -Fq 'AVANTIQO_INTELLIGENCE_LOCAL_RUNTIME_REQUIRED' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceModalDirectRuntime.js
          grep -Fq 'AVANTIQO_INTELLIGENCE_LOCAL_RUNTIME_REQUIRED' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderV2.js
          grep -Fq 'external_provider_fallback_allowed: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderRegistration.js
      - name: Run Intelligence local-only contracts
        run: node --test tests/avantiqo-intelligence-*.test.mjs tests/avantiqo-model-*.test.mjs tests/intelligence-*.test.mjs
