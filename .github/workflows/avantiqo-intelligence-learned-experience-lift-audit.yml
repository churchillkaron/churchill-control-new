name: Avantiqo Intelligence Learned Experience Lift Audit

on:
  push:
    branches: [main]
    paths:
      - "lib/intelligence/runtime/AvantiqoLearnedExperienceLiftCertificationRuntime.mjs"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeLifecycleRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js"
      - "scripts/audit-avantiqo-learned-experience-lift-local.mjs"
      - ".github/workflows/avantiqo-intelligence-learned-experience-lift-audit.yml"
  pull_request:
    paths:
      - "lib/intelligence/runtime/AvantiqoLearnedExperienceLiftCertificationRuntime.mjs"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeLifecycleRuntime.js"
      - "lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js"
      - "scripts/audit-avantiqo-learned-experience-lift-local.mjs"
      - ".github/workflows/avantiqo-intelligence-learned-experience-lift-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learned-experience-lift-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit learned experience lift
        run: node scripts/audit-avantiqo-learned-experience-lift-local.mjs
