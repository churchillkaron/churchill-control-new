name: Avantiqo Intelligence Mission Learning Lift Audit

on:
  push:
    branches: [main]
    paths:
      - "lib/intelligence/runtime/AvantiqoMissionLearningLiftCertificationRuntime.mjs"
      - "lib/operator/runtime/OperatorVerifiedLearningContextRuntime.js"
      - "lib/operator/runtime/OperatorReasoningRuntime.js"
      - "scripts/audit-avantiqo-mission-learning-lift-local.mjs"
      - ".github/workflows/avantiqo-intelligence-mission-learning-lift-audit.yml"
  pull_request:
    paths:
      - "lib/intelligence/runtime/AvantiqoMissionLearningLiftCertificationRuntime.mjs"
      - "lib/operator/runtime/OperatorVerifiedLearningContextRuntime.js"
      - "lib/operator/runtime/OperatorReasoningRuntime.js"
      - "scripts/audit-avantiqo-mission-learning-lift-local.mjs"
      - ".github/workflows/avantiqo-intelligence-mission-learning-lift-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-learning-lift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit mission learning lift
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-avantiqo-mission-learning-lift-local.mjs
