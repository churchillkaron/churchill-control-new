name: Avantiqo Intelligence Mission Outcome Learning Audit

on:
  push:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js"
      - "lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeContractRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeAssessmentRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningBridgeRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningManifestRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningProjectionRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningSettlementRuntime.js"
      - "lib/platform/capabilities/createOperatorBindingAwareMissionCapability.js"
      - "lib/platform/capabilities/createCodeAICommitCapability.js"
      - "lib/platform/capabilities/createCodeAICommitStatusCapability.js"
      - "lib/intelligence/runtime/AvantiqoLearningEvidenceCandidateBridgeRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "scripts/audit-avantiqo-mission-outcome-learning-local.mjs"
      - "scripts/audit-avantiqo-mission-outcome-learning-integrity-local.mjs"
      - "scripts/audit-operator-mission-outcome-learning-handoff-local.mjs"
      - "scripts/audit-operator-mission-outcome-learning-bridge-local.mjs"
      - "scripts/audit-operator-mission-completion-learning-local.mjs"
      - "scripts/audit-operator-mission-learning-manifest-live-local.mjs"
      - "scripts/audit-operator-mission-learning-static-local.mjs"
      - ".github/workflows/avantiqo-intelligence-mission-outcome-learning-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js"
      - "lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeContractRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeAssessmentRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningBridgeRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningManifestRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningProjectionRuntime.js"
      - "lib/operator/runtime/OperatorMissionOutcomeLearningSettlementRuntime.js"
      - "lib/platform/capabilities/createOperatorBindingAwareMissionCapability.js"
      - "lib/platform/capabilities/createCodeAICommitCapability.js"
      - "lib/platform/capabilities/createCodeAICommitStatusCapability.js"
      - "lib/intelligence/runtime/AvantiqoLearningEvidenceCandidateBridgeRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "scripts/audit-avantiqo-mission-outcome-learning-local.mjs"
      - "scripts/audit-avantiqo-mission-outcome-learning-integrity-local.mjs"
      - "scripts/audit-operator-mission-outcome-learning-handoff-local.mjs"
      - "scripts/audit-operator-mission-outcome-learning-bridge-local.mjs"
      - "scripts/audit-operator-mission-completion-learning-local.mjs"
      - "scripts/audit-operator-mission-learning-manifest-live-local.mjs"
      - "scripts/audit-operator-mission-learning-static-local.mjs"
      - ".github/workflows/avantiqo-intelligence-mission-outcome-learning-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-mission-outcome-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Zero-cost governed mission learning certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax gate
        run: |
          node --check lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js
          node --check lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js
          node --check lib/operator/runtime/OperatorMissionOutcomeLearningBridgeRuntime.js
          node --check lib/operator/runtime/OperatorMissionOutcomeLearningManifestRuntime.js
          node --check lib/operator/runtime/OperatorMissionOutcomeLearningProjectionRuntime.js
          node --check lib/operator/runtime/OperatorMissionOutcomeLearningSettlementRuntime.js
          node --check lib/platform/capabilities/createOperatorBindingAwareMissionCapability.js
          node --check lib/platform/capabilities/createCodeAICommitCapability.js
          node --check lib/platform/capabilities/createCodeAICommitStatusCapability.js
          node --check scripts/audit-avantiqo-mission-outcome-learning-local.mjs
          node --check scripts/audit-avantiqo-mission-outcome-learning-integrity-local.mjs
          node --check scripts/audit-operator-mission-outcome-learning-handoff-local.mjs
          node --check scripts/audit-operator-mission-outcome-learning-bridge-local.mjs
          node --check scripts/audit-operator-mission-completion-learning-local.mjs
          node --check scripts/audit-operator-mission-learning-manifest-live-local.mjs
          node --check scripts/audit-operator-mission-learning-static-local.mjs

      - name: Run base accumulation audit
        run: node scripts/audit-avantiqo-mission-outcome-learning-local.mjs

      - name: Run stored evidence integrity audit
        run: node scripts/audit-avantiqo-mission-outcome-learning-integrity-local.mjs

      - name: Run Operator outcome handoff audit
        env:
          SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-operator-mission-outcome-learning-handoff-local.mjs

      - name: Run real Operator outcome bridge audit
        env:
          SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-operator-mission-outcome-learning-bridge-local.mjs

      - name: Run verified mission completion audit
        env:
          SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
          AVANTIQO_INTELLIGENCE_LEARNING_ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-operator-mission-completion-learning-local.mjs

      - name: Run live manifest declaration audit
        env:
          SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-operator-mission-learning-manifest-live-local.mjs

      - name: Run immutable static guards
        run: node scripts/audit-operator-mission-learning-static-local.mjs
