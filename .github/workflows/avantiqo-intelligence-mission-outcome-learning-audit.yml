name: Avantiqo Intelligence Mission Outcome Learning Audit

on:
  push:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js"
      - "lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeContractRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeAssessmentRuntime.js"
      - "lib/intelligence/runtime/AvantiqoLearningEvidenceCandidateBridgeRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "scripts/audit-avantiqo-mission-outcome-learning-local.mjs"
      - "scripts/audit-operator-mission-outcome-learning-handoff-local.mjs"
      - ".github/workflows/avantiqo-intelligence-mission-outcome-learning-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js"
      - "lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeContractRuntime.js"
      - "lib/operator/runtime/OperatorIntelligenceDecisionOutcomeAssessmentRuntime.js"
      - "lib/intelligence/runtime/AvantiqoLearningEvidenceCandidateBridgeRuntime.js"
      - "lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js"
      - "scripts/audit-avantiqo-mission-outcome-learning-local.mjs"
      - "scripts/audit-operator-mission-outcome-learning-handoff-local.mjs"
      - ".github/workflows/avantiqo-intelligence-mission-outcome-learning-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-mission-outcome-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Zero-cost mission outcome learning certification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax gate
        run: |
          node --check lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js
          node --check scripts/audit-avantiqo-mission-outcome-learning-local.mjs

      - name: Run adversarial mission outcome learning audit
        run: node scripts/audit-avantiqo-mission-outcome-learning-local.mjs

      - name: Guard immutable learning boundaries
        shell: bash
        run: |
          set -euo pipefail
          runtime="lib/intelligence/runtime/AvantiqoMissionOutcomeLearningRuntime.js"
          grep -q 'EVIDENCE_CANDIDATE_NOT_RELEASED' "$runtime"
          grep -q 'causal_attribution_allowed: false' "$runtime"
          grep -q 'reusable_platform_knowledge: false' "$runtime"
          grep -q 'knowledge_router_reuse_allowed: false' "$runtime"
          grep -q 'automatic_knowledge_promotion: false' "$runtime"
          grep -q 'explicit_final_promotion_required: true' "$runtime"
          grep -q 'discriminating_counterfactual_evaluation_required: true' "$runtime"
          grep -q 'AVANTIQO_LEARNING_EVIDENCE_CANDIDATE_BRIDGE_V1' "$runtime"
          grep -q 'min_observations: 3' "$runtime"
          grep -q 'min_distinct_observation_days: 2' "$runtime"
          grep -q 'min_dominant_outcome_ratio: 0.8' "$runtime"
          if grep -Eq 'from ["'\''`](openai|@anthropic-ai|modal|runpod)' "$runtime"; then
            echo "Forbidden provider/GPU import in zero-cost mission outcome learning runtime"
            exit 1
          fi
          if grep -Eq '\.from\(["'\'']platform_knowledge["'\'']\)' "$runtime"; then
            echo "Direct reusable platform knowledge write detected"
            exit 1
          fi

  operator-handoff:
    name: Zero-cost Operator outcome handoff certification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax gate
        run: |
          node --check lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js
          node --check scripts/audit-operator-mission-outcome-learning-handoff-local.mjs

      - name: Run Operator outcome handoff adversarial audit
        env:
          SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key-not-used
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-operator-mission-outcome-learning-handoff-local.mjs

      - name: Guard immutable Operator handoff boundaries
        shell: bash
        run: |
          set -euo pipefail
          handoff="lib/intelligence/runtime/OperatorMissionOutcomeLearningHandoffRuntime.js"
          audit="scripts/audit-operator-mission-outcome-learning-handoff-local.mjs"
          grep -q 'AVANTIQO_OPERATOR_MISSION_OUTCOME_LEARNING_HANDOFF_V1' "$handoff"
          grep -q 'post_verified_outcome_handoff_only: true' "$handoff"
          grep -q 'full_operator_outcome_persisted: false' "$handoff"
          grep -q 'source_observation_token_persisted: false' "$handoff"
          grep -q 'customer_private_content_allowed: false' "$handoff"
          grep -q 'customer_identifiers_allowed: false' "$handoff"
          grep -q 'raw_reasoning_persisted: false' "$handoff"
          grep -q 'automatic_business_action_execution: false' "$handoff"
          grep -q 'automatic_message_send: false' "$handoff"
          grep -q 'automatic_knowledge_promotion: false' "$handoff"
          grep -q 'direct_platform_knowledge_write_allowed: false' "$handoff"
          grep -q 'authorization_effect: "NONE"' "$handoff"
          grep -q 'first_observation_cannot_create_candidate: true' "$audit"
          grep -q 'same_day_repetition_cannot_create_candidate: true' "$audit"
          grep -q 'cross_day_three_observation_pattern_creates_one_candidate: true' "$audit"
          grep -q 'repeated_same_observation_token_is_idempotent: true' "$audit"
          if grep -Eiq 'from ["'\''`](openai|@anthropic-ai|modal|runpod)' "$handoff" "$audit"; then
            echo "Forbidden model/GPU provider import in zero-cost Operator outcome handoff" >&2
            exit 1
          fi
          if grep -Eq '\.from\(["'\'']platform_knowledge["'\'']\)' "$handoff"; then
            echo "Operator handoff must not write reusable platform knowledge directly" >&2
            exit 1
          fi
