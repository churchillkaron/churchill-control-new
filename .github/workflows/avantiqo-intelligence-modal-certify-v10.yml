name: Avantiqo Intelligence Modal Certify V10

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-intelligence-modal-certify-v10.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-modal-certify-v10
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      AVANTIQO_INTELLIGENCE_ENGINE_ENABLED: "YES"
      AVANTIQO_INTELLIGENCE_MODAL_REAL_INFERENCE_APPROVED: "YES"
      AVANTIQO_INTELLIGENCE_MODAL_CERT_EXPECTED_MAIN_COMMIT: ${{ github.sha }}
      AVANTIQO_INTELLIGENCE_MODAL_CERT_SOURCE_MAIN_COMMIT: ${{ github.sha }}
      AVANTIQO_INTELLIGENCE_MODAL_BASE_URL: https://churchillkaron--avantiqo-intelligence-gateway-intelligence-api.modal.run
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5' 'python-dotenv==1.1.1'

      - name: Prove zero idle and static boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-intelligence-modal/modal_service.py
          grep -Fq 'python_version="3.12"' services/avantiqo-intelligence-modal/modal_service.py
          node --test tests/avantiqo-intelligence-safe-lease-provider-guard.test.mjs
          node --check scripts/certify-avantiqo-intelligence-modal-gateway-service-live.mjs
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          python - <<'PY'
          import modal
          rows=[]
          for name in ("fast", "deep"):
              f=modal.Function.from_name("avantiqo-intelligence-owned", name)
              s=f.get_current_stats()
              backlog=int(getattr(s,"backlog",0) or 0)
              runners=int(getattr(s,"num_total_runners",0) or 0)
              if backlog or runners:
                  raise RuntimeError(f"AVANTIQO_INTELLIGENCE_MODAL_V10_NOT_IDLE:{name}:{backlog}:{runners}")
              rows.append((name,backlog,runners))
          print(f"AVANTIQO_INTELLIGENCE_MODAL_V10_IDLE_BEFORE=PASS workers={rows}")
          print("GPU_INFERENCE_PERFORMED=false")
          PY

      - name: Rotate token and redeploy CPU gateway
        shell: bash
        run: |
          set -euo pipefail
          token="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
          echo "::add-mask::$token"
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          printf 'AVANTIQO_INTELLIGENCE_GATEWAY_TOKEN=%s\n' "$token" > "$secret_file"
          modal secret create avantiqo-intelligence-gateway --from-dotenv "$secret_file" --force
          rm -f "$secret_file"
          echo "AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN=$token" >> "$GITHUB_ENV"
          cd services/avantiqo-intelligence-modal
          modal deploy modal_service.py
          echo 'AVANTIQO_INTELLIGENCE_MODAL_V10_GATEWAY_DEPLOY=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Require healthy gateway before GPU request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base=process.env.AVANTIQO_INTELLIGENCE_MODAL_BASE_URL;
          const token=process.env.AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN;
          let last=null;
          for (let attempt=1; attempt<=12; attempt+=1) {
            if (attempt>1) await new Promise(r=>setTimeout(r,2500));
            try {
              const response=await fetch(`${base}/health`, {
                headers:{Authorization:`Bearer ${token}`,Accept:'application/json'},
                signal:AbortSignal.timeout(15000),
              });
              const body=await response.json();
              last={status:response.status,body};
              if (response.ok && body.contract==='AVANTIQO_INTELLIGENCE_MODAL_HTTP_V1') {
                if (body.gpu_worker!=='H100' || body.scale_to_zero!==true) throw new Error('HEALTH_GPU_POLICY_INVALID');
                if (body.gateway_gpu_imported!==false || body.gpu_inference_performed!==false || body.runpod_used!==false) throw new Error('HEALTH_BOUNDARY_INVALID');
                console.log(`AVANTIQO_INTELLIGENCE_MODAL_V10_GATEWAY_HEALTH=PASS attempt=${attempt}`);
                console.log('GPU_INFERENCE_PERFORMED=false');
                process.exit(0);
              }
            } catch (error) {
              last={error:String(error?.message||error)};
            }
          }
          throw new Error(`AVANTIQO_INTELLIGENCE_MODAL_V10_GATEWAY_HEALTH_FAILED:${JSON.stringify(last).slice(0,1000)}`);
          NODE

      - name: Run exactly one governed Fast request end to end
        shell: bash
        run: |
          set -euo pipefail
          node scripts/certify-avantiqo-intelligence-modal-gateway-service-live.mjs

      - name: Verify Fast H100 returned to zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import modal
          f=modal.Function.from_name("avantiqo-intelligence-owned","fast")
          last=(None,None)
          for attempt in range(1,19):
              if attempt>1: time.sleep(5)
              s=f.get_current_stats()
              backlog=int(getattr(s,"backlog",0) or 0)
              runners=int(getattr(s,"num_total_runners",0) or 0)
              last=(backlog,runners)
              if backlog==0 and runners==0:
                  print(f"AVANTIQO_INTELLIGENCE_MODAL_V10_SCALE_TO_ZERO=PASS attempt={attempt}")
                  break
          else:
              raise RuntimeError(f"AVANTIQO_INTELLIGENCE_MODAL_V10_SCALE_TO_ZERO_FAILED:{last[0]}:{last[1]}")
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-modal-v10-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: local-audit-output/avantiqo-intelligence-modal-gateway-service-certification/report.json

      - name: Immutable boundaries
        if: always()
        shell: bash
        run: |
          echo 'EXTERNAL_AI_FALLBACK_USED=false'
          echo 'RUNPOD_USED=false'
          echo 'NEW_NETWORK_VOLUME_CREATED=false'
          echo 'MODAL_VOLUME_CREATED=false'
          echo 'MAX_NEW_GPU_JOBS=1'
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
