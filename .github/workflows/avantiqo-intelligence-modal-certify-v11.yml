name: LEGACY - Avantiqo Intelligence Modal Certify V11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy gateway certification retired
        shell: bash
        run: |
          echo 'AVANTIQO_INTELLIGENCE_MODAL_V11_RETIRED=TRUE'
          echo 'Use avantiqo-intelligence-modal-direct-certification.yml'
          echo 'GPU_INFERENCE_PERFORMED=false'
          echo 'RUNPOD_MUTATION_PERFORMED=false'
          echo 'PRODUCTION_DEPLOY_PERFORMED=false'
          exit 1
