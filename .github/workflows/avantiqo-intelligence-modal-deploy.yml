name: Avantiqo Intelligence - Governed Fast/Deep Modal Deploy

on:
  workflow_dispatch:
    inputs:
      approve_deploy:
        description: "Explicitly approve deploying the Fast/Deep overflow worker"
        required: true
        type: boolean
        default: false
      source_commit:
        description: "Expected source commit SHA (optional but recommended)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-modal-fast-deep-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.approve_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ inputs.source_commit }}"
          if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
            echo "SOURCE_COMMIT_MISMATCH expected=$expected actual=$actual" >&2
            exit 1
          fi
          echo "source_commit=$actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal==0.66.54'
          modal --version

      - name: Prove Fast/Deep-only overflow contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          python -m py_compile services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'APP_NAME = os.environ.get("AVANTIQO_INTELLIGENCE_MODAL_APP_NAME", "avantiqo-intelligence-owned")' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'GPU = "H100"' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'def fast(data:' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'def deep(data:' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'FAST_STARTUP_TIMEOUT_SECONDS = 60' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'DEEP_STARTUP_TIMEOUT_SECONDS = 120' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'FAST_HARD_TIMEOUT_SECONDS = 60' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'DEEP_HARD_TIMEOUT_SECONDS = 10 * 60' services/avantiqo-intelligence-modal/modal_app.py
          test "$(grep -Fc 'min_containers=0' services/avantiqo-intelligence-modal/modal_app.py)" -ge 2
          test "$(grep -Fc 'max_containers=1' services/avantiqo-intelligence-modal/modal_app.py)" -ge 2
          test "$(grep -Fc '@modal.concurrent(max_inputs=1)' services/avantiqo-intelligence-modal/modal_app.py)" -ge 2
          ! grep -Eq 'FrontConversation|modal_front_app' services/avantiqo-intelligence-modal/modal_app.py

      - name: Deploy governed overflow worker
        working-directory: services/avantiqo-intelligence-modal
        shell: bash
        run: |
          set -euo pipefail
          modal deploy --strategy recreate modal_app.py

      - name: State deployment boundary
        shell: bash
        run: |
          echo 'AVANTIQO_INTELLIGENCE_MODAL_FAST_DEEP_DEPLOYED=true'
          echo 'AVANTIQO_INTELLIGENCE_MODAL_FRONT_DEPLOYED=false'
          echo 'INFERENCE_JOB_SUBMITTED=false'
          echo 'AUTOMATIC_FALLBACK_ENABLED=false'
          echo 'LOCAL_FIRST_POLICY_CHANGED=false'
