name: Avantiqo Intelligence Modal Final E2E V6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-intelligence-modal-final-e2e-v6.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-modal-final-e2e-v6
  cancel-in-progress: false

jobs:
  deploy-certify-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      AVANTIQO_INTELLIGENCE_ENGINE_ENABLED: "YES"
      AVANTIQO_INTELLIGENCE_MODAL_MODEL_BAKE_APPROVED: "YES"
      AVANTIQO_INTELLIGENCE_MODAL_REAL_INFERENCE_APPROVED: "YES"
      AVANTIQO_INTELLIGENCE_MODAL_CERT_EXPECTED_MAIN_COMMIT: ${{ github.sha }}
      AVANTIQO_INTELLIGENCE_MODAL_CERT_SOURCE_MAIN_COMMIT: ${{ github.sha }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_5K2x3kGkhs3d2PU8VOQQPyNT24A9
      VERCEL_TEAM_ID: team_40jy42BqQOs4U6pVdkawwEfp

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Zero-cost architecture and regression gate
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/platform/service-runtime/providers/ProviderExecutor.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderV2.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceRunpodProvider.js
          node --check scripts/certify-avantiqo-intelligence-modal-gateway-service-live.mjs
          python -m py_compile services/avantiqo-intelligence-modal/modal_app.py
          python -m py_compile services/avantiqo-intelligence-modal/modal_service.py
          node --test tests/avantiqo-intelligence-safe-lease-provider-guard.test.mjs
          grep -Fq 'gpu=GPU' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'GPU = "H100"' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'min_containers=0' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'max_containers=1' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'scaledown_window=5' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'persistent_model_volume: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          grep -Fq 'modal_primary_when_configured: true' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          grep -Fq 'simultaneous_modal_runpod_execution_forbidden: true' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          git diff --check
          echo 'AVANTIQO_INTELLIGENCE_MODAL_ZERO_COST_GATE=PASS'

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'
          modal --version

      - name: Require all final credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${VERCEL_TOKEN:-}"
          echo 'AVANTIQO_INTELLIGENCE_MODAL_FINAL_CREDENTIALS=PASS'

      - name: Deploy pinned Intelligence H100 workers
        shell: bash
        run: |
          set -euo pipefail
          cd services/avantiqo-intelligence-modal
          modal deploy modal_app.py
          echo 'AVANTIQO_INTELLIGENCE_MODAL_WORKERS_DEPLOY=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Prove workers are scale-to-zero before certification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import modal
          app = "avantiqo-intelligence-owned"
          reports = []
          for function_name in ("fast", "deep"):
              function = modal.Function.from_name(app, function_name)
              stats = function.get_current_stats()
              backlog = int(getattr(stats, "backlog", 0) or 0)
              runners = int(getattr(stats, "num_total_runners", 0) or 0)
              if backlog != 0 or runners != 0:
                  raise RuntimeError(
                      f"AVANTIQO_INTELLIGENCE_MODAL_NOT_IDLE_BEFORE:{function_name}:backlog={backlog}:runners={runners}"
                  )
              reports.append((function_name, backlog, runners))
          print(f"AVANTIQO_INTELLIGENCE_MODAL_IDLE_BEFORE=PASS workers={reports}")
          print("GPU_INFERENCE_PERFORMED=false")
          PY

      - name: Create gateway secret and deploy CPU gateway
        shell: bash
        run: |
          set -euo pipefail
          token="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
          test "${#token}" -ge 40
          echo "::add-mask::$token"
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          printf 'AVANTIQO_INTELLIGENCE_GATEWAY_TOKEN=%s\n' "$token" > "$secret_file"
          modal secret create avantiqo-intelligence-gateway --from-dotenv "$secret_file" --force
          rm -f "$secret_file"
          cd services/avantiqo-intelligence-modal
          deploy_log="$(mktemp)"
          modal deploy modal_service.py 2>&1 | tee "$deploy_log"
          base_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.modal\.run' "$deploy_log" | tail -n 1)"
          rm -f "$deploy_log"
          test -n "$base_url"
          echo "AVANTIQO_INTELLIGENCE_MODAL_BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN=$token" >> "$GITHUB_ENV"
          echo 'AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_DEPLOY=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Health-check Modal gateway before inference
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base = process.env.AVANTIQO_INTELLIGENCE_MODAL_BASE_URL;
          const token = process.env.AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN;
          const response = await fetch(`${base}/health`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            signal: AbortSignal.timeout(30000),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(`HEALTH_HTTP_${response.status}`);
          if (body.contract !== 'AVANTIQO_INTELLIGENCE_MODAL_HTTP_V1') throw new Error('HEALTH_CONTRACT_INVALID');
          if (body.gpu_worker !== 'H100') throw new Error('HEALTH_GPU_INVALID');
          if (body.scale_to_zero !== true) throw new Error('HEALTH_SCALE_TO_ZERO_INVALID');
          if (body.gateway_gpu_imported !== false || body.gpu_inference_performed !== false) throw new Error('HEALTH_CPU_GATEWAY_BOUNDARY_INVALID');
          if (body.runpod_used !== false) throw new Error('HEALTH_RUNPOD_BOUNDARY_INVALID');
          console.log('AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_HEALTH=PASS');
          console.log('GPU_INFERENCE_PERFORMED=false');
          NODE

      - name: Run exactly one governed Fast Modal service request
        shell: bash
        run: |
          set -euo pipefail
          node scripts/certify-avantiqo-intelligence-modal-gateway-service-live.mjs

      - name: Prove H100 worker returned to zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import modal
          function = modal.Function.from_name("avantiqo-intelligence-owned", "fast")
          last = None
          for attempt in range(1, 13):
              if attempt > 1:
                  time.sleep(5)
              stats = function.get_current_stats()
              backlog = int(getattr(stats, "backlog", 0) or 0)
              runners = int(getattr(stats, "num_total_runners", 0) or 0)
              last = (backlog, runners)
              if backlog == 0 and runners == 0:
                  print(f"AVANTIQO_INTELLIGENCE_MODAL_SCALE_TO_ZERO=PASS attempt={attempt}")
                  break
          else:
              raise RuntimeError(
                  f"AVANTIQO_INTELLIGENCE_MODAL_SCALE_TO_ZERO_NOT_OBSERVED:backlog={last[0]}:runners={last[1]}"
              )
          PY

      - name: Wire certified Modal Intelligence into Vercel production env only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const project = process.env.VERCEL_PROJECT_ID;
          const team = process.env.VERCEL_TEAM_ID;
          const entries = [
            { key: 'AVANTIQO_INTELLIGENCE_ENGINE_ENABLED', value: 'true', type: 'encrypted' },
            { key: 'AVANTIQO_INTELLIGENCE_MODAL_BASE_URL', value: process.env.AVANTIQO_INTELLIGENCE_MODAL_BASE_URL, type: 'encrypted' },
            { key: 'AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN', value: process.env.AVANTIQO_INTELLIGENCE_MODAL_GATEWAY_TOKEN, type: 'encrypted' },
            { key: 'AVANTIQO_INTELLIGENCE_MODAL_HTTP_TIMEOUT_MS', value: '30000', type: 'encrypted' },
          ];
          for (const entry of entries) {
            if (!entry.value) throw new Error(`VERCEL_ENV_VALUE_REQUIRED:${entry.key}`);
          }
          const response = await fetch(
            `https://api.vercel.com/v10/projects/${encodeURIComponent(project)}/env?teamId=${encodeURIComponent(team)}&upsert=true`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(entries.map((entry) => ({
                ...entry,
                target: ['production'],
                comment: 'Certified Avantiqo Modal Intelligence V6',
              }))),
              signal: AbortSignal.timeout(30000),
            },
          );
          if (!response.ok) {
            const raw = await response.text();
            throw new Error(`VERCEL_INTELLIGENCE_ENV_UPSERT_HTTP_${response.status}:${raw.slice(0, 500)}`);
          }
          console.log('AVANTIQO_INTELLIGENCE_VERCEL_PRODUCTION_ENV_WIRED=PASS');
          console.log('PRODUCTION_VERCEL_DEPLOY_PERFORMED=false');
          NODE

      - name: Upload final Intelligence certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-modal-final-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: local-audit-output/avantiqo-intelligence-modal-gateway-service-certification/report.json

      - name: Preserve immutable boundaries
        if: always()
        shell: bash
        run: |
          echo 'EXTERNAL_AI_FALLBACK_USED=false'
          echo 'RUNPOD_USED=false'
          echo 'NEW_NETWORK_VOLUME_CREATED=false'
          echo 'MODAL_VOLUME_CREATED=false'
          echo 'MAX_NEW_GPU_JOBS=1'
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'PRODUCTION_ENV_WIRING_ALLOWED=true'
