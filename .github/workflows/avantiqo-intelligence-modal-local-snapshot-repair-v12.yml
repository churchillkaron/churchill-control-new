name: LEGACY - Avantiqo Intelligence Modal Snapshot Repair V12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy workflow retired
        shell: bash
        run: |
          set -euo pipefail
          echo 'AVANTIQO_INTELLIGENCE_MODAL_V12_RETIRED=TRUE'
          echo 'Reason: Intelligence now uses the Audio-proven direct Modal JS SDK transport.'
          echo 'Use: .github/workflows/avantiqo-intelligence-modal-direct-certification.yml'
          echo 'GPU_INFERENCE_PERFORMED=false'
          echo 'RUNPOD_MUTATION_PERFORMED=false'
          echo 'PRODUCTION_DEPLOY_PERFORMED=false'
          exit 1
