name: Avantiqo Intelligence Operator Verified Learning Context Audit

on:
  push:
    branches: [main]
    paths:
      - "lib/operator/runtime/OperatorVerifiedLearningContextRuntime.js"
      - "lib/operator/runtime/OperatorReasoningRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeRouterRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "scripts/audit-operator-verified-learning-context-local.mjs"
      - ".github/workflows/avantiqo-intelligence-operator-verified-learning-context-audit.yml"
  pull_request:
    paths:
      - "lib/operator/runtime/OperatorVerifiedLearningContextRuntime.js"
      - "lib/operator/runtime/OperatorReasoningRuntime.js"
      - "lib/intelligence/runtime/AvantiqoKnowledgeRouterRuntime.js"
      - "lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js"
      - "scripts/audit-operator-verified-learning-context-local.mjs"
      - ".github/workflows/avantiqo-intelligence-operator-verified-learning-context-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-verified-learning-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit verified Operator learning context
        run: node --import ./scripts/next-alias-loader.mjs scripts/audit-operator-verified-learning-context-local.mjs
