name: Avantiqo Intelligence Owned Model Mission Learning - Local Guard

on:
  push:
    branches: [main]
    paths:
      - "lib/intelligence/runtime/AvantiqoOwnedModelMissionLearningCertificationRuntime.mjs"
      - "lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js"
      - "lib/intelligence/runtime/AvantiqoModelBenchmarkExecutionRuntime.js"
      - "lib/intelligence/runtime/AvantiqoModelCandidateCanaryRuntime.js"
      - ".github/workflows/avantiqo-intelligence-owned-model-mission-learning.yml"
      - ".github/workflows/avantiqo-intelligence-owned-model-mission-learning-guard-audit.yml"
  pull_request:
    paths:
      - "lib/intelligence/runtime/AvantiqoOwnedModelMissionLearningCertificationRuntime.mjs"
      - "lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js"
      - "lib/intelligence/runtime/AvantiqoModelBenchmarkExecutionRuntime.js"
      - "lib/intelligence/runtime/AvantiqoModelCandidateCanaryRuntime.js"
      - ".github/workflows/avantiqo-intelligence-owned-model-mission-learning.yml"
      - ".github/workflows/avantiqo-intelligence-owned-model-mission-learning-guard-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove model learning is local-only and fail-closed
        run: |
          set -euo pipefail
          grep -Fq 'AVANTIQO_LOCAL_TRAINER_V1' lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js
          grep -Fq 'AVANTIQO_INTELLIGENCE_LOCAL_TRAINER_EXECUTOR_REQUIRED' lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js
          grep -Fq 'AVANTIQO_MODEL_BENCHMARK_LOCAL_RUNTIME_REQUIRED' lib/intelligence/runtime/AvantiqoModelBenchmarkExecutionRuntime.js
          grep -Fq 'AVANTIQO_MODEL_CANDIDATE_CANARY_LOCAL_RUNTIME_REQUIRED' lib/intelligence/runtime/AvantiqoModelCandidateCanaryRuntime.js
          ! grep -R -E 'ModalClient|MODAL_TOKEN|RUNPOD_API_KEY|api\.runpod\.ai' lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js lib/intelligence/runtime/AvantiqoModelBenchmarkExecutionRuntime.js lib/intelligence/runtime/AvantiqoModelCandidateCanaryRuntime.js
          node --test tests/avantiqo-model-*.test.mjs tests/avantiqo-intelligence-safe-lease-provider-guard.test.mjs
      - name: Prove workflow cannot submit external inference
        run: |
          set -euo pipefail
          workflow='.github/workflows/avantiqo-intelligence-owned-model-mission-learning.yml'
          grep -q '^  workflow_dispatch:' "$workflow"
          ! grep -Eq '^  (push|issues|pull_request|schedule):' "$workflow"
          ! grep -Eiq 'provider_job|paid_inference|approve_paid|MODAL_TOKEN|RUNPOD_API_KEY' "$workflow"
          echo 'EXTERNAL_INFERENCE_PERFORMED=false'
          echo 'PRODUCTION_DEPLOY_PERFORMED=false'
