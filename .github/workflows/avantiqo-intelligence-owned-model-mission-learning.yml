name: Avantiqo Intelligence Owned Model Mission Learning - Local Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-owned-model-mission-learning-local
  cancel-in-progress: false

jobs:
  local-only-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify local-only training and certification contracts
        run: |
          node --test tests/avantiqo-model-*.test.mjs tests/avantiqo-intelligence-*.test.mjs
          grep -Fq 'AVANTIQO_LOCAL_TRAINER_V1' lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js
          grep -Fq 'external_compute_allowed: false' lib/intelligence/runtime/AvantiqoModelTrainingExecutionRuntime.js
          grep -Fq 'external_compute_allowed: false' lib/intelligence/runtime/AvantiqoModelBenchmarkExecutionRuntime.js
          grep -Fq 'external_compute_allowed: false' lib/intelligence/runtime/AvantiqoModelCandidateCanaryRuntime.js
      - name: State execution boundary
        run: |
          echo "Model improvement execution is local-only and fails closed until owned local trainer hardware is available."
          echo "No external provider job is submitted by this workflow."
