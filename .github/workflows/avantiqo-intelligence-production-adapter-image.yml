name: Avantiqo Intelligence Production Adapter Image
run-name: Avantiqo Intelligence production adapter image ${{ inputs.request_nonce }}

on:
  workflow_dispatch:
    inputs:
      request_nonce:
        description: Exact local production-adapter image request identifier
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-intelligence-production-adapter-image-${{ inputs.request_nonce }}
  cancel-in-progress: false

jobs:
  build-production-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify production adapter source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          test -f services/avantiqo-intelligence-production-adapter/startup.py
          test -f services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'runpod/worker-v1-vllm:v2.25.0' services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          grep -F 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_ENABLED=false' services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          grep -F 'Qwen/Qwen3-30B-A3B-Thinking-2507' services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          grep -F 'COPY services/avantiqo-intelligence-candidate/inspect_adapter.py ./inspect_adapter.py' services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          grep -F 'ENTRYPOINT ["python3", "/production-adapter/startup.py"]' services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          grep -F 'CONTRACT = "AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_STARTUP_V2"' services/avantiqo-intelligence-production-adapter/startup.py
          grep -F 'canonical_deep_request_uses_adapter' services/avantiqo-intelligence-production-adapter/startup.py
          grep -F 'BASE_MODEL_ALIAS = "avantiqo-intelligence-deep-base"' services/avantiqo-intelligence-production-adapter/startup.py
          grep -F 'activation_authority' services/avantiqo-intelligence-production-adapter/startup.py
          grep -F 'EXTERNAL_EXPLICIT_RELEASE_BINDER_ONLY' services/avantiqo-intelligence-production-adapter/startup.py
          grep -F 'fast_lane_effect' services/avantiqo-intelligence-production-adapter/startup.py
          grep -F 'FOUNDATION_MODEL = "Qwen/Qwen3-30B-A3B-Thinking-2507"' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'MOE_3D_FUSED_PEFT' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'PEFT_FUSED_EXPERT_FACTORS_2D' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'ADAPTER_MOE_PER_EXPERT_LAYOUT_FORBIDDEN' services/avantiqo-intelligence-candidate/inspect_adapter.py
          python3 -m py_compile \
            services/avantiqo-intelligence-production-adapter/startup.py \
            services/avantiqo-intelligence-candidate/inspect_adapter.py
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_IMAGE_TRIGGER_SHA_BOUND=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable production adapter coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-intelligence-production-adapter"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_IMAGE_TAG=$tag"

      - name: Build and push immutable production adapter image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avantiqo-intelligence-production-adapter/Dockerfile.runpod
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.avantiqo.contract=AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_STARTUP_V2
            io.avantiqo.foundation-model=Qwen/Qwen3-30B-A3B-Thinking-2507
            io.avantiqo.adapter-layout=MOE_3D_FUSED_PEFT
            io.avantiqo.adapter-serialization=PEFT_FUSED_EXPERT_FACTORS_2D
            io.avantiqo.fast-lane-effect=NONE
            io.avantiqo.automatic-promotion=false
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-intelligence-production-adapter
          cache-to: type=gha,mode=max,scope=avantiqo-intelligence-production-adapter

      - name: Create immutable production adapter evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          REQUEST_NONCE: ${{ inputs.request_nonce }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_IMAGE_DIGEST_INVALID'; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-intelligence-production-adapter-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_IMAGE_RESULT_V1",
            request_nonce: process.env.REQUEST_NONCE,
            source_sha: process.env.RELEASE_SHA,
            trigger_sha: process.env.TRIGGER_SHA,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            startup_contract: "AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_STARTUP_V2",
            foundation_model: "Qwen/Qwen3-30B-A3B-Thinking-2507",
            adapter_layout: "MOE_3D_FUSED_PEFT",
            adapter_serialization: "PEFT_FUSED_EXPERT_FACTORS_2D",
            exact_candidate_adapter_inspector_reused: true,
            adapter_artifact_embedded: false,
            production_adapter_enabled_by_default: false,
            explicit_release_binder_required: true,
            fast_lane_effect: "NONE",
            provider_job_submitted: false,
            inference_performed: false,
            training_started: false,
            runpod_endpoint_mutated: false,
            production_model_promoted: false,
            automatic_production_promotion: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-intelligence-production-adapter-image/evidence.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload production adapter image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-production-adapter-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-intelligence-production-adapter-image/evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm isolated production adapter image build
        shell: bash
        run: |
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_INFERENCE_PERFORMED=false'
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_RUNPOD_ENDPOINT_MUTATED=false'
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_PRODUCTION_PROMOTION=false'
          echo 'AVANTIQO_INTELLIGENCE_PRODUCTION_ADAPTER_FAST_LANE_EFFECT=NONE'
