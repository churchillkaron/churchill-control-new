name: Avantiqo Intelligence Production Credential Repair

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-intelligence-production-credential-repair-request.json

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-production-credential-repair
  cancel-in-progress: false

jobs:
  repair-production-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_FAST_API_KEY }}
      RUNPOD_AVANTIQO_INTELLIGENCE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_5K2x3kGkhs3d2PU8VOQQPyNT24A9
      VERCEL_TEAM_ID: team_40jy42BqQOs4U6pVdkawwEfp

    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Repair production Intelligence credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-avantiqo-intelligence-production-credential-ci.mjs
