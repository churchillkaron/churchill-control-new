name: Avantiqo Intelligence RunPod Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-intelligence-runpod-cleanup.yml
      - scripts/cleanup-obsolete-avantiqo-intelligence-canary-endpoints-ci.mjs

permissions:
  contents: read

concurrency:
  group: avantiqo-intelligence-runpod-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Delete only obsolete Intelligence canary endpoints
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: node scripts/cleanup-obsolete-avantiqo-intelligence-canary-endpoints-ci.mjs

      - name: Re-audit RunPod spend and storage
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        run: node scripts/audit-avantiqo-runpod-live-spend-ci.mjs

      - name: Upload post-cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-runpod-cleanup-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: avantiqo-runpod-live-spend-audit.json
