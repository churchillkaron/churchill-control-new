name: Avantiqo Intelligence Training Images

on:
  workflow_dispatch:
    inputs:
      component:
        description: Intelligence image(s) to build
        required: true
        type: choice
        options:
          - both
          - trainer
          - candidate
        default: both

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-intelligence-training-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-trainer:
    if: ${{ inputs.component == 'both' || inputs.component == 'trainer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Intelligence trainer source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f services/avantiqo-intelligence-trainer/Dockerfile.runpod
          test -f services/avantiqo-intelligence-trainer/handler.py
          test -f services/avantiqo-intelligence-trainer/requirements.txt
          grep -F 'Qwen/Qwen3-30B-A3B-Thinking-2507' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'LORA_BF16_PEFT_QWEN3_MOE' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'MIN_BF16_GPU_MEMORY_BYTES = 78 * 1024 * 1024 * 1024' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'MAX_SEQUENCE_LENGTH = 2048' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'DEFAULT_SEQUENCE_LENGTH = 1024' services/avantiqo-intelligence-trainer/handler.py
          grep -F '"q_proj"' services/avantiqo-intelligence-trainer/handler.py
          grep -F '"v_proj"' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'mlp.experts.gate_up_proj' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'mlp.experts.down_proj' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'target_parameters=MOE_LORA_TARGET_PARAMETERS' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'lora_dropout=0.0' services/avantiqo-intelligence-trainer/handler.py
          grep -F 'AVANTIQO_INTELLIGENCE_TRAINER_ENABLED=false' services/avantiqo-intelligence-trainer/Dockerfile.runpod
          if grep -Fq '"k_proj",' services/avantiqo-intelligence-trainer/handler.py; then
            echo 'AVANTIQO_INTELLIGENCE_TRAINER_DENSE_TARGET_PROFILE_WIDENED'
            exit 1
          fi
          if grep -Fq '"o_proj",' services/avantiqo-intelligence-trainer/handler.py; then
            echo 'AVANTIQO_INTELLIGENCE_TRAINER_DENSE_TARGET_PROFILE_WIDENED'
            exit 1
          fi
          if grep -Fq 'BitsAndBytesConfig' services/avantiqo-intelligence-trainer/handler.py; then
            echo 'AVANTIQO_INTELLIGENCE_TRAINER_FAKE_QLORA_DETECTED'
            exit 1
          fi
          if grep -Fq 'load_in_4bit' services/avantiqo-intelligence-trainer/handler.py; then
            echo 'AVANTIQO_INTELLIGENCE_TRAINER_4BIT_PATH_DETECTED'
            exit 1
          fi
          if grep -Fqi 'bitsandbytes' services/avantiqo-intelligence-trainer/requirements.txt; then
            echo 'AVANTIQO_INTELLIGENCE_TRAINER_BITSANDBYTES_DEPENDENCY_DETECTED'
            exit 1
          fi
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_IMAGE_TRIGGER_SHA_BOUND=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable trainer coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-intelligence-trainer"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_INTELLIGENCE_TRAINER_IMAGE_TAG=$tag"

      - name: Build and push immutable trainer image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avantiqo-intelligence-trainer/Dockerfile.runpod
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.avantiqo.contract=AVANTIQO_INTELLIGENCE_TRAINER_V1
            io.avantiqo.training-method=LORA_BF16_PEFT_QWEN3_MOE
            io.avantiqo.max-sequence-length=2048
            io.avantiqo.dense-lora-targets=q_proj,v_proj
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-intelligence-trainer
          cache-to: type=gha,mode=max,scope=avantiqo-intelligence-trainer

      - name: Create immutable trainer evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo 'AVANTIQO_INTELLIGENCE_TRAINER_IMAGE_DIGEST_INVALID'; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-intelligence-trainer-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_INTELLIGENCE_TRAINER_IMAGE_RESULT_V1",
            source_sha: process.env.RELEASE_SHA,
            trigger_sha: process.env.TRIGGER_SHA,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            foundation_model: "Qwen/Qwen3-30B-A3B-Thinking-2507",
            training_method: "LORA_BF16_PEFT_QWEN3_MOE",
            base_precision: "BF16",
            base_quantized: false,
            minimum_gpu_class: "80GB",
            default_sequence_length: 1024,
            maximum_sequence_length: 2048,
            dense_lora_target_modules: ["q_proj", "v_proj"],
            trainer_enabled_by_default: false,
            provider_job_submitted: false,
            training_started: false,
            runpod_endpoint_mutated: false,
            production_model_promoted: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-intelligence-trainer-image/evidence.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload trainer image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-trainer-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-intelligence-trainer-image/evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm isolated trainer image build
        shell: bash
        run: |
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_TRAINING_STARTED=false'
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_RUNPOD_ENDPOINT_MUTATED=false'
          echo 'AVANTIQO_INTELLIGENCE_TRAINER_PRODUCTION_DEPLOY=false'

  build-candidate:
    if: ${{ inputs.component == 'both' || inputs.component == 'candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Intelligence candidate source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f services/avantiqo-intelligence-candidate/Dockerfile.runpod
          test -f services/avantiqo-intelligence-candidate/inspect_adapter.py
          test -f services/avantiqo-intelligence-candidate/startup.py
          grep -F 'runpod/worker-v1-vllm:v2.25.0' services/avantiqo-intelligence-candidate/Dockerfile.runpod
          grep -F 'AVANTIQO_INTELLIGENCE_CANDIDATE_ENABLED=false' services/avantiqo-intelligence-candidate/Dockerfile.runpod
          grep -F 'Qwen/Qwen3-30B-A3B-Thinking-2507' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'mlp.experts.gate_up_proj' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'mlp.experts.down_proj' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'MOE_3D_FUSED_PEFT' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'ADAPTER_MOE_LORA_TENSOR_NOT_3D' services/avantiqo-intelligence-candidate/inspect_adapter.py
          grep -F 'candidate_model_name' services/avantiqo-intelligence-candidate/startup.py
          grep -F 'ENABLE_LORA' services/avantiqo-intelligence-candidate/startup.py
          grep -F -- '--enable-mixed-moe-lora-format' services/avantiqo-intelligence-candidate/startup.py
          if grep -Fq 'MOE_2D_PER_EXPERT' services/avantiqo-intelligence-candidate/inspect_adapter.py; then
            echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_LEGACY_2D_LAYOUT_DETECTED'
            exit 1
          fi
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_IMAGE_TRIGGER_SHA_BOUND=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable candidate coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-intelligence-candidate"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_INTELLIGENCE_CANDIDATE_IMAGE_TAG=$tag"

      - name: Build and push immutable candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avantiqo-intelligence-candidate/Dockerfile.runpod
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.avantiqo.contract=AVANTIQO_INTELLIGENCE_CANDIDATE_STARTUP_V1
            io.avantiqo.adapter-layout=MOE_3D_FUSED_PEFT
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-intelligence-candidate
          cache-to: type=gha,mode=max,scope=avantiqo-intelligence-candidate

      - name: Create immutable candidate evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_IMAGE_DIGEST_INVALID'; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-intelligence-candidate-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_INTELLIGENCE_CANDIDATE_IMAGE_RESULT_V1",
            source_sha: process.env.RELEASE_SHA,
            trigger_sha: process.env.TRIGGER_SHA,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            foundation_model: "Qwen/Qwen3-30B-A3B-Thinking-2507",
            adapter_layout: "MOE_3D_FUSED_PEFT",
            exact_adapter_inspection_required: true,
            candidate_enabled_by_default: false,
            provider_job_submitted: false,
            training_started: false,
            runpod_endpoint_mutated: false,
            ordinary_provider_routing_enabled: false,
            production_model_promoted: false,
            production_web_deploy: false,
            database_migration: false,
            secrets_in_output: false,
          };
          writeFileSync(
            "/tmp/avantiqo-intelligence-candidate-image/evidence.json",
            `${JSON.stringify(report, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Upload candidate image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-intelligence-candidate-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-intelligence-candidate-image/evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm isolated candidate image build
        shell: bash
        run: |
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_TRAINING_STARTED=false'
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_RUNPOD_ENDPOINT_MUTATED=false'
          echo 'AVANTIQO_INTELLIGENCE_CANDIDATE_PRODUCTION_DEPLOY=false'
