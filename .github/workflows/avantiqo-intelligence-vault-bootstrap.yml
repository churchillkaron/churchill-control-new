name: Avantiqo Intelligence - Local-Only Credential Guard

on:
  push:
    paths:
      - "lib/platform/service-runtime/providers/avantiqo-intelligence/**"
      - "app/api/platform/admin/intelligence-credentials/route.js"
      - ".github/workflows/avantiqo-intelligence-vault-bootstrap.yml"
  pull_request:
    paths:
      - "lib/platform/service-runtime/providers/avantiqo-intelligence/**"
      - "app/api/platform/admin/intelligence-credentials/route.js"
      - ".github/workflows/avantiqo-intelligence-vault-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert Intelligence has no external credential dependency
        run: |
          grep -Fq 'runtime_credentials_required_at_execution: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProviderRegistration.js
          grep -Fq 'AVANTIQO_INTELLIGENCE_CREDENTIALS_NOT_USED_LOCAL_ONLY' app/api/platform/admin/intelligence-credentials/route.js
          grep -Fq 'credential_required: false' app/api/platform/admin/intelligence-credentials/route.js
          grep -Fq 'external_compute_allowed: false' app/api/platform/admin/intelligence-credentials/route.js
