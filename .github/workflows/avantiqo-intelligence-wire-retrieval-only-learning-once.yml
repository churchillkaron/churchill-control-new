name: Avantiqo Intelligence Wire Retrieval-Only Learning Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/avantiqo-intelligence-wire-retrieval-only-learning-once.yml"

permissions:
  contents: write

jobs:
  wire-retrieval-only-learning:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Refresh latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch deep Operator reasoning
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/operator/runtime/OperatorReasoningRuntime.js")
          source = path.read_text()

          if "./OperatorVerifiedLearningContextRuntime.js" in source:
              raise SystemExit("verified-learning import already present; refusing duplicate patch")

          import_anchor = '} from "./OperatorOwnedIntelligenceServiceRuntime";'
          if source.count(import_anchor) != 1:
              raise SystemExit(f"import anchor count={source.count(import_anchor)}")
          source = source.replace(
              import_anchor,
              import_anchor + '\nimport {\n  loadOperatorVerifiedLearningContext,\n  OPERATOR_VERIFIED_LEARNING_CONTEXT_CONTRACT,\n} from "./OperatorVerifiedLearningContextRuntime.js";',
              1,
          )

          instructions_start = source.find("  const instructions = `")
          if instructions_start < 0:
              raise SystemExit("deep instructions anchor missing")

          prompt_anchor = "Understand the user's request, act as a thoughtful collaborative partner, and when sufficiently clear select a real supplied navigation target or capability."
          prompt_pos = source.find(prompt_anchor, instructions_start)
          if prompt_pos < 0:
              raise SystemExit("deep prompt anchor missing")
          prompt_end = prompt_pos + len(prompt_anchor)
          prompt_insert = "\n\nverified_platform_learning is platform-level reusable learned experience released through Avantiqo's governed learning system. It is retrieval-only advisory planning context: not customer memory, not proof of current business state, and never authorization for an action. Use it to avoid verified prior failure modes and improve process choices when relevant. Current verified business evidence and an explicit current user decision always override it. Never use it alone to justify a write, approval, payment, publication, external message or governance bypass."
          source = source[:prompt_end] + prompt_insert + source[prompt_end:]

          request_anchor = "\n  const request = {\n"
          request_pos = source.find(request_anchor, instructions_start)
          if request_pos < 0:
              raise SystemExit("deep request anchor missing")
          learning_block = '''\n  const verifiedLearningContext = await loadOperatorVerifiedLearningContext({\n    message,\n    projectState,\n    currentScreen,\n  });\n  const verifiedPlatformLearning =\n    verifiedLearningContext.status === "AVAILABLE"\n      ? {\n          contract: verifiedLearningContext.contract,\n          status: verifiedLearningContext.status,\n          route: verifiedLearningContext.route,\n          knowledge: verifiedLearningContext.knowledge,\n          knowledge_count: verifiedLearningContext.knowledge_count,\n          context_chars: verifiedLearningContext.context_chars,\n          freshness_checked: verifiedLearningContext.freshness_checked,\n          evidence_graph_checked: verifiedLearningContext.evidence_graph_checked,\n          retrieval_only: verifiedLearningContext.retrieval_only,\n          internet_search_performed: verifiedLearningContext.internet_search_performed,\n          fresh_research_performed: verifiedLearningContext.fresh_research_performed,\n          advisory_only: verifiedLearningContext.advisory_only,\n          current_business_state_proven:\n            verifiedLearningContext.current_business_state_proven,\n          authorization_effect: verifiedLearningContext.authorization_effect,\n          execution_effect: verifiedLearningContext.execution_effect,\n          customer_private_memory_reused:\n            verifiedLearningContext.customer_private_memory_reused,\n          platform_learning_organization_only:\n            verifiedLearningContext.platform_learning_organization_only,\n        }\n      : null;\n'''
          source = source[:request_pos] + learning_block + source[request_pos:]

          agreement_anchor = "    agreement_state: object(agreementState),\n    recent_conversation: boundedConversation(conversation, source),"
          agreement_pos = source.find(agreement_anchor, request_pos)
          if agreement_pos < 0:
              raise SystemExit("deep agreement context anchor missing")
          source = source.replace(
              agreement_anchor,
              '''    agreement_state: object(agreementState),\n    ...(verifiedPlatformLearning\n      ? { verified_platform_learning: verifiedPlatformLearning }\n      : {}),\n    recent_conversation: boundedConversation(conversation, source),''',
              1,
          )

          metadata_anchor = "      evidence_first_mixed_action: true,\n"
          metadata_pos = source.find(metadata_anchor, request_pos)
          if metadata_pos < 0:
              raise SystemExit("deep metadata anchor missing")
          metadata_end = metadata_pos + len(metadata_anchor)
          metadata_insert = '''      verified_platform_learning_used: Boolean(verifiedPlatformLearning),\n      verified_platform_learning_count:\n        verifiedPlatformLearning?.knowledge_count || 0,\n      verified_platform_learning_contract:\n        OPERATOR_VERIFIED_LEARNING_CONTEXT_CONTRACT,\n      verified_platform_learning_retrieval_only: true,\n      verified_platform_learning_fresh_research_performed: false,\n      platform_learning_customer_private_memory_reused: false,\n'''
          source = source[:metadata_end] + metadata_insert + source[metadata_end:]

          path.write_text(source)

      - name: Verify reasoner syntax
        run: node --check lib/operator/runtime/OperatorReasoningRuntime.js

      - name: Audit deep reasoning learning integration
        run: node scripts/audit-operator-verified-learning-reasoning-integration-local.mjs

      - name: Audit retrieval-only learning safety
        run: node --loader ./scripts/next-alias-loader.mjs scripts/audit-operator-verified-learning-context-local.mjs

      - name: Commit verified learning integration
        run: |
          if git diff --quiet -- lib/operator/runtime/OperatorReasoningRuntime.js; then
            echo "No change required"
            exit 0
          fi
          git config user.name "churchillkaron"
          git config user.email "patric@pcsphuket.com"
          git add lib/operator/runtime/OperatorReasoningRuntime.js
          git commit -m "feat(intelligence): use retrieval-only learning in deep Operator reasoning"
          git pull --rebase origin main
          git push origin HEAD:main
