name: Avantiqo Investor HQ Visual Proof 24s Once

# Dedicated native-4K DFR investor proof. It has an isolated concurrency group so
# unrelated investor preview changes or main-branch work cannot cancel paid HQ inference.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-investor-hq-proof-24s-once.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-investor-hq-proof-24s-once
  cancel-in-progress: false

jobs:
  proof:
    if: github.event.head_commit.message == 'Run Avantiqo investor HQ proof 24s once'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      AVANTIQO_INVESTOR_PROOF_RUN_KEY: "hq-dfr-${{ github.sha }}"
      AVANTIQO_INVESTOR_HQ_MAX_WAIT_SECONDS: "2100"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install HQ proof tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'
          npm ci --ignore-scripts

      - name: Validate HQ DFR generation boundary
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          python -m py_compile services/avantiqo-video-engine/modal_app.py services/avantiqo-video-engine/modal_investor_hq.py
          node --check scripts/run-avantiqo-investor-visual-proof-24s-hq.mjs
          grep -F 'LTX25_DFR_DETAIL_FIDELITY' services/avantiqo-video-engine/modal_investor_hq.py >/dev/null
          grep -F 'WIDTH = 3840' services/avantiqo-video-engine/modal_investor_hq.py >/dev/null
          grep -F 'HEIGHT = 2176' services/avantiqo-video-engine/modal_investor_hq.py >/dev/null
          grep -F '"--spatial-upscalings", "2"' services/avantiqo-video-engine/modal_investor_hq.py >/dev/null
          grep -F 'EXISTING_VISUAL_INPUT_FORBIDDEN' services/avantiqo-video-engine/modal_investor_hq.py >/dev/null
          grep -F 'pixel_delivery_upscale_used: false' scripts/run-avantiqo-investor-visual-proof-24s-hq.mjs >/dev/null
          grep -F 'simultaneous_gpu_jobs: 1' scripts/run-avantiqo-investor-visual-proof-24s-hq.mjs >/dev/null
          echo 'AVANTIQO_INVESTOR_HQ_PREFLIGHT=PASS'
          echo 'GENERATION=native-3840x2176-LTX25-DFR'
          echo 'STUDIO_DELIVERY=3840x2160-crop-only'
          echo 'SIMULTANEOUS_GPU_JOBS=1'
          echo 'AUTOMATIC_PAID_RETRY=false'

      - name: Deploy Avantiqo investor HQ DFR lane
        run: |
          set -euo pipefail
          cd services/avantiqo-video-engine
          modal deploy modal_investor_hq.py | tee /tmp/investor-hq-deploy.log
          grep -F 'generate_investor_hq_job' /tmp/investor-hq-deploy.log >/dev/null
          grep -F 'generate_investor_hq_master' /tmp/investor-hq-deploy.log >/dev/null
          echo 'AVANTIQO_INVESTOR_HQ_MODAL_DEPLOY=PASS'

      - name: Verify HQ model assets without GPU
        run: |
          set -euo pipefail
          cd services/avantiqo-video-engine
          modal run modal_investor_hq.py::seed_investor_hq_cache | tee /tmp/investor-hq-cache.log
          echo 'AVANTIQO_INVESTOR_HQ_CACHE_GATE=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Generate four native-4K DFR shots and assemble 24-second proof
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-investor-visual-proof-24s-hq.mjs

      - name: Verify HQ proof artifact
        run: |
          set -euo pipefail
          REPORT='local-audit-output/avantiqo-investor-visual-proof-24s-hq/avantiqo-investor-visual-proof-24s-hq-report.json'
          MP4='local-audit-output/avantiqo-investor-visual-proof-24s-hq/avantiqo-investor-visual-proof-24s-hq-4k.mp4'
          test -s "$REPORT"
          test -s "$MP4"
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('local-audit-output/avantiqo-investor-visual-proof-24s-hq/avantiqo-investor-visual-proof-24s-hq-report.json','utf8'));
          const expectedRunKey = `hq-dfr-${process.env.GITHUB_SHA}`;
          if (r.success !== true) throw new Error('PROOF_NOT_SUCCESSFUL');
          if (r.run_key !== expectedRunKey) throw new Error(`RUN_KEY_INVALID:${r.run_key}`);
          if (r.proof_type !== 'PURE_T2V_LTX25_DFR_NATIVE_4K_NEW_ASSETS_ONLY') throw new Error('PROOF_TYPE_INVALID');
          if (r.existing_visual_assets_used !== false || Number(r.source_visual_asset_count) !== 0) throw new Error('EXISTING_ASSET_POLICY_FAILED');
          if (r.source_images_used !== false || r.source_videos_used !== false) throw new Error('SOURCE_VISUAL_POLICY_FAILED');
          if (r.screenshot_or_browser_capture_used !== false) throw new Error('SCREENSHOT_POLICY_FAILED');
          if (r.pure_text_to_video !== true || r.modal_used !== true) throw new Error('OWNED_T2V_REQUIRED');
          if (r.model !== 'avantiqo-ltx-2.5') throw new Error('MODEL_INVALID');
          if (r.pipeline !== 'LTX25_DFR_DETAIL_FIDELITY' || r.dfr_used !== true) throw new Error('DFR_REQUIRED');
          if (r.detailing_ic_lora_used !== true) throw new Error('DETAILING_REQUIRED');
          if (r.native_generation_resolution !== '3840x2176') throw new Error('NATIVE_RESOLUTION_INVALID');
          if (r.pixel_delivery_upscale_used !== false) throw new Error('PIXEL_UPSCALE_FORBIDDEN');
          if (r.generated_shot_count !== 4 || r.gpu_generation_calls !== 4 || r.simultaneous_gpu_jobs !== 1) throw new Error('SHOT_OR_GPU_COUNT_INVALID');
          if (r.master_resolution !== '3840x2160') throw new Error('MASTER_RESOLUTION_INVALID');
          if (Math.abs(Number(r.actual_duration_seconds)-24) > 0.08) throw new Error('MASTER_DURATION_INVALID');
          if (r.external_provider_used !== false || r.automatic_paid_retry !== false) throw new Error('PROVIDER_POLICY_FAILED');
          for (const shot of r.shots || []) {
            if (shot.result?.pure_text_to_video !== true) throw new Error('SHOT_NOT_PURE_T2V:' + shot.id);
            if (Number(shot.result?.source_visual_asset_count) !== 0) throw new Error('SHOT_SOURCE_ASSET:' + shot.id);
            if (shot.result?.modal_gpu !== 'B200') throw new Error('SHOT_GPU_INVALID:' + shot.id);
            if (shot.result?.pipeline !== 'LTX25_DFR_DETAIL_FIDELITY') throw new Error('SHOT_PIPELINE_INVALID:' + shot.id);
            if (shot.result?.generation?.dfr_used !== true) throw new Error('SHOT_DFR_INVALID:' + shot.id);
            if (shot.result?.generation?.detailing_ic_lora_used !== true) throw new Error('SHOT_DETAIL_INVALID:' + shot.id);
            if (shot.result?.generation?.pixel_delivery_upscale_used !== false) throw new Error('SHOT_UPSCALE_INVALID:' + shot.id);
          }
          console.log('AVANTIQO_INVESTOR_HQ_ARTIFACT=PASS');
          console.log('MASTER_RESOLUTION=' + r.master_resolution);
          console.log('MASTER_DURATION=' + r.actual_duration_seconds);
          console.log('FINAL_STORAGE_REFERENCE=' + r.final_output.storage_reference);
          console.log('FINAL_SIGNED_URL=' + r.final_output.signed_url);
          NODE

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: avantiqo-investor-visual-proof-24s-hq
          path: local-audit-output/avantiqo-investor-visual-proof-24s-hq/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve release boundary
        if: always()
        run: |
          echo 'PRODUCTION_VERCEL_DEPLOY_TRIGGERED=false'
          echo 'VIDEO_PRICING_ACTIVATED=false'
          echo 'VIDEO_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'EXTERNAL_VIDEO_PROVIDER_USED=false'
          echo 'AUTOMATIC_PAID_RETRY=false'
          echo 'SIMULTANEOUS_GPU_JOBS=1'
          echo 'HQ_WORKFLOW_CANCEL_IN_PROGRESS=false'
