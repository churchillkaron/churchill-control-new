# trigger: investor-modal-repair-2026-09-06-1
name: Avantiqo Investor Modal Live Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-investor-modal-live-diagnostic-once.yml

permissions:
  contents: read

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}

jobs:
  repair-and-verify:
    if: github.event.head_commit.message == 'Deploy Avantiqo investor Modal repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'

      - name: Deploy repaired Avantiqo video app
        shell: bash
        run: |
          set -euo pipefail
          modal deploy services/avantiqo-video-engine/modal_investor_t2v.py

      - name: Invoke investor seed function once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import modal

          fn = modal.Function.from_name(
              "avantiqo-video-owned",
              "modal_investor_t2v.seed_investor_t2v_cache",
          )
          result = fn.remote()
          print(json.dumps(result, sort_keys=True))
          if not isinstance(result, dict) or result.get("success") is not True:
              raise SystemExit("INVESTOR_SEED_PROBE_FAILED")
          print("AVANTIQO_INVESTOR_SEED_PROBE=PASS")
          PY

      - name: Check repaired app logs for crash-loop signature
        shell: bash
        run: |
          set -euo pipefail
          modal app logs avantiqo-video-owned --since 10m --tail 500 --timestamps --show-function-id --show-function-call-id --show-container-id > /tmp/modal.log 2>&1 || true
          cat /tmp/modal.log
          if grep -F "ModuleNotFoundError: No module named 'modal_app'" /tmp/modal.log; then
            echo 'AVANTIQO_INVESTOR_MODAL_CRASH_LOOP=FAIL'
            exit 1
          fi
          echo 'AVANTIQO_INVESTOR_MODAL_CRASH_LOOP=PASS'
