name: Avantiqo Investor Scene 9 Studio Live

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 9 23 8 *"
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-investor-scene9-live-request.json
      - .github/workflows/avantiqo-investor-scene9-studio-live.yml
      - scripts/avantiqo-investor-scene9-owned-preview.mjs
      - lib/creative/post-production/runtime/AvantiqoInvestorCapabilityVisualChoreography.js
      - lib/creative/post-production/runtime/AvantiqoInvestorOwnedExecutionPolicy.js
      - lib/creative/post-production/runtime/AvantiqoInvestorStudioGenerationPlan.js

permissions:
  contents: write

concurrency:
  group: avantiqo-investor-scene9-studio-live
  cancel-in-progress: false

jobs:
  generate-scene9:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID }}
      AVANTIQO_VIDEO_CERTIFIED_CAPABILITIES: ai.video.generate
      INVESTOR_STUDIO_REQUEST_ID: investor-scene9-owned-preview-20260823-v2
      INVESTOR_STUDIO_RESULT_PATH: artifacts/investor-scene9-studio-live.json
      INVESTOR_STUDIO_PREVIEW_TIMEOUT_MS: "1800000"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate owned runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo "NEXT_PUBLIC_SUPABASE_URL missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }
          test -n "${RUNPOD_API_KEY:-}" || { echo "RUNPOD_API_KEY missing"; exit 1; }
          test -n "${RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID:-}" || { echo "RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID missing"; exit 1; }
          echo "Avantiqo-owned Cinema bindings present. External AI provider bindings are not exposed to this job."

      - name: Syntax check owned Scene 9 preview
        run: node --check scripts/avantiqo-investor-scene9-owned-preview.mjs

      - name: Generate Scene 9 through Avantiqo-owned Cinema
        run: node --loader ./scripts/next-alias-loader.mjs scripts/avantiqo-investor-scene9-owned-preview.mjs

      - name: Publish execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-investor-scene9-owned-${{ github.run_id }}
          path: artifacts/investor-scene9-studio-live.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit sanitized result to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/investor-scene9-studio-live.json ]; then
            printf '%s\n' '{"success":false,"provider":"avantiqo-video","external_ai_provider_used":false,"error":"RESULT_FILE_NOT_PRODUCED"}' > artifacts/investor-scene9-studio-live.json
          fi
          mkdir -p audits/results
          cp artifacts/investor-scene9-studio-live.json audits/results/avantiqo-investor-scene9-studio-live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-investor-scene9-studio-live.json
          if git diff --cached --quiet; then
            echo "No result change to commit."
            exit 0
          fi
          git commit -m "Record owned investor Scene 9 preview result"
          git pull --rebase origin main
          git push origin HEAD:main
