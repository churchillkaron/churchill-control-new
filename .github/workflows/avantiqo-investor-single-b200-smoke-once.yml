name: Avantiqo Investor Native-4K B200 Smoke Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-investor-single-b200-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-investor-single-b200-smoke-once
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event.head_commit.message == 'Run native-4K investor B200 smoke v3 once'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      AVANTIQO_VIDEO_SMOKE_REAL_INFERENCE_APPROVED: "YES"
      AVANTIQO_VIDEO_SMOKE_RUN_KEY: "investor-native-4k-b200-smoke-v3"
      AVANTIQO_VIDEO_SMOKE_MAX_WAIT_SECONDS: "720"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install runtime tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --ignore-scripts

      - name: Validate true native-4K smoke boundary
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          node --check scripts/run-avantiqo-investor-single-shot-smoke.mjs
          grep -A14 -B10 'def generate_native_master' services/avantiqo-video-engine/modal_app.py | grep -F 'max_containers=1' >/dev/null
          grep -F 'LTX_MASTER_WIDTH = 3840' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'LTX_MASTER_HEIGHT = 2176' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'LTX_NUM_INFERENCE_STEPS = 30' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'LTX_MAX_BATCH_SIZE = 4' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'pixel_upscale_used": False' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'learned_latent_upsampler_used": False' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'learned_spatial_upscaler_used": False' services/avantiqo-video-engine/modal_app.py >/dev/null
          grep -F 'cancel({ terminateContainers: true })' scripts/run-avantiqo-investor-single-shot-smoke.mjs >/dev/null
          grep -F 'gpu_jobs: 1' scripts/run-avantiqo-investor-single-shot-smoke.mjs >/dev/null
          echo 'AVANTIQO_INVESTOR_NATIVE_4K_SMOKE_PREFLIGHT=PASS'
          echo 'MODEL_RENDER_RESOLUTION=3840x2176'
          echo 'DELIVERY_RESOLUTION=3840x2160'
          echo 'UPSCALE_USED=false'
          echo 'INFERENCE_STEPS=30'
          echo 'B200_MAX_CONTAINERS=1'
          echo 'PAID_GPU_JOBS=1'
          echo 'AUTOMATIC_PAID_RETRY=false'

      - name: Verify deployed JS compatibility and idle queue without GPU
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import * as modal from 'modal';
          const text = (v) => String(v ?? '').trim();
          const tokenId = text(process.env.MODAL_TOKEN_ID || process.env.AVANTIQO_MODAL_TOKEN_ID);
          const tokenSecret = text(process.env.MODAL_TOKEN_SECRET || process.env.AVANTIQO_MODAL_TOKEN_SECRET);
          if (!tokenId || !tokenSecret) throw new Error('MODAL_CREDENTIALS_REQUIRED');
          const client = new modal.ModalClient({ tokenId, tokenSecret });
          const fn = await client.functions.fromName('avantiqo-video-owned', 'generate_native_job');
          const stats = await fn.getCurrentStats();
          const backlog = Number(stats?.backlog || 0);
          const running = Number(stats?.numRunningInputs ?? stats?.num_running_inputs ?? 0);
          if (backlog !== 0 || running !== 0) throw new Error(`VIDEO_RUNTIME_NOT_IDLE:backlog=${backlog}:running=${running}`);
          console.log('AVANTIQO_VIDEO_JS_DEPLOYED_LOOKUP=PASS');
          console.log('AVANTIQO_VIDEO_DEPLOYED_IDLE_GATE=PASS');
          console.log('GPU_INFERENCE_PERFORMED=false');
          NODE

      - name: Generate one real 5-second native-4K shot
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-investor-single-shot-smoke.mjs

      - name: Verify smoke artifact
        run: |
          set -euo pipefail
          REPORT='local-audit-output/avantiqo-investor-single-shot-smoke/avantiqo-investor-smoke-report.json'
          MP4='local-audit-output/avantiqo-investor-single-shot-smoke/avantiqo-investor-smoke-5s-4k.mp4'
          test -s "$REPORT"
          test -s "$MP4"
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('local-audit-output/avantiqo-investor-single-shot-smoke/avantiqo-investor-smoke-report.json', 'utf8'));
          if (report.success !== true) throw new Error('SMOKE_NOT_SUCCESSFUL');
          if (report.run_key !== 'investor-native-4k-b200-smoke-v3') throw new Error('RUN_KEY_INVALID');
          if (report.gpu_generation_calls !== 1) throw new Error('GPU_CALL_COUNT_INVALID');
          if (report.automatic_paid_retry !== false) throw new Error('AUTOMATIC_RETRY_INVALID');
          if (report.delivery_resolution !== '3840x2160') throw new Error('DELIVERY_RESOLUTION_INVALID');
          if (Math.abs(Number(report.duration_seconds) - 5) > 0.08) throw new Error('DELIVERY_DURATION_INVALID');
          console.log('AVANTIQO_INVESTOR_NATIVE_4K_SMOKE_ARTIFACT=PASS');
          console.log('FINAL_SIGNED_URL=' + report.delivery.signed_url);
          console.log('FINAL_STORAGE_REFERENCE=' + report.delivery.storage_reference);
          NODE

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: avantiqo-investor-native-4k-b200-smoke-v3
          path: local-audit-output/avantiqo-investor-single-shot-smoke/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve release boundary
        if: always()
        run: |
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'VIDEO_PRICING_ACTIVATED=false'
          echo 'VIDEO_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'AUTOMATIC_PAID_RETRY=false'
