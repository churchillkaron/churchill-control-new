name: Avantiqo Investor Visual Proof 24s Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-investor-visual-proof-24s-once.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-investor-visual-proof-24s-once
  cancel-in-progress: true

jobs:
  proof:
    if: github.event.head_commit.message == 'Run fast Studio-first Avantiqo investor proof once'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AVANTIQO_INVESTOR_PROOF_RUN_KEY: "visual-proof-24s-fast-${{ github.sha }}"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Studio proof tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm ci --ignore-scripts

      - name: Validate Studio-first proof contract
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          node --check scripts/run-avantiqo-investor-visual-proof-24s-fast.mjs
          grep -F 'new_gpu_generation_calls: 0' scripts/run-avantiqo-investor-visual-proof-24s-fast.mjs >/dev/null
          grep -F 'screenshot_or_browser_capture_used: false' scripts/run-avantiqo-investor-visual-proof-24s-fast.mjs >/dev/null
          grep -F 'owned_avantiqo_generation_used: true' scripts/run-avantiqo-investor-visual-proof-24s-fast.mjs >/dev/null
          grep -F '3840' scripts/run-avantiqo-investor-visual-proof-24s-fast.mjs >/dev/null
          grep -F 'target_duration_seconds: 24' lib/creative/director/runtime/CreativeInvestorFilmMarketResearchRuntime.js >/dev/null
          echo 'AVANTIQO_INVESTOR_FAST_PROOF_PREFLIGHT=PASS'
          echo 'NEW_GPU_GENERATION_CALLS=0'
          echo 'JOB_TIMEOUT_MINUTES=25'

      - name: Assemble 24-second Studio-first 4K investor visual proof
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-investor-visual-proof-24s-fast.mjs

      - name: Verify final proof artifact
        run: |
          set -euo pipefail
          REPORT='local-audit-output/avantiqo-investor-visual-proof-24s/avantiqo-investor-visual-proof-24s-report.json'
          MP4='local-audit-output/avantiqo-investor-visual-proof-24s/avantiqo-investor-visual-proof-24s-4k.mp4'
          test -s "$REPORT"
          test -s "$MP4"
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('local-audit-output/avantiqo-investor-visual-proof-24s/avantiqo-investor-visual-proof-24s-report.json', 'utf8'));
          const expectedRunKey = `visual-proof-24s-fast-${process.env.GITHUB_SHA}`;
          if (report.success !== true) throw new Error('PROOF_NOT_SUCCESSFUL');
          if (report.run_key !== expectedRunKey) throw new Error(`RUN_KEY_INVALID:${report.run_key}`);
          if (report.proof_type !== 'STUDIO_FIRST_OWNED_GENERATION_PLUS_APPROVED_LIVE_ACTION') throw new Error('PROOF_TYPE_INVALID');
          if (report.master_resolution !== '3840x2160') throw new Error(`MASTER_RESOLUTION_INVALID:${report.master_resolution}`);
          if (Math.abs(Number(report.actual_duration_seconds) - 24) > 0.08) throw new Error(`MASTER_DURATION_INVALID:${report.actual_duration_seconds}`);
          if (report.owned_avantiqo_generation_used !== true) throw new Error('OWNED_GENERATION_REQUIRED');
          if (report.owned_avantiqo_generation_model !== 'avantiqo-ltx-2.5') throw new Error('OWNED_MODEL_INVALID');
          if (Number(report.new_gpu_generation_calls) !== 0) throw new Error('NEW_GPU_CALLS_FORBIDDEN');
          if (Number(report.gpu_generation_calls) !== 0) throw new Error('GPU_CALLS_FORBIDDEN');
          if (report.screenshot_or_browser_capture_used !== false) throw new Error('CAPTURE_POLICY_INVALID');
          if (report.image_generation_used !== false) throw new Error('IMAGE_GENERATION_POLICY_INVALID');
          if (report.fake_browser_ui_used !== false) throw new Error('FAKE_UI_POLICY_INVALID');
          if (report.external_provider_contacted_during_proof !== false) throw new Error('EXTERNAL_PROVIDER_POLICY_INVALID');
          if (report.automatic_paid_retry !== false) throw new Error('PAID_RETRY_POLICY_INVALID');
          if (report.studio_editorial_mastering_used !== true) throw new Error('STUDIO_MASTERING_REQUIRED');
          if (!report.final_output?.storage_reference?.startsWith('storage://creative-assets/')) throw new Error('STORAGE_REFERENCE_INVALID');
          if (!/^https:\/\//i.test(String(report.final_output?.signed_url || ''))) throw new Error('SIGNED_URL_INVALID');
          console.log('AVANTIQO_INVESTOR_FAST_PROOF_ARTIFACT=PASS');
          console.log('MASTER_RESOLUTION=3840x2160');
          console.log('MASTER_DURATION_SECONDS=' + report.actual_duration_seconds);
          console.log('OWNED_GENERATION_MODEL=' + report.owned_avantiqo_generation_model);
          console.log('NEW_GPU_GENERATION_CALLS=0');
          console.log('FINAL_STORAGE_REFERENCE=' + report.final_output.storage_reference);
          console.log('FINAL_SIGNED_URL=' + report.final_output.signed_url);
          NODE

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: avantiqo-investor-visual-proof-24s-fast
          path: local-audit-output/avantiqo-investor-visual-proof-24s/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve release boundary
        if: always()
        run: |
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'VIDEO_PRICING_ACTIVATED=false'
          echo 'VIDEO_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'AUTOMATIC_PAID_RETRY=false'
          echo 'NEW_GPU_GENERATION_CALLS=0'
          echo 'JOB_TIMEOUT_MINUTES=25'
