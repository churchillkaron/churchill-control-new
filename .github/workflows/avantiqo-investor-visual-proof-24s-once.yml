name: Avantiqo Investor Visual Proof 24s Once

# One-shot governed execution trigger for the repaired 24-second investor proof.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-investor-visual-proof-24s-once.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-investor-visual-proof-24s-once
  cancel-in-progress: false

jobs:
  proof:
    if: github.event.head_commit.message == 'Run repaired Avantiqo investor visual proof 24s once'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      AVANTIQO_INVESTOR_PROOF_REAL_INFERENCE_APPROVED: "YES"
      AVANTIQO_INVESTOR_PROOF_RUN_KEY: "visual-proof-24s-${{ github.sha }}"
      AVANTIQO_INVESTOR_PROOF_MAX_WAIT_SECONDS: "900"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install runtime tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm ci --ignore-scripts

      - name: Validate repaired investor proof runner
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          node --check scripts/run-avantiqo-investor-visual-proof-24s.mjs
          grep -A12 -B8 'def generate_native_master' services/avantiqo-video-engine/modal_app.py | grep -F 'max_containers=1' >/dev/null
          grep -A12 -B8 'def generate_native_controlled_master' services/avantiqo-video-engine/modal_native_controlled_master.py | grep -F 'max_containers=1' >/dev/null
          grep -F 'GENERATION_DEADLINE_EXCEEDED' scripts/run-avantiqo-investor-visual-proof-24s.mjs >/dev/null
          grep -F 'target_duration_seconds: 24' lib/creative/director/runtime/CreativeInvestorFilmMarketResearchRuntime.js >/dev/null
          grep -F 'screenshot_or_browser_capture_allowed: false' lib/creative/director/runtime/CreativeInvestorFilmMarketResearchRuntime.js >/dev/null
          echo 'AVANTIQO_INVESTOR_VISUAL_PROOF_REPAIRED_PREFLIGHT=PASS'
          echo 'B200_MAX_CONTAINERS=1'
          echo 'GENERATION_FAIL_FAST_SECONDS=900'

      - name: Generate and assemble 24-second 4K investor visual proof
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-investor-visual-proof-24s.mjs

      - name: Verify final proof artifact
        run: |
          set -euo pipefail
          REPORT='local-audit-output/avantiqo-investor-visual-proof-24s/avantiqo-investor-visual-proof-24s-report.json'
          MP4='local-audit-output/avantiqo-investor-visual-proof-24s/avantiqo-investor-visual-proof-24s-4k.mp4'
          test -s "$REPORT"
          test -s "$MP4"
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('local-audit-output/avantiqo-investor-visual-proof-24s/avantiqo-investor-visual-proof-24s-report.json', 'utf8'));
          const expectedRunKey = `visual-proof-24s-${process.env.GITHUB_SHA}`;
          if (report.success !== true) throw new Error('PROOF_NOT_SUCCESSFUL');
          if (report.run_key !== expectedRunKey) throw new Error(`RUN_KEY_INVALID:${report.run_key}`);
          if (report.proof_type !== 'VIDEO_GENERATION_ONLY') throw new Error('PROOF_TYPE_INVALID');
          if (report.generated_video_shot_count !== 4) throw new Error('SHOT_COUNT_INVALID');
          if (report.gpu_generation_calls !== 4) throw new Error('GPU_GENERATION_COUNT_INVALID');
          if (report.screenshot_or_browser_capture_used !== false) throw new Error('CAPTURE_POLICY_INVALID');
          if (report.image_generation_used !== false) throw new Error('IMAGE_GENERATION_POLICY_INVALID');
          if (report.automatic_paid_retry !== false) throw new Error('PAID_RETRY_POLICY_INVALID');
          if (report.master_resolution !== '3840x2160') throw new Error('MASTER_RESOLUTION_INVALID');
          if (Math.abs(Number(report.actual_duration_seconds) - 24) > 0.08) throw new Error('MASTER_DURATION_INVALID');
          if (!Array.isArray(report.shots) || report.shots.length !== 4) throw new Error('SHOT_REPORTS_INVALID');
          for (const shot of report.shots) {
            const result = shot.generation_result || {};
            if (result.success !== true) throw new Error(`SHOT_GENERATION_NOT_SUCCESSFUL:${shot.shot}`);
            if (result.modal_gpu !== 'B200') throw new Error(`SHOT_GPU_INVALID:${shot.shot}:${result.modal_gpu}`);
            if (result.model !== 'avantiqo-ltx-2.5') throw new Error(`SHOT_MODEL_INVALID:${shot.shot}:${result.model}`);
            if (Number(result.width) !== 3840 || Number(result.height) !== 2176) throw new Error(`SHOT_RESOLUTION_INVALID:${shot.shot}`);
            if (Number(result.fps) !== 24) throw new Error(`SHOT_FPS_INVALID:${shot.shot}:${result.fps}`);
            if (Number(result.num_inference_steps) !== 30) throw new Error(`SHOT_STEPS_INVALID:${shot.shot}:${result.num_inference_steps}`);
            if (result.automatic_paid_retry !== false) throw new Error(`SHOT_RETRY_POLICY_INVALID:${shot.shot}`);
            if (result.external_provider_contacted !== false) throw new Error(`SHOT_EXTERNAL_PROVIDER_INVALID:${shot.shot}`);
          }
          console.log('AVANTIQO_INVESTOR_VISUAL_PROOF_ARTIFACT=PASS');
          console.log('GPU_GENERATION_CALLS=4');
          console.log('GPU=B200');
          console.log('MODEL=avantiqo-ltx-2.5');
          console.log('NATIVE_GENERATION_RESOLUTION=3840x2176');
          console.log('MASTER_RESOLUTION=3840x2160');
          console.log('AUTOMATIC_PAID_RETRY=false');
          console.log('FINAL_STORAGE_REFERENCE=' + report.final_output.storage_reference);
          console.log('FINAL_SIGNED_URL=' + report.final_output.signed_url);
          NODE

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: avantiqo-investor-visual-proof-24s
          path: local-audit-output/avantiqo-investor-visual-proof-24s/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve release boundary
        if: always()
        run: |
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'VIDEO_PRICING_ACTIVATED=false'
          echo 'VIDEO_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'AUTOMATIC_PAID_RETRY=false'
          echo 'GENERATION_FAIL_FAST_SECONDS=900'
