name: Avantiqo Local RunPod Secret Sync
run-name: Avantiqo local RunPod secret sync ${{ inputs.request_nonce }}

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: Ephemeral local RSA public key encoded as base64
        required: true
        type: string
      request_nonce:
        description: Unique local request identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: avantiqo-local-runpod-secret-sync-${{ inputs.request_nonce }}
  cancel-in-progress: true

jobs:
  export-encrypted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
      REQUEST_NONCE: ${{ inputs.request_nonce }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_IMAGE_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_IMAGE_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY }}
      RUNPOD_AVANTIQO_IMAGE_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_IMAGE_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_INTELLIGENCE_TRAINER_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_TRAINER_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_INTELLIGENCE_CANDIDATE_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_INTELLIGENCE_CANDIDATE_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_CODE_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_CODE_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_VOICE_STT_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_VOICE_STT_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_VOICE_TTS_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_VOICE_TTS_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID }}
      RUNPOD_AVANTIQO_LIPSYNC_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_LIPSYNC_ENDPOINT_ID }}

    steps:
      - name: Build encrypted local-only RunPod bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local-runpod-secret-sync
          node --input-type=module <<'NODE'
          import {
            constants,
            createCipheriv,
            createPublicKey,
            publicEncrypt,
            randomBytes,
          } from "node:crypto";
          import { writeFileSync } from "node:fs";

          const text = (value) => String(value ?? "").trim();
          const nonce = text(process.env.REQUEST_NONCE);
          if (!/^[A-Za-z0-9._-]{8,96}$/.test(nonce)) {
            throw new Error("LOCAL_RUNPOD_SECRET_SYNC_NONCE_INVALID");
          }

          const allowedNames = [
            "RUNPOD_API_KEY",
            "RUNPOD_MANAGEMENT_API_KEY",
            "RUNPOD_AVANTIQO_IMAGE_API_KEY",
            "RUNPOD_AVANTIQO_VIDEO_API_KEY",
            "RUNPOD_AVANTIQO_IMAGE_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_INTELLIGENCE_TRAINER_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_INTELLIGENCE_CANDIDATE_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_CODE_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_VOICE_STT_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_VOICE_TTS_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID",
            "RUNPOD_AVANTIQO_LIPSYNC_ENDPOINT_ID",
          ];

          const values = Object.fromEntries(
            allowedNames
              .map((name) => [name, text(process.env[name])])
              .filter(([, value]) => Boolean(value)),
          );

          if (!values.RUNPOD_API_KEY) {
            throw new Error("RUNPOD_API_KEY_GITHUB_SECRET_REQUIRED");
          }

          const endpointSpecs = [
            ["RUNPOD_AVANTIQO_IMAGE_ENDPOINT_ID", ["avantiqo-image-v1"]],
            ["RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID", ["avantiqo-cinema-v1"]],
            ["RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID", ["avantiqo-intelligence-v1"]],
            ["RUNPOD_AVANTIQO_INTELLIGENCE_TRAINER_ENDPOINT_ID", ["avantiqo-intelligence-trainer-v1"]],
            ["RUNPOD_AVANTIQO_INTELLIGENCE_CANDIDATE_ENDPOINT_ID", ["avantiqo-intelligence-candidate-v1"]],
            ["RUNPOD_AVANTIQO_CODE_ENDPOINT_ID", ["avantiqo-code-v1"]],
            ["RUNPOD_AVANTIQO_VOICE_STT_ENDPOINT_ID", ["avantiqo-voice-stt-v1"]],
            ["RUNPOD_AVANTIQO_VOICE_TTS_ENDPOINT_ID", ["avantiqo-voice-tts-v1", "services/avantiqo-voice-tts-v1"]],
            ["RUNPOD_AVANTIQO_AUDIO_ENDPOINT_ID", ["avantiqo-audio-v1"]],
            ["RUNPOD_AVANTIQO_LIPSYNC_ENDPOINT_ID", ["avantiqo-lipsync-v1", "avantiqo-lipsync-v1."]],
          ];

          const managementKey = values.RUNPOD_MANAGEMENT_API_KEY || values.RUNPOD_API_KEY;
          let discoveryStatus = "NOT_NEEDED";
          const needsDiscovery = endpointSpecs.some(([envName]) => !values[envName]);
          if (needsDiscovery && managementKey) {
            discoveryStatus = "UNAVAILABLE";
            try {
              const response = await fetch(
                "https://rest.runpod.io/v1/endpoints?includeTemplate=false&includeWorkers=false",
                {
                  headers: {
                    Authorization: `Bearer ${managementKey}`,
                    Accept: "application/json",
                  },
                  signal: AbortSignal.timeout(30_000),
                },
              );
              const body = response.ok ? await response.json() : null;
              if (Array.isArray(body)) {
                for (const [envName, acceptedNames] of endpointSpecs) {
                  if (values[envName]) continue;
                  const matches = body.filter((endpoint) => acceptedNames.includes(text(endpoint?.name)));
                  if (matches.length === 1 && text(matches[0]?.id)) {
                    values[envName] = text(matches[0].id);
                  }
                }
                discoveryStatus = "COMPLETE";
              }
            } catch {
              discoveryStatus = "UNAVAILABLE";
            }
          }

          if (!values.RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID) {
            throw new Error("RUNPOD_AVANTIQO_INTELLIGENCE_ENDPOINT_ID_REQUIRED");
          }

          const publicKeyPem = Buffer.from(text(process.env.PUBLIC_KEY_B64), "base64").toString("utf8");
          const publicKey = createPublicKey(publicKeyPem);
          const aesKey = randomBytes(32);
          const iv = randomBytes(12);
          const cipher = createCipheriv("aes-256-gcm", aesKey, iv);
          const plaintext = Buffer.from(JSON.stringify({
            contract: "AVANTIQO_LOCAL_RUNPOD_SECRET_VALUES_V1",
            request_nonce: nonce,
            values,
          }), "utf8");
          const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
          const authTag = cipher.getAuthTag();
          const encryptedKey = publicEncrypt(
            {
              key: publicKey,
              padding: constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: "sha256",
            },
            aesKey,
          );

          const output = {
            contract: "AVANTIQO_LOCAL_RUNPOD_SECRET_ENVELOPE_V1",
            request_nonce: nonce,
            algorithm: "RSA-OAEP-SHA256+A256GCM",
            encrypted_key_b64: encryptedKey.toString("base64"),
            iv_b64: iv.toString("base64"),
            auth_tag_b64: authTag.toString("base64"),
            ciphertext_b64: ciphertext.toString("base64"),
            configured_key_count: Object.keys(values).length,
            endpoint_discovery_status: discoveryStatus,
            plaintext_secret_artifact_written: false,
          };

          writeFileSync(
            `artifacts/local-runpod-secret-sync/${nonce}.json`,
            `${JSON.stringify(output)}\n`,
            { mode: 0o600 },
          );
          console.log(`AVANTIQO_LOCAL_RUNPOD_SECRET_SYNC_CONFIGURED_COUNT=${output.configured_key_count}`);
          console.log(`AVANTIQO_LOCAL_RUNPOD_SECRET_SYNC_ENDPOINT_DISCOVERY=${discoveryStatus}`);
          console.log("AVANTIQO_LOCAL_RUNPOD_SECRET_SYNC_PLAINTEXT_ARTIFACT=false");
          console.log("AVANTIQO_LOCAL_RUNPOD_SECRET_SYNC_SECRET_VALUES_PRINTED=false");
          NODE

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-local-runpod-secrets-${{ inputs.request_nonce }}
          path: artifacts/local-runpod-secret-sync/${{ inputs.request_nonce }}.json
          if-no-files-found: error
          retention-days: 1
