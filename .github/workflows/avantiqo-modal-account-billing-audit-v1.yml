name: Avantiqo Modal Account Billing Audit V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-modal-account-billing-audit-v1.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || { echo "MODAL_TOKEN_ID=MISSING"; exit 1; }
          test -n "${MODAL_TOKEN_SECRET:-}" || { echo "MODAL_TOKEN_SECRET=MISSING"; exit 1; }
          echo "MODAL_TOKEN_ID=PRESENT"
          echo "MODAL_TOKEN_SECRET=PRESENT"
          echo "SECRET_VALUES_PRINTED=false"

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'modal==1.5.5'
          modal --version

      - name: Read authenticated workspace and billing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import modal

          workspace = modal.Workspace.from_context()
          name = workspace.name
          if callable(name):
              name = name()
          members = workspace.members.list()
          print(json.dumps({
              "contract": "AVANTIQO_MODAL_ACCOUNT_BILLING_AUDIT_V1",
              "workspace_authenticated": True,
              "workspace_name": str(name),
              "workspace_member_count": len(members),
              "credentials_printed": False,
              "gpu_inference_performed": False,
              "modal_function_invoked": False,
              "deployment_performed": False,
              "runpod_mutation_performed": False,
              "production_vercel_deploy_performed": False,
          }, sort_keys=True))
          PY

          echo 'AVANTIQO_MODAL_BILLING_SUMMARY_JSON_START'
          modal billing summary --for 'this month' --json
          echo 'AVANTIQO_MODAL_BILLING_SUMMARY_JSON_END'

          echo 'AVANTIQO_MODAL_BILLING_REPORT_JSON_START'
          modal billing report --for 'this month' --show-resources --json
          echo 'AVANTIQO_MODAL_BILLING_REPORT_JSON_END'

          echo 'AVANTIQO_MODAL_ACCOUNT_BILLING_AUDIT_V1=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'
          echo 'MODAL_FUNCTION_INVOKED=false'
          echo 'DEPLOYMENT_PERFORMED=false'
          echo 'RUNPOD_MUTATION_PERFORMED=false'
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
