name: Avantiqo Music Transform Candidate Provision

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-music-transform-candidate-provision-request.json

permissions:
  contents: write

concurrency:
  group: avantiqo-music-transform-candidate-provision
  cancel-in-progress: false

jobs:
  provision-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY || secrets.RUNPOD_API_KEY }}
      REQUEST_PATH: audits/avantiqo-music-transform-candidate-provision-request.json
      IMAGE_EVIDENCE_PATH: audits/results/avantiqo-audio-worker-image.json
      PROVISION_OUTPUT: artifacts/avantiqo-music-transform-candidate-provision.json
      PREFLIGHT_OUTPUT: artifacts/avantiqo-music-transform-candidate-preflight.json
      RESULT_OUTPUT: audits/results/avantiqo-music-transform-candidate-provision.json
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate management-only credential scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_MANAGEMENT_API_KEY:-}" ]; then
            echo "RUNPOD_MANAGEMENT_API_KEY_REQUIRED" >&2
            exit 1
          fi
          if [ -n "${RUNPOD_API_KEY:-}" ] || [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_INFERENCE_OR_STORAGE_CREDENTIAL_FORBIDDEN" >&2
            exit 1
          fi
          echo "AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_MANAGEMENT_ONLY=true"
          echo "AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVIDER_JOB_CAPABLE=false"

      - name: Validate request and immutable image evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'));
          const evidence = JSON.parse(fs.readFileSync(process.env.IMAGE_EVIDENCE_PATH, 'utf8'));
          const fail = (code) => { throw new Error(code); };
          if (request?.contract !== 'AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_V1') fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_INVALID');
          if (request?.apply_approved !== true) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_APPROVAL_REQUIRED');
          if (request?.provider_job_submitted !== false) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_PROVIDER_JOB_MUST_BE_FALSE');
          if (request?.production_audio_endpoint_mutation_allowed !== false) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_PRODUCTION_MUTATION_MUST_BE_FALSE');
          if (request?.workers_min !== 0 || request?.workers_max !== 0) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_MUST_PARK_0_0');
          if (request?.endpoint_name !== 'avantiqo-music-transform-candidate-v1') fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_ENDPOINT_INVALID');
          if (request?.safe_lease_lane !== 'music-transform-candidate') fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_LANE_INVALID');
          if (request?.expected_image_source_sha !== evidence?.source_sha) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_SOURCE_SHA_MISMATCH');
          if (request?.expected_image_digest !== evidence?.image_digest) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_DIGEST_MISMATCH');
          if (evidence?.success !== true || evidence?.source_sha_matches_trigger !== true) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_IMAGE_EVIDENCE_INVALID');
          if (evidence?.provider_job_submitted !== false || evidence?.production_web_deploy !== false || evidence?.pricing_activation_performed !== false) fail('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_IMAGE_EVIDENCE_SAFETY_INVALID');
          console.log('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_REQUEST_VERIFIED=true');
          console.log(`AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_IMAGE_SOURCE_SHA=${evidence.source_sha}`);
          console.log(`AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_IMAGE_DIGEST=${evidence.image_digest}`);
          NODE

      - name: Validate candidate scripts and release isolation
        run: |
          node --check scripts/provision-avantiqo-music-transform-candidate-runpod-local.mjs
          node --check scripts/preflight-avantiqo-music-transform-candidate-local.mjs
          node scripts/music-transform-candidate-release-audit.mjs

      - name: Plan parked candidate without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/provision-avantiqo-music-transform-candidate-runpod-local.mjs > artifacts/avantiqo-music-transform-candidate-plan.json
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('artifacts/avantiqo-music-transform-candidate-plan.json', 'utf8'));
          if (plan?.success !== true) throw new Error('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PLAN_FAILED');
          if (plan?.provider_job_submitted !== false || plan?.workers_opened !== false || plan?.production_audio_endpoint_mutation_performed !== false) {
            throw new Error('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PLAN_SAFETY_INVALID');
          }
          console.log(`AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PLAN_ENDPOINT_EXISTS=${plan.endpoint_exists === true}`);
          NODE

      - name: Create or verify parked candidate
        shell: bash
        env:
          AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_APPROVED: "YES"
        run: |
          set -euo pipefail
          node scripts/provision-avantiqo-music-transform-candidate-runpod-local.mjs --apply > "$PROVISION_OUTPUT"
          CANDIDATE_ID=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.PROVISION_OUTPUT,'utf8'));const id=String(x?.endpoint?.id||'').trim();if(!id)process.exit(2);process.stdout.write(id)")
          echo "RUNPOD_AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_ENDPOINT_ID=$CANDIDATE_ID" >> "$GITHUB_ENV"
          echo "AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_ENDPOINT_ID_RESOLVED=true"

      - name: Run zero-spend candidate preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preflight-avantiqo-music-transform-candidate-local.mjs > "$PREFLIGHT_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.PREFLIGHT_OUTPUT, 'utf8'));
          if (report?.success !== true || report?.ready_for_safe_lease_certification !== true) throw new Error('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PREFLIGHT_NOT_READY');
          if (report?.provider_job_submitted !== false || report?.workers_opened !== false || report?.endpoint_mutation_performed !== false) {
            throw new Error('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PREFLIGHT_SAFETY_INVALID');
          }
          if (report?.endpoint?.workers_min !== 0 || report?.endpoint?.workers_max !== 0) throw new Error('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PREFLIGHT_NOT_PARKED_0_0');
          console.log('AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PREFLIGHT=PASS');
          NODE

      - name: Record sanitized PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/results
          node <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'));
          const evidence = JSON.parse(fs.readFileSync(process.env.IMAGE_EVIDENCE_PATH, 'utf8'));
          const provision = JSON.parse(fs.readFileSync(process.env.PROVISION_OUTPUT, 'utf8'));
          const preflight = JSON.parse(fs.readFileSync(process.env.PREFLIGHT_OUTPUT, 'utf8'));
          const result = {
            success: true,
            contract: 'AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_RESULT_V1',
            github_run_id: process.env.GITHUB_RUN_ID,
            request_contract: request.contract,
            endpoint: preflight.endpoint,
            immutable_image_reference: evidence.immutable_image_reference,
            image_source_sha: evidence.source_sha,
            image_digest: evidence.image_digest,
            provision_mode: provision.mode,
            endpoint_created: provision.endpoint_created === true,
            endpoint_mutation_performed: provision.mutation_performed === true,
            candidate_resting_workers_min: 0,
            candidate_resting_workers_max: 0,
            shared_audio_voice_cache_verified: preflight.shared_audio_voice_cache_verified === true,
            safe_lease_lane: preflight.certification_safe_lease_lane,
            ready_for_safe_lease_certification: preflight.ready_for_safe_lease_certification === true,
            production_audio_endpoint_mutation_allowed: false,
            production_audio_endpoint_mutation_performed: false,
            provider_job_submitted: false,
            runpod_inference_credential_present: false,
            supabase_storage_credentials_present: false,
            workers_opened: false,
            production_deploy_performed: false,
            pricing_activation_performed: false,
            secrets_in_output: false
          };
          fs.writeFileSync(process.env.RESULT_OUTPUT, JSON.stringify(result, null, 2) + '\n');
          NODE

      - name: Publish sanitized evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-music-transform-candidate-provision-${{ github.run_id }}
          path: |
            artifacts/avantiqo-music-transform-candidate-plan.json
            artifacts/avantiqo-music-transform-candidate-provision.json
            artifacts/avantiqo-music-transform-candidate-preflight.json
            audits/results/avantiqo-music-transform-candidate-provision.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record sanitized failure shell if needed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/results
          if [ ! -f "$RESULT_OUTPUT" ]; then
            printf '{"success":false,"contract":"AVANTIQO_MUSIC_TRANSFORM_CANDIDATE_PROVISION_RESULT_V1","github_run_id":"%s","error":"WORKFLOW_STEP_FAILED_REVIEW_LOGS","mutation_state":"UNKNOWN_REVIEW_REQUIRED","provider_job_submitted":false,"runpod_inference_credential_present":false,"supabase_storage_credentials_present":false,"production_deploy_performed":false,"pricing_activation_performed":false,"secrets_in_output":false}\n' "$GITHUB_RUN_ID" > "$RESULT_OUTPUT"
          fi

      - name: Commit sanitized result to newest main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT_OUTPUT" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_OUTPUT"
          if git diff --cached --quiet; then
            echo "No result change to commit."
            exit 0
          fi
          git commit -m "Record Music transform candidate provision result"
          git pull --rebase origin main
          git push origin HEAD:main
