name: Avantiqo Business Partner CPU Front Two Turn E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Certification mode. Preflight performs no model inference."
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute
      approve_real_inference:
        description: "Required for execute: approve exactly two real owned CPU-front Business Partner turns."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avantiqo-business-partner-cpu-front-two-turn-e2e
  cancel-in-progress: false

jobs:
  prove-business-partner-cpu-front:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      NODE_ENV: development
      AVANTIQO_INTELLIGENCE_ENGINE_ENABLED: "YES"
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Static CPU-front contract preflight
        run: |
          set -euo pipefail
          node --check scripts/run-avantiqo-operator-cpu-two-turn-e2e-local.mjs
          node --check lib/operator/runtime/OperatorFrontCognitionRuntime.js
          node --check lib/operator/runtime/OperatorHumanBusinessPartnerUnderstandingRuntime.js
          node --check lib/operator/runtime/OperatorFastConversationRuntime.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceModalDirectRuntime.js
          python -m py_compile services/avantiqo-intelligence-modal/modal_front_app.py
          grep -Fq 'Qwen/Qwen3-4B-GGUF:Q4_K_M' services/avantiqo-intelligence-modal/modal_front_app.py
          grep -Fq 'AVANTIQO_INTELLIGENCE_FRONT_CPU_WARM_V2' services/avantiqo-intelligence-modal/modal_front_app.py
          grep -Fq 'mutation_authority": False' services/avantiqo-intelligence-modal/modal_front_app.py
          grep -Fq 'tools_allowed": False' services/avantiqo-intelligence-modal/modal_front_app.py
          grep -Fq 'execution_lane === '\''front'\''' scripts/run-avantiqo-operator-cpu-two-turn-e2e-local.mjs
          grep -Fq 'GPU_ESCALATION_FORBIDDEN' scripts/run-avantiqo-operator-cpu-two-turn-e2e-local.mjs
          stale_gpu='H''100'
          stale_model='Qwen3-''30B'
          if grep -q "${stale_gpu}\|${stale_model}" .github/workflows/avantiqo-operator-two-turn-e2e.yml; then
            echo "AVANTIQO_BUSINESS_PARTNER_CPU_E2E_GPU_CONTRADICTION=true"
            exit 1
          fi
          if grep -q '^  push:' .github/workflows/avantiqo-operator-two-turn-e2e.yml; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_AUTOMATIC_TRIGGER=true"
            exit 1
          fi
          echo "AVANTIQO_BUSINESS_PARTNER_CPU_FRONT_STATIC_PREFLIGHT=PASS"
          echo "GPU_INFERENCE_PERFORMED=false"

      - name: Explicit real-inference approval gate
        if: ${{ inputs.mode == 'execute' }}
        env:
          DISPATCH_APPROVED: ${{ inputs.approve_real_inference }}
        run: |
          set -euo pipefail
          if [ "${DISPATCH_APPROVED}" != "true" ]; then
            echo "AVANTIQO_BUSINESS_PARTNER_CPU_E2E_REAL_INFERENCE_APPROVAL_REQUIRED=true"
            exit 1
          fi
          echo "AVANTIQO_BUSINESS_PARTNER_CPU_E2E_REAL_INFERENCE_APPROVED=true"

      - name: Install pinned Modal SDK for execute mode
        if: ${{ inputs.mode == 'execute' }}
        run: python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'

      - name: Prove CPU front is deployed and idle
        if: ${{ inputs.mode == 'execute' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          python - <<'PY'
          import modal
          cls = modal.Cls.from_name("avantiqo-intelligence-front-owned", "FrontConversation")
          stats = cls.get_current_stats()
          backlog = int(getattr(stats, "backlog", 0) or 0)
          runners = int(getattr(stats, "num_total_runners", 0) or 0)
          if backlog != 0:
              raise RuntimeError(f"AVANTIQO_FRONT_BACKLOG_NOT_ZERO:{backlog}")
          if runners > 2:
              raise RuntimeError(f"AVANTIQO_FRONT_RUNNER_LIMIT_INVALID:{runners}")
          print(f"AVANTIQO_FRONT_CPU_PREFLIGHT=PASS backlog={backlog} runners={runners}")
          print("GPU_INFERENCE_PERFORMED=false")
          PY

      - name: Run owned CPU-front Business Partner certification
        if: ${{ inputs.mode == 'execute' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-operator-cpu-two-turn-e2e-local.mjs

      - name: Immutable release boundary
        if: always()
        run: |
          echo "EXTERNAL_AI_FALLBACK_USED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
          echo "THIS_WORKFLOW_DOES_NOT_RELEASE_PRODUCTION=true"
