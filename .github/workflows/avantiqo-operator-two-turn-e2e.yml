name: Avantiqo Business Partner Two Turn E2E

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: "Certification mode. Preflight performs no model inference."
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute
      approve_real_inference:
        description: "Required for execute: approve exactly two real owned Intelligence turns on Modal H100."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avantiqo-business-partner-two-turn-e2e
  cancel-in-progress: false

jobs:
  prove-business-partner:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == 'AVANTIQO_INTELLIGENCE_MODAL_EXECUTE_20260902' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      NODE_ENV: development
      AVANTIQO_INTELLIGENCE_ENGINE_ENABLED: "YES"
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static Modal contract preflight
        run: |
          set -euo pipefail
          node --check scripts/run-avantiqo-operator-two-turn-e2e-local.mjs
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceModalDirectRuntime.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          grep -q 'MODAL_H100_ASYNC_V1' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          grep -q 'safe_lease_required_for_inference: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          stale_prefix="RUN""POD_"
          if grep -q "${stale_prefix}" .github/workflows/avantiqo-operator-two-turn-e2e.yml; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_STALE_LEGACY_PROVIDER_REFERENCE=true"
            exit 1
          fi
          if grep -q '^  push:' .github/workflows/avantiqo-operator-two-turn-e2e.yml; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_AUTOMATIC_PAID_TRIGGER=true"
            exit 1
          fi
          echo "AVANTIQO_BUSINESS_PARTNER_E2E_MODAL_STATIC_PREFLIGHT=PASS"
          echo "GPU_INFERENCE_PERFORMED=false"

      - name: Explicit real-inference approval gate
        if: ${{ inputs.mode == 'execute' || github.event.issue.title == 'AVANTIQO_INTELLIGENCE_MODAL_EXECUTE_20260902' }}
        env:
          DISPATCH_APPROVED: ${{ inputs.approve_real_inference }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [ "${ISSUE_TITLE}" = "AVANTIQO_INTELLIGENCE_MODAL_EXECUTE_20260902" ]; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_ONE_TIME_EXECUTE_APPROVED=true"
          elif [ "${DISPATCH_APPROVED}" = "true" ]; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_REAL_INFERENCE_APPROVED=true"
          else
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_REAL_INFERENCE_APPROVAL_REQUIRED=true"
            exit 1
          fi

      - name: Run governed Modal Business Partner certification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_APPROVED: ${{ inputs.approve_real_inference }}
        run: |
          set -euo pipefail
          if [ "${ISSUE_TITLE}" = "AVANTIQO_INTELLIGENCE_MODAL_EXECUTE_20260902" ]; then
            AVANTIQO_OPERATOR_MODAL_E2E_REAL_INFERENCE_APPROVED=YES node scripts/run-avantiqo-operator-two-turn-e2e-local.mjs --execute
          elif [ "${DISPATCH_MODE}" = "execute" ]; then
            AVANTIQO_OPERATOR_MODAL_E2E_REAL_INFERENCE_APPROVED="${DISPATCH_APPROVED}" node scripts/run-avantiqo-operator-two-turn-e2e-local.mjs --execute
          else
            node scripts/run-avantiqo-operator-two-turn-e2e-local.mjs
          fi

      - name: Immutable release boundary
        if: always()
        run: |
          echo "EXTERNAL_AI_FALLBACK_USED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
          echo "THIS_WORKFLOW_DOES_NOT_RELEASE_PRODUCTION=true"
