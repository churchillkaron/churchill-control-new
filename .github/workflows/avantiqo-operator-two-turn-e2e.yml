name: Avantiqo Business Partner Fast Two Turn E2E

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: "Certification mode. Preflight performs no model inference."
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute
      approve_real_inference:
        description: "Required for execute: approve exactly two real owned Fast Intelligence turns on Modal H100."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avantiqo-business-partner-fast-two-turn-e2e
  cancel-in-progress: false

jobs:
  prove-business-partner-fast:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == 'AVANTIQO_INTELLIGENCE_MODAL_FAST_EXECUTE_20260902' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      NODE_ENV: development
      AVANTIQO_INTELLIGENCE_ENGINE_ENABLED: "YES"
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Static Fast Modal contract preflight
        run: |
          set -euo pipefail
          node --check scripts/run-avantiqo-operator-fast-two-turn-e2e-local.mjs
          node --check lib/operator/runtime/OperatorOwnedCognitiveBriefPolicy.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceModalDirectRuntime.js
          node --check lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          python -m py_compile services/avantiqo-intelligence-modal/modal_app.py
          python -m py_compile services/avantiqo-intelligence-modal/deploy_app.py
          grep -q 'MODAL_H100_ASYNC_V1' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          grep -q 'safe_lease_required_for_inference: false' lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceProvider.js
          grep -Fq 'FAST_SCALEDOWN_WINDOW_SECONDS = 10 * 60' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq '"enforce_eager": False' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq '"safetensors_load_strategy": "prefetch"' services/avantiqo-intelligence-modal/modal_app.py
          grep -Fq 'WARM_LATENCY_LIMIT_MS = 4000' scripts/run-avantiqo-operator-fast-two-turn-e2e-local.mjs
          grep -Fq 'UNEXPECTED_DEEP_COGNITIVE_BRIEF' scripts/run-avantiqo-operator-fast-two-turn-e2e-local.mjs
          stale_prefix="RUN""POD_"
          if grep -q "${stale_prefix}" .github/workflows/avantiqo-operator-two-turn-e2e.yml; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_STALE_LEGACY_PROVIDER_REFERENCE=true"
            exit 1
          fi
          if grep -q '^  push:' .github/workflows/avantiqo-operator-two-turn-e2e.yml; then
            echo "AVANTIQO_BUSINESS_PARTNER_E2E_AUTOMATIC_PAID_TRIGGER=true"
            exit 1
          fi
          echo "AVANTIQO_BUSINESS_PARTNER_FAST_E2E_STATIC_PREFLIGHT=PASS"
          echo "GPU_INFERENCE_PERFORMED=false"

      - name: Install pinned Modal SDK for live revision gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'

      - name: Prove deployed Modal revision before any H100 inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          expected_fingerprint="$(sha256sum services/avantiqo-intelligence-modal/modal_app.py | awk '{print $1}')"
          export AVANTIQO_INTELLIGENCE_EXPECTED_SOURCE_FINGERPRINT="${expected_fingerprint}"
          python - <<'PY'
          import os
          import modal

          app_name = "avantiqo-intelligence-owned"
          expected = os.environ["AVANTIQO_INTELLIGENCE_EXPECTED_SOURCE_FINGERPRINT"]
          probe_name = f"runtime_probe_{expected[:16]}"
          reports = []
          for function_name in (probe_name, "fast", "deep"):
              fn = modal.Function.from_name(app_name, function_name)
              stats = fn.get_current_stats()
              backlog = int(getattr(stats, "backlog", 0) or 0)
              runners = int(getattr(stats, "num_total_runners", 0) or 0)
              if backlog != 0:
                  raise RuntimeError(
                      f"AVANTIQO_INTELLIGENCE_MODAL_BACKLOG_BEFORE_CERT:{function_name}:{backlog}"
                  )
              if runners > 1:
                  raise RuntimeError(
                      f"AVANTIQO_INTELLIGENCE_MODAL_RUNNER_LIMIT_INVALID:{function_name}:{runners}"
                  )
              reports.append((function_name, backlog, runners))
          print(
              "AVANTIQO_INTELLIGENCE_MODAL_DEPLOYED_REVISION_GATE=PASS "
              f"probe={probe_name} fingerprint={expected}"
          )
          print(f"AVANTIQO_INTELLIGENCE_MODAL_PREFLIGHT_STATS={reports}")
          print("REMOTE_PROBE_EXECUTION_PERFORMED=false")
          print("GPU_INFERENCE_PERFORMED=false")
          PY

      - name: Explicit real-inference approval gate
        if: ${{ inputs.mode == 'execute' || github.event.issue.title == 'AVANTIQO_INTELLIGENCE_MODAL_FAST_EXECUTE_20260902' }}
        env:
          DISPATCH_APPROVED: ${{ inputs.approve_real_inference }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [ "${ISSUE_TITLE}" = "AVANTIQO_INTELLIGENCE_MODAL_FAST_EXECUTE_20260902" ]; then
            echo "AVANTIQO_BUSINESS_PARTNER_FAST_E2E_ONE_TIME_EXECUTE_APPROVED=true"
          elif [ "${DISPATCH_APPROVED}" = "true" ]; then
            echo "AVANTIQO_BUSINESS_PARTNER_FAST_E2E_REAL_INFERENCE_APPROVED=true"
          else
            echo "AVANTIQO_BUSINESS_PARTNER_FAST_E2E_REAL_INFERENCE_APPROVAL_REQUIRED=true"
            exit 1
          fi

      - name: Run governed Modal Fast Business Partner certification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_APPROVED: ${{ inputs.approve_real_inference }}
        run: |
          set -euo pipefail
          run_fast_cert() {
            if [ "${ISSUE_TITLE}" = "AVANTIQO_INTELLIGENCE_MODAL_FAST_EXECUTE_20260902" ]; then
              AVANTIQO_OPERATOR_MODAL_E2E_REAL_INFERENCE_APPROVED=YES node scripts/run-avantiqo-operator-fast-two-turn-e2e-local.mjs --execute
            elif [ "${DISPATCH_MODE}" = "execute" ]; then
              AVANTIQO_OPERATOR_MODAL_E2E_REAL_INFERENCE_APPROVED="${DISPATCH_APPROVED}" node scripts/run-avantiqo-operator-fast-two-turn-e2e-local.mjs --execute
            else
              node scripts/run-avantiqo-operator-fast-two-turn-e2e-local.mjs
            fi
          }

          set +e
          timeout --signal=TERM --kill-after=5s 125s bash -c "$(declare -f run_fast_cert); run_fast_cert"
          cert_status=$?
          set -e

          if [ "${cert_status}" -eq 124 ] || [ "${cert_status}" -eq 137 ]; then
            echo "AVANTIQO_BUSINESS_PARTNER_FAST_E2E_COLD_DEADLINE_EXCEEDED=true"
            echo "AVANTIQO_BUSINESS_PARTNER_FAST_E2E_COLD_DEADLINE_MS=125000"
            python - <<'PY'
          import modal
          reports = []
          for function_name in ("fast", "deep"):
              fn = modal.Function.from_name("avantiqo-intelligence-owned", function_name)
              stats = fn.get_current_stats()
              reports.append((
                  function_name,
                  int(getattr(stats, "backlog", 0) or 0),
                  int(getattr(stats, "num_total_runners", 0) or 0),
              ))
          print(f"AVANTIQO_INTELLIGENCE_MODAL_TIMEOUT_STATS={reports}")
          PY
            exit "${cert_status}"
          fi

          exit "${cert_status}"

      - name: Immutable release boundary
        if: always()
        run: |
          echo "EXTERNAL_AI_FALLBACK_USED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
          echo "THIS_WORKFLOW_DOES_NOT_RELEASE_PRODUCTION=true"
