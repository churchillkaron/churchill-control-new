name: Avantiqo Released Knowledge Authenticity Wiring

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-released-knowledge-authenticity.mjs"
      - ".github/workflows/avantiqo-released-knowledge-authenticity-wiring.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avantiqo-released-knowledge-authenticity-wiring
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact authenticity wiring patch
        run: node scripts/patch-released-knowledge-authenticity.mjs
      - name: Syntax gate
        run: |
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeAuthenticityRuntime.js
          node --check lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js
          node --check lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js
          node --check lib/intelligence/runtime/AvantiqoReleasedKnowledgeLifecycleRuntime.js
      - name: Commit exact wired sources
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/intelligence/runtime/AvantiqoFinalKnowledgeReleaseRuntime.js lib/intelligence/runtime/AvantiqoHybridKnowledgeRetrievalRuntime.js
          git commit -m "feat(intelligence): enforce released knowledge authenticity"
          git push origin HEAD:main
# Triggered after registration on main.
