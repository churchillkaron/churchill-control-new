name: Avantiqo RunPod Emergency All Stop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avantiqo-runpod-emergency-all-stop.yml

permissions:
  contents: write

concurrency:
  group: avantiqo-runpod-emergency-all-stop
  cancel-in-progress: false

jobs:
  emergency-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AVANTIQO_RUNPOD_EMERGENCY_STOP_ALL_APPROVED: "YES"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate RunPod management credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_MANAGEMENT_API_KEY:-}" || { echo "RUNPOD_MANAGEMENT_API_KEY missing"; exit 1; }

      - name: Emergency stop all RunPod Serverless work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/emergency-stop-all-runpod-serverless-local.mjs \
            > artifacts/avantiqo-runpod-emergency-all-stop.log 2>&1 || status=$?
          cat artifacts/avantiqo-runpod-emergency-all-stop.log
          status=${status:-0}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Publish stop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-runpod-emergency-all-stop-${{ github.run_id }}
          path: artifacts/avantiqo-runpod-emergency-all-stop.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit sanitized stop evidence to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/results
          if [ -f artifacts/avantiqo-runpod-emergency-all-stop.log ]; then
            cp artifacts/avantiqo-runpod-emergency-all-stop.log audits/results/avantiqo-runpod-emergency-all-stop.log
          else
            printf 'AVANTIQO_RUNPOD_EMERGENCY_ALL_STOP_V1=NO_OUTPUT\n' > audits/results/avantiqo-runpod-emergency-all-stop.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-runpod-emergency-all-stop.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record RunPod emergency all-stop result"
          git pull --rebase origin main
          git push origin HEAD:main
