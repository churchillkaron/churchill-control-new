name: Avantiqo Secretary Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avantiqo-secretary-certification.yml
      - audits/avantiqo-secretary-certification-request.json

permissions:
  contents: read

concurrency:
  group: avantiqo-secretary-certification
  cancel-in-progress: false

jobs:
  certify-secretary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify isolated local prerequisites
        run: |
          node --version
          supabase --version
          docker --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"

      - name: Run full Secretary local certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/run-operator-secretary-meeting-local-certification.sh 2>&1 | tee artifacts/secretary-local-certification.log

      - name: Verify Secretary certification markers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          LOG="artifacts/secretary-local-certification.log"
          grep -Fx "OPERATOR_SECRETARY_HUMAN_ROLE_SOURCE_AUDIT=PASS" "$LOG"
          grep -Fx "SECRETARY_HUMAN_ROLE_COVERAGE_MATRIX=PASS" "$LOG"
          grep -Fx "SECRETARY_OFFICE_ARTIFACT_PREPARATION_LOCAL_CERTIFICATION=PASS" "$LOG"
          grep -Fx "SECRETARY_MEETING_LOCAL_CERTIFICATION_WRAPPER=PASS" "$LOG"
          grep -Fx "SECRETARY_MEETING_LOCAL_SUPABASE_WORKDIR_ISOLATED=true" "$LOG"
          grep -Fx "SECRETARY_MEETING_LOCAL_MIGRATION_SCOPE=SECRETARY_ONLY" "$LOG"
          grep -Fx "SECRETARY_MEETING_ROOT_ENV_LOCAL_MUTATED=false" "$LOG"
          grep -Fx "SECRETARY_PRODUCTION_DEPLOY_PERFORMED=false" "$LOG"
          echo "AVANTIQO_SECRETARY_GITHUB_CERTIFICATION=PASS"

      - name: Upload Secretary certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-secretary-certification-${{ github.run_id }}
          path: artifacts/secretary-local-certification.log
          if-no-files-found: warn
          retention-days: 14
