name: Avantiqo Video Confirmed Pod Termination Repair

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-video-confirmed-pod-termination-repair-request.json

permissions:
  contents: write

concurrency:
  group: avantiqo-video-confirmed-pod-termination-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch all Video Pod delete paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B video-confirmed-pod-termination-repair origin/main

          python - <<'PY'
          from pathlib import Path

          normal = Path('lib/platform/service-runtime/providers/avantiqo-video/AvantiqoVideoPodRuntime.js')
          flash = Path('lib/platform/service-runtime/providers/avantiqo-video/AvantiqoVideoFlashVsrPodRuntime.js')

          def once(path, old, new):
              body = path.read_text()
              if old not in body:
                  raise SystemExit(f'missing patch target in {path}: {old[:100]}')
              path.write_text(body.replace(old, new, 1))

          once(normal,
            '    if (podId) await deleteVideoPod(podId).catch(() => null);\n    await releaseVideoPodLease({ leaseId: lease.id, ownerRequestId: owner, state: "FAILED", reason: text(error.message).split(":")[0] }).catch(() => null);',
            '    if (podId) { await deleteVideoPod(podId).catch(() => null); await confirmAvantiqoVideoPodTerminal(podId); }\n    await releaseVideoPodLease({ leaseId: lease.id, ownerRequestId: owner, state: "FAILED", reason: text(error.message).split(":")[0] }).catch(() => null);')
          once(normal,
            '  if (!pod || podTerminal(pod)) { if (pod) await deleteVideoPod(podId).catch(() => null); await releaseVideoPodLease({ leaseId, ownerRequestId: owner, state: "FAILED", reason: "VIDEO_POD_EXITED_WITHOUT_RECEIPT" }).catch(() => null); return { status: "failed", error: "AVANTIQO_VIDEO_POD_EXITED_WITHOUT_RECEIPT" }; }',
            '  if (!pod || podTerminal(pod)) { if (pod) { await deleteVideoPod(podId).catch(() => null); await confirmAvantiqoVideoPodTerminal(podId); } await releaseVideoPodLease({ leaseId, ownerRequestId: owner, state: "FAILED", reason: "VIDEO_POD_EXITED_WITHOUT_RECEIPT" }).catch(() => null); return { status: "failed", error: "AVANTIQO_VIDEO_POD_EXITED_WITHOUT_RECEIPT" }; }')
          once(normal,
            '    await deleteVideoPod(podId).catch(() => null); await releaseVideoPodLease({ leaseId, ownerRequestId: owner, state: "FAILED", reason: code }).catch(() => null);',
            '    await deleteVideoPod(podId).catch(() => null); await confirmAvantiqoVideoPodTerminal(podId); await releaseVideoPodLease({ leaseId, ownerRequestId: owner, state: "FAILED", reason: code }).catch(() => null);')
          once(normal,
            '  if (podJob?.pod_id) await deleteVideoPod(text(podJob.pod_id)).catch(() => null);\n  if (podJob?.lease_id && podJob?.lease_owner_request_id) await releaseVideoPodLease',
            '  if (podJob?.pod_id) { await deleteVideoPod(text(podJob.pod_id)).catch(() => null); await confirmAvantiqoVideoPodTerminal(text(podJob.pod_id)); }\n  if (podJob?.lease_id && podJob?.lease_owner_request_id) await releaseVideoPodLease')
          once(normal,
            '        if (pod?.id) await deleteVideoPod(text(pod.id)).catch(() => null);\n        await releaseVideoPodLease({ leaseId: lease.id, ownerRequestId: owner, state: saved.success ? "RELEASED" : "FAILED", reason: "VIDEO_POD_RECONCILED_RECEIPT" });',
            '        if (pod?.id) { await deleteVideoPod(text(pod.id)).catch(() => null); await confirmAvantiqoVideoPodTerminal(text(pod.id)); }\n        await releaseVideoPodLease({ leaseId: lease.id, ownerRequestId: owner, state: saved.success ? "RELEASED" : "FAILED", reason: "VIDEO_POD_RECONCILED_RECEIPT" });')
          once(normal,
            '        await deleteVideoPod(text(pod.id)).catch(() => null);\n        await releaseVideoPodLease({ leaseId: lease.id, ownerRequestId: owner, state: "FAILED", reason: age >= HARD_TIMEOUT ? "VIDEO_POD_RECONCILED_HARD_TIMEOUT" : "VIDEO_POD_RECONCILED_TERMINAL" });',
            '        await deleteVideoPod(text(pod.id)).catch(() => null);\n        await confirmAvantiqoVideoPodTerminal(text(pod.id));\n        await releaseVideoPodLease({ leaseId: lease.id, ownerRequestId: owner, state: "FAILED", reason: age >= HARD_TIMEOUT ? "VIDEO_POD_RECONCILED_HARD_TIMEOUT" : "VIDEO_POD_RECONCILED_TERMINAL" });')

          once(flash,
            '  if (gpu && gpu !== AVANTIQO_VIDEO_FLASHVSR_GPU_TYPE) {\n    await deleteVideoPod(id).catch(() => null);\n    throw new Error(`AVANTIQO_VIDEO_FLASHVSR_GPU_UNCERTIFIED:${gpu}`);\n  }',
            '  if (gpu && gpu !== AVANTIQO_VIDEO_FLASHVSR_GPU_TYPE) {\n    await deleteVideoPod(id).catch(() => null);\n    await confirmAvantiqoVideoPodTerminal(id);\n    throw new Error(`AVANTIQO_VIDEO_FLASHVSR_GPU_UNCERTIFIED:${gpu}`);\n  }')
          once(flash,
            '    if (podId) await deleteVideoPod(podId).catch(() => null);\n    if (lease) await releaseVideoPodLease',
            '    if (podId) { await deleteVideoPod(podId).catch(() => null); await confirmAvantiqoVideoPodTerminal(podId); }\n    if (lease) await releaseVideoPodLease')
          once(flash,
            '    await deleteVideoPod(podId).catch(() => null);\n    await releaseVideoPodLease({ leaseId, ownerRequestId: owner, state: "FAILED", reason: code }).catch(() => null);',
            '    await deleteVideoPod(podId).catch(() => null);\n    await confirmAvantiqoVideoPodTerminal(podId);\n    await releaseVideoPodLease({ leaseId, ownerRequestId: owner, state: "FAILED", reason: code }).catch(() => null);')
          once(flash,
            '  if (masterJob.pod_id) await deleteVideoPod(text(masterJob.pod_id)).catch(() => null);\n  if (masterJob.lease_id && masterJob.owner_request_id) {',
            '  if (masterJob.pod_id) { await deleteVideoPod(text(masterJob.pod_id)).catch(() => null); await confirmAvantiqoVideoPodTerminal(text(masterJob.pod_id)); }\n  if (masterJob.lease_id && masterJob.owner_request_id) {')
          PY

          node --test tests/avantiqo-video-pod-termination-coverage.test.mjs
          node --test tests/avantiqo-video-studio-first-boundary.test.mjs
          node scripts/studio-first-compute-boundary-audit.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/platform/service-runtime/providers/avantiqo-video/AvantiqoVideoPodRuntime.js \
            lib/platform/service-runtime/providers/avantiqo-video/AvantiqoVideoFlashVsrPodRuntime.js
          git commit -m 'Confirm Video Pod termination on all cleanup paths'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'AVANTIQO_VIDEO_CONFIRMED_POD_TERMINATION_FAILURE_PATHS=PASS'
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            git fetch origin main
            git rebase origin/main
          done