name: Avantiqo Video Emergency Stop

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-video-emergency-stop-request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: avantiqo-video-emergency-stop
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      TARGET_WORKFLOW_RUN_ID: "33630050724"
      TARGET_MODAL_APP: avantiqo-video-owned

    steps:
      - name: Validate emergency stop credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          echo "AVANTIQO_VIDEO_EMERGENCY_STOP_PREFLIGHT=PASS"

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'

      - name: Stop owned Video Modal app
        shell: bash
        run: |
          set -euo pipefail
          echo "AVANTIQO_VIDEO_MODAL_STOP_REQUESTED=true"
          modal app stop "${TARGET_MODAL_APP}"
          echo "AVANTIQO_VIDEO_MODAL_APP_STOP=PASS"

      - name: Cancel exact Scene 1 HQ GitHub run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/github-cancel.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_WORKFLOW_RUN_ID}/cancel")"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "AVANTIQO_VIDEO_EMERGENCY_STOP_GITHUB_CANCEL_HTTP=${code}"
            cat /tmp/github-cancel.json || true
            exit 1
          fi
          echo "AVANTIQO_VIDEO_EMERGENCY_STOP_GITHUB_RUN_CANCELLED_OR_ALREADY_DONE=true"

      - name: Final emergency-stop marker
        shell: bash
        run: |
          echo "AVANTIQO_VIDEO_EMERGENCY_STOP=PASS"
          echo "TARGET_SCENE=1_HQ"
          echo "NEW_GPU_GENERATION_STARTED=false"
          echo "RUNPOD_TOUCHED=false"
          echo "PRODUCTION_DEPLOY_PERFORMED=false"
