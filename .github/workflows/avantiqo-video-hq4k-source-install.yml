name: Avantiqo Video HQ4K Source Install

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-hq4k-source-install.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HQ4K worker and controller
        shell: bash
        env:
          WORKER_GZ_B64: 
          CONTROLLER_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$WORKER_GZ_B64" | base64 -d | gzip -d > scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          printf '%s' "$CONTROLLER_GZ_B64" | base64 -d | gzip -d > scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          python3 -m py_compile scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          node --check scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          grep -q 'TI2VID_TWO_STAGES_HQ_RES2S' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -q '3840' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -q '2160' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -q 'Q C' /dev/null || true
          git diff --check

      - name: Commit HQ4K sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "churchillkaron"
          git config user.email "patric@pcsphuket.com"
          git add scripts/avantiqo-video-ltx25-hq4k-scene-worker.py scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add LTX 2.5 HQ4K Scene 1 lane"
          git push origin HEAD:main
          echo 'AVANTIQO_VIDEO_HQ4K_SOURCE_INSTALL=PASS'
