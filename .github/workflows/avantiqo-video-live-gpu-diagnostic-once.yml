name: Avantiqo Video Live GPU Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-live-gpu-diagnostic-once.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Avantiqo Video live GPU execution v2 once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal CLI
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'

      - name: Inspect existing Video containers and GPU utilization only
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          modal container list --json | tee /tmp/modal-containers.json
          python - <<'PY' >/tmp/container-ids.txt
          import json,re
          data=json.load(open('/tmp/modal-containers.json'))
          text=json.dumps(data)
          ids=[]
          for x in re.findall(r'ta-[A-Za-z0-9_-]+', text):
              if x not in ids:
                  ids.append(x)
          print('\n'.join(ids))
          PY
          echo '=== EXISTING CONTAINER GPU SNAPSHOTS ==='
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            echo "CONTAINER=$cid"
            timeout 15s modal container exec --no-pty "$cid" -- sh -lc "nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total,power.draw --format=csv,noheader,nounits || true" || true
          done </tmp/container-ids.txt
          echo '=== CURRENT DEPLOYED FUNCTION STATS ==='
          python - <<'PY'
          import modal
          app='avantiqo-video-owned'
          for name in ('generate_native_job','generate_native_master','generate_native_controlled_master'):
              fn=modal.Function.from_name(app,name)
              s=fn.get_current_stats()
              print(name, {
                  'backlog': int(getattr(s,'backlog',0) or 0),
                  'num_total_runners': int(getattr(s,'num_total_runners',0) or 0),
                  'num_running_inputs': int(getattr(s,'num_running_inputs',0) or 0),
              })
          PY
          echo 'AVANTIQO_VIDEO_LIVE_DIAGNOSTIC_V2=PASS'
          echo 'PAID_GENERATION_CALLS_STARTED_BY_DIAGNOSTIC=0'
