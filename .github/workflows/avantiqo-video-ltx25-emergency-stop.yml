name: Avantiqo Video LTX-2.5 Emergency Stop

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-emergency-stop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-ltx25-fast-runtime-scene1
  cancel-in-progress: true

jobs:
  stop-video-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete active LTX Video pods
        env:
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const key = String(process.env.RUNPOD_MANAGEMENT_API_KEY || process.env.RUNPOD_API_KEY || '').trim();
          if (!key) throw new Error('RUNPOD_MANAGEMENT_API_KEY_REQUIRED');
          const base = 'https://rest.runpod.io/v1';
          const call = async (path, method='GET') => {
            const r = await fetch(base + path, {method, headers:{Authorization:`Bearer ${key}`, Accept:'application/json'}});
            const raw = await r.text();
            if (!r.ok && !(method === 'DELETE' && r.status === 404)) throw new Error(`RUNPOD_HTTP_${r.status}:${raw.slice(0,300)}`);
            try { return raw ? JSON.parse(raw) : null; } catch { return null; }
          };
          const rows = (v, depth=0) => {
            if (Array.isArray(v)) return v;
            if (!v || typeof v !== 'object' || depth > 4) return [];
            for (const k of ['pods','data','items','results']) {
              if (!(k in v)) continue;
              const n = rows(v[k], depth+1);
              if (n.length || Array.isArray(v[k])) return n;
            }
            return [];
          };
          const terminal = new Set(['EXITED','TERMINATED','DELETED','STOPPED']);
          const pods = rows(await call('/pods'));
          const targets = pods.filter(p => String(p?.name || '').startsWith('avantiqo-video-ltx25-') && !terminal.has(String(p?.status || p?.runtimeStatus || p?.desiredStatus || '').toUpperCase()));
          console.log(`AVANTIQO_VIDEO_EMERGENCY_TARGETS=${targets.length}`);
          for (const p of targets) {
            const id = String(p?.id || '').trim();
            if (!id) continue;
            await call(`/pods/${encodeURIComponent(id)}`, 'DELETE');
            console.log(`AVANTIQO_VIDEO_EMERGENCY_DELETE=${String(p?.name || id)}:PASS`);
          }
          const remaining = rows(await call('/pods')).filter(p => String(p?.name || '').startsWith('avantiqo-video-ltx25-') && !terminal.has(String(p?.status || p?.runtimeStatus || p?.desiredStatus || '').toUpperCase()));
          console.log(`AVANTIQO_VIDEO_EMERGENCY_REMAINING=${remaining.length}`);
          if (remaining.length) process.exit(1);
          console.log('AVANTIQO_VIDEO_EMERGENCY_GENERATION_SUBMITTED=false');
          console.log('AVANTIQO_VIDEO_EMERGENCY_PRODUCTION_DEPLOYED=false');
          NODE
