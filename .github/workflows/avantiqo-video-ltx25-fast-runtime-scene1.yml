name: Avantiqo Video LTX-2.5 Fast Runtime Scene 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-fast-runtime-scene1.yml
      - services/avantiqo-video-engine/Dockerfile.ltx25.fast-runtime

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-video-ltx25-fast-runtime-scene1
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push slim LTX runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-video-engine
          file: services/avantiqo-video-engine/Dockerfile.ltx25.fast-runtime
          push: true
          tags: ghcr.io/churchillkaron/avantiqo-video-ltx25-fast-runtime:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=avantiqo-video-ltx25-fast-runtime
          cache-to: type=gha,mode=max,scope=avantiqo-video-ltx25-fast-runtime

      - name: Verify immutable digest
        shell: bash
        run: |
          set -euo pipefail
          case '${{ steps.build.outputs.digest }}' in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo 'AVANTIQO_VIDEO_LTX25_FAST_RUNTIME_DIGEST_INVALID'; exit 1 ;;
          esac
          echo 'AVANTIQO_VIDEO_LTX25_FAST_RUNTIME_BUILD=PASS'

  render-scene-1:
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AVANTIQO_VIDEO_LTX25_IMAGE: ghcr.io/churchillkaron/avantiqo-video-ltx25-fast-runtime@${{ needs.build-runtime.outputs.digest }}
      AVANTIQO_VIDEO_SCENE1_ORGANIZATION_ID: 9a148429-b6a0-4bc6-ac83-a35c64fb7045
      AVANTIQO_VIDEO_SCENE1_OPENING_FRAME: ${{ github.workspace }}/assets/video/proofs/avantiqo_first_shot_frame_transport.jpg
      AVANTIQO_VIDEO_SCENE1_OUTPUT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1.mp4
      AVANTIQO_VIDEO_SCENE1_REPORT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-proof.json

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Reconstruct exact approved Scene 1 opening frame
        run: python3 scripts/reconstruct-avantiqo-video-scene1-frame-ci.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Validate Fast V2 runner
        run: |
          set -euo pipefail
          node --check scripts/run-avantiqo-video-ltx25-scene1-fast-v2-ci.mjs
          python3 -m py_compile scripts/avantiqo-video-ltx25-distilled-scene-worker.py
          echo 'AVANTIQO_VIDEO_LTX25_FAST_RUNTIME_SCENE1_STATIC_GATE=PASS'

      - name: Render Scene 1 on slim runtime
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-video-ltx25-scene1-fast-v2-ci.mjs
          test -s "${AVANTIQO_VIDEO_SCENE1_OUTPUT}"
          test -s "${AVANTIQO_VIDEO_SCENE1_REPORT}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.AVANTIQO_VIDEO_SCENE1_REPORT, 'utf8'));
          if (report.success !== true) throw new Error(report.error_code || 'SCENE1_REPORT_FAILED');
          if (report.production_deploy_performed !== false) throw new Error('PRODUCTION_DEPLOY_BOUNDARY_BROKEN');
          if (report.old_video_renderer_used !== false) throw new Error('OLD_VIDEO_RENDERER_USED');
          if (report.generation?.external_provider_contacted !== false) throw new Error('EXTERNAL_PROVIDER_CONTACTED');
          if (report.generation?.pixel_720p_stage_used !== false) throw new Error('720P_STAGE_USED');
          if (report.generation?.lanczos_upscale_used !== false) throw new Error('PIXEL_UPSCALE_USED');
          console.log('AVANTIQO_VIDEO_LTX25_FAST_RUNTIME_SCENE1_FINAL_GATE=PASS');
          NODE

      - name: Upload Scene 1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-fast-runtime-scene1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            avantiqo-video-ltx25-scene1.mp4
            avantiqo-video-ltx25-scene1-proof.json
