name: Avantiqo Video LTX-2.5 HF Credential Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-hf-credential-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      HUGGING_FACE_ACCESS_TOKEN: ${{ secrets.HUGGING_FACE_ACCESS_TOKEN }}
      HUGGING_FACE_API_TOKEN: ${{ secrets.HUGGING_FACE_API_TOKEN }}
      HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      HUGGING_FACE_HUB_ACCESS_TOKEN: ${{ secrets.HUGGING_FACE_HUB_ACCESS_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGINGFACE_ACCESS_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
      HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      RESULT: audits/results/avantiqo-video-ltx25-hf-credential-recovery.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect existing credential sources without printing secrets
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/results
          endpoint="$(curl -fsS \
            -H "Authorization: Bearer ${RUNPOD_MANAGEMENT_API_KEY}" \
            "https://rest.runpod.io/v1/endpoints/${RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID}?includeTemplate=true")"

          valid_token=''
          valid_source=''
          checked=0
          results='[]'

          check_candidate() {
            local source="$1"
            local token="$2"
            if [ -z "$token" ]; then return 1; fi
            checked=$((checked+1))
            echo "::add-mask::$token"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              'https://huggingface.co/Lightricks/LTX-2.5/resolve/main/diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors?download=false')"
            results="$(printf '%s' "$results" | jq -c --arg source "$source" --arg code "$code" '. + [{source:$source,http_code:$code}]')"
            if [ "$code" = '200' ] || [ "$code" = '302' ] || [ "$code" = '303' ] || [ "$code" = '307' ]; then
              valid_token="$token"
              valid_source="$source"
              return 0
            fi
            return 1
          }

          for key in \
            HF_TOKEN HF_ACCESS_TOKEN HF_API_TOKEN HF_API_KEY \
            HUGGING_FACE_TOKEN HUGGING_FACE_ACCESS_TOKEN HUGGING_FACE_API_TOKEN HUGGING_FACE_API_KEY \
            HUGGING_FACE_HUB_TOKEN HUGGING_FACE_HUB_ACCESS_TOKEN \
            HUGGINGFACE_TOKEN HUGGINGFACE_ACCESS_TOKEN HUGGINGFACE_API_TOKEN HUGGINGFACE_API_KEY \
            HUGGINGFACE_HUB_TOKEN; do
            candidate="${!key:-}"
            check_candidate "github:${key}" "$candidate" && break || true
          done

          if [ -z "$valid_token" ]; then
            for key in \
              HF_TOKEN HF_ACCESS_TOKEN HF_API_TOKEN HF_API_KEY \
              HUGGING_FACE_TOKEN HUGGING_FACE_ACCESS_TOKEN HUGGING_FACE_API_TOKEN HUGGING_FACE_API_KEY \
              HUGGING_FACE_HUB_TOKEN HUGGING_FACE_HUB_ACCESS_TOKEN \
              HUGGINGFACE_TOKEN HUGGINGFACE_ACCESS_TOKEN HUGGINGFACE_API_TOKEN HUGGINGFACE_API_KEY \
              HUGGINGFACE_HUB_TOKEN; do
              candidate="$(printf '%s' "$endpoint" | jq -r --arg key "$key" '.env[$key] // .template.env[$key] // empty')"
              check_candidate "runpod:${key}" "$candidate" && break || true
            done
          fi

          if [ -n "$valid_token" ]; then
            echo "::add-mask::$valid_token"
            printf '%s' "$valid_token" > /tmp/valid-hf-token
            found=true
          else
            found=false
          fi

          env_keys="$(printf '%s' "$endpoint" | jq -c '[((.env // {}) | keys[]?),((.template.env // {}) | keys[]?)] | unique | map(select(test("HF|HUGGING|LTX";"i")))')"
          jq -n \
            --argjson found "$found" \
            --arg source "$valid_source" \
            --argjson checked "$checked" \
            --argjson candidate_results "$results" \
            --argjson related_env_keys "$env_keys" \
            '{success:true,contract:"AVANTIQO_VIDEO_LTX25_HF_CREDENTIAL_RECOVERY_V2",valid_credential_found:$found,valid_source:(if ($source|length)>0 then $source else null end),candidate_count_checked:$checked,candidate_results:$candidate_results,related_existing_runpod_env_keys:$related_env_keys,secret_value_printed:false,gpu_started:false,generation_submitted:false,production_deploy_performed:false}' > "$RESULT"
          cat "$RESULT"
          test -s "$RESULT"
          jq -e '.contract == "AVANTIQO_VIDEO_LTX25_HF_CREDENTIAL_RECOVERY_V2"' "$RESULT" >/dev/null
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Upload valid credential for same-run handoff only
        if: steps.inspect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-valid-hf-token-${{ github.run_id }}
          path: /tmp/valid-hf-token
          retention-days: 1
          if-no-files-found: error

      - name: Commit sanitized recovery result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record LTX-2.5 credential recovery result v2'
          git pull --rebase origin main
          git push origin HEAD:main
