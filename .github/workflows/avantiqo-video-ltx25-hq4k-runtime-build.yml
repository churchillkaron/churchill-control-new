name: Avantiqo Video LTX-2.5 HQ4K Runtime Build

on:
  push:
    branches: [main]
    paths:
      - services/avantiqo-video-engine/Dockerfile.ltx25.hq4k-runtime
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-video-ltx25-hq4k-runtime-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push HQ4K runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-video-engine
          file: services/avantiqo-video-engine/Dockerfile.ltx25.hq4k-runtime
          push: true
          tags: ghcr.io/churchillkaron/avantiqo-video-ltx25-hq4k-runtime:${{ github.sha }}
          provenance: false
          sbom: false

      - name: Report immutable digest
        run: |
          set -euo pipefail
          test -n '${{ steps.build.outputs.digest }}'
          echo 'AVANTIQO_VIDEO_LTX25_HQ4K_RUNTIME_DIGEST=${{ steps.build.outputs.digest }}'
          echo 'AVANTIQO_VIDEO_LTX25_HQ4K_RUNTIME_BUILD=PASS'
