name: Avantiqo Video LTX-2.5 Native 3840x2176 Master Scene 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-hq4k-scene1-credential-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-video-ltx25-native-master-scene1
  cancel-in-progress: false

env:
  ENDPOINT_ID: xmey8y2hofexyp
  ENDPOINT_NAME: avantiqo-cinema-production-v1
  TEMPLATE_ID: l84730vvj0
  IMAGE_REPO: ghcr.io/churchillkaron/avantiqo-video-ltx25-native-master-serverless

jobs:
  build-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify generation-only worker source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'MASTER_WIDTH = 3840' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'MASTER_HEIGHT = 2176' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'TI2VID_ONE_STAGE_FULL_DEV_BF16' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'preprocessing_inside_paid_worker": False' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'ffprobe_inside_paid_worker": False' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          ! grep -Fq 'ImageFilter' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          ! grep -Fq '"ffprobe"' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          echo 'AVANTIQO_VIDEO_SCENE1_GENERATION_ONLY_WORKER_GATE=PASS'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable native-master worker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-video-engine
          file: services/avantiqo-video-engine/Dockerfile.ltx25.native-master-serverless
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=avantiqo-video-native-master-serverless
          cache-to: type=gha,mode=max,scope=avantiqo-video-native-master-serverless

      - name: Verify immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          case '${{ steps.build.outputs.digest }}' in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo 'AVANTIQO_VIDEO_SCENE1_IMMUTABLE_WORKER_BUILD=PASS'

  render-scene-1:
    needs: build-worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
      RUNPOD_AVANTIQO_VIDEO_ENDPOINT_ID: xmey8y2hofexyp
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AVANTIQO_VIDEO_SCENE1_ORGANIZATION_ID: 9a148429-b6a0-4bc6-ac83-a35c64fb7045
      AVANTIQO_VIDEO_SCENE1_OPENING_FRAME: ${{ github.workspace }}/assets/video/proofs/avantiqo_first_shot_frame_transport.jpg
      AVANTIQO_VIDEO_SCENE1_PREPARED_FRAME: ${{ github.workspace }}/scene1-prepared-reference.png
      AVANTIQO_VIDEO_SCENE1_OUTPUT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-native-master.mp4
      AVANTIQO_VIDEO_SCENE1_REPORT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-native-master-proof.json
      NEW_IMAGE: ghcr.io/churchillkaron/avantiqo-video-ltx25-native-master-serverless@${{ needs.build-worker.outputs.digest }}

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Prepare approved opening frame outside paid worker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 scripts/reconstruct-avantiqo-video-scene1-frame-ci.py
          python3 scripts/prepare-avantiqo-video-scene1-reference-ci.py
          test -s "$AVANTIQO_VIDEO_SCENE1_PREPARED_FRAME"

      - name: Rebind canonical template to generation-only worker with zero GPU
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_MANAGEMENT_API_KEY:-}"
          test -n "${RUNPOD_AVANTIQO_VIDEO_API_KEY:-}"
          REST='https://rest.runpod.io/v1'
          auth=(-H "Authorization: Bearer ${RUNPOD_MANAGEMENT_API_KEY}")
          json=(-H 'Content-Type: application/json')
          endpoint="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          health="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_AVANTIQO_VIDEO_API_KEY}" "https://api.runpod.ai/v2/${ENDPOINT_ID}/health")"
          test "$(printf '%s' "$endpoint" | jq -r '.id')" = "$ENDPOINT_ID"
          test "$(printf '%s' "$endpoint" | jq -r '.name')" = "$ENDPOINT_NAME"
          test "$(printf '%s' "$endpoint" | jq -r '.templateId // .template.id')" = "$TEMPLATE_ID"
          test "$(printf '%s' "$endpoint" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$endpoint" | jq -r '.workersMax')" = '1'
          test "$(printf '%s' "$endpoint" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type=="object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'
          test "$(printf '%s' "$endpoint" | jq -r '(.dataCenterIds // []) | length')" = '0'
          test "$(printf '%s' "$health" | jq -r '(.jobs.inQueue // .jobs.in_queue // 0)')" = '0'
          test "$(printf '%s' "$health" | jq -r '(.jobs.inProgress // .jobs.in_progress // 0)')" = '0'
          test "$(printf '%s' "$health" | jq -r '(.workers // {}) | [.[]] | add // 0')" = '0'
          template="$(curl -fsS "${auth[@]}" "${REST}/templates/${TEMPLATE_ID}")"
          env="$(printf '%s' "$template" | jq -c '.env // {}')"
          test -n "$(printf '%s' "$env" | jq -r '.HF_TOKEN // empty')"
          disk="$(printf '%s' "$template" | jq -r '.containerDiskInGb // 30')"
          patch="$(jq -cn --arg image "$NEW_IMAGE" --argjson env "$env" --argjson disk "$disk" '{imageName:$image,env:$env,containerDiskInGb:$disk}')"
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$patch" "${REST}/templates/${TEMPLATE_ID}" >/tmp/video-scene1-template-patch.json
          verified="$(curl -fsS "${auth[@]}" "${REST}/templates/${TEMPLATE_ID}")"
          test "$(printf '%s' "$verified" | jq -r '.imageName')" = "$NEW_IMAGE"
          test -n "$(printf '%s' "$verified" | jq -r '.env.HF_TOKEN // empty')"
          echo 'AVANTIQO_VIDEO_SCENE1_TEMPLATE_IMAGE_REBOUND=PASS'
          echo 'AVANTIQO_VIDEO_SCENE1_GPU_STARTED_BEFORE_GENERATION=false'

      - name: Submit exactly one real Scene 1 generation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-avantiqo-video-ltx25-global-scene1-ci.mjs
          node scripts/run-avantiqo-video-ltx25-global-scene1-ci.mjs
          test -s "$AVANTIQO_VIDEO_SCENE1_OUTPUT"
          test -s "$AVANTIQO_VIDEO_SCENE1_REPORT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.AVANTIQO_VIDEO_SCENE1_REPORT, 'utf8'));
          if (report.success !== true) throw new Error('SCENE1_FAILED');
          if (report.width !== 3840 || report.height !== 2176 || report.fps !== 24) throw new Error('NATIVE_MASTER_INVALID');
          if (report.pipeline !== 'TI2VID_ONE_STAGE_FULL_DEV_BF16') throw new Error('PIPELINE_INVALID');
          if (report.pixel_upscale_used !== false || report.learned_spatial_upscaler_used !== false || report.distilled_lora_used !== false) throw new Error('UPSCALE_OR_DISTILLATION_USED');
          if (report.preprocessing_inside_paid_worker !== false || report.ffprobe_inside_paid_worker !== false) throw new Error('PAID_WORKER_BOUNDARY_BROKEN');
          if (report.production_deploy_performed !== false) throw new Error('PRODUCTION_DEPLOY_BOUNDARY_BROKEN');
          console.log('AVANTIQO_VIDEO_SCENE1_WORLDCLASS_NATIVE_MASTER_GATE=PASS');
          NODE

      - name: Upload Scene 1 native master evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-native-master-scene1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            avantiqo-video-ltx25-scene1-native-master.mp4
            avantiqo-video-ltx25-scene1-native-master-proof.json
            scene1-prepared-reference.png
