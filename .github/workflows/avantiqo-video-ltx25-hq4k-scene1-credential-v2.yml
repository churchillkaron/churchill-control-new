name: Avantiqo Video LTX-2.5 Native 3840x2176 Master Scene 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-hq4k-scene1-credential-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-ltx25-native-master-scene1
  cancel-in-progress: true

jobs:
  park-legacy-pod-path:
    runs-on: ubuntu-latest
    steps:
      - name: Park EU-RO-1 network-volume render path
        run: |
          set -euo pipefail
          echo 'AVANTIQO_VIDEO_NATIVE_MASTER_LEGACY_POD_PATH_PARKED=true'
          echo 'AVANTIQO_VIDEO_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_RUNPOD_MUTATION_PERFORMED=false'
          echo 'AVANTIQO_VIDEO_PRODUCTION_DEPLOY_PERFORMED=false'
