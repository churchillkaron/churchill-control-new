name: Avantiqo Video LTX-2.5 Native 3840x2176 Master Scene 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-hq4k-scene1-credential-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-ltx25-native-master-scene1
  cancel-in-progress: true

jobs:
  render-native-master-scene-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVANTIQO_VIDEO_LTX25_IMAGE: ghcr.io/churchillkaron/avantiqo-video-ltx25-hq4k-runtime@sha256:4aebfa8252bd870a30ebffef6788800096f78c336a558b0ad0ca5e2324a0a2b9
      AVANTIQO_VIDEO_SCENE1_ORGANIZATION_ID: 9a148429-b6a0-4bc6-ac83-a35c64fb7045
      AVANTIQO_VIDEO_SCENE1_OPENING_FRAME: ${{ github.workspace }}/assets/video/proofs/avantiqo_first_shot_frame_transport.jpg
      AVANTIQO_VIDEO_SCENE1_OUTPUT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-native-master-3840x2176.mp4
      AVANTIQO_VIDEO_SCENE1_REPORT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-native-master-proof.json

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Reconstruct exact approved Scene 1 opening frame
        run: python3 scripts/reconstruct-avantiqo-video-scene1-frame-ci.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Validate native master source and immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${AVANTIQO_VIDEO_LTX25_IMAGE}" in
            ghcr.io/churchillkaron/avantiqo-video-ltx25-hq4k-runtime@sha256:4aebfa8252bd870a30ebffef6788800096f78c336a558b0ad0ca5e2324a0a2b9) ;;
            *) echo 'AVANTIQO_VIDEO_NATIVE_MASTER_IMAGE_MISMATCH'; exit 1 ;;
          esac
          python3 -m py_compile scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          node --check scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          grep -Fq 'ltx_pipelines.ti2vid_one_stage' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          ! grep -Fq 'ti2vid_two_stages_hq' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'ltx-2.5-22b-dev-transformer-bf16.safetensors' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          ! grep -Fq 'distilled-lora' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          ! grep -Fq 'spatial-upsampler-path' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'MASTER_WIDTH = 3840' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'MASTER_HEIGHT = 2176' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"native_master_generated": True' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"master_is_exact_model_output": True' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"learned_latent_upsampler_used": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"distilled_lora_used": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"resize_used": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"crop_used": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"delivery_variants_generated": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"deterministic_title_composite": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          ! grep -Fq 'finish_uhd(' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          ! grep -Fq 'drawtext=' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'AVANTIQO_VIDEO_LTX25_HARD_TIMEOUT_SECONDS: "1800"' scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          grep -Fq '35 * 60 * 1000' scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          echo 'AVANTIQO_VIDEO_NATIVE_MASTER_STATIC_GATE=PASS'

      - name: Test existing Hugging Face credential
        env:
          CANDIDATE_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CANDIDATE_HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          CANDIDATE_HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const names = Object.keys(process.env).filter((name) => name.startsWith('CANDIDATE_')).sort();
          const target = 'https://huggingface.co/Lightricks/LTX-2.5/resolve/main/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors';
          let winner = null;
          for (const name of names) {
            const token = String(process.env[name] || '').trim().replace(/^Bearer\s+/i, '');
            if (!/^hf_[A-Za-z0-9_-]{20,}$/.test(token)) continue;
            console.log(`::add-mask::${token}`);
            const response = await fetch(target, {
              method: 'HEAD', redirect: 'manual',
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(30000),
            });
            if ([200, 206, 302, 303, 307, 308].includes(response.status)) {
              winner = { token, status: response.status };
              break;
            }
          }
          if (!winner) throw new Error('AVANTIQO_VIDEO_NATIVE_MASTER_HF_ACCESS_REQUIRED');
          await fs.appendFile(process.env.GITHUB_ENV, `HF_TOKEN=${winner.token}\n`, { mode: 0o600 });
          console.log(`AVANTIQO_VIDEO_NATIVE_MASTER_HF_ACCESS=PASS:${winner.status}`);
          NODE

      - name: Render untouched native Scene 1 master on owned LTX-2.5
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'AVANTIQO_VIDEO_NATIVE_MASTER_SCENE1_START=true'
          node scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          test -s "${AVANTIQO_VIDEO_SCENE1_OUTPUT}"
          test -s "${AVANTIQO_VIDEO_SCENE1_REPORT}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.AVANTIQO_VIDEO_SCENE1_REPORT, 'utf8'));
          if (report.success !== true) throw new Error(report.error_code || 'NATIVE_MASTER_SCENE1_REPORT_FAILED');
          if (report.production_deploy_performed !== false) throw new Error('PRODUCTION_DEPLOY_BOUNDARY_BROKEN');
          if (report.old_video_renderer_used !== false) throw new Error('OLD_VIDEO_RENDERER_USED');
          const g = report.generation || {};
          if (Number(g.width) !== 3840 || Number(g.height) !== 2176 || Number(g.fps) !== 24) throw new Error('NATIVE_MASTER_DIMENSIONS_INVALID');
          if (Number(g.native_generation_width) !== 3840 || Number(g.native_generation_height) !== 2176) throw new Error('NATIVE_MASTER_GENERATION_DIMENSIONS_INVALID');
          if (g.native_4k_claimed !== true || g.native_master_generated !== true || g.master_is_exact_model_output !== true) throw new Error('NATIVE_MASTER_CLAIM_INVALID');
          if (g.pixel_upscale_used !== false || g.learned_latent_upsampler_used !== false || g.learned_spatial_upscaler_used !== false || g.resize_used !== false || g.crop_used !== false) throw new Error('POST_GENERATION_IMAGE_CHANGE_FORBIDDEN');
          if (g.distilled_lora_used !== false || g.external_provider_contacted !== false) throw new Error('NATIVE_MASTER_MODEL_BOUNDARY_BROKEN');
          if (g.uhd_delivery !== false || g.delivery_crop_only !== false || g.delivery_variants_generated !== false || g.deterministic_title_composite !== false) throw new Error('GPU_DELIVERY_FORMATTING_FORBIDDEN');
          if (g.visual_integrity_qc_deferred_to_studio !== true) throw new Error('STUDIO_QC_BOUNDARY_INVALID');
          console.log('AVANTIQO_VIDEO_NATIVE_MASTER_SCENE1_FINAL_GATE=PASS');
          NODE

      - name: Upload native Scene 1 master artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-native-master-scene1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            avantiqo-video-ltx25-scene1-native-master-3840x2176.mp4
            avantiqo-video-ltx25-scene1-native-master-proof.json
