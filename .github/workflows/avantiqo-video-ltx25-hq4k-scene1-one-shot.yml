name: Avantiqo Video LTX-2.5 HQ4K Scene 1 One Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-hq4k-scene1-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-ltx25-hq4k-scene1-one-shot
  cancel-in-progress: true

jobs:
  render-hq4k-scene-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVANTIQO_VIDEO_LTX25_IMAGE: ghcr.io/churchillkaron/avantiqo-video-ltx25-hq4k-runtime@sha256:4aebfa8252bd870a30ebffef6788800096f78c336a558b0ad0ca5e2324a0a2b9
      AVANTIQO_VIDEO_SCENE1_ORGANIZATION_ID: 9a148429-b6a0-4bc6-ac83-a35c64fb7045
      AVANTIQO_VIDEO_SCENE1_OPENING_FRAME: ${{ github.workspace }}/assets/video/proofs/avantiqo_first_shot_frame_transport.jpg
      AVANTIQO_VIDEO_SCENE1_OUTPUT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-hq4k.mp4
      AVANTIQO_VIDEO_SCENE1_REPORT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-hq4k-proof.json

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Reconstruct exact approved Scene 1 opening frame
        run: python3 scripts/reconstruct-avantiqo-video-scene1-frame-ci.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Validate HQ4K source and immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${AVANTIQO_VIDEO_LTX25_IMAGE}" in
            ghcr.io/churchillkaron/avantiqo-video-ltx25-hq4k-runtime@sha256:4aebfa8252bd870a30ebffef6788800096f78c336a558b0ad0ca5e2324a0a2b9) ;;
            *) echo 'AVANTIQO_VIDEO_HQ4K_IMAGE_MISMATCH'; exit 1 ;;
          esac
          python3 -m py_compile scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          node --check scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          grep -Fq 'ltx_pipelines.ti2vid_two_stages_hq' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'ltx-2.5-22b-dev-transformer-bf16.safetensors' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'ltx-2.5-22b-distilled-lora-450-bf16.safetensors' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'RAW_WIDTH = 3840' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'DELIVERY_HEIGHT = 2160' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"native_4k_claimed": False' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '"learned_latent_upsampler_used": True' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'AVANTIQO_VIDEO_HQ4K_QC_BLACK_COLLAPSE' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq '04\\:47 AM' scripts/avantiqo-video-ltx25-hq4k-scene-worker.py
          grep -Fq 'AVANTIQO_VIDEO_LTX25_HARD_TIMEOUT_SECONDS: "360"' scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          grep -Fq '8 * 60 * 1000' scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          echo 'AVANTIQO_VIDEO_HQ4K_STATIC_GATE=PASS'
          echo 'AVANTIQO_VIDEO_HQ4K_PRODUCTION_DEPLOY=false'

      - name: Render HQ4K Scene 1 on owned LTX-2.5
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'AVANTIQO_VIDEO_HQ4K_SCENE1_START=true'
          node scripts/run-avantiqo-video-ltx25-scene1-hq4k-ci.mjs
          test -s "${AVANTIQO_VIDEO_SCENE1_OUTPUT}"
          test -s "${AVANTIQO_VIDEO_SCENE1_REPORT}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.AVANTIQO_VIDEO_SCENE1_REPORT, 'utf8'));
          if (report.success !== true) throw new Error(report.error_code || 'HQ4K_SCENE1_REPORT_FAILED');
          if (report.production_deploy_performed !== false) throw new Error('PRODUCTION_DEPLOY_BOUNDARY_BROKEN');
          if (report.old_video_renderer_used !== false) throw new Error('OLD_VIDEO_RENDERER_USED');
          if (Number(report.generation?.width) !== 3840 || Number(report.generation?.height) !== 2160 || Number(report.generation?.fps) !== 24) throw new Error('HQ4K_DELIVERY_DIMENSIONS_INVALID');
          if (report.generation?.external_provider_contacted !== false) throw new Error('EXTERNAL_PROVIDER_CONTACTED');
          if (report.generation?.pixel_720p_stage_used !== false || report.generation?.lanczos_upscale_used !== false) throw new Error('PIXEL_UPSCALE_BOUNDARY_BROKEN');
          console.log('AVANTIQO_VIDEO_HQ4K_SCENE1_FINAL_GATE=PASS');
          NODE

      - name: Upload HQ4K Scene 1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-hq4k-scene1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            avantiqo-video-ltx25-scene1-hq4k.mp4
            avantiqo-video-ltx25-scene1-hq4k-proof.json
