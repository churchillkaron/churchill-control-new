name: Avantiqo Video Native Master Serverless Migration V5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-native-master-serverless-migrate-v5.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-native-master-serverless-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENDPOINT_ID: xmey8y2hofexyp
      ENDPOINT_NAME: avantiqo-cinema-production-v1
      MODEL_REFERENCE: https://huggingface.co/Lightricks/LTX-2.5:main
      IMAGE: ghcr.io/churchillkaron/avantiqo-video-ltx25-native-master-serverless@sha256:3073b7fb3eaccd822bbd3d0a0e9ef9209bc2f1a6840c9d1ac87e61102161ef62
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_INFERENCE_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY || secrets.RUNPOD_MANAGEMENT_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate zero-cost prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for name in RUNPOD_API_KEY RUNPOD_INFERENCE_KEY HF_TOKEN; do
            test -n "${!name:-}" || { echo "AVANTIQO_VIDEO_MIGRATION_V5_MISSING_${name}"; exit 1; }
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            'https://huggingface.co/Lightricks/LTX-2.5/resolve/main/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors?download=false')"
          case "$code" in
            200|302|303|307|308) ;;
            *) echo "AVANTIQO_VIDEO_MIGRATION_V5_HF_ACCESS_FAIL_${code}"; exit 1 ;;
          esac
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_HF_ACCESS=PASS'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_GPU_STARTED=false'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_GENERATION_SUBMITTED=false'

      - name: Install current runpodctl
        shell: bash
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /usr/local/bin/runpodctl
          sudo chmod +x /usr/local/bin/runpodctl
          runpodctl version
          help_text="$(runpodctl serverless update --help)"
          grep -q -- '--model-reference' <<<"$help_text"
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_RUNPODCTL=PASS'

      - name: Bind gated cached model and global zero-idle policy
        shell: bash
        run: |
          set -euo pipefail
          REST='https://rest.runpod.io/v1'
          GRAPH='https://api.runpod.io/graphql'
          QUEUE="https://api.runpod.ai/v2/${ENDPOINT_ID}"
          auth=(-H "Authorization: Bearer ${RUNPOD_API_KEY}")
          json=(-H 'Content-Type: application/json')

          endpoint="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          health="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          cli_before="$(runpodctl serverless get "$ENDPOINT_ID" -o json)"

          test "$(printf '%s' "$endpoint" | jq -r '.id')" = "$ENDPOINT_ID"
          test "$(printf '%s' "$endpoint" | jq -r '.name')" = "$ENDPOINT_NAME"
          test "$(printf '%s' "$endpoint" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$health" | jq -r '(.jobs.inQueue // .jobs.in_queue // 0)')" = '0'
          test "$(printf '%s' "$health" | jq -r '(.jobs.inProgress // .jobs.in_progress // 0)')" = '0'
          test "$(printf '%s' "$health" | jq -r '(.workers // {}) | [.[]] | add // 0')" = '0'
          active="$(printf '%s' "$endpoint" | jq '[.workers[]? | select(((.status // .workerStatus // "") | ascii_upcase) as $s | ($s != "EXITED" and $s != "TERMINATED" and $s != "DELETED" and $s != "STOPPED"))] | length')"
          test "$active" = '0'

          template_id="$(printf '%s' "$endpoint" | jq -r '.templateId // .template.id // empty')"
          test -n "$template_id"
          template="$(curl -fsS "${auth[@]}" "${REST}/templates/${template_id}")"
          printf '%s' "$endpoint" >/tmp/video-endpoint-before.json
          printf '%s' "$cli_before" >/tmp/video-cli-before.json
          printf '%s' "$template" >/tmp/video-template-before.json

          restore_state() {
            rc=$?
            if [ "$rc" -eq 0 ]; then return 0; fi
            set +e
            echo 'AVANTIQO_VIDEO_MIGRATION_V5_ROLLBACK=START'

            source="$(cat /tmp/video-cli-before.json)"
            restore_input="$(printf '%s' "$source" | jq -c '{
              id:.id,name:.name,templateId:.templateId,gpuIds:.gpuIds,gpuCount:(.gpuCount // 1),instanceIds:(.instanceIds // []),
              workersMin:(.workersMin // 0),workersMax:(.workersMax // 0),locations:(.locations // ""),
              networkVolumeId:(.networkVolumeId // ""),
              networkVolumeIds:((.networkVolumeIds // []) | map(if type == "string" then {networkVolumeId:.} else {networkVolumeId:(.networkVolumeId // .id)} end) | map(select(.networkVolumeId != null and .networkVolumeId != ""))),
              idleTimeout:(.idleTimeout // 5),scalerType:(.scalerType // "REQUEST_COUNT"),scalerValue:(.scalerValue // 1),
              executionTimeoutMs:(.executionTimeoutMs // 2100000),minCudaVersion:(.minCudaVersion // "12.8"),
              flashBootType:(.flashBootType // "FLASHBOOT"),modelReferences:(.modelReferences // [])
            }')"
            restore_payload="$(jq -cn --argjson input "$restore_input" '{query:"mutation SaveEndpoint($input: EndpointInput!){saveEndpoint(input:$input){id}}",variables:{input:$input}}')"
            curl -sS "${auth[@]}" "${json[@]}" -d "$restore_payload" "$GRAPH" >/tmp/video-rollback-graph.json

            before="$(cat /tmp/video-endpoint-before.json)"
            rest_restore="$(printf '%s' "$before" | jq -c '{
              gpuTypeIds:(.gpuTypeIds // []),gpuCount:(.gpuCount // 1),workersMin:(.workersMin // 0),workersMax:(.workersMax // 0),
              idleTimeout:(.idleTimeout // 5),scalerType:(.scalerType // "REQUEST_COUNT"),scalerValue:(.scalerValue // 1),
              flashboot:(.flashboot // .flashBoot // false),minCudaVersion:(.minCudaVersion // "12.8"),allowedCudaVersions:(.allowedCudaVersions // []),
              dataCenterIds:(.dataCenterIds // []),executionTimeoutMs:(.executionTimeoutMs // 2100000),
              networkVolumeIds:([.networkVolumeId,.networkVolumeIds[]?] | map(if type == "object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | unique)
            }')"
            curl -sS -X PATCH "${auth[@]}" "${json[@]}" -d "$rest_restore" "${REST}/endpoints/${ENDPOINT_ID}" >/tmp/video-rollback-rest.json

            old_template="$(cat /tmp/video-template-before.json)"
            old_env="$(printf '%s' "$old_template" | jq -c '.env // {}')"
            old_image="$(printf '%s' "$old_template" | jq -r '.imageName')"
            old_readme="$(printf '%s' "$old_template" | jq -r '.readme // ""')"
            old_disk="$(printf '%s' "$old_template" | jq -r '.containerDiskInGb // 20')"
            template_restore="$(jq -cn --arg image "$old_image" --argjson env "$old_env" --arg readme "$old_readme" --argjson disk "$old_disk" '{imageName:$image,env:$env,readme:$readme,containerDiskInGb:$disk}')"
            curl -sS -X PATCH "${auth[@]}" "${json[@]}" -d "$template_restore" "${REST}/templates/${template_id}" >/tmp/video-rollback-template.json
            echo 'AVANTIQO_VIDEO_MIGRATION_V5_ROLLBACK=ATTEMPTED'
            exit "$rc"
          }
          trap restore_state EXIT

          new_env="$(printf '%s' "$template" | jq -c --arg token "$HF_TOKEN" '(.env // {}) + {
            HF_TOKEN:$token,
            HUGGING_FACE_HUB_TOKEN:$token,
            HUGGINGFACE_TOKEN:$token,
            MODEL_NAME:"Lightricks/LTX-2.5",
            HF_HUB_OFFLINE:"1",
            TRANSFORMERS_OFFLINE:"1",
            AVANTIQO_VIDEO_LTX25_PIPELINE_ROOT:"/opt/LTX-2",
            AVANTIQO_VIDEO_LTX25_HARD_TIMEOUT_SECONDS:"1800"
          }')"
          disk="$(printf '%s' "$template" | jq -r '.containerDiskInGb // 30')"
          template_patch="$(jq -cn --arg image "$IMAGE" --argjson env "$new_env" --argjson disk "$disk" '{imageName:$image,env:$env,containerDiskInGb:$disk}')"
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$template_patch" "${REST}/templates/${template_id}" >/tmp/video-template-patched.json

          patched_template="$(curl -fsS "${auth[@]}" "${REST}/templates/${template_id}")"
          test "$(printf '%s' "$patched_template" | jq -r '.imageName')" = "$IMAGE"
          test -n "$(printf '%s' "$patched_template" | jq -r '.env.HF_TOKEN // empty')"
          test -n "$(printf '%s' "$patched_template" | jq -r '.env.HUGGING_FACE_HUB_TOKEN // empty')"
          test -n "$(printf '%s' "$patched_template" | jq -r '.env.HUGGINGFACE_TOKEN // empty')"
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_TOKEN_ALIASES=PASS'

          runpodctl serverless update "$ENDPOINT_ID" --model-reference "$MODEL_REFERENCE" -o json >/tmp/video-model-reference.json
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_GATED_MODEL_REFERENCE=PASS'

          current="$(runpodctl serverless get "$ENDPOINT_ID" -o json)"
          input="$(printf '%s' "$current" | jq -c --arg model "$MODEL_REFERENCE" '{
            id:.id,name:.name,templateId:.templateId,gpuIds:.gpuIds,gpuCount:(.gpuCount // 1),instanceIds:(.instanceIds // []),
            workersMin:0,workersMax:1,locations:"",networkVolumeId:"",networkVolumeIds:[],idleTimeout:5,
            scalerType:"REQUEST_COUNT",scalerValue:1,executionTimeoutMs:2100000,minCudaVersion:"12.8",
            flashBootType:(.flashBootType // "FLASHBOOT"),modelReferences:[$model]
          }')"
          payload="$(jq -cn --argjson input "$input" '{query:"mutation SaveEndpoint($input: EndpointInput!){saveEndpoint(input:$input){id workersMin workersMax networkVolumeId networkVolumeIds{networkVolumeId} modelReferences}}",variables:{input:$input}}')"
          response="$(curl -fsS "${auth[@]}" "${json[@]}" -d "$payload" "$GRAPH")"
          if [ "$(printf '%s' "$response" | jq '.errors | length // 0')" != '0' ]; then
            printf '%s\n' "$response" | jq -c '{errors:.errors}' >&2
            exit 1
          fi
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.networkVolumeId // ""')" = ''
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.networkVolumeIds | length')" = '0'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_NETWORK_VOLUME_DETACHED=true'

          policy='{"gpuTypeIds":["NVIDIA RTX PRO 6000 Blackwell Server Edition","NVIDIA RTX PRO 6000 Blackwell Workstation Edition","NVIDIA B200"],"gpuCount":1,"workersMin":0,"workersMax":1,"idleTimeout":5,"scalerType":"REQUEST_COUNT","scalerValue":1,"flashboot":true,"minCudaVersion":"12.8","allowedCudaVersions":["12.8","12.9","13.0"],"dataCenterIds":[],"executionTimeoutMs":2100000,"networkVolumeIds":[]}'
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$policy" "${REST}/endpoints/${ENDPOINT_ID}" >/tmp/video-global-policy.json

          verified="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          verified_cli="$(runpodctl serverless get "$ENDPOINT_ID" -o json)"
          verified_health="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          test "$(printf '%s' "$verified" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$verified" | jq -r '.workersMax')" = '1'
          test "$(printf '%s' "$verified" | jq -r '.idleTimeout')" = '5'
          test "$(printf '%s' "$verified" | jq -r '.scalerType')" = 'REQUEST_COUNT'
          test "$(printf '%s' "$verified" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type == "object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'
          test "$(printf '%s' "$verified" | jq -r '(.dataCenterIds // []) | length')" = '0'
          test "$(printf '%s' "$verified_cli" | jq -r --arg model "$MODEL_REFERENCE" '(.modelReferences // []) | index($model) != null')" = 'true'
          test "$(printf '%s' "$verified_health" | jq -r '(.jobs.inQueue // .jobs.in_queue // 0)')" = '0'
          test "$(printf '%s' "$verified_health" | jq -r '(.jobs.inProgress // .jobs.in_progress // 0)')" = '0'
          test "$(printf '%s' "$verified_health" | jq -r '(.workers // {}) | [.[]] | add // 0')" = '0'

          trap - EXIT
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_SUCCESS=true'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_ENDPOINT=xmey8y2hofexyp'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_WORKERS=0_TO_1'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_GLOBAL_SCHEDULING=true'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_NETWORK_VOLUME=false'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_GPU_STARTED=false'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_MIGRATION_V5_PRODUCTION_WEB_DEPLOY=false'
