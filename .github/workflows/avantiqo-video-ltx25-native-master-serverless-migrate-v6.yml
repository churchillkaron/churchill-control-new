name: Avantiqo Video Global Capacity Repair V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-native-master-serverless-migrate-v6.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-native-master-serverless-migrate
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENDPOINT_ID: xmey8y2hofexyp
      ENDPOINT_NAME: avantiqo-cinema-production-v1
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_INFERENCE_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY || secrets.RUNPOD_MANAGEMENT_API_KEY }}

    steps:
      - name: Apply REST GPU pool while preserving cached model and queued Scene 1
        shell: bash
        run: |
          set -euo pipefail
          REST='https://rest.runpod.io/v1'
          GRAPH='https://api.runpod.io/graphql'
          QUEUE="https://api.runpod.ai/v2/${ENDPOINT_ID}"
          auth=(-H "Authorization: Bearer ${RUNPOD_API_KEY}")
          json=(-H 'Content-Type: application/json')
          gpu_pool='["NVIDIA B200","NVIDIA H200","NVIDIA H200 NVL","NVIDIA RTX PRO 6000 Blackwell Server Edition","NVIDIA RTX PRO 6000 Blackwell Workstation Edition","NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition","NVIDIA H100 NVL","NVIDIA H100 80GB HBM3","NVIDIA H100 PCIe","NVIDIA A100-SXM4-80GB","NVIDIA A100 80GB PCIe"]'

          endpoint="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          test "$(printf '%s' "$endpoint" | jq -r '.id')" = "$ENDPOINT_ID"
          test "$(printf '%s' "$endpoint" | jq -r '.name')" = "$ENDPOINT_NAME"
          test "$(printf '%s' "$endpoint" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type=="object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'
          template_id="$(printf '%s' "$endpoint" | jq -r '.templateId // .template.id // empty')"
          template="$(curl -fsS "${auth[@]}" "${REST}/templates/${template_id}")"
          test "$(printf '%s' "$template" | jq -r '.containerDiskInGb')" = '30'
          test -n "$(printf '%s' "$template" | jq -r '.env.HF_TOKEN // empty')"

          model_query='query VideoModel { myself { endpoints { id modelReferences } } }'
          model_payload="$(jq -cn --arg query "$model_query" '{query:$query,variables:{}}')"
          model_before="$(curl -fsS "${auth[@]}" "${json[@]}" -d "$model_payload" "$GRAPH" | jq -c --arg id "$ENDPOINT_ID" '[.data.myself.endpoints[] | select(.id==$id) | .modelReferences[]?]')"
          test "$(printf '%s' "$model_before" | jq 'length')" -ge 1

          health_before="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          echo "AVANTIQO_VIDEO_CAPACITY_V3_HEALTH_BEFORE=$(printf '%s' "$health_before" | jq -c '{jobs:.jobs,workers:.workers}')"
          echo "AVANTIQO_VIDEO_CAPACITY_V3_MODEL=$(printf '%s' "$model_before" | jq -c '.')"

          # Clear the failing pre-container attempt, but preserve the already-submitted queue item.
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d '{"workersMin":0,"workersMax":0}' "${REST}/endpoints/${ENDPOINT_ID}" >/dev/null
          for i in $(seq 1 18); do
            h="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
            total="$(printf '%s' "$h" | jq '(.workers // {}) | [.[]] | add // 0')"
            [ "$total" = '0' ] && break
            sleep 5
          done

          policy="$(jq -cn --argjson gpu "$gpu_pool" '{gpuTypeIds:$gpu,gpuCount:1,workersMin:0,workersMax:1,idleTimeout:5,scalerType:"REQUEST_COUNT",scalerValue:1,flashboot:false,minCudaVersion:"12.8",allowedCudaVersions:["12.8","12.9","13.0"],dataCenterIds:[],networkVolumeIds:[],executionTimeoutMs:2100000}')"
          response="$(curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$policy" "${REST}/endpoints/${ENDPOINT_ID}")"
          echo "AVANTIQO_VIDEO_CAPACITY_V3_PATCH_RESPONSE=$(printf '%s' "$response" | jq -c '{id,name,workersMin,workersMax,gpuTypeIds,flashboot,networkVolumeId,networkVolumeIds}')"

          after="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          test "$(printf '%s' "$after" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$after" | jq -r '.workersMax')" = '1'
          test "$(printf '%s' "$after" | jq -r '(.gpuTypeIds // []) | length')" -ge 8
          test "$(printf '%s' "$after" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type=="object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'

          model_after="$(curl -fsS "${auth[@]}" "${json[@]}" -d "$model_payload" "$GRAPH" | jq -c --arg id "$ENDPOINT_ID" '[.data.myself.endpoints[] | select(.id==$id) | .modelReferences[]?]')"
          test "$model_after" = "$model_before"

          sleep 12
          health_after="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          echo "AVANTIQO_VIDEO_CAPACITY_V3_HEALTH_AFTER=$(printf '%s' "$health_after" | jq -c '{jobs:.jobs,workers:.workers}')"
          echo "AVANTIQO_VIDEO_CAPACITY_V3_GPU_POOL=$(printf '%s' "$after" | jq -c '.gpuTypeIds')"
          echo 'AVANTIQO_VIDEO_CAPACITY_V3_FLASHBOOT=false'
          echo 'AVANTIQO_VIDEO_CAPACITY_V3_MODEL_PRESERVED=true'
          echo 'AVANTIQO_VIDEO_CAPACITY_V3_EXISTING_JOB_PRESERVED=true'
          echo 'AVANTIQO_VIDEO_CAPACITY_V3_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_CAPACITY_V3_NETWORK_VOLUME=false'
          echo 'AVANTIQO_VIDEO_CAPACITY_V3_PRODUCTION_DEPLOY=false'
