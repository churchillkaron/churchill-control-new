name: Avantiqo Video Serverless Startup Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-native-master-serverless-migrate-v6.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-native-master-serverless-migrate
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENDPOINT_ID: xmey8y2hofexyp
      ENDPOINT_NAME: avantiqo-cinema-production-v1
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_INFERENCE_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY || secrets.RUNPOD_MANAGEMENT_API_KEY }}

    steps:
      - name: Enlarge worker disk and recycle stuck initializer without resubmitting Scene 1
        shell: bash
        run: |
          set -euo pipefail
          REST='https://rest.runpod.io/v1'
          GRAPH='https://api.runpod.io/graphql'
          QUEUE="https://api.runpod.ai/v2/${ENDPOINT_ID}"
          auth=(-H "Authorization: Bearer ${RUNPOD_API_KEY}")
          json=(-H 'Content-Type: application/json')

          endpoint="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          test "$(printf '%s' "$endpoint" | jq -r '.id')" = "$ENDPOINT_ID"
          test "$(printf '%s' "$endpoint" | jq -r '.name')" = "$ENDPOINT_NAME"
          test "$(printf '%s' "$endpoint" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$endpoint" | jq -r '.workersMax')" = '1'
          test "$(printf '%s' "$endpoint" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type=="object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'

          template_id="$(printf '%s' "$endpoint" | jq -r '.templateId // .template.id // empty')"
          test -n "$template_id"
          template="$(curl -fsS "${auth[@]}" "${REST}/templates/${template_id}")"
          image="$(printf '%s' "$template" | jq -r '.imageName // empty')"
          env="$(printf '%s' "$template" | jq -c '.env // {}')"
          old_disk="$(printf '%s' "$template" | jq -r '.containerDiskInGb // 0')"
          test -n "$image"
          test -n "$(printf '%s' "$env" | jq -r '.HF_TOKEN // empty')"

          query='query VideoEndpoint { myself { endpoints { id templateId modelReferences } } }'
          read_payload="$(jq -cn --arg query "$query" '{query:$query,variables:{}}')"
          graph="$(curl -fsS "${auth[@]}" "${json[@]}" -d "$read_payload" "$GRAPH")"
          model_count="$(printf '%s' "$graph" | jq --arg id "$ENDPOINT_ID" '[.data.myself.endpoints[] | select(.id==$id) | .modelReferences[]?] | length')"
          test "$model_count" -ge 1

          health_before="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          echo "AVANTIQO_VIDEO_STARTUP_REPAIR_HEALTH_BEFORE=$(printf '%s' "$health_before" | jq -c '{jobs:.jobs,workers:.workers}')"
          echo "AVANTIQO_VIDEO_STARTUP_REPAIR_OLD_DISK_GB=${old_disk}"

          # Stop only the autoscaler while preserving the queued Scene 1 job.
          park='{"workersMin":0,"workersMax":0}'
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$park" "${REST}/endpoints/${ENDPOINT_ID}" >/tmp/video-startup-park.json

          # Give RunPod a short bounded window to release the stuck initializer.
          for i in $(seq 1 18); do
            h="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
            total="$(printf '%s' "$h" | jq '(.workers // {}) | [.[]] | add // 0')"
            if [ "$total" = '0' ]; then break; fi
            sleep 5
          done

          patch="$(jq -cn --arg image "$image" --argjson env "$env" '{imageName:$image,env:$env,containerDiskInGb:30}')"
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$patch" "${REST}/templates/${template_id}" >/tmp/video-startup-template.json
          verified_template="$(curl -fsS "${auth[@]}" "${REST}/templates/${template_id}")"
          test "$(printf '%s' "$verified_template" | jq -r '.imageName')" = "$image"
          test "$(printf '%s' "$verified_template" | jq -r '.containerDiskInGb')" = '30'
          test -n "$(printf '%s' "$verified_template" | jq -r '.env.HF_TOKEN // empty')"

          # Restore exactly one autoscaled worker. This reuses the existing queued job; no /run call occurs here.
          resume='{"workersMin":0,"workersMax":1,"idleTimeout":5,"scalerType":"REQUEST_COUNT","scalerValue":1,"flashboot":true,"minCudaVersion":"12.8","allowedCudaVersions":["12.8","12.9","13.0"],"dataCenterIds":[],"networkVolumeIds":[]}'
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d "$resume" "${REST}/endpoints/${ENDPOINT_ID}" >/tmp/video-startup-resume.json

          final_endpoint="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          test "$(printf '%s' "$final_endpoint" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$final_endpoint" | jq -r '.workersMax')" = '1'
          test "$(printf '%s' "$final_endpoint" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type=="object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'
          final_graph="$(curl -fsS "${auth[@]}" "${json[@]}" -d "$read_payload" "$GRAPH")"
          final_model_count="$(printf '%s' "$final_graph" | jq --arg id "$ENDPOINT_ID" '[.data.myself.endpoints[] | select(.id==$id) | .modelReferences[]?] | length')"
          test "$final_model_count" -ge 1
          health_after="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          echo "AVANTIQO_VIDEO_STARTUP_REPAIR_HEALTH_AFTER=$(printf '%s' "$health_after" | jq -c '{jobs:.jobs,workers:.workers}')"
          echo "AVANTIQO_VIDEO_STARTUP_REPAIR_TEMPLATE_ID=${template_id}"
          echo 'AVANTIQO_VIDEO_STARTUP_REPAIR_CONTAINER_DISK_GB=30'
          echo 'AVANTIQO_VIDEO_STARTUP_REPAIR_EXISTING_JOB_PRESERVED=true'
          echo 'AVANTIQO_VIDEO_STARTUP_REPAIR_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_STARTUP_REPAIR_NETWORK_VOLUME=false'
          echo 'AVANTIQO_VIDEO_STARTUP_REPAIR_PRODUCTION_DEPLOY=false'
