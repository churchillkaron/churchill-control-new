name: Avantiqo Video Atomic Global Startup Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-native-master-serverless-migrate-v6.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-native-master-serverless-migrate
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENDPOINT_ID: xmey8y2hofexyp
      ENDPOINT_NAME: avantiqo-cinema-production-v1
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_INFERENCE_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY || secrets.RUNPOD_MANAGEMENT_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Atomically preserve model and widen pre-container placement
        shell: bash
        run: |
          set -euo pipefail
          REST='https://rest.runpod.io/v1'
          GRAPH='https://api.runpod.io/graphql'
          QUEUE="https://api.runpod.ai/v2/${ENDPOINT_ID}"
          auth=(-H "Authorization: Bearer ${RUNPOD_API_KEY}")
          json=(-H 'Content-Type: application/json')
          MODEL_REVISION='e8dc69fd26150afbfa20351f6bc9ac384257f9fd'
          MODEL_REFERENCE="https://huggingface.co/Lightricks/LTX-2.5:${MODEL_REVISION}"

          for name in RUNPOD_API_KEY RUNPOD_INFERENCE_KEY HF_TOKEN; do
            test -n "${!name:-}" || { echo "AVANTIQO_VIDEO_ATOMIC_REPAIR_MISSING_${name}"; exit 1; }
          done

          endpoint="$(curl -fsS "${auth[@]}" "${REST}/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          test "$(printf '%s' "$endpoint" | jq -r '.id')" = "$ENDPOINT_ID"
          test "$(printf '%s' "$endpoint" | jq -r '.name')" = "$ENDPOINT_NAME"
          test "$(printf '%s' "$endpoint" | jq -r '([.networkVolumeId,.networkVolumeIds[]?] | map(if type=="object" then (.networkVolumeId // .id) else . end) | map(select(. != null and . != "")) | length)')" = '0'
          old_template_id="$(printf '%s' "$endpoint" | jq -r '.templateId // .template.id // empty')"
          test -n "$old_template_id"
          template="$(curl -fsS "${auth[@]}" "${REST}/templates/${old_template_id}")"
          image="$(printf '%s' "$template" | jq -r '.imageName // empty')"
          test -n "$image"

          # Preserve existing env but refresh the gated-model credentials explicitly.
          env_array="$(printf '%s' "$template" | jq -c --arg token "$HF_TOKEN" --arg revision "$MODEL_REVISION" '
            (.env // {}) + {
              HF_TOKEN:$token,
              HUGGING_FACE_HUB_TOKEN:$token,
              HUGGINGFACE_TOKEN:$token,
              MODEL_NAME:"Lightricks/LTX-2.5",
              MODEL_REVISION:$revision,
              HF_HUB_OFFLINE:"1",
              TRANSFORMERS_OFFLINE:"1",
              AVANTIQO_VIDEO_LTX25_PIPELINE_ROOT:"/opt/LTX-2",
              AVANTIQO_VIDEO_LTX25_HARD_TIMEOUT_SECONDS:"1800"
            } | to_entries | map({key:.key,value:(.value|tostring)})')"

          # Current RunPod-documented NVIDIA endpoint types with >=80GB VRAM.
          gpu_pool='["NVIDIA B200","NVIDIA H200","NVIDIA H200 NVL","NVIDIA RTX PRO 6000 Blackwell Server Edition","NVIDIA RTX PRO 6000 Blackwell Workstation Edition","NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition","NVIDIA H100 NVL","NVIDIA H100 80GB HBM3","NVIDIA H100 PCIe","NVIDIA A100-SXM4-80GB","NVIDIA A100 80GB PCIe"]'

          health_before="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          echo "AVANTIQO_VIDEO_ATOMIC_REPAIR_HEALTH_BEFORE=$(printf '%s' "$health_before" | jq -c '{jobs:.jobs,workers:.workers}')"

          # Stop autoscaling only; do not cancel or submit a request.
          curl -fsS -X PATCH "${auth[@]}" "${json[@]}" -d '{"workersMin":0,"workersMax":0}' "${REST}/endpoints/${ENDPOINT_ID}" >/dev/null
          for i in $(seq 1 18); do
            h="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
            total="$(printf '%s' "$h" | jq '(.workers // {}) | [.[]] | add // 0')"
            [ "$total" = '0' ] && break
            sleep 5
          done

          target_input="$(jq -cn \
            --arg id "$ENDPOINT_ID" \
            --arg name "$ENDPOINT_NAME" \
            --arg image "$image" \
            --arg model "$MODEL_REFERENCE" \
            --argjson env "$env_array" \
            --argjson gpu "$gpu_pool" '
            {
              id:$id,
              name:$name,
              template:{name:"avantiqo-video-ltx25-native-master-serverless-v1",imageName:$image,containerDiskInGb:30,dockerArgs:"",env:$env},
              gpuIds:$gpu,
              gpuCount:1,
              instanceIds:[],
              workersMin:0,
              workersMax:1,
              locations:"",
              networkVolumeId:"",
              networkVolumeIds:[],
              idleTimeout:5,
              scalerType:"REQUEST_COUNT",
              scalerValue:1,
              executionTimeoutMs:2100000,
              minCudaVersion:"12.8",
              flashBootType:"OFF",
              modelReferences:[$model]
            }')"
          mutation='mutation Save($input: EndpointInput!){saveEndpoint(input:$input){id name templateId gpuIds workersMin workersMax locations networkVolumeId networkVolumeIds{networkVolumeId dataCenterId} idleTimeout minCudaVersion flashBootType modelReferences}}'
          payload="$(jq -cn --arg query "$mutation" --argjson input "$target_input" '{query:$query,variables:{input:$input}}')"
          response="$(curl -fsS "${auth[@]}" "${json[@]}" -d "$payload" "$GRAPH")"
          if [ "$(printf '%s' "$response" | jq '.errors | length // 0')" != '0' ]; then
            printf '%s\n' "$response" | jq -c '{errors:.errors}' >&2
            # Ensure the existing job is not left permanently parked if GraphQL rejects the repair.
            curl -sS -X PATCH "${auth[@]}" "${json[@]}" -d '{"workersMin":0,"workersMax":1}' "${REST}/endpoints/${ENDPOINT_ID}" >/dev/null || true
            exit 1
          fi

          new_template_id="$(printf '%s' "$response" | jq -r '.data.saveEndpoint.templateId // empty')"
          test -n "$new_template_id"
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.workersMin')" = '0'
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.workersMax')" = '1'
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.flashBootType')" = 'OFF'
          test "$(printf '%s' "$response" | jq -r --arg model "$MODEL_REFERENCE" '.data.saveEndpoint.modelReferences | index($model) != null')" = 'true'
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.networkVolumeIds | length')" = '0'
          test "$(printf '%s' "$response" | jq -r '.data.saveEndpoint.gpuIds | length')" -ge 8

          verified_template="$(curl -fsS "${auth[@]}" "${REST}/templates/${new_template_id}")"
          test "$(printf '%s' "$verified_template" | jq -r '.imageName')" = "$image"
          test "$(printf '%s' "$verified_template" | jq -r '.containerDiskInGb')" = '30'
          test -n "$(printf '%s' "$verified_template" | jq -r '.env.HF_TOKEN // empty')"

          if [ "$new_template_id" != "$old_template_id" ]; then
            endpoints="$(curl -fsS "${auth[@]}" "${REST}/endpoints")"
            old_refs="$(printf '%s' "$endpoints" | jq --arg id "$old_template_id" '[.[] | select((.templateId // .template.id // "") == $id)] | length')"
            if [ "$old_refs" = '0' ]; then
              curl -fsS -X DELETE "${auth[@]}" "${REST}/templates/${old_template_id}" >/dev/null
              echo "AVANTIQO_VIDEO_ATOMIC_REPAIR_OLD_TEMPLATE_REMOVED=${old_template_id}"
            fi
          fi

          sleep 12
          health_after="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" "${QUEUE}/health")"
          echo "AVANTIQO_VIDEO_ATOMIC_REPAIR_HEALTH_AFTER=$(printf '%s' "$health_after" | jq -c '{jobs:.jobs,workers:.workers}')"
          echo "AVANTIQO_VIDEO_ATOMIC_REPAIR_TEMPLATE=${new_template_id}"
          echo "AVANTIQO_VIDEO_ATOMIC_REPAIR_GPU_POOL=${gpu_pool}"
          echo 'AVANTIQO_VIDEO_ATOMIC_REPAIR_FLASHBOOT=OFF'
          echo 'AVANTIQO_VIDEO_ATOMIC_REPAIR_MODEL_PRESERVED=true'
          echo 'AVANTIQO_VIDEO_ATOMIC_REPAIR_EXISTING_JOB_PRESERVED=true'
          echo 'AVANTIQO_VIDEO_ATOMIC_REPAIR_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_ATOMIC_REPAIR_NETWORK_VOLUME=false'
          echo 'AVANTIQO_VIDEO_ATOMIC_REPAIR_PRODUCTION_DEPLOY=false'
