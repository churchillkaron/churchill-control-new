name: Avantiqo Video Native Master Serverless Migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate-avantiqo-video-runpod-cached-model-v1-ci.mjs
      - services/avantiqo-video-engine/ltx25_native_master_serverless.py
      - services/avantiqo-video-engine/Dockerfile.ltx25.native-master-serverless
      - .github/workflows/avantiqo-video-ltx25-native-master-serverless-migrate.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-video-native-master-serverless-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENDPOINT_ID: xmey8y2hofexyp
      ENDPOINT_NAME: avantiqo-cinema-production-v1
      IMAGE_REPO: ghcr.io/churchillkaron/avantiqo-video-ltx25-native-master-serverless
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_INFERENCE_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY || secrets.RUNPOD_MANAGEMENT_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate migration source and gated full-dev access
        shell: bash
        run: |
          set -euo pipefail
          for name in RUNPOD_MANAGEMENT_API_KEY RUNPOD_INFERENCE_KEY HF_TOKEN; do
            test -n "${!name:-}" || { echo "AVANTIQO_VIDEO_SERVERLESS_MIGRATION_MISSING_${name}"; exit 1; }
          done
          node --check scripts/migrate-avantiqo-video-runpod-cached-model-v1-ci.mjs
          python3 -m py_compile services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'MASTER_WIDTH = 3840' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'MASTER_HEIGHT = 2176' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'ltx_pipelines.ti2vid_one_stage' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          grep -Fq 'ltx-2.5-22b-dev-transformer-bf16.safetensors' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          ! grep -Fq 'distilled-transformer' services/avantiqo-video-engine/ltx25_native_master_serverless.py
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${HF_TOKEN}" \
            'https://huggingface.co/Lightricks/LTX-2.5/resolve/main/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors?download=false')"
          case "$code" in
            200|302|303|307|308) echo 'AVANTIQO_VIDEO_FULL_DEV_ACCESS=PASS' ;;
            *) echo "AVANTIQO_VIDEO_FULL_DEV_ACCESS=FAIL_HTTP_${code}"; exit 1 ;;
          esac
          echo 'AVANTIQO_VIDEO_SERVERLESS_SOURCE_GATE=PASS'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable native-master serverless image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-video-engine
          file: services/avantiqo-video-engine/Dockerfile.ltx25.native-master-serverless
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=avantiqo-video-native-master-serverless
          cache-to: type=gha,mode=max,scope=avantiqo-video-native-master-serverless

      - name: Migrate existing production endpoint with zero GPU
        shell: bash
        env:
          AVANTIQO_VIDEO_SERVERLESS_IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          AVANTIQO_VIDEO_CACHED_MODEL_MIGRATION_APPROVED: YES
        run: |
          set -euo pipefail
          node scripts/migrate-avantiqo-video-runpod-cached-model-v1-ci.mjs

      - name: Confirm migration used no GPU generation
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_MANAGEMENT_API_KEY}" \
            "https://rest.runpod.io/v1/endpoints/${ENDPOINT_ID}?includeTemplate=true&includeWorkers=true")"
          health="$(curl -fsS -H "Authorization: Bearer ${RUNPOD_INFERENCE_KEY}" \
            "https://api.runpod.ai/v2/${ENDPOINT_ID}/health")"
          test "$(printf '%s' "$endpoint" | jq -r '.workersMin')" = '0'
          test "$(printf '%s' "$endpoint" | jq -r '.workersMax')" = '1'
          active_workers="$(printf '%s' "$endpoint" | jq '[.workers[]? | select(((.status // .workerStatus // .runtimeStatus // .desiredStatus // "") | ascii_upcase) as $s | ($s != "EXITED" and $s != "STOPPED" and $s != "TERMINATED" and $s != "DELETED"))] | length')"
          test "$active_workers" = '0'
          test "$(printf '%s' "$health" | jq '(.jobs.inQueue // .jobs.in_queue // 0)')" = '0'
          test "$(printf '%s' "$health" | jq '(.jobs.inProgress // .jobs.in_progress // 0)')" = '0'
          echo 'AVANTIQO_VIDEO_SERVERLESS_ZERO_IDLE_CONTROL_PLANE=PASS'
          echo 'AVANTIQO_VIDEO_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_INFERENCE_PERFORMED=false'
          echo 'AVANTIQO_VIDEO_PRODUCTION_WEB_DEPLOY=false'
