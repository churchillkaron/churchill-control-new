name: Avantiqo Video Native Master Serverless Migration (Legacy Parked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy migration path is parked
        run: |
          set -euo pipefail
          echo 'AVANTIQO_VIDEO_LEGACY_CACHED_MODEL_MIGRATION_PARKED=true'
          echo 'AVANTIQO_VIDEO_CANONICAL_ENDPOINT=xmey8y2hofexyp'
          echo 'AVANTIQO_VIDEO_CANONICAL_TEMPLATE=l84730vvj0'
          echo 'AVANTIQO_VIDEO_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_RUNPOD_MUTATION_PERFORMED=false'
          echo 'AVANTIQO_VIDEO_PRODUCTION_DEPLOY_PERFORMED=false'
