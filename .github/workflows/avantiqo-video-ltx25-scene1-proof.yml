name: Avantiqo Video LTX-2.5 Scene 1 Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avantiqo-video-ltx25-scene1-proof.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: avantiqo-video-ltx25-scene1-proof
  cancel-in-progress: false

jobs:
  render-scene-1:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      V5_SOURCE_SHA: 897b1409dcba14e4d39519fd2b574813beeeae95
      AVANTIQO_VIDEO_SCENE1_ORGANIZATION_ID: 9a148429-b6a0-4bc6-ac83-a35c64fb7045
      AVANTIQO_VIDEO_SCENE1_OPENING_FRAME: ${{ github.workspace }}/assets/video/proofs/avantiqo_first_shot_frame_transport.jpg
      AVANTIQO_VIDEO_SCENE1_OUTPUT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1.mp4
      AVANTIQO_VIDEO_SCENE1_REPORT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-proof.json

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact approved Scene 1 opening frame
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re
          root = pathlib.Path('assets/video/proofs')
          parts = sorted(root.glob('scene1_frame.part-*.b64'))
          if len(parts) != 6:
              raise SystemExit(f'AVANTIQO_VIDEO_SCENE1_FRAME_PART_COUNT_INVALID:{len(parts)}')
          expected_part_lengths = [7000, 7000, 7000, 7000, 7000, 6836]
          for part, expected in zip(parts, expected_part_lengths):
              value = re.sub(r'[^A-Za-z0-9+/=]', '', part.read_text(encoding='utf-8'))
              print(f'AVANTIQO_VIDEO_SCENE1_PART={part.name}:{len(value)}:{expected}')
          text = ''.join(p.read_text(encoding='utf-8') for p in parts)
          compact = re.sub(r'[^A-Za-z0-9+/=]', '', text)
          target_digest = 'cbf4437d77f74b2fd0193f9039ef64c511b597712fe08c466c30d4c231aeb0c5'
          expected_b64_chars = 41836
          expected_bytes = 31376

          def exact(value):
              try:
                  raw = base64.b64decode(value, validate=True)
              except Exception:
                  return None
              if len(raw) != expected_bytes:
                  return None
              if hashlib.sha256(raw).hexdigest() != target_digest:
                  return None
              return raw

          raw = exact(compact)
          if raw is None and len(compact) > expected_b64_chars:
              delta = len(compact) - expected_b64_chars
              print(f'AVANTIQO_VIDEO_SCENE1_FRAME_SURPLUS_CHARS={delta}')
              if delta > 512:
                  raise SystemExit('AVANTIQO_VIDEO_SCENE1_FRAME_SURPLUS_TOO_LARGE')
              found = None
              for offset in range(0, len(compact) - delta + 1, 4):
                  candidate = compact[:offset] + compact[offset + delta:]
                  if exact(candidate) is not None:
                      found = (offset, candidate)
                      break
              if found is None:
                  for offset in range(0, len(compact) - delta + 1):
                      if offset % 4 == 0:
                          continue
                      candidate = compact[:offset] + compact[offset + delta:]
                      if exact(candidate) is not None:
                          found = (offset, candidate)
                          break
              if found is not None:
                  offset, compact = found
                  raw = exact(compact)
                  print(f'AVANTIQO_VIDEO_SCENE1_FRAME_INSERTION_RECOVERED_AT={offset}')
          if raw is None:
              raise SystemExit('AVANTIQO_VIDEO_SCENE1_FRAME_EXACT_RECOVERY_FAILED')
          target = pathlib.Path(os.environ['AVANTIQO_VIDEO_SCENE1_OPENING_FRAME'])
          target.write_bytes(raw)
          print(f'AVANTIQO_VIDEO_SCENE1_FRAME_B64_CHARS={len(compact)}')
          print(f'AVANTIQO_VIDEO_SCENE1_FRAME_BYTES={len(raw)}')
          print(f'AVANTIQO_VIDEO_SCENE1_FRAME_SHA256={hashlib.sha256(raw).hexdigest()}')
          if raw[:2] != b'\xff\xd8' or raw[-2:] != b'\xff\xd9':
              raise SystemExit('AVANTIQO_VIDEO_SCENE1_FRAME_JPEG_BOUNDARY_INVALID')
          print('AVANTIQO_VIDEO_SCENE1_APPROVED_FRAME=PASS')
          PY

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Fetch and verify pinned V5 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${V5_SOURCE_SHA}"
          git cat-file -e "${V5_SOURCE_SHA}^{commit}"
          test "$(git show "${V5_SOURCE_SHA}:services/avantiqo-video-engine/Dockerfile.ltx25" | grep -c 'LTX2_COMMIT=a95ab856bf29407b6b066ede0abe1846050db56c')" = "1"
          test "$(git show "${V5_SOURCE_SHA}:services/avantiqo-video-engine/ltx25_worker_v2.py" | grep -c 'RUNTIME_CONTRACT = "AVANTIQO_VIDEO_LTX25_BLACKWELL_V1"')" = "1"
          echo 'AVANTIQO_VIDEO_LTX25_V5_SOURCE_PIN=PASS'

      - name: Prepare immutable V5 build context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/avantiqo-video-ltx25-v5
          mkdir -p /tmp/avantiqo-video-ltx25-v5
          git show "${V5_SOURCE_SHA}:services/avantiqo-video-engine/Dockerfile.ltx25" > /tmp/avantiqo-video-ltx25-v5/Dockerfile
          git show "${V5_SOURCE_SHA}:services/avantiqo-video-engine/ltx25_worker_v2.py" > /tmp/avantiqo-video-ltx25-v5/ltx25_worker_v2.py
          cat >> /tmp/avantiqo-video-ltx25-v5/Dockerfile <<'DOCKER'
          LABEL org.opencontainers.image.source="https://github.com/churchillkaron/churchill-control-new" \
                org.opencontainers.image.revision="897b1409dcba14e4d39519fd2b574813beeeae95" \
                avantiqo.video.runtime="AVANTIQO_VIDEO_LTX25_BLACKWELL_V1" \
                avantiqo.video.release="scene1-proof-only"
          DOCKER
          python3 -m py_compile /tmp/avantiqo-video-ltx25-v5/ltx25_worker_v2.py
          echo 'AVANTIQO_VIDEO_LTX25_V5_BUILD_CONTEXT=PASS'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable V5 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: /tmp/avantiqo-video-ltx25-v5
          file: /tmp/avantiqo-video-ltx25-v5/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/churchillkaron/avantiqo-video-ltx25-v5:scene1-${{ github.run_id }}
          provenance: false
          sbom: false

      - name: Verify immutable image digest
        id: image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "${IMAGE_DIGEST}" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "AVANTIQO_VIDEO_LTX25_IMAGE_DIGEST_INVALID:${IMAGE_DIGEST}"; exit 1 ;;
          esac
          immutable="ghcr.io/churchillkaron/avantiqo-video-ltx25-v5@${IMAGE_DIGEST}"
          echo "immutable=${immutable}" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_VIDEO_LTX25_IMMUTABLE_IMAGE=${immutable}"

      - name: Patch proof runner for official split model repositories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-avantiqo-video-ltx25-scene1-proof-ci.mjs')
          s = p.read_text()
          old = """        for name in missing:\n            hf_hub_download(repo_id=repo, filename=name, revision=revision, token=token, local_dir=str(root))"""
          new = """        for name in missing:\n            if name.startswith('loras/'):\n                source_repo = 'Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler'\n                source_name = name.split('/', 1)[1]\n                source_revision = HfApi(token=token).model_info(repo_id=source_repo, token=token).sha\n                if not source_revision:\n                    raise RuntimeError('AVANTIQO_VIDEO_LTX25_DETAILING_REVISION_REQUIRED')\n                downloaded = Path(hf_hub_download(repo_id=source_repo, filename=source_name, revision=source_revision, token=token, local_dir=str(root / '.sources' / 'detailing-lora')))\n                target = root / name\n                target.parent.mkdir(parents=True, exist_ok=True)\n                target.write_bytes(downloaded.read_bytes())\n            else:\n                hf_hub_download(repo_id=repo, filename=name, revision=revision, token=token, local_dir=str(root))"""
          if old not in s:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_PRELOAD_PATCH_TARGET_MISSING')
          s = s.replace(old, new, 1)
          old_env = """        AVANTIQO_VIDEO_LTX25_MODEL_ROOT: \"/runpod-volume/ltx-2.5\",\n      },\n      command: [\"python\", \"-u\", \"-c\", preloadPython()],"""
          new_env = """        AVANTIQO_VIDEO_LTX25_MODEL_ROOT: \"/runpod-volume/ltx-2.5\",\n        ...(process.env.HF_TOKEN ? { HF_TOKEN: process.env.HF_TOKEN } : {}),\n      },\n      command: [\"python\", \"-u\", \"-c\", preloadPython()],"""
          if old_env not in s:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_HF_FORWARD_PATCH_TARGET_MISSING')
          s = s.replace(old_env, new_env, 1)
          p.write_text(s)
          print('AVANTIQO_VIDEO_LTX25_OFFICIAL_MODEL_SOURCE_PATCH=PASS')
          PY
          node --check scripts/run-avantiqo-video-ltx25-scene1-proof-ci.mjs

      - name: Render Scene 1 through owned V5
        env:
          NODE_ENV: development
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AVANTIQO_VIDEO_LTX25_IMAGE: ${{ steps.image.outputs.immutable }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${AVANTIQO_VIDEO_SCENE1_OPENING_FRAME}"
          node scripts/run-avantiqo-video-ltx25-scene1-proof-ci.mjs
          test -s "${AVANTIQO_VIDEO_SCENE1_OUTPUT}"
          test -s "${AVANTIQO_VIDEO_SCENE1_REPORT}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.AVANTIQO_VIDEO_SCENE1_REPORT, 'utf8'));
          if (report.success !== true) throw new Error(report.error_code || 'SCENE1_REPORT_FAILED');
          if (report.production_deploy_performed !== false) throw new Error('PRODUCTION_DEPLOY_BOUNDARY_BROKEN');
          if (report.old_video_renderer_used !== false) throw new Error('OLD_VIDEO_RENDERER_USED');
          if (report.generation?.external_provider_contacted !== false) throw new Error('EXTERNAL_PROVIDER_CONTACTED');
          if (report.generation?.pixel_720p_stage_used !== false) throw new Error('720P_STAGE_USED');
          if (report.generation?.lanczos_upscale_used !== false) throw new Error('PIXEL_UPSCALE_USED');
          console.log('AVANTIQO_VIDEO_LTX25_SCENE1_FINAL_GATE=PASS');
          NODE

      - name: Upload Scene 1 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-scene1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            avantiqo-video-ltx25-scene1.mp4
            avantiqo-video-ltx25-scene1-proof.json
