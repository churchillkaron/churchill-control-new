# Scene 1 proof: reuse the already-built immutable V5 image and go straight to cache/render.
name: Avantiqo Video LTX-2.5 Scene 1 Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-ltx25-scene1-proof.yml
      - scripts/reconstruct-avantiqo-video-scene1-frame-ci.py
      - scripts/run-avantiqo-video-ltx25-scene1-distilled-proof-ci.mjs
      - scripts/avantiqo-video-ltx25-distilled-scene-worker.py
      - assets/video/proofs/scene1_frame.part-*.b64

permissions:
  contents: read

concurrency:
  group: avantiqo-video-ltx25-scene1-proof
  cancel-in-progress: true

jobs:
  render-scene-1:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      V5_SOURCE_SHA: 897b1409dcba14e4d39519fd2b574813beeeae95
      AVANTIQO_VIDEO_LTX25_IMAGE: ghcr.io/churchillkaron/avantiqo-video-ltx25-v5@sha256:63fac5692fb3a038b24c2cdac44f88e452e8ee25744693456391c50259b9eb20
      AVANTIQO_VIDEO_SCENE1_ORGANIZATION_ID: 9a148429-b6a0-4bc6-ac83-a35c64fb7045
      AVANTIQO_VIDEO_SCENE1_OPENING_FRAME: ${{ github.workspace }}/assets/video/proofs/avantiqo_first_shot_frame_transport.jpg
      AVANTIQO_VIDEO_SCENE1_OUTPUT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1.mp4
      AVANTIQO_VIDEO_SCENE1_REPORT: ${{ github.workspace }}/avantiqo-video-ltx25-scene1-proof.json
      VERCEL_PROJECT_ID: prj_5K2x3kGkhs3d2PU8VOQQPyNT24A9
      VERCEL_TEAM_ID: team_40jy42BqQOs4U6pVdkawwEfp

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact approved Scene 1 opening frame
        run: python3 scripts/reconstruct-avantiqo-video-scene1-frame-ci.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Verify pinned V5 source and immutable image contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${V5_SOURCE_SHA}"
          git cat-file -e "${V5_SOURCE_SHA}^{commit}"
          git show "${V5_SOURCE_SHA}:services/avantiqo-video-engine/Dockerfile.ltx25" | grep -F 'LTX2_COMMIT=a95ab856bf29407b6b066ede0abe1846050db56c'
          git show "${V5_SOURCE_SHA}:services/avantiqo-video-engine/ltx25_worker_v2.py" | grep -F 'RUNTIME_CONTRACT = "AVANTIQO_VIDEO_LTX25_BLACKWELL_V1"'
          case "${AVANTIQO_VIDEO_LTX25_IMAGE}" in
            ghcr.io/churchillkaron/avantiqo-video-ltx25-v5@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "AVANTIQO_VIDEO_LTX25_IMAGE_NOT_IMMUTABLE:${AVANTIQO_VIDEO_LTX25_IMAGE}"; exit 1 ;;
          esac
          node --check scripts/run-avantiqo-video-ltx25-scene1-distilled-proof-ci.mjs
          python3 -m py_compile scripts/avantiqo-video-ltx25-distilled-scene-worker.py
          echo 'AVANTIQO_VIDEO_LTX25_V5_SOURCE_AND_DISTILLED_WORKER_PIN=PASS'

      - name: Prepare capacity-resilient Scene 1 attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runner = Path('scripts/run-avantiqo-video-ltx25-scene1-distilled-proof-ci.mjs')
          source = runner.read_text()

          pool = '''const SCENE_GPU_POOL = Object.freeze([
            "NVIDIA B200",
            "NVIDIA RTX PRO 6000 Blackwell Server Edition",
            "NVIDIA RTX PRO 6000 Blackwell Workstation Edition",
            "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition",
            "NVIDIA A100 80GB PCIe",
            "NVIDIA RTX PRO 4500 Blackwell",
          ]);'''
          source, count = re.subn(
              r'const SCENE_GPU_POOL = Object\.freeze\(\[.*?\n\]\);',
              pool,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_SCENE_GPU_POOL_PATCH_FAILED')

          old_placement = '''return status === 500 && (message.includes("no instances currently available") || message.includes("no instances"));'''
          new_placement = '''return status === 500 && (
              message.includes("no instances currently available") ||
              message.includes("no instances") ||
              message.includes("not available") ||
              message.includes("unavailable") ||
              message.includes("no matching")
            );'''
          if old_placement not in source:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_PLACEMENT_PATCH_TARGET_MISSING')
          source = source.replace(old_placement, new_placement, 1)

          replacement = '''async function createFromPool({ snapshot, name, imageName, gpuPool, minRamGb, env, command }) {
            let last = null;
            const attempts = Math.max(1, Number(process.env.AVANTIQO_VIDEO_LTX25_PLACEMENT_ATTEMPTS || 30));
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              for (const gpuTypeId of gpuPool) {
                try {
                  const pod = await createExactPod({ snapshot, name, imageName, gpuTypeId, minRamGb, env, command });
                  console.log(`AVANTIQO_VIDEO_SCENE1_GPU_SELECTED=${pod.gpu_type_id}:attempt=${attempt}`);
                  return pod;
                } catch (error) {
                  last = error;
                  if (!placementUnavailable(error)) throw error;
                  console.log(`AVANTIQO_VIDEO_SCENE1_GPU_UNAVAILABLE=${gpuTypeId}:attempt=${attempt}`);
                }
              }
              if (attempt < attempts) {
                console.log(`AVANTIQO_VIDEO_SCENE1_GPU_CAPACITY_WAIT=30s:attempt=${attempt}/${attempts}`);
                await sleep(30_000);
              }
            }
            throw last || new Error("AVANTIQO_VIDEO_SCENE1_GPU_POOL_EXHAUSTED");
          }

          function preloadPython'''
          source, count = re.subn(
              r'async function createFromPool\(\{ snapshot, name, imageName, gpuPool, minRamGb, env, command \}\) \{.*?\n\}\n\nfunction preloadPython',
              replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_CAPACITY_RETRY_PATCH_FAILED')

          old_preload = '''    const preload = await runPreload(await videoPodCandidateSnapshot());
              report.preload = {
                success: true,
                revision: preload.revision,
                file_count: preload.files.length,
                total_bytes: preload.files.reduce((sum, item) => sum + Number(item.size_bytes || 0), 0),
              };'''
          new_preload = '''    report.preload = {
                success: true,
                revision: "CACHED_EXISTING_PROVEN_RUN_33350171235",
                file_count: REQUIRED_MODEL_FILES.length,
                total_bytes: null,
                cache_proof_run_id: "33350171235",
              };
              console.log("AVANTIQO_VIDEO_LTX25_DISTILLED_PRELOAD=REUSED_CACHED_EXISTING_PROOF");'''
          if old_preload not in source:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_PRELOAD_REUSE_PATCH_TARGET_MISSING')
          source = source.replace(old_preload, new_preload, 1)
          source = source.replace('minRamGb: 96,', 'minRamGb: 64,', 1)
          runner.write_text(source)

          worker = Path('scripts/avantiqo-video-ltx25-distilled-scene-worker.py')
          worker_source = worker.read_text()
          old_args = '''        "--prompt",
                  cinematic_instruction(data),
                  "--image",'''
          new_args = '''        "--prompt",
                  cinematic_instruction(data),
                  "--quantization",
                  "fp8-cast",
                  "--offload",
                  "cpu",
                  "--image",'''
          if old_args not in worker_source:
              raise SystemExit('AVANTIQO_VIDEO_LTX25_LOW_VRAM_WORKER_PATCH_TARGET_MISSING')
          worker_source = worker_source.replace(old_args, new_args, 1)
          worker_source = worker_source.replace('"precision": "BF16",', '"precision": "FP8_CAST_BF16_SOURCE",', 1)
          worker.write_text(worker_source)

          print('AVANTIQO_VIDEO_LTX25_CAPACITY_RESILIENT_PATCH=PASS')
          PY
          node --check scripts/run-avantiqo-video-ltx25-scene1-distilled-proof-ci.mjs
          python3 -m py_compile scripts/avantiqo-video-ltx25-distilled-scene-worker.py

      - name: Recover existing LTX-2.5 credential
        env:
          HF_TOKEN_SECRET: ${{ secrets.HF_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recover-avantiqo-video-hf-token-ci.mjs

      - name: Render Scene 1 through owned V5
        env:
          NODE_ENV: development
          AVANTIQO_VIDEO_LTX25_PLACEMENT_ATTEMPTS: '30'
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
          RUNPOD_AVANTIQO_VIDEO_API_KEY: ${{ secrets.RUNPOD_AVANTIQO_VIDEO_API_KEY || secrets.RUNPOD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-video-ltx25-scene1-distilled-proof-ci.mjs
          test -s "${AVANTIQO_VIDEO_SCENE1_OUTPUT}"
          test -s "${AVANTIQO_VIDEO_SCENE1_REPORT}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.AVANTIQO_VIDEO_SCENE1_REPORT, 'utf8'));
          if (report.success !== true) throw new Error(report.error_code || 'SCENE1_REPORT_FAILED');
          if (report.production_deploy_performed !== false) throw new Error('PRODUCTION_DEPLOY_BOUNDARY_BROKEN');
          if (report.old_video_renderer_used !== false) throw new Error('OLD_VIDEO_RENDERER_USED');
          if (report.separately_gated_detailing_lora_used !== false) throw new Error('GATED_DETAILING_LORA_USED');
          if (report.generation?.external_provider_contacted !== false) throw new Error('EXTERNAL_PROVIDER_CONTACTED');
          if (report.generation?.pixel_720p_stage_used !== false) throw new Error('720P_STAGE_USED');
          if (report.generation?.lanczos_upscale_used !== false) throw new Error('PIXEL_UPSCALE_USED');
          console.log('AVANTIQO_VIDEO_LTX25_SCENE1_FINAL_GATE=PASS');
          NODE

      - name: Upload Scene 1 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-ltx25-scene1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            avantiqo-video-ltx25-scene1.mp4
            avantiqo-video-ltx25-scene1-proof.json
