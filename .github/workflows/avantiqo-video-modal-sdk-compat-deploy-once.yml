name: Avantiqo Video Modal SDK Compatibility Deploy Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-modal-sdk-compat-deploy-once.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-video-modal-sdk-compat-deploy-once
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Redeploy Video Modal transport sibling sources once'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      AVANTIQO_VIDEO_REAL_INFERENCE_APPROVED: "NO"
      AVANTIQO_VIDEO_GPU_EXECUTION_ALLOWED: "NO"
      AVANTIQO_VIDEO_PROVIDER_CALLS_ALLOWED: "NO"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install compatible Modal SDKs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'
          npm ci --ignore-scripts
          python - <<'PY'
          import modal
          print('MODAL_PYTHON_SDK_VERSION=' + modal.__version__)
          PY

      - name: Zero-GPU source admission
        run: |
          set -euo pipefail
          test "$AVANTIQO_VIDEO_REAL_INFERENCE_APPROVED" = "NO"
          test "$AVANTIQO_VIDEO_GPU_EXECUTION_ALLOWED" = "NO"
          test "$AVANTIQO_VIDEO_PROVIDER_CALLS_ALLOWED" = "NO"
          python -m py_compile \
            services/avantiqo-video-engine/modal_app.py \
            services/avantiqo-video-engine/modal_deploy.py \
            services/avantiqo-video-engine/modal_native_job.py \
            services/avantiqo-video-engine/modal_native_controlled_master.py
          grep -F '.add_local_python_source("modal_app")' services/avantiqo-video-engine/modal_native_job.py >/dev/null
          grep -F '.add_local_python_source("modal_native_controlled_master")' services/avantiqo-video-engine/modal_native_job.py >/dev/null
          echo 'VIDEO_TRANSPORT_SIBLING_SOURCE_ADMISSION=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Redeploy complete owned Video Modal surface
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          cd services/avantiqo-video-engine
          modal deploy modal_deploy.py
          echo 'AVANTIQO_VIDEO_MODAL_COMPLETE_SURFACE_DEPLOY=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Prove JavaScript Service Runtime lookup without spawn
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import * as modal from 'modal';
          const tokenId = String(process.env.MODAL_TOKEN_ID || '').trim();
          const tokenSecret = String(process.env.MODAL_TOKEN_SECRET || '').trim();
          if (!tokenId || !tokenSecret) throw new Error('MODAL_CREDENTIALS_REQUIRED');
          const client = new modal.ModalClient({ tokenId, tokenSecret });
          const fn = await client.functions.fromName('avantiqo-video-owned', 'generate_native_job');
          if (!fn) throw new Error('AVANTIQO_VIDEO_MODAL_JS_LOOKUP_MISSING');
          console.log('AVANTIQO_VIDEO_MODAL_JS_FROM_NAME=PASS');
          console.log('MODAL_SPAWN_COUNT=0');
          console.log('GPU_INFERENCE_PERFORMED=false');
          NODE

      - name: Prove transport container cold-starts before any GPU boundary
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import * as modal from 'modal';
          const tokenId = String(process.env.MODAL_TOKEN_ID || '').trim();
          const tokenSecret = String(process.env.MODAL_TOKEN_SECRET || '').trim();
          const client = new modal.ModalClient({ tokenId, tokenSecret });
          const fn = await client.functions.fromName('avantiqo-video-owned', 'generate_native_job');
          let failedAsExpected = false;
          try {
            await fn.remote({});
          } catch (error) {
            const message = String(error?.message || error || '');
            console.log('VIDEO_TRANSPORT_COLD_START_ERROR=' + message.replace(/\s+/g, ' ').slice(0, 500));
            if (message.includes('AVANTIQO_VIDEO_LTX25_MODAL_CAPABILITY_INVALID')) failedAsExpected = true;
          }
          if (!failedAsExpected) throw new Error('VIDEO_TRANSPORT_COLD_START_DID_NOT_REACH_VALIDATION');
          console.log('AVANTIQO_VIDEO_TRANSPORT_COLD_START_IMPORT=PASS');
          console.log('INVALID_PROBE_GPU_GENERATION_CALLS=0');
          console.log('PAID_GPU_INFERENCE_PERFORMED=false');
          NODE

      - name: Preserve release boundary
        if: always()
        run: |
          echo 'GPU_INFERENCE_PERFORMED=false'
          echo 'PAID_GPU_INFERENCE_PERFORMED=false'
          echo 'MODAL_PAID_SPAWN_COUNT=0'
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'VIDEO_PRICING_ACTIVATED=false'
          echo 'VIDEO_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'RUNPOD_USED=false'
