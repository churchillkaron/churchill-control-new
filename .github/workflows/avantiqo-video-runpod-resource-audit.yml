name: Avantiqo Video RunPod Resource Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit-avantiqo-video-runpod-resources-ci.mjs
      - .github/workflows/avantiqo-video-runpod-resource-audit.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-video-runpod-resource-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENDPOINT_ID: xmey8y2hofexyp
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inventory Video RunPod resources only
        run: node scripts/audit-avantiqo-video-runpod-resources-ci.mjs
      - name: Inspect RunPod Model Repository for LTX read-only
        shell: bash
        run: |
          set -euo pipefail
          wget --quiet https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          echo 'AVANTIQO_VIDEO_MODEL_REPO_LTX_SEARCH_START=true'
          /tmp/runpodctl model list --all --name 'LTX' --output=json || true
          /tmp/runpodctl model list --all --name 'ltx' --output=json || true
          /tmp/runpodctl model list --all --provider 'Lightricks' --output=json || true
          echo 'AVANTIQO_VIDEO_MODEL_REPO_LTX_SEARCH_COMPLETE=true'
      - name: Capture Serverless container startup logs read-only
        shell: bash
        run: |
          set -euo pipefail
          wget --quiet https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          set +e
          timeout 12s /tmp/runpodctl serverless logs "$ENDPOINT_ID" --source container > /tmp/video-serverless-container.log 2>&1
          rc=$?
          set -e
          echo "AVANTIQO_VIDEO_SERVERLESS_LOG_CAPTURE_RC=${rc}"
          tail -n 100 /tmp/video-serverless-container.log
          echo 'AVANTIQO_VIDEO_SERVERLESS_LOG_CAPTURE_COMPLETE=true'
