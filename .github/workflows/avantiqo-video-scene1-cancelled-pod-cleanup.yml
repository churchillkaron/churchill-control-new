name: Avantiqo Video Scene 1 Cancelled Pod Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-scene1-cancelled-pod-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avantiqo-video-scene1-cancelled-pod-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4

      - name: Delete orphan Scene 1 pods only
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { podRest, podTerminal, text } from './lib/platform/service-runtime/providers/avantiqo-video/AvantiqoVideoPodRunpod.js';

          const prefix = 'avantiqo-video-ltx25-scene1-distilled-';
          const list = async () => {
            const raw = await podRest('/pods');
            return Array.isArray(raw) ? raw : Array.isArray(raw?.pods) ? raw.pods : Array.isArray(raw?.data) ? raw.data : [];
          };

          const pods = await list();
          const matches = pods.filter((pod) => text(pod?.name).startsWith(prefix) && !podTerminal(pod));
          console.log(`AVANTIQO_VIDEO_ORPHAN_SCENE1_PODS_FOUND=${matches.length}`);
          for (const pod of matches) {
            const id = text(pod?.id);
            if (!id) throw new Error('AVANTIQO_VIDEO_ORPHAN_SCENE1_POD_ID_REQUIRED');
            console.log(`AVANTIQO_VIDEO_ORPHAN_SCENE1_POD=${text(pod?.name)}:${id}`);
            await podRest(`/pods/${encodeURIComponent(id)}`, { method: 'DELETE' });
            console.log(`AVANTIQO_VIDEO_ORPHAN_SCENE1_POD_DELETE_REQUESTED=${id}`);
          }

          const deadline = Date.now() + 120000;
          while (Date.now() < deadline) {
            const remaining = (await list()).filter((pod) => text(pod?.name).startsWith(prefix) && !podTerminal(pod));
            if (!remaining.length) {
              console.log('AVANTIQO_VIDEO_ORPHAN_SCENE1_POD_CLEANUP=PASS');
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error('AVANTIQO_VIDEO_ORPHAN_SCENE1_POD_CLEANUP_TIMEOUT');
          NODE
