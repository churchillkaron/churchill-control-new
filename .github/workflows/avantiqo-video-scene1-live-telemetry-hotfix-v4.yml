name: Prepare Safe Sequential Native-4K Investor Render V2 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-video-scene1-live-telemetry-hotfix-v4.yml

permissions:
  contents: write

concurrency:
  group: avantiqo-investor-full-render-prepare
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare safe sequential native-4K investor render v2 once'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair full 24-second runner without GPU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-avantiqo-investor-visual-proof-24s.mjs')
          source = path.read_text()

          helper_marker = 'async function main() {'
          helper = '''async function cancelGeneratedCall(client, functionCallId, reason) {\n  if (!functionCallId) return;\n  try {\n    const sameCall = await client.functionCalls.fromId(functionCallId);\n    await sameCall.cancel({ terminateContainers: true });\n    console.error(`AVANTIQO_INVESTOR_PROOF_FUNCTION_CALL_CANCELLED=${functionCallId}:reason=${reason}`);\n  } catch (error) {\n    console.error(`AVANTIQO_INVESTOR_PROOF_FUNCTION_CALL_CANCEL_FAILED=${functionCallId}:${text(error?.message)}`);\n  }\n}\n\nasync function generateOneShot(client, worker, item) {\n  let functionCallId = \"\";\n  const deadline = Date.now() + MAX_GENERATION_WAIT_SECONDS * 1000;\n  try {\n    const call = await worker.spawn([item.payload]);\n    functionCallId = text(call.functionCallId);\n    ensure(functionCallId, `FUNCTION_CALL_ID_REQUIRED:${item.index + 1}`);\n    console.log(`AVANTIQO_INVESTOR_PROOF_FUNCTION_CALL_${item.index + 1}=${functionCallId}`);\n    let polls = 0;\n    for (;;) {\n      polls += 1;\n      if (Date.now() >= deadline) {\n        throw new Error(`${CONTRACT}_GENERATION_DEADLINE_EXCEEDED:${item.index + 1}:${MAX_GENERATION_WAIT_SECONDS}s`);\n      }\n      const sameCall = await client.functionCalls.fromId(functionCallId);\n      try {\n        const result = await sameCall.get({ timeoutMs: 0 });\n        ensure(result?.success === true, `GENERATION_FAILED:${item.index + 1}`);\n        ensure(result?.gpu_generation_calls === 1, `GPU_CALL_COUNT_INVALID:${item.index + 1}`);\n        ensure(Number(result?.width) === WIDTH && Number(result?.height) === MODEL_HEIGHT, `MODEL_DIMENSIONS_INVALID:${item.index + 1}`);\n        return { ...item, functionCallId, polls, result };\n      } catch (error) {\n        if (error instanceof modal.FunctionTimeoutError && /Timeout exceeded:\\s*0ms/i.test(text(error?.message))) {\n          if (polls % 6 === 0) console.log(`AVANTIQO_INVESTOR_PROOF_PENDING_${item.index + 1}=${polls}`);\n          await sleep(10000);\n          continue;\n        }\n        throw error;\n      }\n    }\n  } catch (error) {\n    await cancelGeneratedCall(client, functionCallId, `shot-${item.index + 1}-failure`);\n    throw error;\n  }\n}\n\n'''
          if 'async function generateOneShot(client, worker, item)' not in source:
              if helper_marker not in source:
                  raise SystemExit('AVANTIQO_INVESTOR_FULL_RUNNER_MAIN_MARKER_MISSING')
              source = source.replace(helper_marker, helper + helper_marker, 1)

          if 'Promise.all(prepared.map' in source:
              start_marker = '  console.log(JSON.stringify({ event: "AVANTIQO_INVESTOR_VISUAL_PROOF_SPAWN"'
              end_marker = '  const normalizedFiles = [];'
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('AVANTIQO_INVESTOR_FULL_RUNNER_GENERATION_BLOCK_MISSING')
              replacement = '''  console.log(JSON.stringify({ event: "AVANTIQO_INVESTOR_VISUAL_PROOF_SEQUENTIAL_START", shot_count: prepared.length, total_duration_seconds: TARGET_DURATION, gpu_jobs: prepared.length, simultaneous_gpu_jobs: 1, automatic_paid_retry: false }));\n  const completed = [];\n  for (const item of prepared) {\n    console.log(`AVANTIQO_INVESTOR_PROOF_SHOT_START=${item.index + 1}:${item.shot.id}`);\n    const generated = await generateOneShot(client, worker, item);\n    completed.push(generated);\n    console.log(`AVANTIQO_INVESTOR_PROOF_SHOT_COMPLETE=${item.index + 1}:${item.shot.id}`);\n  }\n\n'''
              source = source[:start] + replacement + source[end:]

          path.write_text(source)
          PY

          node --check scripts/run-avantiqo-investor-visual-proof-24s.mjs
          grep -F 'async function generateOneShot(client, worker, item)' scripts/run-avantiqo-investor-visual-proof-24s.mjs >/dev/null
          grep -F 'cancel({ terminateContainers: true })' scripts/run-avantiqo-investor-visual-proof-24s.mjs >/dev/null
          grep -F 'simultaneous_gpu_jobs: 1' scripts/run-avantiqo-investor-visual-proof-24s.mjs >/dev/null
          if grep -F 'Promise.all(prepared.map' scripts/run-avantiqo-investor-visual-proof-24s.mjs >/dev/null; then
            echo 'AVANTIQO_INVESTOR_PARALLEL_PAID_SPAWN_REMAINS' >&2
            exit 1
          fi
          echo 'AVANTIQO_INVESTOR_FULL_RUNNER_SEQUENTIAL_GATE=PASS'
          echo 'SIMULTANEOUS_B200_GENERATIONS=1'
          echo 'AUTOMATIC_PAID_RETRY=false'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Commit safe runner to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'churchillkaron'
          git config user.email 'patric@pcsphuket.com'
          git add scripts/run-avantiqo-investor-visual-proof-24s.mjs
          if git diff --cached --quiet; then
            echo 'AVANTIQO_INVESTOR_FULL_RUNNER_ALREADY_SAFE=true'
          else
            git commit -m 'Make investor 24s render sequential and cancellable [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo 'PAID_VIDEO_GENERATION_SUBMITTED=false'
