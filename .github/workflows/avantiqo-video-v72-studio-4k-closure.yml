name: Avantiqo Video V72 Studio 4K Closure

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-video-v72-studio-4k-closure-request.json

permissions:
  contents: read

concurrency:
  group: avantiqo-video-v72-studio-4k-closure
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AVANTIQO_VIDEO_V72_STUDIO_4K_REPORT: /tmp/avantiqo-video-v72-studio-4k.json

    steps:
      - name: Checkout exact closure commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate closure credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "AVANTIQO_VIDEO_V72_STUDIO_4K_CREDENTIAL_MISSING=$name"
              exit 1
            fi
          done

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Install Studio media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate zero-GPU Video boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-avantiqo-video-v72-studio-4k-closure-ci.mjs
          node --check lib/creative/video/runtime/CreativeVideoStudioMasterRuntime.js
          grep -F 'backend: "STUDIO_CPU_FFMPEG_LANCZOS"' lib/creative/video/runtime/CreativeVideoStudioMasterRuntime.js
          grep -F 'gpu_compute_used: false' lib/creative/video/runtime/CreativeVideoStudioMasterRuntime.js
          grep -F 'paid_provider_contacted: false' lib/creative/video/runtime/CreativeVideoStudioMasterRuntime.js

      - name: Run zero-GPU Studio 4K closure
        env:
          AVANTIQO_VIDEO_V72_STUDIO_4K_CLOSURE_APPROVED: "YES"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-video-v72-studio-4k-closure-ci.mjs | tee /tmp/avantiqo-video-v72-studio-4k.log

      - name: Upload sanitized closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-v72-studio-4k-${{ github.run_id }}
          path: |
            /tmp/avantiqo-video-v72-studio-4k.json
            /tmp/avantiqo-video-v72-studio-4k.log
          if-no-files-found: warn
          retention-days: 14
