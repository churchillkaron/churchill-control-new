name: Avantiqo Video Worker Image

on:
  push:
    branches:
      - main
    paths:
      - audits/avantiqo-video-worker-image-request.json

permissions:
  contents: write
  packages: write

concurrency:
  group: avantiqo-video-worker-image
  cancel-in-progress: true

jobs:
  build-video-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Video worker source lock
        shell: bash
        run: |
          set -euo pipefail
          test -f services/avantiqo-video-engine/Dockerfile
          test -f services/avantiqo-video-engine/handler.py
          test -f services/avantiqo-video-engine/handler_v2.py
          test -f services/avantiqo-video-engine/handler_v3.py
          test -f services/avantiqo-video-engine/requirements.txt
          grep -F 'COPY handler.py ./handler.py' services/avantiqo-video-engine/Dockerfile
          grep -F 'COPY handler_v2.py ./handler_v2.py' services/avantiqo-video-engine/Dockerfile
          grep -F 'COPY handler_v3.py ./handler_v3.py' services/avantiqo-video-engine/Dockerfile
          grep -F 'CMD ["python", "-u", "handler_v3.py"]' services/avantiqo-video-engine/Dockerfile
          grep -F 'ENGINE_CONTRACT = "AVANTIQO_SYNTHETIC_VIDEO_ENGINE_V1"' services/avantiqo-video-engine/handler.py
          grep -F 'DEFAULT_CERTIFIED_CAPABILITIES = {' services/avantiqo-video-engine/handler.py
          grep -F 'EXTEND_CAPABILITY = "ai.video.extend"' services/avantiqo-video-engine/handler_v2.py
          grep -F 'UPSCALE_CAPABILITY = "ai.video.upscale"' services/avantiqo-video-engine/handler_v2.py
          grep -F 'legacy.IMPLEMENTED_CAPABILITIES.update(SPECIAL_CAPABILITIES)' services/avantiqo-video-engine/handler_v2.py
          grep -F 'RUNTIME_ENTRYPOINT_REVISION = "AVANTIQO_VIDEO_HANDLER_V3_WAN22_A14B_DEFAULT_ROUTING_V1"' services/avantiqo-video-engine/handler_v3.py
          grep -F 'RUNTIME_REVISION = "AVANTIQO_VIDEO_WAN22_A14B_DEFAULT_ROUTING_CACHE_V1"' services/avantiqo-video-engine/handler_v3.py
          grep -F 'DEFAULT_ROUTING_CONTRACT = "AVANTIQO_VIDEO_WAN22_A14B_DEFAULT_GENERATION_ROUTING_V1"' services/avantiqo-video-engine/handler_v3.py
          grep -F 'DEFAULT_T2V_MODEL = "Wan-AI/Wan2.2-T2V-A14B-Diffusers"' services/avantiqo-video-engine/handler_v3.py
          grep -F 'DEFAULT_I2V_MODEL = "Wan-AI/Wan2.2-I2V-A14B-Diffusers"' services/avantiqo-video-engine/handler_v3.py
          grep -F '"generation_requested": False' services/avantiqo-video-engine/handler_v3.py
          grep -F '"inference_performed": False' services/avantiqo-video-engine/handler_v3.py
          grep -F '"model_download_performed": False' services/avantiqo-video-engine/handler_v3.py
          grep -F '"storage_mutation_performed": False' services/avantiqo-video-engine/handler_v3.py
          python -m py_compile \
            services/avantiqo-video-engine/handler.py \
            services/avantiqo-video-engine/handler_v2.py \
            services/avantiqo-video-engine/handler_v3.py
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_PREFLIGHT=PASS'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_TRIGGER_SHA_BOUND=true'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_PRODUCTION_WEB_DEPLOY=false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$GITHUB_SHA"
          short_sha="${release_sha:0:12}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/avantiqo-video-worker"
          tag="${image}:sha-${short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "AVANTIQO_VIDEO_WORKER_IMAGE_TAG=$tag"

      - name: Build and push immutable Video worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/avantiqo-video-engine
          file: services/avantiqo-video-engine/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=avantiqo-video-worker
          cache-to: type=gha,mode=max,scope=avantiqo-video-worker

      - name: Create sanitized immutable image evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.image.outputs.release_sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          test "$RELEASE_SHA" = "$TRIGGER_SHA"
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "AVANTIQO_VIDEO_WORKER_IMAGE_DIGEST_INVALID"; exit 1 ;;
          esac
          mkdir -p /tmp/avantiqo-video-worker-image
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const repository = process.env.IMAGE_REPOSITORY;
          const digest = process.env.IMAGE_DIGEST;
          const report = {
            success: true,
            contract: "AVANTIQO_VIDEO_WORKER_IMAGE_RESULT_V2",
            evidence_revision: "AVANTIQO_VIDEO_WORKER_IMAGE_V3_WAN22_A14B_DEFAULT_ROUTING_V1",
            source_sha: process.env.RELEASE_SHA || null,
            trigger_sha: process.env.TRIGGER_SHA || null,
            source_sha_matches_trigger: process.env.RELEASE_SHA === process.env.TRIGGER_SHA,
            github_run_id: process.env.BUILD_RUN_ID || null,
            image_repository: repository,
            image_tag: process.env.IMAGE_TAG || null,
            image_digest: digest,
            immutable_image_reference: `${repository}@${digest}`,
            source_path: "services/avantiqo-video-engine",
            entrypoint: "handler_v3.py",
            entrypoint_revision: "AVANTIQO_VIDEO_HANDLER_V3_WAN22_A14B_DEFAULT_ROUTING_V1",
            runtime_revision: "AVANTIQO_VIDEO_WAN22_A14B_DEFAULT_ROUTING_CACHE_V1",
            engine_contract: "AVANTIQO_SYNTHETIC_VIDEO_ENGINE_V1",
            default_generation_routing_contract: "AVANTIQO_VIDEO_WAN22_A14B_DEFAULT_GENERATION_ROUTING_V1",
            default_generation_routing_enabled: true,
            configured_text_to_video_foundation: "Wan-AI/Wan2.2-T2V-A14B-Diffusers",
            configured_image_to_video_foundation: "Wan-AI/Wan2.2-I2V-A14B-Diffusers",
            request_foundation_override_applied: false,
            runtime_probe_contract: "AVANTIQO_VIDEO_RUNTIME_PROBE_V1",
            cache_capacity_evidence_contract: "AVANTIQO_VIDEO_CACHE_CAPACITY_EVIDENCE_V1",
            default_certified_capabilities: [
              "ai.video.generate",
              "ai.video.image_to_video",
            ],
            implemented_extended_capabilities: [
              "ai.video.first_last_frame_to_video",
              "ai.video.video_to_video",
              "ai.video.edit",
              "ai.video.inpaint",
              "ai.video.extend",
              "ai.video.upscale",
            ],
            immutable_digest_required: true,
            exact_trigger_sha_binding_required: true,
            provider_job_submitted: false,
            video_generation_submitted: false,
            inference_performed: false,
            model_download_submitted: false,
            storage_mutation_performed: false,
            runpod_endpoint_mutation_performed: false,
            automatic_production_routing_enabled: false,
            production_web_deploy: false,
            pricing_activation_performed: false,
            secrets_in_output: false,
          };
          if (!report.source_sha_matches_trigger) {
            throw new Error("AVANTIQO_VIDEO_WORKER_IMAGE_SOURCE_TRIGGER_MISMATCH");
          }
          writeFileSync(
            "/tmp/avantiqo-video-worker-image/avantiqo-video-worker-image.json",
            `${JSON.stringify(report)}\n`,
            "utf8",
          );
          NODE

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-video-worker-image-${{ steps.image.outputs.short_sha }}
          path: /tmp/avantiqo-video-worker-image/avantiqo-video-worker-image.json
          if-no-files-found: error
          retention-days: 14

      - name: Record sanitized image evidence on newest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B video-worker-image-evidence origin/main
          mkdir -p audits/results
          cp /tmp/avantiqo-video-worker-image/avantiqo-video-worker-image.json \
            audits/results/avantiqo-video-worker-image.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/results/avantiqo-video-worker-image.json
          if git diff --cached --quiet; then
            echo "No Video worker image result change to commit."
            exit 0
          fi
          git commit -m "Record Video worker image result"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "AVANTIQO_VIDEO_WORKER_IMAGE_EVIDENCE_PUSH_FAILED"
          exit 1

      - name: Confirm isolated worker image build
        shell: bash
        run: |
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_BUILD=PASS'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_SOURCE_TRIGGER_MATCH=true'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_ENTRYPOINT=handler_v3.py'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_T2V_FOUNDATION=Wan-AI/Wan2.2-T2V-A14B-Diffusers'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_I2V_FOUNDATION=Wan-AI/Wan2.2-I2V-A14B-Diffusers'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_PROVIDER_JOB_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_GENERATION_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_MODEL_DOWNLOAD_SUBMITTED=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_RUNPOD_ENDPOINT_MUTATION=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_AUTOMATIC_PRODUCTION_ROUTING=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_PRODUCTION_WEB_DEPLOY=false'
          echo 'AVANTIQO_VIDEO_WORKER_IMAGE_PRICING_ACTIVATION=false'
