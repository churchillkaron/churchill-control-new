name: Avantiqo Voice Modal Direct Function Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-voice-modal-preload-deploy.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-voice-modal-direct-function-deploy
  cancel-in-progress: false

jobs:
  deploy-voice-direct-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zero-cost direct-function source gates
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/platform/service-runtime/providers/avantiqo-voice/AvantiqoVoiceModalDirectRuntime.js
          node --test tests/avantiqo-voice-modal-direct-transport.test.mjs
          python -m py_compile services/avantiqo-voice-modal/modal_app.py
          grep -Fq '@app.function(' services/avantiqo-voice-modal/modal_app.py
          ! grep -Fq '@app.cls(' services/avantiqo-voice-modal/modal_app.py
          ! grep -Fq '@modal.enter()' services/avantiqo-voice-modal/modal_app.py
          grep -Fq 'def transcribe(' services/avantiqo-voice-modal/modal_app.py
          grep -Fq 'def speak(' services/avantiqo-voice-modal/modal_app.py
          grep -Fq 'sha256:960ee663a65aa085b46373aa279b91394e95aa7a89da7625f86446eb1122445f' services/avantiqo-voice-modal/modal_app.py
          grep -Fq 'AVANTIQO_VOICE_STT_LOCAL_MODEL_PATH' services/avantiqo-voice-modal/modal_app.py
          test "$(grep -Fc 'min_containers=0' services/avantiqo-voice-modal/modal_app.py)" -eq 2
          test "$(grep -Fc 'max_containers=1' services/avantiqo-voice-modal/modal_app.py)" -eq 2
          test "$(grep -Fc 'buffer_containers=0' services/avantiqo-voice-modal/modal_app.py)" -eq 2
          grep -Fq 'scaledown_window=5' services/avantiqo-voice-modal/modal_app.py
          grep -Fq 'client.functions.fromName(APP_NAME, functionName' lib/platform/service-runtime/providers/avantiqo-voice/AvantiqoVoiceModalDirectRuntime.js
          grep -Fq 'client.functionCalls.fromId(parsed.callId)' lib/platform/service-runtime/providers/avantiqo-voice/AvantiqoVoiceModalDirectRuntime.js
          echo 'AVANTIQO_VOICE_MODAL_DIRECT_FUNCTION_STATIC_GATE=PASS'

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'modal==1.5.5'
          modal --version

      - name: Require Modal deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          echo 'AVANTIQO_VOICE_MODAL_DIRECT_DEPLOY_CREDENTIALS=PASS'

      - name: Recreate Voice direct-function deployment
        shell: bash
        run: |
          set -euo pipefail
          cd services/avantiqo-voice-modal
          modal deploy --strategy recreate modal_app.py
          echo 'AVANTIQO_VOICE_MODAL_DIRECT_FUNCTION_DEPLOY=PASS'
          echo 'GPU_INFERENCE_PERFORMED=false'

      - name: Verify deployed direct functions are idle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import modal

          app_name = "avantiqo-voice-owned"
          reports = []
          for function_name in ("transcribe", "speak"):
              fn = modal.Function.from_name(app_name, function_name)
              stats = fn.get_current_stats()
              backlog = int(getattr(stats, "backlog", 0) or 0)
              runners = int(getattr(stats, "num_total_runners", 0) or 0)
              if backlog != 0 or runners != 0:
                  raise RuntimeError(
                      f"AVANTIQO_VOICE_MODAL_DIRECT_POST_DEPLOY_NOT_IDLE:{function_name}:"
                      f"backlog={backlog}:runners={runners}"
                  )
              reports.append((function_name, backlog, runners))
          print(f"AVANTIQO_VOICE_MODAL_DIRECT_POST_DEPLOY_IDLE=PASS functions={reports}")
          print("GPU_INFERENCE_PERFORMED=false")
          PY

      - name: Preserve release boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'VOICE_PRICING_ACTIVATED=false'
          echo 'VOICE_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'RUNPOD_USED=false'
          echo 'PAID_STT_TTS_JOB_SUBMITTED=false'
          echo 'MODAL_CPU_GATEWAY_USED=false'
