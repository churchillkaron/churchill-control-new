name: Avantiqo Voice Modal Recovery Certification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/avantiqo-voice-modal-recovery-certification.yml

permissions:
  contents: read

concurrency:
  group: avantiqo-voice-modal-recovery-certification
  cancel-in-progress: false

jobs:
  recover-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://vfsjqabpkcbiuerhzugk.supabase.co
      AVANTIQO_VOICE_ENGINE_ENABLED: "YES"
      AVANTIQO_VOICE_MODAL_CHAINED_REAL_INFERENCE_APPROVED: "YES"
      AVANTIQO_VOICE_MODAL_CHAIN_RECOVER_TTS_USAGE_ID: 824b0b2e-fa9c-4c32-84a4-4d55ee0125e1
      AVANTIQO_VOICE_MODAL_CHAIN_ALLOWED_FAILED_STT_USAGE_ID: d7d02e4e-506b-4d5e-9d6a-d5d2f51cfa93
      AVANTIQO_VOICE_MODAL_CHAIN_CERT_EXPECTED_MAIN_COMMIT: ${{ github.sha }}
      AVANTIQO_VOICE_MODAL_CHAIN_CERT_SOURCE_MAIN_COMMIT: ${{ github.sha }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Zero-cost direct-function source gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/assert-avantiqo-voice-modal-chain-stt-idempotency.mjs
          node --check scripts/certify-avantiqo-voice-modal-chained-service-live.mjs
          node --check lib/platform/service-runtime/providers/avantiqo-voice/AvantiqoVoiceModalDirectRuntime.js
          node --test tests/avantiqo-voice-modal-direct-transport.test.mjs
          node --test tests/secretary-voice-runtime-safety.test.mjs
          grep -Fq 'client.functions.fromName' lib/platform/service-runtime/providers/avantiqo-voice/AvantiqoVoiceModalDirectRuntime.js
          grep -Fq 'modal.functions.fromName' scripts/certify-avantiqo-voice-modal-chained-service-live.mjs
          grep -Fq 'DIRECT_NAMED_FUNCTIONS' scripts/certify-avantiqo-voice-modal-chained-service-live.mjs
          grep -Fq 'AVANTIQO_VOICE_STT_LOCAL_MODEL_PATH' services/avantiqo-voice-modal/modal_app.py
          grep -Fq 'sha256:960ee663a65aa085b46373aa279b91394e95aa7a89da7625f86446eb1122445f' services/avantiqo-voice-modal/modal_app.py
          if grep -Fq 'modal.cls.fromName' scripts/certify-avantiqo-voice-modal-chained-service-live.mjs; then
            echo 'CLASS_TRANSPORT_FORBIDDEN'
            exit 1
          fi
          echo 'AVANTIQO_VOICE_DIRECT_RECOVERY_STATIC_GATE=PASS'

      - name: Require recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo 'AVANTIQO_VOICE_RECOVERY_CREDENTIALS=PASS'

      - name: Prove exact historical TTS and single failed STT exception
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-avantiqo-voice-modal-chain-stt-idempotency.mjs

      - name: Resume with exactly one replacement STT
        shell: bash
        run: |
          set -euo pipefail
          node scripts/certify-avantiqo-voice-modal-chained-service-live.mjs --resume

      - name: Preserve release boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'PRODUCTION_VERCEL_DEPLOY_PERFORMED=false'
          echo 'VOICE_PRICING_ACTIVATED=false'
          echo 'VOICE_PRODUCTION_ROUTING_ACTIVATED=false'
          echo 'RUNPOD_USED=false'
          echo 'NEW_TTS_JOB_ALLOWED=false'
          echo 'MAX_NEW_STT_JOBS=1'
          echo 'VOICE_MODAL_TRANSPORT=direct-named-functions'

      - name: Upload Voice certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-voice-modal-recovery-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            local-audit-output/avantiqo-voice-modal-chained-service-certification/state.json
            local-audit-output/avantiqo-voice-modal-chained-service-certification/report.json
            local-audit-output/avantiqo-voice-modal-chained-service-certification/tts-exact-stored.wav
