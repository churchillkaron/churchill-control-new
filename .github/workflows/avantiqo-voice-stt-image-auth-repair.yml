name: Avantiqo Voice STT Image Auth Repair

on:
  issues:
    types: [opened]

permissions:
  contents: read
  packages: read
  issues: read

concurrency:
  group: avantiqo-voice-stt-image-auth-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.title == 'AVANTIQO_VOICE_STT_IMAGE_AUTH_REPAIR_EXECUTE_20260829'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_MANAGEMENT_API_KEY: ${{ secrets.RUNPOD_MANAGEMENT_API_KEY }}
      GHCR_USERNAME: churchillkaron
      GHCR_TOKEN: ${{ github.token }}
      AVANTIQO_VOICE_STT_GHCR_AUTH_REPAIR_APPROVED: 'YES'
      AVANTIQO_VOICE_STT_OFFLINE_RUNTIME_PROBE_APPROVED: 'YES'

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Voice-only repair source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/repair-avantiqo-voice-stt-ghcr-auth-local.mjs
          node --check scripts/run-avantiqo-voice-stt-offline-image-runtime-probe-local.mjs
          if [ -z "${RUNPOD_MANAGEMENT_API_KEY:-}" ]; then
            echo 'VOICE_STT_REPAIR_PREFLIGHT_BLOCKED=RUNPOD_MANAGEMENT_API_KEY'
            exit 1
          fi

      - name: Repair STT immutable image and registry auth
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-avantiqo-voice-stt-ghcr-auth-local.mjs --apply | tee /tmp/avantiqo-voice-stt-image-auth-repair.log

      - name: Open v2 Voice STT probe lease
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { appendFileSync } from 'node:fs';
          const text = (v) => String(v ?? '').trim();
          const key = text(process.env.RUNPOD_MANAGEMENT_API_KEY);
          const queueKey = text(process.env.RUNPOD_API_KEY) || key;
          if (!key) throw new Error('RUNPOD_MANAGEMENT_API_KEY_REQUIRED');
          async function request(url, apiKey, options = {}) {
            const res = await fetch(url, {
              method: options.method || 'GET',
              headers: { Authorization: `Bearer ${apiKey}`, Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}) },
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const raw = await res.text();
            let body = {};
            try { body = raw ? JSON.parse(raw) : {}; } catch {}
            if (!res.ok) throw new Error(`HTTP_${res.status}:${String(body?.message || body?.error || raw).slice(0,300)}`);
            return body;
          }
          const rowsBody = await request('https://rest.runpod.io/v1/endpoints?includeTemplate=true&includeWorkers=true', key);
          const rows = Array.isArray(rowsBody) ? rowsBody : (rowsBody.endpoints || rowsBody.data || rowsBody.items || rowsBody.results || []);
          const matches = rows.filter((row) => text(row?.name) === 'avantiqo-voice-stt-v1');
          if (matches.length !== 1) throw new Error(`VOICE_STT_ENDPOINT_MATCHES_${matches.length}`);
          const endpointId = text(matches[0]?.id);
          if (!endpointId) throw new Error('VOICE_STT_ENDPOINT_ID_REQUIRED');
          const health = await request(`https://api.runpod.ai/v2/${encodeURIComponent(endpointId)}/health`, queueKey);
          const jobs = health?.jobs || {};
          const queued = Number(jobs.inQueue ?? jobs.in_queue ?? 0);
          const progress = Number(jobs.inProgress ?? jobs.in_progress ?? 0);
          if (queued !== 0 || progress !== 0) throw new Error(`VOICE_STT_QUEUE_NOT_CLEAN:${queued}/${progress}`);
          await request(`https://api.runpod.io/v2/serverless/${encodeURIComponent(endpointId)}`, key, {
            method: 'PATCH',
            body: { workers: { min: 0, max: 1, idleTimeout: 5 } },
          });
          const verified = await request(`https://api.runpod.io/v2/serverless/${encodeURIComponent(endpointId)}`, key);
          const workers = verified?.workers || {};
          if (Number(workers.min) !== 0 || Number(workers.max) !== 1 || Number(workers.idleTimeout) !== 5) {
            throw new Error(`VOICE_STT_V2_OPEN_VERIFY_FAILED:${workers.min}/${workers.max}/${workers.idleTimeout}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `AVANTIQO_RUNPOD_SAFE_LEASE_ACTIVE=YES\n`);
          appendFileSync(process.env.GITHUB_ENV, `AVANTIQO_RUNPOD_SAFE_LEASE_CONTRACT=AVANTIQO_RUNPOD_SAFE_LEASE_V2\n`);
          appendFileSync(process.env.GITHUB_ENV, `AVANTIQO_RUNPOD_SAFE_LEASE_LANE=voice-stt\n`);
          appendFileSync(process.env.GITHUB_ENV, `AVANTIQO_RUNPOD_SAFE_LEASE_ENDPOINT_ID=${endpointId}\n`);
          appendFileSync(process.env.GITHUB_ENV, `AVANTIQO_RUNPOD_SAFE_LEASE_EXPIRES_AT=${new Date(Date.now() + 5 * 60_000).toISOString()}\n`);
          appendFileSync(process.env.GITHUB_ENV, `AVANTIQO_VOICE_STT_REPAIR_ENDPOINT_ID=${endpointId}\n`);
          console.log(JSON.stringify({ success: true, endpoint_name: 'avantiqo-voice-stt-v1', workers_min: 0, workers_max: 1, idle_timeout: 5, management_api: 'SERVERLESS_V2_NESTED_WORKERS', secrets_printed: false }));
          NODE

      - name: Prove STT image pull and runtime boot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-avantiqo-voice-stt-offline-image-runtime-probe-local.mjs | tee /tmp/avantiqo-voice-stt-runtime-probe.log

      - name: Restore Voice STT to permanent 0/0
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const text = (v) => String(v ?? '').trim();
          const endpointId = text(process.env.AVANTIQO_VOICE_STT_REPAIR_ENDPOINT_ID || process.env.AVANTIQO_RUNPOD_SAFE_LEASE_ENDPOINT_ID);
          const key = text(process.env.RUNPOD_MANAGEMENT_API_KEY);
          const queueKey = text(process.env.RUNPOD_API_KEY) || key;
          if (!endpointId || !key) throw new Error('VOICE_STT_CLEANUP_BINDING_REQUIRED');
          async function request(url, apiKey, options = {}) {
            const res = await fetch(url, {
              method: options.method || 'GET',
              headers: { Authorization: `Bearer ${apiKey}`, Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}) },
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const raw = await res.text();
            let body = {};
            try { body = raw ? JSON.parse(raw) : {}; } catch {}
            if (!res.ok) throw new Error(`HTTP_${res.status}:${String(body?.message || body?.error || raw).slice(0,300)}`);
            return body;
          }
          try { await request(`https://api.runpod.ai/v2/${encodeURIComponent(endpointId)}/purge-queue`, queueKey, { method: 'POST' }); } catch {}
          await request(`https://api.runpod.io/v2/serverless/${encodeURIComponent(endpointId)}`, key, {
            method: 'PATCH',
            body: { workers: { min: 0, max: 0, idleTimeout: 5 } },
          });
          const deadline = Date.now() + 180000;
          let latest = null;
          while (Date.now() < deadline) {
            const endpoint = await request(`https://api.runpod.io/v2/serverless/${encodeURIComponent(endpointId)}`, key);
            const inv = await request(`https://api.runpod.io/v2/serverless/${encodeURIComponent(endpointId)}/workers`, key);
            const health = await request(`https://api.runpod.ai/v2/${encodeURIComponent(endpointId)}/health`, queueKey);
            const w = endpoint?.workers || {};
            const active = Array.isArray(inv) ? inv.length : (Array.isArray(inv?.workers) ? inv.workers.length : (Array.isArray(inv?.data?.workers) ? inv.data.workers.length : 0));
            const jobs = health?.jobs || {};
            const queued = Number(jobs.inQueue ?? jobs.in_queue ?? 0);
            const progress = Number(jobs.inProgress ?? jobs.in_progress ?? 0);
            latest = { min: Number(w.min), max: Number(w.max), idleTimeout: Number(w.idleTimeout), active, queued, progress };
            if (latest.min === 0 && latest.max === 0 && latest.idleTimeout === 5 && active === 0 && queued === 0 && progress === 0) {
              console.log(JSON.stringify({ success: true, permanent_rest_state: latest, secrets_printed: false }));
              process.exit(0);
            }
            await new Promise((r) => setTimeout(r, 3000));
          }
          throw new Error(`VOICE_STT_CLEANUP_TIMEOUT:${JSON.stringify(latest)}`);
          NODE

      - name: Upload Voice STT repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-voice-stt-image-auth-repair-${{ github.run_id }}
          path: |
            /tmp/avantiqo-voice-stt-image-auth-repair.log
            /tmp/avantiqo-voice-stt-runtime-probe.log
          if-no-files-found: warn
          retention-days: 14
