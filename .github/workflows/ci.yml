name: Churchill CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: churchill-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  finance-worldclass:
    name: Finance world-class certification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit Finance workflow
        run: node scripts/audit-finance-worldclass-workflow.mjs

      - name: Certify Finance work programs
        run: node scripts/audit-finance-work-programs.mjs

      - name: Certify Finance engagement workpapers
        run: node scripts/audit-finance-engagement-workpapers.mjs

      - name: Audit Finance capability closure
        run: node scripts/finance-closeout-audit.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit Finance capability closure
        run: node scripts/finance-closeout-audit.mjs

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          OPENAI_API_KEY: test
        run: npm run build

      - name: Verify Supabase migrations folder
        run: |
          test -d supabase/migrations

      - name: Verify environment files ignored
        run: |
          if git ls-files | grep -E '^\.env($|\.local|\.development|\.production)'; then
            echo "ERROR: Environment files committed"
            exit 1
          fi

      - name: Verify backups ignored
        run: |
          if git ls-files | grep backups; then
            echo "ERROR: Backups committed"
            exit 1
          fi

  private12-v17-one-shot:
    name: Private12 V17 native-MTP certification
    if: github.event_name == 'push' && github.event.head_commit.message == 'Trigger one Private12 V17 via CI carrier'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.2.6'

      - name: Zero-cost V17 native-MTP admission
        run: |
          set -euo pipefail
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_canary_runtime_v10.py
          python -m py_compile services/avantiqo-code-engine/modal_code_qwen38_private12_v17_cert.py
          python -m py_compile services/avantiqo-code-engine/verify_private12_v17_native_mtp.py
          PYTHONPATH=services/avantiqo-code-engine python services/avantiqo-code-engine/verify_private12_v17_native_mtp.py
          echo 'AVANTIQO_CODE_QWEN38_PRIVATE12_V17_ADMISSION=PASS'

      - name: Prove candidate marker before H100
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m \
            python -m modal run services/avantiqo-code-engine/modal_code_model_canary_preflight.py \
            2>&1 | tee /tmp/qwen38-private12-v17-preflight.log
          grep -q '"single_code_storage":true' /tmp/qwen38-private12-v17-preflight.log
          grep -q '"candidate_already_ready":true' /tmp/qwen38-private12-v17-preflight.log
          grep -q '"gpu_used":false' /tmp/qwen38-private12-v17-preflight.log
          grep -q '"model_download_performed":false' /tmp/qwen38-private12-v17-preflight.log
          grep -q '"volume_created":false' /tmp/qwen38-private12-v17-preflight.log
          grep -q '"production_deploy_performed":false' /tmp/qwen38-private12-v17-preflight.log
          grep -q '"production_routing_change":false' /tmp/qwen38-private12-v17-preflight.log

      - name: Derive fresh sealed suite secret
        run: |
          set -euo pipefail
          secret="$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_SHA}:avantiqo-qwen38-private12-v17" | sha256sum | awk '{print $1}')"
          echo "::add-mask::${secret}"
          echo "AVANTIQO_CODE_PRIVATE_SUITE_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Run one native-MTP Qwen3.8 Private12 V17 certification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.AVANTIQO_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.AVANTIQO_MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            python -m modal run \
            services/avantiqo-code-engine/modal_code_qwen38_private12_v17_cert.py::qwen38_private12_v17 \
            --approved 2>&1 | tee /tmp/qwen38-private12-v17.log
          grep -q '"cases":12' /tmp/qwen38-private12-v17.log
          grep -q '"passed":12' /tmp/qwen38-private12-v17.log
          grep -q '"hidden_tests_passed":12' /tmp/qwen38-private12-v17.log
          grep -q '"regression_tests_passed":12' /tmp/qwen38-private12-v17.log
          grep -q '"semantic_review_passed":12' /tmp/qwen38-private12-v17.log
          grep -q '"worldclass_certified":true' /tmp/qwen38-private12-v17.log
          grep -q 'AVANTIQO_CODE_QWEN38_PRIVATE12_CERT_V17=PASS' /tmp/qwen38-private12-v17.log

      - name: Upload V17 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-code-qwen38-private12-v17-${{ github.run_id }}
          path: |
            /tmp/qwen38-private12-v17-preflight.log
            /tmp/qwen38-private12-v17.log
          if-no-files-found: warn
          retention-days: 14
