name: One-shot Code planner prompt budget convergence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/code-ai-planner-prompt-budget-convergence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-ai-planner-prompt-budget-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Refetch newest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install dependencies without lifecycle effects
        run: npm ci --ignore-scripts
      - name: Apply bounded planner transport and run zero-provider gates
        run: |
          node scripts/patch-code-ai-planner-prompt-budget-once.mjs
          node --check lib/code/runtime/CodeAIPlannerPromptRuntime.js
          node --check lib/code/runtime/CodeAIAutonomousRuntime.js
          node scripts/code-ai-planner-prompt-budget-selftest.mjs
          npm run audit:code-ai-autonomy
      - name: Commit verified Code convergence
        run: |
          git config user.name "Avantiqo Code Convergence"
          git config user.email "actions@users.noreply.github.com"
          git add lib/code/runtime/CodeAIPlannerPromptRuntime.js lib/code/runtime/CodeAIAutonomousRuntime.js scripts/code-ai-autonomy-loop-guard-audit.mjs scripts/code-ai-planner-prompt-budget-selftest.mjs package.json
          git commit -m "Bound Code planner prompt transport"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove one-shot convergence files
        run: |
          git pull --rebase origin main
          git rm scripts/patch-code-ai-planner-prompt-budget-once.mjs .github/workflows/code-ai-planner-prompt-budget-convergence.yml
          git commit -m "Remove Code prompt convergence tooling"
          git pull --rebase origin main
          git push origin HEAD:main
