name: Code Distributed Safe Lease Convergence

on:
  push:
    branches:
      - main
    paths:
      - "scripts/patch-code-distributed-safe-lease-once.mjs"
      - ".github/workflows/code-distributed-safe-lease-convergence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-distributed-safe-lease-convergence-main
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED: "NO"
      AVANTIQO_CODE_WORLDCLASS_CI: "YES"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply distributed Code lease convergence
        run: node scripts/patch-code-distributed-safe-lease-once.mjs

      - name: Verify zero-GPU Code gates
        run: |
          node --check scripts/avantiqo-code-runpod-distributed-lease.mjs
          node --check scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs
          node --check scripts/code-ai-certification-resilience-selftest.mjs
          npm run audit:code-ai-autonomy
          test "${AVANTIQO_RUNPOD_SAFE_LEASE_APPROVED}" = "NO"

      - name: Commit convergence
        run: |
          if git diff --quiet -- scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs scripts/code-ai-certification-resilience-selftest.mjs; then
            echo "No convergence changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-avantiqo-runpod-safe-lease-v2-local.mjs scripts/code-ai-certification-resilience-selftest.mjs
          git commit -m "Protect distributed Code RunPod lease"
          git restore scripts/patch-code-distributed-safe-lease-once.mjs
          git pull --rebase origin main
          git push origin HEAD:main
