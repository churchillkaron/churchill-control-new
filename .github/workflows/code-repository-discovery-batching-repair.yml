name: One-shot Code repository discovery batching repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/code-repository-discovery-batching-repair.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-code-repository-discovery-batching-repair
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Refetch current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Patch and test discovery batching
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("lib/code/runtime/CodeRepositoryIntelligenceRuntime.js")
          s = p.read_text()
          marker = "const MAX_BUILD_SYSTEM_CONVENTIONS = 120;\n"
          if "const DISCOVERY_PATHSPEC_BATCH_SIZE = 60;" not in s:
              if marker not in s: raise SystemExit("BATCH_CONSTANT_MARKER_MISSING")
              s = s.replace(marker, marker + "const DISCOVERY_PATHSPEC_BATCH_SIZE = 60;\n", 1)

          pattern = re.compile(r'''async function discoverPaths\(workspace\) \{\n  const result = await workspace\.run\(\{\n    command: "git",\n    args: \["ls-files", "--", \.\.\.DISCOVERY_PATHSPECS\],\n    cwd: "\.",\n  \}\);\n  if \(result\.exit_code !== 0\) \{\n    const error = new Error\(`CODE_AI_REPOSITORY_INTELLIGENCE_DISCOVERY_FAILED:\$\{result\.exit_code\}`\);\n    error\.details = result;\n    throw error;\n  \}\n  const allPaths = unique\(String\(result\.stdout \|\| ""\)\.split\("\\\\n"\)\);''')
          replacement = '''async function discoverPaths(workspace) {
  const outputs = [];
  let batchCount = 0;
  for (let offset = 0; offset < DISCOVERY_PATHSPECS.length; offset += DISCOVERY_PATHSPEC_BATCH_SIZE) {
    const pathspecBatch = DISCOVERY_PATHSPECS.slice(offset, offset + DISCOVERY_PATHSPEC_BATCH_SIZE);
    const result = await workspace.run({
      command: "git",
      args: ["ls-files", "--", ...pathspecBatch],
      cwd: ".",
    });
    batchCount += 1;
    if (result.exit_code !== 0) {
      const error = new Error(`CODE_AI_REPOSITORY_INTELLIGENCE_DISCOVERY_FAILED:${result.exit_code}:batch=${batchCount}`);
      error.details = { ...result, discovery_batch: batchCount, discovery_pathspec_count: pathspecBatch.length };
      throw error;
    }
    outputs.push(String(result.stdout || ""));
  }
  const allPaths = unique(outputs.join("\\n").split("\\n"));'''
          if "const outputs = [];\n  let batchCount = 0;" not in s:
              s, count = pattern.subn(lambda _: replacement, s, count=1)
              if count != 1: raise SystemExit(f"DISCOVERY_RUNTIME_REPLACEMENT_COUNT:{count}")

          ret = "    truncated: allPaths.length > MAX_DISCOVERED_PATHS,\n  };"
          if "discovery_batches: batchCount" not in s:
              if ret not in s: raise SystemExit("DISCOVERY_RETURN_MARKER_MISSING")
              s = s.replace(ret, "    truncated: allPaths.length > MAX_DISCOVERED_PATHS,\n    discovery_batches: batchCount,\n  };", 1)

          exp = "      discovered_policy_and_convention_path_count: discovered.discovered_count,\n      discovery_truncated: discovered.truncated,"
          if "discovery_batch_count: discovered.discovery_batches" not in s:
              if exp not in s: raise SystemExit("DISCOVERY_EXPORT_MARKER_MISSING")
              s = s.replace(exp, "      discovered_policy_and_convention_path_count: discovered.discovered_count,\n      discovery_batch_count: discovered.discovery_batches,\n      discovery_truncated: discovered.truncated,", 1)
          p.write_text(s)

          Path("scripts/code-ai-repository-intelligence-selftest.mjs").write_text('''import { inspectCodeRepositoryIntelligence } from "../lib/code/runtime/CodeRepositoryIntelligenceRuntime.js";\nconst CONTRACT = "AVANTIQO_CODE_REPOSITORY_INTELLIGENCE_SELFTEST_V1";\nconst calls = [];\nconst workspace = {\n  async inspect() { return { head_sha: "selftest", clean: true, package_manager: "unknown", tracked_file_count: 0, tracked_files_sample: [] }; },\n  async run(input) {\n    calls.push({ command: input?.command, args: [...(input?.args || [])], cwd: input?.cwd });\n    if (input?.command !== "git" || input?.args?.[0] !== "ls-files" || input?.args?.[1] !== "--") throw new Error(`UNEXPECTED_DISCOVERY_COMMAND:${JSON.stringify(input)}`);\n    if (input.args.length > 80) throw new Error(`DISCOVERY_ARGUMENT_LIMIT_EXCEEDED:${input.args.length}`);\n    return { exit_code: 0, stdout: "", stderr: "" };\n  },\n  async read() { throw new Error("DISCOVERY_SELFTEST_READ_SHOULD_NOT_RUN"); },\n};\nconst result = await inspectCodeRepositoryIntelligence(workspace);\nconst discovery = result.repository_intelligence;\nfunction assert(ok, code, evidence = null) { if (!ok) throw new Error(`${code}:${JSON.stringify(evidence)}`); }\nassert(calls.length >= 2, "DISCOVERY_MUST_BATCH_MORE_THAN_80_PATHSPECS", calls);\nassert(calls.every((x) => x.args.length <= 80), "DISCOVERY_BATCH_MUST_RESPECT_SANDBOX_ARGUMENT_LIMIT", calls);\nassert(calls.every((x) => x.args.length <= 62), "DISCOVERY_BATCH_SIZE_MUST_REMAIN_BOUNDED", calls);\nassert(discovery.discovery_batch_count === calls.length, "DISCOVERY_BATCH_COUNT_MUST_BE_REPORTED", discovery);\nconsole.log(JSON.stringify({ success: true, contract: CONTRACT, verified: { oversized_internal_pathspec_inventory_is_batched: true, sandbox_command_argument_limit_preserved: true, each_discovery_batch_stays_below_limit: true, discovery_batch_count_reported: true, provider_calls_executed: false, provider_spend_performed: false, runpod_lease_opened: false, production_deploy_performed: false } }, null, 2));\nconsole.log(`${CONTRACT}=PASS`);\n''')

          a = Path("scripts/code-ai-repository-mutation-audit.mjs")
          t = a.read_text()
          if '  "DISCOVERY_PATHSPEC_BATCH_SIZE",\n' not in t:
              t = t.replace('  "monorepo",\n', '  "monorepo",\n  "DISCOVERY_PATHSPEC_BATCH_SIZE",\n  "discovery_batch_count",\n', 1)
          if "    discovery_pathspecs_batched_below_sandbox_argument_limit: true,\n" not in t:
              t = t.replace("    nested_build_commands_bound_to_working_directory: true,\n", "    nested_build_commands_bound_to_working_directory: true,\n    discovery_pathspecs_batched_below_sandbox_argument_limit: true,\n", 1)
          a.write_text(t)

          pkg = Path("package.json")
          t = pkg.read_text()
          old = '"audit:code-repository-mutations": "node scripts/code-ai-repository-mutation-audit.mjs && node scripts/code-ai-source-change-selftest.mjs"'
          new = '"audit:code-repository-mutations": "node scripts/code-ai-repository-mutation-audit.mjs && node scripts/code-ai-repository-intelligence-selftest.mjs && node scripts/code-ai-source-change-selftest.mjs"'
          if old in t: t = t.replace(old, new, 1)
          elif new not in t: raise SystemExit("PACKAGE_AUDIT_MARKER_MISSING")
          pkg.write_text(t)
          PY
          npm ci --ignore-scripts
          node --check lib/code/runtime/CodeRepositoryIntelligenceRuntime.js
          node scripts/code-ai-repository-intelligence-selftest.mjs
          npm run audit:code-ai-autonomy
      - name: Commit verified convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "churchillkaron"
          git config user.email "patric@pcsphuket.com"
          git rm .github/workflows/code-repository-discovery-batching-convergence.yml
          git rm .github/workflows/code-repository-discovery-batching-repair.yml
          git add lib/code/runtime/CodeRepositoryIntelligenceRuntime.js scripts/code-ai-repository-intelligence-selftest.mjs scripts/code-ai-repository-mutation-audit.mjs package.json
          git commit -m "Batch Code repository discovery pathspecs"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
              npm run audit:code-ai-autonomy
            fi
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
