name: Creative Autonomous Handoff Convergence

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-autonomous-handoff-20260723.py

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply autonomous handoff convergence
        run: python3 scripts/creative-autonomous-handoff-20260723.py

      - name: Validate JavaScript
        run: |
          node --check lib/creative/production/runtime/CreativeProductionHandoffRuntime.js
          node --check lib/creative/production/runtime/ProductionRuntime.js
          node --check lib/creative/director/runtime/CreativeDirectorRuntime.js
          node --check app/api/creative/director/execute/route.js
          node --check components/creative/ProductionStudio/actions/RunCreativePipelineButton.jsx
          git diff --check

      - name: Commit autonomous handoff convergence
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/creative/production/runtime/CreativeProductionHandoffRuntime.js \
            lib/creative/production/runtime/ProductionRuntime.js \
            lib/creative/director/runtime/CreativeDirectorRuntime.js \
            app/api/creative/director/execute/route.js \
            components/creative/ProductionStudio/actions/RunCreativePipelineButton.jsx
          git rm \
            scripts/creative-autonomous-handoff-20260723.py \
            .github/workflows/creative-autonomous-handoff-20260723.yml
          git commit -m "Start Creative production autonomously after approval"
          git push origin HEAD:agent/creative-shot-production-convergence
