name: Creative Defect Router Convergence

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-defect-router-20260723.py

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/creative-defect-router-20260723.py
      - run: |
          node --check lib/creative/director/runtime/CreativeFailureRouter.js
          node --check app/api/creative/director-jobs/canary/route.js
          node --check app/api/creative/director-jobs/converge-temporal/route.js
          git diff --check
      - run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/creative/director/runtime/CreativeFailureRouter.js \
            app/api/creative/director-jobs/canary/route.js \
            app/api/creative/director-jobs/converge-temporal/route.js
          git rm \
            scripts/creative-defect-router-20260723.py \
            .github/workflows/creative-defect-router-20260723.yml
          git commit -m "Route Creative failures by defect class"
          git push origin HEAD:agent/creative-shot-production-convergence
