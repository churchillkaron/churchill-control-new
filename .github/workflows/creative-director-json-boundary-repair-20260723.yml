name: Creative Director JSON Boundary Repair

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-director-json-boundary-repair-20260723.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply JSON boundary repair
        run: python3 scripts/creative-director-json-boundary-repair-20260723.py

      - name: Validate source
        run: |
          node --check lib/creative/intent/CreativeMissionComposerRuntime.js
          git diff --check

      - name: Commit repair and self-clean
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add lib/creative/intent/CreativeMissionComposerRuntime.js
          git rm \
            scripts/creative-director-json-boundary-repair-20260723.py \
            .github/workflows/creative-director-json-boundary-repair-20260723.yml
          git commit -m "Repair Creative Director JSON boundary"
          git push origin HEAD:agent/creative-shot-production-convergence
