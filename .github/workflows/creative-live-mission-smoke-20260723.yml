name: Creative Live Mission Smoke

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - .github/creative-live-mission-smoke-trigger-20260723.txt

permissions:
  contents: write

env:
  CREATIVE_REALITY_APP_URL: ${{ secrets.CREATIVE_REALITY_APP_URL || vars.CREATIVE_REALITY_APP_URL }}
  CREATIVE_TEST_ORGANIZATION_ID: ${{ secrets.CREATIVE_TEST_ORGANIZATION_ID || vars.CREATIVE_TEST_ORGANIZATION_ID }}
  CREATIVE_TEST_ENTITY_ID: ${{ secrets.CREATIVE_TEST_ENTITY_ID || vars.CREATIVE_TEST_ENTITY_ID }}
  CREATIVE_TEST_PERIOD_ID: ${{ secrets.CREATIVE_TEST_PERIOD_ID || vars.CREATIVE_TEST_PERIOD_ID }}
  CREATIVE_TEST_BEARER_TOKEN: ${{ secrets.CREATIVE_TEST_BEARER_TOKEN }}
  CREATIVE_TEST_COOKIE: ${{ secrets.CREATIVE_TEST_COOKIE }}
  CREATIVE_TEST_REQUEST: ${{ vars.CREATIVE_TEST_REQUEST }}
  CREATIVE_LIVE_SMOKE_REPORT: ${{ github.workspace }}/creative-live-mission-smoke-report.txt

jobs:
  live-mission-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Creative convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate live smoke configuration
        id: configuration
        shell: bash
        run: |
          set +x
          : > "$CREATIVE_LIVE_SMOKE_REPORT"

          if [ -z "$CREATIVE_REALITY_APP_URL" ]; then
            echo "FAIL: CREATIVE_REALITY_APP_URL secret or variable is required" | tee -a "$CREATIVE_LIVE_SMOKE_REPORT"
            echo 21 > .creative-live-smoke-exit
            exit 0
          fi

          if [ -z "$CREATIVE_TEST_ORGANIZATION_ID" ]; then
            echo "FAIL: CREATIVE_TEST_ORGANIZATION_ID secret or variable is required" | tee -a "$CREATIVE_LIVE_SMOKE_REPORT"
            echo 22 > .creative-live-smoke-exit
            exit 0
          fi

          echo "PASS: live smoke configuration present" | tee -a "$CREATIVE_LIVE_SMOKE_REPORT"
          echo 0 > .creative-live-smoke-exit

      - name: Wait for deployment reachability
        if: always()
        shell: bash
        run: |
          set +x
          if [ "$(cat .creative-live-smoke-exit 2>/dev/null || echo 1)" != "0" ]; then
            exit 0
          fi

          reachable=0
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$CREATIVE_REALITY_APP_URL" || true)"
            case "$status" in
              200|301|302|307|308|401|403)
                reachable=1
                echo "PASS: deployment reachable with HTTP $status" | tee -a "$CREATIVE_LIVE_SMOKE_REPORT"
                break
                ;;
              *)
                echo "Deployment not ready on attempt $attempt (HTTP ${status:-000})" | tee -a "$CREATIVE_LIVE_SMOKE_REPORT"
                sleep 10
                ;;
            esac
          done

          if [ "$reachable" != "1" ]; then
            echo "FAIL: deployment did not become reachable" | tee -a "$CREATIVE_LIVE_SMOKE_REPORT"
            echo 23 > .creative-live-smoke-exit
          fi

      - name: Run organization-scoped live mission smoke
        if: always()
        shell: bash
        run: |
          set +x
          if [ "$(cat .creative-live-smoke-exit 2>/dev/null || echo 1)" != "0" ]; then
            exit 0
          fi

          set +e
          bash scripts/creative-live-mission-smoke.sh
          status=$?
          set -e
          echo "$status" > .creative-live-smoke-exit

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-live-mission-smoke-report
          path: creative-live-mission-smoke-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove one-shot live smoke trigger
        if: always()
        shell: bash
        run: |
          git config user.name "Avantiqo Creative Live Gate"
          git config user.email "actions@users.noreply.github.com"
          git rm \
            .github/creative-live-mission-smoke-trigger-20260723.txt \
            .github/workflows/creative-live-mission-smoke-20260723.yml
          git commit -m "Complete Creative live mission smoke trigger"
          git push origin HEAD:agent/creative-shot-production-convergence

      - name: Enforce live smoke result
        if: always()
        shell: bash
        run: |
          status="$(cat .creative-live-smoke-exit 2>/dev/null || echo 1)"
          if [ "$status" != "0" ]; then
            echo "CREATIVE_LIVE_MISSION_SMOKE=FAIL status=$status"
            exit "$status"
          fi
          echo "CREATIVE_LIVE_MISSION_SMOKE=PASS"
