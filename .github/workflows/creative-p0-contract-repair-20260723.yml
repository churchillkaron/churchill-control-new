name: Creative P0 Convergence Repair

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-p0-contract-repair-20260723.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Creative convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Creative P0 repair
        run: python3 scripts/creative-p0-contract-repair-20260723.py

      - name: Validate repaired JavaScript
        run: |
          node --check app/api/creative/director-jobs/canary/route.js
          node --check app/api/creative/director-jobs/converge-storyboard-final/route.js
          git diff --check

      - name: Commit repaired contracts
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/api/creative/director-jobs/canary/route.js \
            app/api/creative/director-jobs/converge-storyboard-final/route.js
          git rm \
            scripts/creative-p0-contract-repair-20260723.py \
            .github/workflows/creative-p0-contract-repair-20260723.yml
          git commit -m "Repair Creative production convergence contracts"
          git push origin HEAD:agent/creative-shot-production-convergence
