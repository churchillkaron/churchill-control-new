name: Creative Precheck Truth Gate

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-precheck-truth-gate-20260723.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply precheck truth repairs
        run: python3 scripts/creative-precheck-truth-gate-20260723.py

      - name: Validate source
        run: |
          node --check lib/creative/production/runtime/CreativeProductionLifecycleRuntime.js
          node --check lib/creative/production/runtime/ProductionRuntime.js
          git diff --check

      - name: Commit precheck truth repairs
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/creative/production/runtime/CreativeProductionLifecycleRuntime.js \
            lib/creative/production/runtime/ProductionRuntime.js
          git rm \
            scripts/creative-precheck-truth-gate-20260723.py \
            .github/workflows/creative-precheck-truth-gate-20260723.yml
          git commit -m "Close Creative precheck lifecycle gates"
          git push origin HEAD:agent/creative-shot-production-convergence
