name: Creative Preproduction Truth Lineage Repair

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - .github/workflows/creative-preproduction-truth-lineage-repair-20260723.yml
      - scripts/creative-preproduction-truth-lineage-repair-20260723.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Correct installer response snapshot scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/creative-preproduction-truth-lineage-repair-20260723.py')
          text = path.read_text()
          old = '''text = text.replace("businessTruth.snapshot_id", "finalBusinessTruth.snapshot_id")
          text = text.replace("businessTruth.payload_hash", "finalBusinessTruth.payload_hash")
          text = text.replace("businessTruth.schema_version", "finalBusinessTruth.schema_version")
          text = text.replace("businessTruth.record_counts", "finalBusinessTruth.record_counts")
          text = text.replace("businessTruth.source_manifest", "finalBusinessTruth.source_manifest")
          text = text.replace("businessTruth.source_failures", "finalBusinessTruth.source_failures")
          '''
          new = '''old = \'\'\'      business_truth: {
                  snapshot_id: businessTruth.snapshot_id,
                  payload_hash: businessTruth.payload_hash,
                  schema_version: businessTruth.schema_version,
                  record_counts: businessTruth.record_counts,
                  source_manifest: businessTruth.source_manifest,
                  source_failures: businessTruth.source_failures,
                },
          \'\'\'
          new = \'\'\'      business_truth: {
                  snapshot_id: finalBusinessTruth.snapshot_id,
                  payload_hash: finalBusinessTruth.payload_hash,
                  schema_version: finalBusinessTruth.schema_version,
                  record_counts: finalBusinessTruth.record_counts,
                  source_manifest: finalBusinessTruth.source_manifest,
                  source_failures: finalBusinessTruth.source_failures,
                },
          \'\'\'
          text = replace_once(text, old, new, "final business truth response")
          '''
          if old not in text:
              raise SystemExit('installer snapshot scope block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply repair
        run: python3 scripts/creative-preproduction-truth-lineage-repair-20260723.py

      - name: Validate source contracts
        run: |
          node --check lib/creative/intent/CreativeMissionComposerRuntime.js
          node --check lib/creative/knowledge/CreativeBusinessTruthRuntime.js
          node --check app/api/creative/missions/compose/route.js
          bash -n scripts/creative-live-mission-smoke.sh
          grep -q 'production_role: productionRole' lib/creative/intent/CreativeMissionComposerRuntime.js
          grep -q 'asset_nodes: evidenceNodes.length' lib/creative/knowledge/CreativeBusinessTruthRuntime.js
          grep -q 'DERIVE_FROM_APPROVED_MASTER_TIMELINE' app/api/creative/missions/compose/route.js
          grep -q 'project-scoped asset evidence nodes' scripts/creative-live-mission-smoke.sh
          git diff --check

      - name: Commit repaired source and clean installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/creative-preproduction-truth-lineage-repair-20260723.yml
          git rm scripts/creative-preproduction-truth-lineage-repair-20260723.py
          git add \
            lib/creative/intent/CreativeMissionComposerRuntime.js \
            lib/creative/knowledge/CreativeBusinessTruthRuntime.js \
            app/api/creative/missions/compose/route.js \
            scripts/creative-live-mission-smoke.sh
          git diff --cached --check
          git commit -m 'Close Creative preproduction truth and lineage gates'
          git push origin HEAD:agent/creative-shot-production-convergence
