name: Creative Production Lifecycle Convergence

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-production-lifecycle-20260723.py

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply lifecycle convergence
        run: python3 scripts/creative-production-lifecycle-20260723.py

      - name: Validate JavaScript
        run: |
          node --check lib/creative/production/runtime/CreativeProductionLifecycleRuntime.js
          node --check lib/creative/director/orchestrator/CreativePipelineOrchestrator.js
          node --check lib/creative/production/runtime/ProductionRuntime.js
          node --check lib/creative/worker/CreativeOrchestrationWorker.js
          node --check lib/creative/production/control/CreativeProductionControlRuntime.js
          git diff --check

      - name: Commit lifecycle convergence
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/creative/production/runtime/CreativeProductionLifecycleRuntime.js \
            lib/creative/director/orchestrator/CreativePipelineOrchestrator.js \
            lib/creative/production/runtime/ProductionRuntime.js \
            lib/creative/worker/CreativeOrchestrationWorker.js \
            lib/creative/production/control/CreativeProductionControlRuntime.js \
            components/creative/ProductionStudio/workspaces/ProductionWorkspace.jsx
          git rm \
            scripts/creative-production-lifecycle-20260723.py \
            .github/workflows/creative-production-lifecycle-20260723.yml
          git commit -m "Persist truthful Creative production lifecycle"
          git push origin HEAD:agent/creative-shot-production-convergence
