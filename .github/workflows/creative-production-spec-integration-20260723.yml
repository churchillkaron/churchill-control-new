name: Creative Production Specification Integration

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-production-spec-integration-20260723.py

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate canonical production specification
        run: python3 scripts/creative-production-spec-integration-20260723.py
      - name: Validate Creative specification integration
        run: |
          node --check lib/creative/production/contracts/CreativeProductionSpecification.js
          node --check lib/creative/director/runtime/CreativeShotDirectorRuntime.js
          node --check lib/creative/director/runtime/CreativeDirectorJobRuntime.js
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/creative/director/runtime/CreativeShotDirectorRuntime.js \
            lib/creative/director/runtime/CreativeDirectorJobRuntime.js
          git rm \
            scripts/creative-production-spec-integration-20260723.py \
            .github/workflows/creative-production-spec-integration-20260723.yml
          git commit -m "Enforce canonical Creative production specification"
          git push origin HEAD:agent/creative-shot-production-convergence
