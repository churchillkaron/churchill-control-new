name: Creative Reality Gate

on:
  push:
    branches:
      - "agent/creative-*"
  pull_request:
    branches:
      - main
      - "agent/creative-shot-production-convergence"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: creative-reality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Materialize audited Creative source
        id: creative_materializer
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            if compgen -G "scripts/.creative-repair-parts-v2/part-*" > /dev/null; then
              cat scripts/.creative-repair-parts-v2/part-* | base64 --decode > /tmp/creative-universal-repair.tar.gz
              gzip -t /tmp/creative-universal-repair.tar.gz
              tar -xzf /tmp/creative-universal-repair.tar.gz
              rm -rf scripts/.creative-repair-parts-v2 scripts/.creative-repair-parts
            elif compgen -G "scripts/.creative-repair-parts/part-*" > /dev/null; then
              cat scripts/.creative-repair-parts/part-* > /tmp/creative-universal-repair.tar.gz
              gzip -t /tmp/creative-universal-repair.tar.gz
              tar -xzf /tmp/creative-universal-repair.tar.gz
              rm -rf scripts/.creative-repair-parts
            fi
            node --check scripts/materialize-creative-reality-gate.mjs
            node scripts/materialize-creative-reality-gate.mjs
          } > /tmp/creative-materializer.log 2>&1

      - name: Upload Creative materializer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-materializer-log
          path: /tmp/creative-materializer.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Creative materialization failed
        if: steps.creative_materializer.outcome == 'failure'
        shell: bash
        run: |
          cat /tmp/creative-materializer.log
          exit 1

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit materialized source and canonical lockfile
        if: github.event_name == 'push' && startsWith(github.ref_name, 'agent/creative-')
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Creative repair and package lock are already canonical"
            exit 0
          fi
          git config user.name "avantiqo-reality-gate[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: converge Creative Studio universal production"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Clean dependency installation
        run: npm ci

      - name: JavaScript syntax gates
        run: |
          node --check scripts/materialize-creative-reality-gate.mjs
          node --check scripts/apply-creative-pre-spend-evidence-gate-v7.mjs
          node --check scripts/apply-creative-director-structured-output-v8.mjs
          node --check scripts/apply-creative-director-escape-fix-v8-1.mjs
          node --check scripts/apply-creative-director-list-helper-v8-2.mjs
          node --check scripts/apply-creative-source-evidence-provenance-v9.mjs
          node --check app/api/creative/missions/compose/route.js
          node --check app/api/creative/director/execute/route.js
          node --check lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          node --check lib/creative/knowledge/CreativeBusinessTruthRuntime.js
          node --check lib/creative/intent/CreativeMissionComposerRuntime.js
          node --check lib/creative/intent/CreativeDeliverableContract.js
          node --check lib/creative/director/runtime/CreativeDirectorRuntime.js
          node --check lib/creative/storyboard/runtime/CreativeStoryboardExecutionContractConvergence.js
          node --check lib/creative/production-graph/planner/ProductionGraphPlanner.js
          node --check lib/creative/production/contracts/CreativeImagePromptBudgetRuntime.js
          node --check lib/creative/production/contracts/CreativeProviderInputRuntime.js
          node --check lib/creative/production/contracts/CreativeShotDirectionEnrichmentRuntime.js
          node --check lib/operations/tasks/runtime/ProductionTaskRuntime.js
          node --check lib/platform/service-runtime/providers/openai/OpenAIProvider.js
          node --check lib/creative/production/runtime/CreativeUniversalProductionRuntime.js
          node --check lib/creative/production/runtime/CreativeProductionHandoffRuntime.js
          node --check lib/creative/production/runtime/CreativeProductionLifecycleRuntime.js
          node --check lib/creative/production/runtime/ProductionRuntime.js
          node --check lib/creative/production/control/CreativeProductionControlRuntime.js
          node --check lib/creative/worker/CreativeOrchestrationWorker.js
          bash -n scripts/creative-end-to-end-smoke.sh
          bash -n scripts/creative-live-smoke-local.sh
          bash -n scripts/creative-reality-gate.sh

      - name: Production build
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          OPENAI_API_KEY: test
        run: |
          set -o pipefail
          npm run build > /tmp/creative-build.log 2>&1

      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-production-build-log
          path: /tmp/creative-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Creative architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
            'CREATIVE_AI_DIRECTOR_FILM_DELIVERABLE_REQUIRED\|Churchill Cinematic Hero Film' \
            app/api/creative lib/creative components/creative
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
            '\brestaurant\b\|\bbar\b\|\bwaiter\b\|\bchef\b\|\bhotel\b\|\bretail\b' \
            lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          grep -q 'CREATIVE_PRODUCTION_LIFECYCLE_V3_PROJECT_STATUS_SEPARATION' lib/creative/production/runtime/CreativeProductionLifecycleRuntime.js
          grep -q 'universal_deliverable_v1' lib/creative/production-graph/planner/ProductionGraphPlanner.js
          grep -q 'CREATIVE_DECLARED_EVIDENCE_ASSET_HANDOFF_V2' lib/creative/production-graph/planner/ProductionGraphPlanner.js
          grep -q 'CREATIVE_RUNTIME_EVIDENCE_REFERENCE_RECOVERY_V2' lib/operations/tasks/runtime/ProductionTaskRuntime.js
          grep -q 'CREATIVE_OPENAI_FINAL_PROMPT_BUDGET_V2' lib/platform/service-runtime/providers/openai/OpenAIProvider.js
          grep -q 'CREATIVE_STORYBOARD_EVIDENCE_BINDING_V3' lib/creative/storyboard/runtime/CreativeStoryboardExecutionContractConvergence.js
          grep -q 'CREATIVE_MISSION_RELEVANT_EVIDENCE_IMPORT_V4' app/api/creative/missions/compose/route.js
          grep -q 'CREATIVE_UPLOADED_REFERENCE_APPROVAL_V2' lib/creative/knowledge/CreativeBusinessTruthRuntime.js
          grep -q 'CREATIVE_MISSION_EVIDENCE_SELECTION_V9' lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          grep -q 'CREATIVE_CANONICAL_EVIDENCE_ACTOR_MERGE_V5' lib/creative/production/contracts/CreativeShotDirectionEnrichmentRuntime.js
          grep -q 'CREATIVE_GENERATED_FRAME_QA_AND_CORRECTION_LOOP_V5' lib/operations/tasks/runtime/ProductionTaskRuntime.js
          grep -q 'CREATIVE_VISUAL_EVIDENCE_COMPARISON_QA_V5' lib/platform/service-runtime/providers/openai/OpenAIProvider.js
          grep -q 'CREATIVE_EXACT_EVIDENCE_RENDERING_POLICY_V5' lib/creative/production/contracts/CreativeProviderInputRuntime.js
          grep -q 'CREATIVE_MASTER_STILL_FIDELITY_AND_DIVERSITY_GATE_V5' lib/creative/production-graph/planner/ProductionGraphPlanner.js
          grep -q 'CREATIVE_ORGANIZATION_UPLOAD_SCOPE_V3' lib/creative/knowledge/CreativeBusinessTruthRuntime.js
          grep -q 'CREATIVE_STRONG_RELEVANCE_MISSION_AUTHORIZATION_V6' lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          grep -q 'CREATIVE_QUALITY_REVISION_ATTEMPT_BUDGET_V6' lib/operations/tasks/runtime/ProductionTaskRuntime.js
          grep -q 'CREATIVE_PRE_SPEND_EVIDENCE_DIAGNOSTICS_V7' lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          grep -q 'CREATIVE_PRE_SPEND_EVIDENCE_GATE_V7' scripts/creative-end-to-end-smoke.sh
          grep -q 'CREATIVE_LIVE_SMOKE_REQUIRED_EVIDENCE_ROLES_V7' scripts/creative-live-smoke-local.sh
          grep -q 'CREATIVE_OPENAI_STRUCTURED_RECOVERY_V8' lib/platform/service-runtime/providers/openai/OpenAIProvider.js
          grep -q 'CREATIVE_MISSION_DIRECTOR_SCHEMA_V8' lib/creative/intent/CreativeMissionComposerRuntime.js
          grep -q 'CREATIVE_MISSION_DIRECTOR_CONTEXT_BUDGET_V8' lib/creative/intent/CreativeMissionComposerRuntime.js
          grep -q 'CREATIVE_DIRECTOR_DIAGNOSTICS_V8' app/api/creative/missions/compose/route.js
          grep -q 'CREATIVE_OPENAI_STRUCTURED_RECOVERY_ESCAPE_V8_1' lib/platform/service-runtime/providers/openai/OpenAIProvider.js
          grep -q 'CREATIVE_MISSION_DIRECTOR_LIST_HELPER_V8_2' lib/creative/intent/CreativeMissionComposerRuntime.js
          grep -q 'function list(value)' lib/creative/intent/CreativeMissionComposerRuntime.js
          grep -q 'CREATIVE_ASSET_PROVENANCE_CLASSIFICATION_V9' lib/creative/knowledge/CreativeBusinessTruthRuntime.js
          grep -q 'CREATIVE_SOURCE_ONLY_MISSION_EVIDENCE_V9' lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          grep -q 'CREATIVE_REQUIRED_EVIDENCE_ROLE_HANDOFF_V9' app/api/creative/missions/compose/route.js
          grep -q 'CREATIVE_PRE_SPEND_BOOLEAN_AND_PROVENANCE_V9' scripts/creative-end-to-end-smoke.sh
          grep -q 'sourceKind === "GENERATED_OUTPUT"' lib/creative/assets/evidence/runtime/CreativeMissionEvidenceSelectionRuntime.js
          grep -q 'required_evidence_roles' app/api/creative/missions/compose/route.js
          grep -q 'MISSION_ROLE_MATCHED_ORGANIZATION_UPLOAD' scripts/creative-end-to-end-smoke.sh
          ! grep -q "arbitrary_fallback_allowed // true" scripts/creative-end-to-end-smoke.sh
          printf '{"arbitrary_fallback_allowed":false}\n' | jq -e 'if has("arbitrary_fallback_allowed") then .arbitrary_fallback_allowed == false else false end' >/dev/null
          grep -q 'CREATIVE_REALITY_GATE_MATERIALIZATION=PASS' /tmp/creative-materializer.log
          grep -q 'Automatic after AI quality' components/creative/ProductionStudio/actions/RunCreativePipelineButton.jsx
          grep -q 'CREATIVE_END_TO_END_SMOKE=PASS' scripts/creative-end-to-end-smoke.sh
