name: Creative Structural Replan Convergence

on:
  push:
    branches:
      - agent/creative-shot-production-convergence
    paths:
      - scripts/creative-structural-replan-20260723.py

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Creative convergence branch
        uses: actions/checkout@v4
        with:
          ref: agent/creative-shot-production-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply structural replan convergence
        run: python3 scripts/creative-structural-replan-20260723.py

      - name: Validate repaired JavaScript
        run: |
          node --check lib/creative/director/runtime/CreativeShotDirectorRuntime.js
          node --check lib/creative/director/runtime/CreativeDirectorJobRuntime.js
          node --check app/api/creative/director-jobs/route.js
          node --check app/api/creative/director-jobs/canary/route.js
          git diff --check

      - name: Commit structural replan convergence
        run: |
          git config user.name "Avantiqo Creative Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/creative/director/runtime/CreativeShotDirectorRuntime.js \
            lib/creative/director/runtime/CreativeDirectorJobRuntime.js \
            app/api/creative/director-jobs/route.js \
            app/api/creative/director-jobs/canary/route.js
          git rm \
            scripts/creative-structural-replan-20260723.py \
            .github/workflows/creative-structural-replan-20260723.yml
          git commit -m "Add Creative structural replan recovery"
          git push origin HEAD:agent/creative-shot-production-convergence
