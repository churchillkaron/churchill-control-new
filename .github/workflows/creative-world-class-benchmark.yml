name: Creative World-Class Benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/creative-world-class-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    if: contains(github.event.head_commit.message, '[creative-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify benchmark credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OPENAI_API_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "MISSING_GITHUB_SECRET=$name"
              exit 2
            fi
          done
          echo "CREATIVE_QA_CREDENTIALS=PRESENT"

      - name: Run reasoning-only Creative benchmark
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_GIT_COMMIT_MESSAGE: "[creative-benchmark] [creative-qa] isolated GitHub Action"
          CREATIVE_WORLD_CLASS_LIVE_BENCHMARK_OUTPUT: ${{ github.workspace }}/creative-world-class-live-benchmark.json
        run: |
          set -o pipefail
          npm run benchmark:creative-world-class-live 2>&1 | tee creative-world-class-benchmark.log

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-world-class-benchmark
          path: |
            creative-world-class-benchmark.log
            creative-world-class-live-benchmark.json
          if-no-files-found: warn
          retention-days: 7
