name: Avantiqo Finance Human Workflow Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/api/workspace/finance/**"
      - "app/api/finance/tax/**"
      - "app/api/finance/vat-returns/**"
      - "app/(system)/workspace/[organizationId]/finance/**"
      - "components/workspace/finance/**"
      - "lib/finance/**"
      - "tests/finance-human-workflow-contract.test.mjs"
      - "tests/finance-ui-completion-contract.test.mjs"
      - "tests/finance-tax-workspace-contract.test.mjs"
      - "tests/finance-tax-selection-contract.test.mjs"
      - "tests/finance-tax-calculation-method-contract.test.mjs"
      - "tests/finance-tax-client-request-bridge-contract.test.mjs"
      - "tests/finance-tax-dependency-work-contract.test.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/finance-human-workflow-certification.yml"
  pull_request:
    paths:
      - "app/api/workspace/finance/**"
      - "app/api/finance/tax/**"
      - "app/api/finance/vat-returns/**"
      - "app/(system)/workspace/[organizationId]/finance/**"
      - "components/workspace/finance/**"
      - "lib/finance/**"
      - "tests/finance-human-workflow-contract.test.mjs"
      - "tests/finance-ui-completion-contract.test.mjs"
      - "tests/finance-tax-workspace-contract.test.mjs"
      - "tests/finance-tax-selection-contract.test.mjs"
      - "tests/finance-tax-calculation-method-contract.test.mjs"
      - "tests/finance-tax-client-request-bridge-contract.test.mjs"
      - "tests/finance-tax-dependency-work-contract.test.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/finance-human-workflow-certification.yml"

permissions:
  contents: read

concurrency:
  group: finance-human-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-human-workflow:
    name: Finance human workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Certify Finance human workflow and accountant UI
        # Keep every Tax coordination contract in the same exact-source certification lane.
        run: node --test tests/finance-human-workflow-contract.test.mjs tests/finance-ui-completion-contract.test.mjs tests/finance-tax-workspace-contract.test.mjs tests/finance-tax-selection-contract.test.mjs tests/finance-tax-calculation-method-contract.test.mjs tests/finance-tax-client-request-bridge-contract.test.mjs tests/finance-tax-dependency-work-contract.test.mjs
