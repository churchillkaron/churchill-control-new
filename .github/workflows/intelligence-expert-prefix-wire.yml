name: Wire Intelligence Expert Prefix

on:
  push:
    branches:
      - ai/intelligence-cache-stable-prefix-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ai/intelligence-cache-stable-prefix-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wire expert prefix into Deep provider
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceDeepProvider.js';
          let source = fs.readFileSync(path, 'utf8');
          const replaceOnce = (from, to) => {
            if (!source.includes(from)) throw new Error(`missing patch marker: ${from.slice(0, 80)}`);
            source = source.replace(from, to);
          };

          replaceOnce(
            'import { request as httpsRequest } from "node:https";\n',
            'import { request as httpsRequest } from "node:https";\nimport {\n  buildAvantiqoExpertPrefix,\n  prependAvantiqoExpertPrefix,\n} from "../../../../intelligence/runtime/AvantiqoExpertPrefixRuntime.js";\n',
          );

          replaceOnce(
            `function normalizeMessages(input = {}) {\n  if (list(input.messages).length) return input.messages;\n  const system = text(\n    input.system_prompt || input.systemPrompt || input.instructions_text,\n  );\n  const prompt = text(input.prompt || input.input || input.text);\n  const messages = [];\n  if (system) messages.push({ role: "system", content: system });\n  if (prompt) messages.push({ role: "user", content: prompt });\n  return messages;\n}\n\nfunction normalizedUsage`,
            `function normalizeMessages(input = {}) {\n  if (list(input.messages).length) return input.messages;\n  const system = text(\n    input.system_prompt || input.systemPrompt || input.instructions_text,\n  );\n  const prompt = text(input.prompt || input.input || input.text);\n  const messages = [];\n  if (system) messages.push({ role: "system", content: system });\n  if (prompt) messages.push({ role: "user", content: prompt });\n  return messages;\n}\n\nfunction prepareInferenceMessages(input = {}) {\n  const messages = normalizeMessages(input);\n  if (!messages.length) return { messages, prefix: null };\n  if (input.expert_prefix === false || input.expertPrefix === false) {\n    return { messages, prefix: null };\n  }\n  return prependAvantiqoExpertPrefix(messages, input);\n}\n\nfunction normalizedUsage`,
          );

          replaceOnce(
            '  const messages = normalizeMessages(input);\n  if (!messages.length) throw new Error("AVANTIQO_INTELLIGENCE_INPUT_REQUIRED");',
            '  const preparedMessages = prepareInferenceMessages(input);\n  const messages = preparedMessages.messages;\n  if (!messages.length) throw new Error("AVANTIQO_INTELLIGENCE_INPUT_REQUIRED");',
          );

          replaceOnce(
            '    raw_reasoning_persisted: false,\n  };\n}\n\nexport async function probeAvantiqoIntelligenceRuntime',
            '    raw_reasoning_persisted: false,\n    expert_prefix_contract: "AVANTIQO_EXPERT_PREFIX_V1",\n    expert_prefix_cache_stable: true,\n  };\n}\n\nexport async function probeAvantiqoIntelligenceRuntime',
          );

          replaceOnce(
            '    response_format: { type: "json_object" },\n  });',
            '    response_format: { type: "json_object" },\n    expert_prefix: false,\n  });',
          );
          replaceOnce(
            '    tool_choice: {\n      type: "function",\n      function: { name: "avantiqo_probe" },\n    },\n  });',
            '    tool_choice: {\n      type: "function",\n      function: { name: "avantiqo_probe" },\n    },\n    expert_prefix: false,\n  });',
          );

          replaceOnce(
            '    const model = text(input.model) || configuredModel();\n    const response = await chatCompletion({ ...input, model });',
            '    const model = text(input.model) || configuredModel();\n    const expertPrefix = buildAvantiqoExpertPrefix(input);\n    const response = await chatCompletion({ ...input, model });',
          );

          replaceOnce(
            '        raw_reasoning_persisted: false,\n      },',
            '        raw_reasoning_persisted: false,\n        expert_prefix: {\n          contract: expertPrefix.contract,\n          version: expertPrefix.version,\n          domain: expertPrefix.domain,\n          fingerprint: expertPrefix.fingerprint,\n          cache_stable: expertPrefix.cache_stable,\n        },\n      },',
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Run focused Intelligence prefix tests
        run: |
          node --test tests/avantiqo-expert-prefix-runtime.test.mjs
          node --test tests/avantiqo-intelligence-deep-expert-prefix.test.mjs
          node --test tests/avantiqo-intelligence-deep-native-https-transport.test.mjs
      - name: Commit certified provider wiring and remove temporary workflows
        run: |
          rm -f .github/workflows/intelligence-expert-prefix-check.yml
          rm -f .github/workflows/intelligence-expert-prefix-wire.yml
          git config user.name churchillkaron
          git config user.email patric@pcsphuket.com
          git add lib/platform/service-runtime/providers/avantiqo-intelligence/AvantiqoIntelligenceDeepProvider.js tests/avantiqo-expert-prefix-runtime.test.mjs tests/avantiqo-intelligence-deep-expert-prefix.test.mjs lib/intelligence/runtime/AvantiqoExpertPrefixRuntime.js .github/workflows/intelligence-expert-prefix-check.yml .github/workflows/intelligence-expert-prefix-wire.yml
          git commit -m "Wire cache-stable expert prefixes into Deep Intelligence"
          git push origin HEAD:ai/intelligence-cache-stable-prefix-20260831
