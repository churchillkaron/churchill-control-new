name: Intelligence Specialist Benchmark Execution Check

on:
  push:
    branches:
      - ai/intelligence-specialist-benchmark-20260831

permissions:
  contents: read

jobs:
  benchmark-execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run specialist benchmark contract tests
        run: node --test tests/avantiqo-specialist-benchmark-runtime.test.mjs
      - name: Run specialist benchmark execution harness tests
        run: node --test tests/avantiqo-specialist-benchmark-execution-runtime.test.mjs
