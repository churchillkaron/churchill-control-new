name: Intelligence Specialist Router Check

on:
  push:
    branches:
      - ai/intelligence-specialist-routing-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialist-router:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run specialist cognition router tests
        run: node --test tests/avantiqo-cognition-router.test.mjs
