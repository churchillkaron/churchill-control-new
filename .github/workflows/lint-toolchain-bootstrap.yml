name: Lint Toolchain Bootstrap

on:
  push:
    branches:
      - agent/blocking-lint-gate

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/blocking-lint-gate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install lint toolchain and script
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint === 'eslint . --ext .js,.jsx,.ts,.tsx' && p.devDependencies?.eslint === '8.57.1' && p.devDependencies?.['eslint-config-next'] === '14.2.35' ? 0 : 1)"; then
            echo "Lint toolchain already bootstrapped"
            exit 0
          fi
          npm install --save-dev --save-exact eslint@8.57.1 eslint-config-next@14.2.35
          npm pkg set 'scripts.lint=eslint . --ext .js,.jsx,.ts,.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Install deterministic blocking lint toolchain"
          git push

# One-shot branch workflow. Remove before merge.
