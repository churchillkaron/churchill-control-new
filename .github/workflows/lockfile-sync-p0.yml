name: P0 Lockfile Sync

on:
  push:
    branches:
      - agent/release-convergence-p0-r2
    paths:
      - package.json
      - .github/workflows/lockfile-sync-p0.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/release-convergence-p0-r2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already converged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "[lockfile-sync] Converge dependency lockfile"
          git push origin HEAD:agent/release-convergence-p0-r2
