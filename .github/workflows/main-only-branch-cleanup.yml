name: Main-only stale branch cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-only-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

# One-shot convergence helper: main is the repository source of truth.
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale non-main branches except open PR heads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const protectedHeads = new Set(
              pulls
                .filter((pr) => pr.head?.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );
            protectedHeads.add('main');

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const deleted = [];
            const kept = [];
            for (const branch of branches) {
              if (protectedHeads.has(branch.name) || branch.protected) {
                kept.push(branch.name);
                continue;
              }
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
              deleted.push(branch.name);
            }

            core.summary
              .addHeading('Branch cleanup')
              .addRaw(`Deleted ${deleted.length} stale branch(es).\n`)
              .addRaw(`Kept: ${kept.join(', ') || 'none'}.\n`)
              .write();
