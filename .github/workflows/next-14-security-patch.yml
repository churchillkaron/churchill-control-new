name: Next 14 Security Patch

on:
  push:
    branches:
      - agent/next-14-security-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/next-14-security-patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply patched Next.js release
        shell: bash
        run: |
          CURRENT="$(node -p "require('./package.json').dependencies.next")"
          if [ "$CURRENT" = "14.2.35" ]; then
            echo "Next.js already patched"
            exit 0
          fi
          npm install next@14.2.35 --save-exact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch Next.js 14 to 14.2.35"
          git push
