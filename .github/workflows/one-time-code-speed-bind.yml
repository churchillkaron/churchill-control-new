name: One-time Code Speed Bind

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-code-speed-bind.yml

permissions:
  contents: write

concurrency:
  group: one-time-code-speed-bind
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind optimized immutable Code image and faster polling
        shell: bash
        run: |
          set -euo pipefail

          old_image='ghcr.io/churchillkaron/avantiqo-code-pod@sha256:1b6ac20925085104ac00c09dde3073e32e5934543bd16b9a346b2dca3fa7bb27'
          new_image='ghcr.io/churchillkaron/avantiqo-code-pod@sha256:daba714fde0b149cb82d779a3a114fd10e701de03722a36b1e2041c4adc19b3e'
          runtime='lib/code/runtime/CodeAIWorkerSessionRuntime.js'
          cert='scripts/certify-code-ai-employee-fast-start-live.mjs'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            python3 - <<'PY'
          from pathlib import Path

          runtime = Path('lib/code/runtime/CodeAIWorkerSessionRuntime.js')
          cert = Path('scripts/certify-code-ai-employee-fast-start-live.mjs')
          old_image = 'ghcr.io/churchillkaron/avantiqo-code-pod@sha256:1b6ac20925085104ac00c09dde3073e32e5934543bd16b9a346b2dca3fa7bb27'
          new_image = 'ghcr.io/churchillkaron/avantiqo-code-pod@sha256:daba714fde0b149cb82d779a3a114fd10e701de03722a36b1e2041c4adc19b3e'

          runtime_text = runtime.read_text()
          cert_text = cert.read_text()

          if runtime_text.count(new_image) == 1:
              pass
          elif runtime_text.count(old_image) == 1:
              runtime_text = runtime_text.replace(old_image, new_image, 1)
              runtime.write_text(runtime_text)
          else:
              raise SystemExit('CODE_SPEED_BIND_IMAGE_GUARD_FAILED')

          old_poll = 'const POLL_DELAY_MS = 5000;'
          new_poll = 'const POLL_DELAY_MS = 1000;'
          if cert_text.count(new_poll) == 1:
              pass
          elif cert_text.count(old_poll) == 1:
              cert_text = cert_text.replace(old_poll, new_poll, 1)
              cert.write_text(cert_text)
          else:
              raise SystemExit('CODE_SPEED_BIND_POLL_GUARD_FAILED')
          PY

            changed="$(git diff --name-only)"
            unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(lib/code/runtime/CodeAIWorkerSessionRuntime\.js|scripts/certify-code-ai-employee-fast-start-live\.mjs)$' || true)"
            test -z "$unexpected"

            grep -F "$new_image" "$runtime"
            grep -F 'const POLL_DELAY_MS = 1000;' "$cert"

            if git diff --quiet; then
              echo 'AVANTIQO_CODE_SPEED_BIND_ALREADY_APPLIED=true'
              exit 0
            fi

            git add "$runtime" "$cert"
            git commit -m 'Use optimized Code pod image and faster readiness polling'
            if git push origin main; then
              echo 'AVANTIQO_CODE_SPEED_BIND=PASS'
              echo 'AVANTIQO_CODE_WORKER_IMAGE_OPTIMIZED=true'
              echo 'AVANTIQO_CODE_CERT_POLL_MS=1000'
              exit 0
            fi

            echo "AVANTIQO_CODE_SPEED_BIND_PUSH_RETRY=$attempt"
          done

          echo 'AVANTIQO_CODE_SPEED_BIND_PUSH_RETRY_EXHAUSTED'
          exit 1
