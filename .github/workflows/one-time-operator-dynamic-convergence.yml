name: One-time Operator dynamic convergence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-operator-dynamic-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove hardcoded Operator business semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reasoning_path = Path("lib/operator/runtime/OperatorReasoningRuntime.js")
          reasoning = reasoning_path.read_text()

          semantic_start = reasoning.index("const BUSINESS_SEMANTIC_HINT_RULES = Object.freeze([")
          tokens_start = reasoning.index("function tokens(value) {", semantic_start)
          reasoning = reasoning[:semantic_start] + reasoning[tokens_start:]

          tokens_start = reasoning.index("function tokens(value) {")
          relevance_start = reasoning.index("function relevanceScore(item, queryTokens) {", tokens_start)
          generic_tokens = '''function tokens(value) {
            return Array.from(
              new Set(
                text(value)
                  .toLowerCase()
                  .normalize("NFD")
                  .replace(/[\\u0300-\\u036f]/g, "")
                  .replace(/[^a-z0-9\\s_-]/g, " ")
                  .split(/\\s+/)
                  .map((item) => item.trim())
                  .filter((item) => item.length > 1),
              ),
            ).slice(0, 24);
          }

          '''
          reasoning = reasoning[:tokens_start] + generic_tokens + reasoning[relevance_start:]

          ranked_start = reasoning.index("function rankedCapabilities(items, message, limit) {")
          bounded_start = reasoning.index("function boundedTargets(targets = [], message = \"\", source = \"text\") {", ranked_start)
          dynamic_ranking = '''function rankedCapabilities(items, message, limit) {
            const source = list(items);
            if (source.length <= limit) return source;

            const queryTokens = tokens(message);
            const fallback = !queryTokens.length
              ? source.slice(0, limit)
              : source
                  .map((item, index) => ({
                    item,
                    index,
                    score: relevanceScore(item, queryTokens),
                  }))
                  .sort((a, b) => b.score - a.score || a.index - b.index)
                  .slice(0, limit)
                  .map((entry) => entry.item);

            return prioritizeOperatorBusinessReads({
              message,
              capabilities: source,
              fallback,
              limit,
            }).capabilities;
          }

          '''
          reasoning = reasoning[:ranked_start] + dynamic_ranking + reasoning[bounded_start:]
          reasoning_path.write_text(reasoning)

          audit_path = Path("scripts/operator-voice-responsiveness-audit.mjs")
          audit = audit_path.read_text()

          helper_marker = '''function requireAll(label, source, needles) {
            for (const needle of needles) {
              if (!source.includes(needle)) violations.push(`${label}:${needle}`);
            }
          }
          '''
          if "function forbidAll(" not in audit:
            audit = audit.replace(
              helper_marker,
              helper_marker + '''\nfunction forbidAll(label, source, needles) {
            for (const needle of needles) {
              if (source.includes(needle)) violations.push(`${label}:${needle}`);
            }
          }
          ''',
            )

          source_marker = 'const reasoningRuntime = read("lib/operator/runtime/OperatorReasoningRuntime.js");\n'
          if 'const businessReadResolver = read(' not in audit:
            audit = audit.replace(
              source_marker,
              source_marker
              + 'const businessReadResolver = read("lib/operator/runtime/OperatorBusinessReadResolver.js");\n'
              + 'const businessDataReflex = read("lib/operator/runtime/OperatorBusinessDataReflex.js");\n'
              + 'const capabilityCatalog = read("lib/operator/runtime/OperatorCapabilityCatalog.js");\n',
            )

          semantic_audit_start = audit.index('requireAll("SEMANTIC_READ_RANKING"')
          read_nav_start = audit.index('requireAll("READ_BEFORE_NAVIGATION"', semantic_audit_start)
          dynamic_audit = '''requireAll("DYNAMIC_READ_RANKING", businessReadResolver, [
            "function capabilityVocabulary",
            "function schemaVocabulary",
            "capability.operator_aliases",
            "capability.operator_examples",
            "capability.input_schema",
            "capability.output_schema",
            "export function rankOperatorReadCapabilities",
          ]);

          requireAll("DYNAMIC_READ_REFLEX", businessDataReflex, [
            "resolveOperatorBusinessRead",
            "resolution.ranked",
            "Registry-resolved read:",
            "registry-data-reflex-v2",
          ]);

          requireAll("MANIFEST_DRIVEN_CAPABILITY_SEMANTICS", capabilityCatalog, [
            "operator_aliases:",
            "operator_examples:",
            "input_schema:",
            "output_schema:",
          ]);

          forbidAll("NO_HARDCODED_BUSINESS_SEMANTICS", reasoningRuntime, [
            "BUSINESS_SEMANTIC_HINT_RULES",
            "function semanticTokens",
            "relevanceScore(item, hintTokens)",
          ]);

          requireAll("REGISTRY_DRIVEN_REASONING_RANKING", reasoningRuntime, [
            "prioritizeOperatorBusinessReads({",
            "capabilities: source",
            "fallback,",
          ]);

          '''
          audit = audit[:semantic_audit_start] + dynamic_audit + audit[read_nav_start:]
          audit_path.write_text(audit)
          PY

          node --check lib/operator/runtime/OperatorReasoningRuntime.js
          node --check lib/operator/runtime/OperatorBusinessReadResolver.js
          node --check lib/operator/runtime/OperatorBusinessDataReflex.js
          node --check lib/operator/runtime/OperatorCapabilityCatalog.js
          node --check scripts/operator-voice-responsiveness-audit.mjs
          node scripts/operator-voice-responsiveness-audit.mjs
          git diff --check

      - name: Commit convergence and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-operator-dynamic-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/operator/runtime/OperatorReasoningRuntime.js scripts/operator-voice-responsiveness-audit.mjs .github/workflows/one-time-operator-dynamic-convergence.yml
          git diff --cached --quiet && exit 0
          git commit -m "[deploy-production] Remove hardcoded Operator business semantics"
          git push origin HEAD:main
