name: One-time Operator executive brain observable convergence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-operator-executive-brain-observable.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, validate, and publish or diagnose
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-operator-executive-brain-final.yml').read_text()
          marker = "python3 - <<'PY'\n"
          if marker not in source:
              raise SystemExit('FINAL_RUNNER_PATCH_BLOCK_NOT_FOUND')
          block = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/operator-executive-patch.py').write_text('\n'.join(lines) + '\n')
          PY

          extract_rc=$?
          if [ "$extract_rc" -eq 0 ]; then
            python3 /tmp/operator-executive-patch.py > /tmp/operator-executive.log 2>&1
            patch_rc=$?
          else
            echo "PATCH_EXTRACTION_FAILED=$extract_rc" > /tmp/operator-executive.log
            patch_rc=$extract_rc
          fi

          if [ "$patch_rc" -eq 0 ]; then
            {
              node --check lib/operator/runtime/OperatorCapabilityMatcher.js
              node --check lib/operator/runtime/OperatorBusinessReadResolver.js
              node --check lib/operator/runtime/OperatorCognitionRouter.js
              node --check lib/operator/runtime/OperatorReasoningRuntime.js
              node --check lib/platform/capabilities/createOperatorReadChainCapability.js
              node --check lib/operator/runtime/OperatorVerificationRuntime.js
              node --check scripts/operator-voice-responsiveness-audit.mjs
              node --check scripts/operator-fast-voice-read-catalog-audit.mjs
              npm run audit:operator-voice-responsiveness
              npm run audit:operator-fast-voice-read-catalog
              npm run audit:operator-goal-continuity
              npm run audit:operator-exposure
              git diff --check
            } >> /tmp/operator-executive.log 2>&1
            verify_rc=$?
          else
            verify_rc=$patch_rc
          fi

          if [ "$verify_rc" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/operator-executive.log OPERATOR_EXECUTIVE_BRAIN_DIAGNOSTIC.txt
            rm -f .github/workflows/one-time-operator-executive-brain.yml
            rm -f .github/workflows/one-time-operator-executive-brain-v2.yml
            rm -f .github/workflows/one-time-operator-executive-brain-final.yml
            rm -f .github/workflows/one-time-operator-executive-brain-observable.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add OPERATOR_EXECUTIVE_BRAIN_DIAGNOSTIC.txt .github/workflows/
            git commit -m "Record Operator executive brain convergence diagnostic"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            exit 0
          fi

          rm -f OPERATOR_EXECUTIVE_BRAIN_DIAGNOSTIC.txt
          rm -f .github/workflows/one-time-operator-executive-brain.yml
          rm -f .github/workflows/one-time-operator-executive-brain-v2.yml
          rm -f .github/workflows/one-time-operator-executive-brain-final.yml
          rm -f .github/workflows/one-time-operator-executive-brain-observable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/operator/runtime/OperatorReasoningRuntime.js lib/platform/capabilities/createOperatorReadChainCapability.js lib/operator/runtime/OperatorVerificationRuntime.js scripts/operator-voice-responsiveness-audit.mjs scripts/operator-fast-voice-read-catalog-audit.mjs .github/workflows/ OPERATOR_EXECUTIVE_BRAIN_DIAGNOSTIC.txt
          git commit -m "[deploy-production] Complete dynamic Operator executive brain"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
