              Number(rankedEntry?.primary_coverage || 0) >= 0.55 &&
              (separation >= 0.12 || resolution.capabilities.length === 1);

            if (!clearPhrase && !clearCoverage) return null;''',
              '''  const clearCoverage =
              Number(rankedEntry?.primary_coverage || 0) >= 0.55 &&
