name: One-time Operator voice and intelligence convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-operator-voice-intelligence-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Converge Operator voice and company intelligence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new, 1)

          # 1. Make the existing Attention Scan the canonical broad company-analysis read.
          path = Path("lib/platform/capabilities/createOperatorAttentionCapability.js")
          source = path.read_text()
          source = replace_once(
              source,
              '''    operatorAliases: [
              "what needs attention",
              "what should I look at",
              "what deserves attention",
              "what should I know",
              "executive attention brief",
            ],''',
              '''    operatorAliases: [
              "what needs attention",
              "what should I look at",
              "what deserves attention",
              "what should I know",
              "analyze the business",
              "analyze this business",
              "analyse the business",
              "analyse this business",
              "analyze the company",
              "analyze this company",
              "analyse the company",
              "analyse this company",
              "analyze the organization",
              "analyze this organization",
              "analyse the organization",
              "analyse this organization",
              "review the business",
              "review the company",
              "review the organization",
              "check everything",
              "review everything",
              "check the whole business",
              "full business analysis",
              "company analysis",
              "organization analysis",
              "tell me what you think about the business",
              "give me your assessment of the business",
              "executive attention brief",
            ],''',
              "attention aliases",
          )
          source = replace_once(
              source,
              '''    operatorExamples: [
              "What needs my attention?",
              "Give me the important things I should know right now.",
              "What should I focus on next?",
            ],''',
              '''    operatorExamples: [
              "What needs my attention?",
              "Give me the important things I should know right now.",
              "What should I focus on next?",
              "Analyze this business and tell me what you think.",
              "Check everything and tell me what matters most.",
              "Give me a full organization assessment from the live business data.",
            ],''',
              "attention examples",
          )
          path.write_text(source)

          # 2. Let broad organization-analysis reads resolve deterministically even when
          # multiple domain reads naturally overlap with the request.
          path = Path("lib/operator/runtime/OperatorBusinessDataReflex.js")
          source = path.read_text()
          source = replace_once(
              source,
              '''} from "./OperatorBusinessReadResolver";

function text(value) {''',
              '''} from "./OperatorBusinessReadResolver";

const ATTENTION_KEY = "platform.attention.scan";

function text(value) {''',
              "business reflex attention constant",
          )
          source = replace_once(
              source,
              '''function entityRequired(capability, entityId) {
            return normalizedMode(capability?.context_scope) === "entity" && !text(entityId);
          }

          export function resolveOperatorBusinessDataReflex({''',
              '''function entityRequired(capability, entityId) {
            return normalizedMode(capability?.context_scope) === "entity" && !text(entityId);
          }

          function isAttentionReflexMatch(entry) {
            const phraseAffinity = Number(entry?.phrase_affinity || 0);
            const primaryCoverage = Number(entry?.primary_coverage || 0);
            const score = Number(entry?.score || 0);

            return (
              phraseAffinity >= 0.72 ||
              (primaryCoverage >= 0.52 && score >= 0.34)
            );
          }

          export function resolveOperatorBusinessDataReflex({''',
              "business reflex attention matcher",
          )
          source = replace_once(
              source,
              '''  const capability = candidates[0] || null;
            if (!capability) return null;

            const rankedEntry = list(resolution.ranked).find(''',
