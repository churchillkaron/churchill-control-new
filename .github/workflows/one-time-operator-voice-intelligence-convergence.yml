              .filter((item) => item.title || item.why || item.next)
              .slice(0, voice ? 3 : 5);

            if (!summary && !items.length) return "";

            if (voice) {
              const details = items.map((item) =>
                [
                  item.title,
                  item.why,
                  item.next ? `Next: ${item.next}` : "",
                ]
                  .filter(Boolean)
                  .join(". "),
              );

              return [summary, ...details].filter(Boolean).join(" ");
            }

            const details = items.map((item, index) => {
              const body = [item.title, item.why].filter(Boolean).join(": ");
              return `${index + 1}. ${body}${
                item.next ? ` Next: ${item.next}` : ""
              }`;
            });

            return [summary, ...details].filter(Boolean).join("\\n");
          }

          function normalizedVerificationRead(value) {''',
              "verification attention response formatter",
          )
          source = replace_once(
