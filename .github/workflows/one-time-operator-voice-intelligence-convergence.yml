              '''      const response = await fetch("/api/operator/turn", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({
                  organizationId,
                  entityId,
                  periodId,
                  conversationKey: "primary",
                  pathname,
                  message,
