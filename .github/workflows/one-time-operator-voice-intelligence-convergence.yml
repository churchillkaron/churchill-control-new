          const homeIntelligence = read("components/operator/HomeAvantiqoIntelligence.jsx");
          const verificationRuntime = read("lib/operator/runtime/OperatorVerificationRuntime.js");
          const attentionCapability = read("lib/platform/capabilities/createOperatorAttentionCapability.js");

          requireAll("VOICE_BRIDGE", bridge, [''',
