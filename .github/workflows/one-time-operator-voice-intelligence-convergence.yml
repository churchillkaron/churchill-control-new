              '''const EVIDENCE_CHAR_LIMIT = 6000;
          const EVIDENCE_SAMPLE_SIZE = 12;''',
              '''const EVIDENCE_CHAR_LIMIT = 6000;
          const EVIDENCE_SAMPLE_SIZE = 12;
          const ATTENTION_KEY = "platform.attention.scan";''',
              "verification attention constant",
          )
          source = replace_once(
              source,
              '''function capabilityResult(value) {
            const root = object(value);
            return object(root.result);
          }

          function normalizedVerificationRead(value) {''',
              '''function capabilityResult(value) {
            const root = object(value);
            return object(root.result);
          }

          function attentionResponseText(value, { voice = false } = {}) {
            const result = capabilityResult(value);
            const summary = text(result.summary);
            const items = list(result.items)
              .map((item) => ({
                title: text(item?.title),
