name: Operator one-time lock sync

on:
  push:
    branches:
      - fix/operator-project-continuity
    paths:
      - .github/workflows/operator-lock-sync-once.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Synchronize package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/operator-lock-sync-once.yml
          if git diff --cached --quiet; then
            echo "No lockfile change required"
            exit 0
          fi
          git commit -m "Sync package lock for Creative Sandbox dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
