name: Operator refinement capability convergence

# One-shot governed convergence trigger.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/operator-refinement-capability-resolution.yml"

permissions:
  contents: write

concurrency:
  group: operator-refinement-capability-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact guarded patch
        run: node scripts/apply-operator-refinement-capability-resolution.mjs

      - name: Verify runtime and focused governance
        run: |
          node --check lib/operator/runtime/OperatorTurnRuntime.js
          node --check lib/operator/runtime/OperatorRecommendationRefinementCapabilityResolver.js
          node scripts/operator-recommendation-refinement-capability-resolution-audit.mjs
          node scripts/operator-recommendation-refinement-materialization-audit.mjs
          node scripts/operator-recommendation-refinement-restore-audit.mjs

      - name: Refuse stale-main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Commit convergence to main
        run: |
          git config user.name "Avantiqo Governance"
          git config user.email "actions@users.noreply.github.com"
          git add lib/operator/runtime/OperatorTurnRuntime.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "Use fresh capability resolution for refinements"
          git push origin HEAD:main
