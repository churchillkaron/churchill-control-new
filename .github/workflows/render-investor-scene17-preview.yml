name: Render Investor Scenes 1-17 Review

on:
  push:
    paths:
      - ".github/workflows/render-investor-scene17-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  render-scenes-1-17:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install review render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          ffmpeg -version | head -1

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=avantiqo-investor-review-render-v1")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Render and upload Scenes 1-17
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: bash .github/scripts/render-investor-scenes-1-17-review-v4.sh

      - name: Upload review package artifact
        uses: actions/upload-artifact@v4
        with:
          name: avantiqo-investor-scenes-1-17-review
          path: review-scenes/
          if-no-files-found: error
          retention-days: 7
