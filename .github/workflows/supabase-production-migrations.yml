name: Apply Atomic Waiter Batch Merge UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-production-migrations.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Replace sequential merge request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx")
          source = path.read_text()
          old = '''    try {
      for (const targetId of mergeTargetIds) {
        await posAction("MERGE_TABLES", {
          masterTableId: modalTable.id,
          targetTableId: targetId,
        });
      }
      closeModal();
      await loadRuntime();
    } catch (error) {'''
          new = '''    try {
      await posAction("MERGE_TABLES", {
        masterTableId: modalTable.id,
        targetTableIds: mergeTargetIds,
      });
      closeModal();
      await loadRuntime();
    } catch (error) {'''

          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected one sequential merge block, found {count}")

          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          grep -q 'targetTableIds: mergeTargetIds' 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'
          if grep -q 'for (const targetId of mergeTargetIds)' 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'; then
            echo "Sequential merge loop still present" >&2
            exit 1
          fi

      - name: Commit UI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'
          git commit -m "submit waiter table merges atomically"
          git push origin HEAD:main
