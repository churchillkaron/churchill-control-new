name: Supabase Production Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "lib/operations/deployment/**"
      - "scripts/operations-*-audit.mjs"
      - ".github/workflows/supabase-production-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Push pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Mark migration pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "Supabase Production Migrations",
              description: "Applying pending production migrations",
              target_url: runUrl
            });

      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for production database deployment."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Detect Operations release changes
        id: domain_changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "operations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="HEAD^"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(lib/operations/deployment/|scripts/operations-.*-audit\.mjs|supabase/migrations/[^/]*operations[^/]*\.sql$)'; then
            echo "operations=true" >> "$GITHUB_OUTPUT"
          else
            echo "operations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate Operations release contracts
        if: steps.domain_changes.outputs.operations == 'true'
        run: |
          npm run audit:operations
          npm run audit:operations-events
          npm run audit:operations-authorization
          npm run audit:operations-roles
          npm run audit:operations-readiness
          npm run audit:operations-migrations

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration history before deployment
        run: supabase migration list --linked

      - name: Dry-run pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Capture migration history after deployment
        run: supabase migration list --linked | tee production-remote-migration-history.txt

      - name: Verify Operations migration history after deployment
        if: steps.domain_changes.outputs.operations == 'true'
        env:
          SUPABASE_MIGRATION_LIST_FILE: production-remote-migration-history.txt
        run: npm run audit:operations-migrations

      - name: Publish migration result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = "${{ job.status }}" === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? "success" : "failure",
              context: "Supabase Production Migrations",
              description: succeeded
                ? "Production migrations applied successfully"
                : "Production migration failed",
              target_url: runUrl
            });

