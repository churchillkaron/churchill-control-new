name: Temporary Waiter Atomic Batch Merge

on:
  push:
    paths:
      - ".github/workflows/temporary-waiter-batch-merge.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Replace sequential table merge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx")
          source = path.read_text()
          old = '''    try {\n      for (const targetId of mergeTargetIds) {\n        await posAction("MERGE_TABLES", {\n          masterTableId: modalTable.id,\n          targetTableId: targetId,\n        });\n      }\n      closeModal();\n      await loadRuntime();\n    } catch (error) {'''
          new = '''    try {\n      await posAction("MERGE_TABLES", {\n        masterTableId: modalTable.id,\n        targetTableIds: mergeTargetIds,\n      });\n      closeModal();\n      await loadRuntime();\n    } catch (error) {'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one sequential merge block, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          grep -q 'targetTableIds: mergeTargetIds' 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'
          if grep -q 'for (const targetId of mergeTargetIds)' 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'; then
            echo "Sequential merge loop still present" >&2
            exit 1
          fi

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-waiter-batch-merge.yml
          git add 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'
          git commit -m "submit waiter table merges atomically"
          git push origin HEAD:main
