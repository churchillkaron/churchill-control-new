name: Temporary Waiter Bill Group Scope Repair

on:
  push:
    paths:
      - ".github/workflows/temporary-waiter-bill-group-scope.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch waiter bill-group scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx")
          source = path.read_text()
          old = '''    const result = await assignSeatToBillGroup({\n      itemIds,\n      billGroup: destination.group_name,\n    });'''
          new = '''    const result = await assignSeatToBillGroup({\n      organizationId,\n      tableId: openTable.id,\n      itemIds,\n      billGroup: destination.group_name,\n    });'''

          if source.count(old) != 1:
              raise SystemExit(f"expected one bill-group call, found {source.count(old)}")

          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          grep -q 'tableId: openTable.id' 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-waiter-bill-group-scope.yml
          git add 'app/(system)/workspace/[organizationId]/operations/pos/waiter/POS_FINAL_UI.jsx'
          git commit -m "pass waiter bill group organization and table scope"
          git push origin HEAD:main
