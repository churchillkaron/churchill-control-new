services:
  secretary-asterisk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ASTERISK_VERSION: ${ASTERISK_VERSION:-22.10.1}
    restart: unless-stopped
    environment:
      ASTERISK_AMI_USERNAME: ${ASTERISK_AMI_USERNAME:?required}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:?required}
      ASTERISK_SECRETARY_INBOUND_CONTEXT: ${ASTERISK_SECRETARY_INBOUND_CONTEXT:-avantiqo-secretary-inbound}
      ASTERISK_SECRETARY_TRUNK_ENDPOINT: ${ASTERISK_SECRETARY_TRUNK_ENDPOINT:-}
      ASTERISK_SECRETARY_TRUNK_HOST: ${ASTERISK_SECRETARY_TRUNK_HOST:-}
      ASTERISK_SECRETARY_TRUNK_PORT: ${ASTERISK_SECRETARY_TRUNK_PORT:-5060}
      ASTERISK_SECRETARY_TRUNK_PROTOCOL: ${ASTERISK_SECRETARY_TRUNK_PROTOCOL:-udp}
      ASTERISK_SECRETARY_TRUNK_USERNAME: ${ASTERISK_SECRETARY_TRUNK_USERNAME:-}
      ASTERISK_SECRETARY_TRUNK_SECRET: ${ASTERISK_SECRETARY_TRUNK_SECRET:-}
      ASTERISK_SECRETARY_TRUNK_REGISTER: ${ASTERISK_SECRETARY_TRUNK_REGISTER:-true}
      ASTERISK_SECRETARY_TRUNK_CLIENT_USER: ${ASTERISK_SECRETARY_TRUNK_CLIENT_USER:-}
      ASTERISK_SECRETARY_TRUNK_CONTACT_USER: ${ASTERISK_SECRETARY_TRUNK_CONTACT_USER:-}
      ASTERISK_SECRETARY_TRUNK_IDENTIFY_MATCH: ${ASTERISK_SECRETARY_TRUNK_IDENTIFY_MATCH:-}
      ASTERISK_SECRETARY_TRUNK_FROM_USER: ${ASTERISK_SECRETARY_TRUNK_FROM_USER:-}
      ASTERISK_SECRETARY_TRUNK_CODECS: ${ASTERISK_SECRETARY_TRUNK_CODECS:-ulaw,alaw}
      SECRETARY_GATEWAY_LOCAL_URL: ${SECRETARY_GATEWAY_LOCAL_URL:-http://host.docker.internal:8787}
      AVANTIQO_SECRETARY_SIP_GATEWAY_TOKEN: ${AVANTIQO_SECRETARY_SIP_GATEWAY_TOKEN:-}
      AVANTIQO_SECRETARY_PUBLIC_BASE_URL: ${AVANTIQO_SECRETARY_PUBLIC_BASE_URL:-http://host.docker.internal:3000}
      AVANTIQO_SECRETARY_CALL_GATEWAY_TOKEN: ${AVANTIQO_SECRETARY_CALL_GATEWAY_TOKEN:-}
      AVANTIQO_SECRETARY_PHONE_LINE_ID: ${AVANTIQO_SECRETARY_PHONE_LINE_ID:-}
    ports:
      - "127.0.0.1:${ASTERISK_AMI_PORT:-5038}:5038/tcp"
      - "127.0.0.1:${ASTERISK_SIP_TCP_PORT:-5060}:5060/tcp"
      - "127.0.0.1:${ASTERISK_SIP_UDP_PORT:-5060}:5060/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
