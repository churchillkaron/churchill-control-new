services:
  secretary-sip-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRETARY_GATEWAY_HTTP_HOST: 0.0.0.0
      SECRETARY_GATEWAY_HTTP_PORT: 8787
      SECRETARY_GATEWAY_AUDIO_HOST: 0.0.0.0
      SECRETARY_GATEWAY_AUDIO_PORT: 9019
      AVANTIQO_SECRETARY_SIP_GATEWAY_TOKEN: ${AVANTIQO_SECRETARY_SIP_GATEWAY_TOKEN:?required}
      AVANTIQO_SECRETARY_PUBLIC_BASE_URL: ${AVANTIQO_SECRETARY_PUBLIC_BASE_URL:?required}
      AVANTIQO_SECRETARY_CALL_GATEWAY_TOKEN: ${AVANTIQO_SECRETARY_CALL_GATEWAY_TOKEN:?required}
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST:-secretary-asterisk}
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT:-5038}
      ASTERISK_AMI_USERNAME: ${ASTERISK_AMI_USERNAME:?required}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:?required}
      ASTERISK_SECRETARY_OUTBOUND_CONTEXT: ${ASTERISK_SECRETARY_OUTBOUND_CONTEXT:-avantiqo-secretary-outbound}
      ASTERISK_SECRETARY_OUTBOUND_EXTEN: ${ASTERISK_SECRETARY_OUTBOUND_EXTEN:-s}
      ASTERISK_SECRETARY_OUTBOUND_CHANNEL_TEMPLATE: ${ASTERISK_SECRETARY_OUTBOUND_CHANNEL_TEMPLATE:-PJSIP/{destination}@avantiqo-trunk}
      ASTERISK_SECRETARY_AUDIOSOCKET_SERVICE: ${ASTERISK_SECRETARY_AUDIOSOCKET_SERVICE:-secretary-sip-gateway:9019}
      SECRETARY_GATEWAY_VAD_THRESHOLD: ${SECRETARY_GATEWAY_VAD_THRESHOLD:-450}
      SECRETARY_GATEWAY_VAD_SILENCE_MS: ${SECRETARY_GATEWAY_VAD_SILENCE_MS:-650}
      SECRETARY_GATEWAY_VAD_MIN_SPEECH_MS: ${SECRETARY_GATEWAY_VAD_MIN_SPEECH_MS:-280}
      SECRETARY_GATEWAY_VAD_MAX_SPEECH_MS: ${SECRETARY_GATEWAY_VAD_MAX_SPEECH_MS:-12000}
    ports:
      - "127.0.0.1:${SECRETARY_GATEWAY_HTTP_PORT:-8787}:8787/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - secretary-telephony

networks:
  secretary-telephony:
    external: true
    name: ${SECRETARY_TELEPHONY_DOCKER_NETWORK:-avantiqo-secretary-telephony}
